ÉRDEKFESZÍTŐ  melléknév (<span style="color:green;font-weight:bold">választékos</span>)
Az érdeklődést különlegesen nagy mértékben fokozó, rendkívül, nagyon érdekes; izgalmas. <span style="color:blue">Érdekfeszítő olvasmány, történet. A regény oly érdekfeszítő volt, hogy nem tudtam letenni.</span> □ Igen el volt merülve [a regénynek] egy érdekfeszítő jelenetébe. (Jókai Mór)
</div>
