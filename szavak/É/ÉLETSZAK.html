ÉLETSZAK  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Vmely személy, közösség, szervezet életének meghatározott szakasza. <span style="color:blue">Minden életszaknak megvannak a maga jellemző tulajdonságai.</span> □ A gyermeki életszakot felváltja a férfikor. (Széchenyi István) A fiatal nőre egy új életszak kezdődött. (Jósika Miklós)
