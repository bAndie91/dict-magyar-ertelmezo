ÉLETFOLYAMAT  főnév (<span style="color:green;font-weight:bold">tudományos</span>)
Vmely élőlénynek, a társadalomnak v. vmely társadalmi jelenségnek az életében az egymást követő változások, mozzanatok szervesen összefüggő menete, folyamata. <span style="color:blue">Egyszerű, bonyolult életfolyamatok; a társadalom életfolyamatának törvényszerűségei.</span>
