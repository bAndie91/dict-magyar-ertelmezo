ÉRTÉKTÁRGY  főnév
Nagyobb értékű, nem vmely elsőrendű szükségletet kielégítő, hanem fényűzési célra való, rendsz. kisebb ingó vagyontárgy (pl. ékszer, perzsaszőnyeg, bunda, kép). <span style="color:blue">A betörő elvitte az összes értéktárgyakat.</span> □ Minden értéktárgya nagy, nikkel óra s hatalmas ezüst óralánc. (Kuncz Aladár)
