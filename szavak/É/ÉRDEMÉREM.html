ÉRDEMÉREM  [m-é] főnév
Vmely kiváló tettért, teljesítményért, munkáért adott állami, polgári v. katonai kitüntetés, gyak. nemesfémből készült, a mellen viselt, szalagon függő jelvény. <span style="color:blue">Katonai, köztársasági érdemérem; arany, ezüst érdemérem. Érdeméremmel tüntették ki.</span>
<ul><li>érdemérmes.
</li></ul></div>
