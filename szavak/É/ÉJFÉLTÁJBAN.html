ÉJFÉLTÁJBAN  határozószó
Éjfél körül, kevéssel előtte v. utána. <span style="color:blue">Csak éjféltájban fog hazajönni. Úgy éjféltájban mentek el a vendégek.</span> □ Ha elesnénk egy szálig mindnyájan, Feljövünk a sírból éjféltájban. (Petőfi Sándor) Éjféltájba lehetett, mikor nagy hangos beszédet hallott. (Móricz Zsigmond)
