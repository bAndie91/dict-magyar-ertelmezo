ÉTLEN-SZOMJAN  határozószó
Evés és ivás nélkül; éhezve és szomjazva. <span style="color:blue">Fél napig étlen-szomjan várt.</span> □ Elhallgatták  napestig étlen-szomjan a bohó lengyel daliát. (Jókai Mór) Ment, ment étlen-szomjan, a sötét utakon, hegyeket mászott. (Gelléri Andor Endre)
