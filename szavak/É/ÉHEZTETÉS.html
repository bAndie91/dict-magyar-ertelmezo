ÉHEZTETÉS  főnév -t, -e [e] (csak egyes számban)
Az éheztet igével kifejezett eljárás, bánásmód; a szükséges táplálék megvonása; éhséggel gyötrés, koplaltatás. <span style="color:blue">Az állatok éheztetése; a gyermek éheztetése. Egy kis éheztetés kell a betegnek.</span>
<ul><li>éheztetési.
</li></ul></div>
