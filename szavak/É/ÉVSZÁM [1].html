ÉVSZÁM [1]  főnév
Az a szám, amellyel vmely időszámítás szerint vmely évet megjelölnek. <span style="color:blue">A dátumban az évszám nem volt kiírva, csak a hónap és nap. Nem tud évszámokat megjegyezni.</span> □ Matematikában a képletek, s a történelemben az évszámok szigorú diszciplínát adtak. (Babits Mihály)
