ÉLETÖSZTÖN  [t-ö] főnév
Az élet fenntartására, az életben maradás biztosítására irányuló ösztön. <span style="color:blue">Erős benne, felébredt benne az életösztön.</span> □ Annyi józan ész, vagy tán életösztön megmaradt nálam, hogy hirtelen arcra vessem magamat. (Jókai Mór)
<ul><li>életösztönös; életösztönű.
</li></ul></div>
