ÉLMUNKÁS  főnév (<span style="color:green;font-weight:bold">1945 után</span>)
&lt;Az iparban v. mezőgazdaságban 1950-ig&gt; az a munkás, aki az egy szakmájúak közül kimagaslóan nagy teljesítményt ért el, kevés selejttel v. selejt nélkül dolgozott, s ezért kitüntették.
<ul><li>Szóösszetétel(ek): élmunkásbrigád; élmunkásjelvény.
</li><li>élmunkási; élmunkásság.
</li></ul></div>
