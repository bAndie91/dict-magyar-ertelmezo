ÉLÜZEM  [l-ü] főnév (<span style="color:green;font-weight:bold">1945 után</span>)
Olyan üzem, amely a munkaversenyben a megszabott feltételek teljesítésével a legjobb üzemek sorába került, s ezt a címet megkapta.
<ul><li>Szóösszetétel(ek): élüzemjelvény.
</li><li>élüzemi.
