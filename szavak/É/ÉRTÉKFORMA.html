ÉRTÉKFORMA  főnév (<span style="color:green;font-weight:bold">közgazdaságtan</span>)
Az a forma, ahogyan vmely áru értékét kifejezzük. <span style="color:blue">Egyszerű</span> v. <span style="color:blue">véletlen értékforma:</span> olyan é., amely egy áru értékét vmely más áruban fejezi ki; <span style="color:blue">általános értékforma:</span> olyan é., amely több különböző áru értékét egy bizonyos áruban fejezi ki.
