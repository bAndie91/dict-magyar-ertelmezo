ÉKIRAT  [k-i] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
Ékírással kőbe, táblába vésett v. agyagba égetett irat, felirat. <span style="color:blue">Az ékiratok kibetűzése, megfejtése. A babiloni és a ninivei romokból előkerült ékiratok.</span>
