ÉRTÉKLEVÉL  főnév (<span style="color:green;font-weight:bold">postaügy</span>)
Olyan levél, melyben papírpénzt, értékpapírt, értékes okmányokat v. más értékcikket küldenek; a küldemény értékét a küldő feltünteti, s a rendes szállítási díjon felül biztosítási díjat is fizet érte.
