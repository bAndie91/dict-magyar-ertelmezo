ÉTKEZTETÉS  [ë-e] főnév -t, (-ek), -e [ë, e] (többes számban ritka)
Rendsz. szervezett, kedvezményes ellátás, étkezés szolgáltatása. <span style="color:blue">Hatósági étkeztetés; a tanfolyam étkeztetése. Az üzemben megszervezik az étkeztetést.</span>
<ul><li>Szóösszetétel(ek): közétkeztetés.
</li><li>étkeztetési.
</li></ul></div>
