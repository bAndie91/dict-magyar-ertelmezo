ÉLÉNKÜL  tárgyatlan ige -t, -jön
Folyamatosan egyre élénkebbé lesz. <span style="color:blue">Élénkül a forgalom, a hangulat, a játék.</span> □ Jámbor cigány munkás zajától Élénkül a sík pusztaság. (Jókai Mór)
<ul><li>Igekötős igék: felélénkül; megélénkül.
</li><li>élénkülés; élénkülő.
