ÉLETFORMA  főnév
A társadalmi helyzet s más körülmények megszabta, meghatározta életmód. <span style="color:blue">Demokratikus, paraszti, polgári életforma; a tudós, a művész életformája.</span> □ Az egyéni életformákat egy törléssel el lehetett volna tüntetni rólunk s maradt volna: a puszta sors. (Kuncz Aladár)
