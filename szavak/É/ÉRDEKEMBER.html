ÉRDEKEMBER  [k-e] főnév (<span style="color:green;font-weight:bold">választékos</span>, <span style="color:green;font-weight:bold">rosszalló</span>)
Olyan ember, aki csak a maga érdekeit, főleg anyagi hasznát, érvényesülését tartja szem előtt. <span style="color:blue">Nem várhatunk segítséget ettől az érdekembertől. A regény főhőse a tipikus érdekember alakját testesíti meg.</span>
