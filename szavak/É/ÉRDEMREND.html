ÉRDEMREND  főnév
Polgári v. katonai érdemeket jutalmazó kitüntetés, ill. ennek jelvénye; rendjel. <span style="color:blue">A Munka Vörös Zászló érdemrend arany, ezüst, bronz fokozata; érdemrendet kapott; érdemrenddel tüntették ki.</span>
<ul><li>Szóösszetétel(ek): munkaérdemrend.
