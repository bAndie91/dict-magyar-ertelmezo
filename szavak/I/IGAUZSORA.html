IGAUZSORA  főnév (<span style="color:green;font-weight:bold">mezőgazdaság</span>, <span style="color:green;font-weight:bold">sajtónyelvi</span>)
Igásállatnak, ill. igának munkára való kölcsönzése olyan térítés ellenében, amely uzsorának számít, amellyel a rászorulót kiuzsorázzák. <span style="color:blue">A néhány hold föld jövedelmét fölemésztette az igauzsora. Sok földhözjuttatott nyögte a kulákok igauzsoráját.</span>
