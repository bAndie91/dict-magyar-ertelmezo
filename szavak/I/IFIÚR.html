IFIÚR  főnév (<span style="color:green;font-weight:bold">régies</span>)
Fiatalúr, úrfi. □ Bejött Mariska  menyecskésen hátrakötött keszkenővel , mosolygott nagyon.  Elkésik az ifiúr. Még fel sincs öltözve. (Babits Mihály) A pedellus , tétlen ácsorgásából felriasztva, szólt:  Mi tetszik ifiúr? (Móricz Zsigmond)
