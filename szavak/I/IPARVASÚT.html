IPARVASÚT  [s-ú] főnév
Mezőgazdasági termények, bánya- v. ipari termékek szállítására haszn., régebben többnyire a rendesnél keskenyebb nyomtávú, rendsz. egy bizonyos vállalat v. gazdaság tulajdonában levő vasút; gazdasági vasút, kisvasút. <span style="color:blue">Gépi üzemű, korszerű iparvasút.</span>
<ul><li>iparvasútas; iparvasúti.
</li></ul></div>
