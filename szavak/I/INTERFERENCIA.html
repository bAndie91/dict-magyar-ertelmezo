INTERFERENCIA  [ë-ë-ë v. e-e-e] főnév ..iát, ..iája (<span style="color:green;font-weight:bold">fizika</span>)

<ul><li>Szóösszetétel(ek): interferenciacsík; interferenciajelenség.
