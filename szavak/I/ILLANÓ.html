ILLANÓ  melléknév -an v. -n, -bb
Olyan, aki, ami (el)illan. <span style="color:blue">A kertbe illanó leány; az illanó évek; könnyen illanó folyadék; illanó olaj ←.</span> □ Mihelyt valami | rajz őrizte, kép, megfogalmazás, | rabom maradt az illanó varázs. (Szabó Lőrinc)
