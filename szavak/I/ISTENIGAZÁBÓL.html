ISTENIGAZÁBÓL  [n-i] határozószó (<span style="color:green;font-weight:bold">bizalmas</span>)
Vágyainak, indulatának megfelelően nagy mértékben, ugyancsak alaposan; istenigazában. <span style="color:blue">Istenigazából ellátta a baját</span> v. <span style="color:blue">ellátta a baját amúgy istenigazából. Elverte a gyereket amúgy istenigazából.</span>
