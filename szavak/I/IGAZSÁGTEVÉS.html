IGAZSÁGTEVÉS  főnév (<span style="color:green;font-weight:bold">népies</span>, kissé <span style="color:green;font-weight:bold">régies</span>)
Az a tény, cselekvés, hogy vki igazságot tesz (4a) vmely ügyben, vkik között; ítélet, döntés arról, hogy kinek van igaza; igazságtétel. <span style="color:blue">Nehéz ebben az ügyen az igazságtevés. Az igazságtevés a nép joga. Magára vállalta az igazságtevést.</span>
