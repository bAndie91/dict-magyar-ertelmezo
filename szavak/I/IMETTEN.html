IMETTEN  [ë-e v. e-e] határozószó (<span style="color:green;font-weight:bold">elavult</span>)
Ébren (1). □ Imetten-e? álomban-e? Hallék üvöltő hangokat. (Arany János) Sokszor hall az ember álmában olyan zenét, amihez imetten sem hangírást, sem zeneeszközt nem tud. (Gárdonyi Géza)
