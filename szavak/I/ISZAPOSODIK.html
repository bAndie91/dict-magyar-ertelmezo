ISZAPOSODIK  tárgyatlan ige -tam, -ott, -jék (-jon)
&lt;Víz, meder, talaj&gt; fokozatosan iszapossá válik, iszappal telítődik. <span style="color:blue">Iszaposodik a régi tó, a kikötő, a szennyvízcsatorna. A folyó holt ága erősen iszaposodik.</span>
<ul><li>Igekötős igék: eliszaposodik; megiszaposodik.
</li><li>iszaposodás; iszaposodó.
</li></ul></div>
