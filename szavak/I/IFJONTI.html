IFJONTI  melléknév (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Fiatalkori, ifjúi, fiatalos. <span style="color:blue">Ifjonti hév, kedély, lelkesedés.</span> □ Miért lesz vége, pajtás, Az ifjonti jóknak?  (Tóth Árpád) Tiétek mind a rózsa, Amit letéphet az ifjonti kéz. (Juhász Gyula)
