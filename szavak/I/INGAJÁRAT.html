INGAJÁRAT  főnév (<span style="color:green;font-weight:bold">közlekedés</span>)
&lt;Helyi forgalomban, főleg villamosok közlekedésében&gt; két megállóhely között egy sínpáron közlekedő járművek, ill. szerelvények járata, főleg akkor, ha az útszakasz többi részét elzárták a forgalom elől.
