INGGALLÉR  főnév (<span style="color:green;font-weight:bold">ruházkodás</span>)
Az inghez tartozó (régebben rágombolható, újabban rávarrott) gallér. <span style="color:blue">Keményített, lehajlított inggallér; begombolja az inggallérját.</span> □ Csak a nyakkendő hiányzik nyakáról, melyet szabadon hagy a kétfelé hajtott fehér inggallér. (Jókai Mór)
