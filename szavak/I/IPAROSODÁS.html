IPAROSODÁS  főnév -t, -a (csak egyes számban)
Az iparosodik igével kifejezett folyamat; az a tény, hogy az ipar meghonosodik, kifejlődik (vhol, vmely területen). <span style="color:blue">Az ország, a város, a vidék iparosodása. Az iparosodás a mezőgazdaság fejlődését is elősegíti.</span>
<ul><li>iparosodási.
