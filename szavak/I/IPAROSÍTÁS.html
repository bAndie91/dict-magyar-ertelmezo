IPAROSÍTÁS  főnév -t, (-ok), -a
Az iparosít igével kifejezett tevékenység, eljárás, ill. folyamat; az az eljárás, hogy vmit iparosítanak. <span style="color:blue">Az Alföld iparosítása; elmaradt vidékek iparosítása. Az ország iparosítása és villamosítása a jelen és a közeli jövő feladata.</span>
<ul><li>iparosítási.
