IMÁDÁS  főnév -t, -a (csak egyes számban)
Az imád igével kifejezett cselekvés, megnyilvánulás, magatartás; az a tény, hogy vkit, vmit imádnak (12). <span style="color:blue">Isten imádása. Imádásig szerette feleségét.</span>
<ul><li>Szóösszetétel(ek): bálványimádás; napimádás; önimádás; szentségimádás; természetimádás; tűzimádás.
</li></ul></div>
