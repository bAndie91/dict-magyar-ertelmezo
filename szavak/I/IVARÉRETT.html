IVARÉRETT  [r-é] melléknév (-en) [e] (<span style="color:green;font-weight:bold">biológia</span>)
Testi fejlődésének arra a fokára ért &lt;ember, állat&gt;, amikor szaporodásra (fogamzásra, ill. nemzésre) már képes, amikor kifejlődött rajta a külső nemi jelleg; ivarképes.
<ul><li>ivarérettség.
