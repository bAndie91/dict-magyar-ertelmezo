ISMERETANYAG  [t-a] főnév (<span style="color:green;font-weight:bold">tudományos</span>)
Meghatározott tárgykör(ök)re, főleg részletekre, adatokra vonatk. tárgyi ismeret; tudásanyag. <span style="color:blue">Megfelelő ismeretanyaggal rendelkezik, de kevés benne az ötlet. A jó nevelő nemcsak ismeretanyagot közöl.</span>
