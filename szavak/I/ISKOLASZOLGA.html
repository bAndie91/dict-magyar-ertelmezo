ISKOLASZOLGA  főnév (<span style="color:green;font-weight:bold">régies</span>)
Iskolában alkalmazott hivatalsegéd; pedellus. □ Az iskolaszolga elő is állt, s mint afféle városi ember,  ki is törülközött a bajból. (Móra Ferenc) Az iskolaszolga rágyújtott makrapipájára. (Kosztolányi Dezső)
