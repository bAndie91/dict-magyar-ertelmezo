ITALÁLDOZAT  [l-á] főnév (<span style="color:green;font-weight:bold">vallásügy</span>, <span style="color:green;font-weight:bold">történettudomány</span>)
<ul><li>1. Az a szertartás, amelynek keretében az istenség iránt való tiszteletből italt, legtöbbször bort áldoztak.
</li><li>2. Az ilyenkor szertartásosan megivott v. kiöntött ital, rendsz. bor.
</li><li>italáldozati.
</li></ul></div>
