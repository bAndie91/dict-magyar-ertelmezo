IFJONTA  határozószó ifjanta (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">választékos</span>)
Ifjú korában, ifjúként. □ Toldi jut eszembe, kiről még ifjonta, Játszi elmém könnyü énekét elmondta. (Arany János) Megjövendölték, hogy  híres ember lesz belőle, de ifjanta és erőszakos halállal fog meghalni. (Jókai Mór)
