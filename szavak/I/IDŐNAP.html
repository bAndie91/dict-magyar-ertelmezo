IDŐNAP  főnév (kissé <span style="color:green;font-weight:bold">népies</span>)
&lt;Csak ebben az állandósult szókapcsolatban:&gt; <span style="color:blue">Időnap előtt:</span> a megszokott, természetes v. várt időpont előtt; korábban, mint kellene. <span style="color:blue">Időnap előtt megöregedett.</span> □ Oh mért kelle felébrednünk! a gyenge leánykák, Mint a virág elhervadtak időnap előtt. (Vörösmarty Mihály)
