IKERÁLLOMÁS  [r-á] főnév (<span style="color:green;font-weight:bold">postaügy</span>)
Olyan távbeszélő állomás, amelyet egy másik állomással együtt közös vezetékpár köt össze a központtal. <span style="color:blue">Ikerállomást kap, szereltet. Az ikerállomások sem egymással, sem egyidejűleg nem beszélhetnek.</span>
