ILLATÁR  [t-á] főnév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
A levegőben áramló, nagy teret betöltő, elborító kellemes illat(ok) áradata. <span style="color:blue">Bódító, kábító illatár; illatárban úszik a kert, a bálterem.</span> □ Gyógyítsatok meg engem, oh liget Szellői, lége, illatárjai. (Vörösmarty Mihály)
