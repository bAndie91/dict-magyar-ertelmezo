ISMERETSZOMJ  főnév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Erős hajlam, kedv, vágyódás ismeretek szerzésére. <span style="color:blue">Csillapíthatatlan, kielégíthetetlen ismeretszomj; ismeretszomjának csillapítására.</span> □ Ritkán látogatják meg e tájat kíváncsi utazók  hacsak nem túlságos ismeretszomj hajtja [őket] e  földre. (Jókai Mór)
