IPARRAJZISKOLA  [z-i] főnév (<span style="color:green;font-weight:bold">1945 előtt</span>)
Olyan ipariskola, amelyben részint ipari tanulók, részint segédek és önálló mesterek a szabadkézi, a mértani és a szakrajzban, valamint némely más szaktárgyban kaptak oktatást.
<ul><li>iparrajziskolai; iparrajziskolás.
</li></ul></div>
