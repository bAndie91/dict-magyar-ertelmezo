IRATGYŰJTŐ  főnév (<span style="color:green;font-weight:bold">hivatalos</span>)
Összehajtott kartonlapból készült fedél v. nagyobb könyvtáblához hasonló, összeköthető v. az iratokat rögzítő szerkezettel ellátott kemény tok, iratok gyűjtésére, tartására, megőrzésére; dosszié. <span style="color:blue">Az iratgyűjtőbe tette a másolatokat.</span>
