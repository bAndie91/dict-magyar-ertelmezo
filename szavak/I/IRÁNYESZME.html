IRÁNYESZME  [ny-e] főnév (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">választékos</span>)
Az az eszme (1), amely vmely szellemi működésnek, vállalkozásnak irányt mutat; vezérlő eszme. <span style="color:blue">Irodalmi irányeszme; a XX. század irányeszméje; a társadalom irányeszméi.</span> □ A magyar regényírónak célja  irányeszmét adni a  szépérzésben. (Jókai Mór)
