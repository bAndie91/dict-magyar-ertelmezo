VÁRGRÓF  [r-g] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
Német hűbérúr, aki császári adománnyal szerzett hatalmánál fogva pallosjogot és törvénykezést gyakorolt kerületében a szabadok felett. □ A mi grófságunk fővárosa nem oly nagy, mint a német  várgrófoké. (Kemény Zsigmond)
<ul><li>várgrófi; várgrófság.
