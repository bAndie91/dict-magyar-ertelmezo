VÍZILÓ  főnév ..lovat v. (<span style="color:green;font-weight:bold">ritka</span>) -t ..lova
A párosujjú patások rendjébe tartozó esetlen, szőrtelen testű, hatalmas szemfogú emlős; átlagban másfél méter magas, négy és fél méter hosszú, súlya 20002500 kg, a meleg égöv nagy folyóiban él (Hippopotamus). <span style="color:blue">Nílusi víziló.</span>
