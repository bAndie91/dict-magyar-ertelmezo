VÁRTORONY  főnév
A vár tornya, mely főleg őrhelyül v. leshelyül szolgált. □ Megfújták a kürtöt a vártoronyban. (Mikszáth Kálmán) Fölkerültem a vártoronyba: Pince-börtönből torony-börtön. (Ady Endre) Alant, a sziklalábnál fellobogózott vártorony emelkedett. (Krúdy Gyula)
