VADKAN  főnév
A vaddisznó (1) hímje. <span style="color:blue">Hatalmas vadkant lőtt.</span> □ Mint a sértett vadkan, fú veszett dühében. (Arany János) Vadkanok jöttek alá az erdőből, s az én kukoricámat kedvükre gázolják. (Jókai Mór)
<ul><li>Szóösszetétel(ek): vadkanagyar; vadkanfej; vadkankoponya; vadkantúrás; vadkanvadászat.
</li></ul></div>
