VIZAHÓLYAG  főnév
A viza, a tok és más halak úszóhólyagja, mely színtelen, átlátszó, vékony lemezek alakjában kerül forgalomba. <span style="color:blue">A vizahólyag bor derítésére, ragasztószerül, angoltapasz készítésére használatos.</span> □ [A hajó] szárított halat, vizahólyagot  szállított. (Eötvös Károly)
