VÉGBÉLKÚP  főnév (<span style="color:green;font-weight:bold">gyógyszerészet</span>)
Könnyen olvadó anyagból, többnyire kakaóvajból készült, gyógyszert tartalmazó, 23 cm hosszú kúp; a végbél nyílásába bedugva megolvad, s a gyógyszer a nyálkahártyán át fölszívódik.
<ul><li>végbélkúpos.
</li></ul></div>
