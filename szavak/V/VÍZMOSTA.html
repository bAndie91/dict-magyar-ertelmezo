VÍZMOSTA  melléknév
Olyan &lt;hely, terület&gt;, amelyet a víz elárasztott, kimosott, kimélyített. <span style="color:blue">Vízmosta part, rét, terület. Vízmosta szurdok tátongott előtte. A patak vízmosta partjai beomlottak.</span> □ Az út vízmosta gödrökön visz a kastély kapujáig. (Tolnai Lajos)
