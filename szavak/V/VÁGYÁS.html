VÁGYÁS  főnév -t, (-ok), -a (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">költői</span>)
A vágy(ik) igével kifejezett lelki folyamat; az a tény, hogy vki vágyik vmire; vágyódás. □ Elmegyek, elmegyek. El is van vágyásom. (népköltés) Lelke lebeg kardján, kezeit vágyása vezérli. (Vörösmarty Mihály)
<ul><li>Szóösszetétel(ek): nagyravágyás.
</li></ul></div>
