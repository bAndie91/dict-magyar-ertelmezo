VÁROSSZERTE  [s-sz] határozószó
A városnak nagyon sok helyén (pontján), az egész városban mindenütt. <span style="color:blue">Városszerte beszélik. Városszerte ismert személy.</span> □ Szaladt  kihirdetni a tilalmat városszerte. (Jókai Mór) A Gregorics testvérek  nagy csúfságot csaptak városszerte. (Mikszáth Kálmán)
