VILLANYÚJSÁG  [ny-ú] főnév
Olyan elektromos berendezés, amely forgalmas utakon, tereken a magasban elhelyezett villanykörték rendszeréből nagy, világító, elfutó betűket alkot, s ily módon vmely hír, tájékoztatás, esetleg hirdetés szövegét egyidejűleg sok ember számára olvashatóan közli.
