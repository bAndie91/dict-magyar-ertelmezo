VERŐKOS  főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Cölöpverő gépeken használatos, fából v. vasból készült, kalapácsszerű eszköz, amely gépi erővel a cölöpöt a földbe veri; verőbak. <span style="color:blue">A verőkos percenként tíz ütést mért a cölöpre.</span>
