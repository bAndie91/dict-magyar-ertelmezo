VALLÁSHÁBORÚ  főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
A különféle vallásfelekezetek között, kül. a XVII. században a protestánsok szabad vallásgyakorlatáért, ill. ennek megakadályozásáért, de emellett rendsz. különféle hatalmi érdekekért is folytatott háború.
