VÉRÖZÖN  [r-ö] főnév (<span style="color:green;font-weight:bold">költői</span>)
Kiontott vér özöne; nagyon sok kiontott vér. □ Bú s kétség mellette, Vérözön lábainál  (Kölcsey Ferenc) Vész a réműletes ifjú: Kardja feszítve szorúl markába, de szíve sebéből Vérözön omlik alá. (Vörösmarty Mihály)
