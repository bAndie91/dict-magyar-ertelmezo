VISSZAJÖVETEL  [e-e] főnév -t, (-ek), -e [ë, e]
A visszajön igével kifejezett cselekvés; az a tény, hogy vki, vmi (korábbi, előbbi helyére) visszajön; visszajövés, visszatérés. <span style="color:blue">A családjába, otthonába, szülőföldjére való visszajövetel, a háborúból való visszajövetele után.</span>
<ul><li>visszajöveteli.
</li></ul></div>
