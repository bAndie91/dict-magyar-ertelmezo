VICCELŐDIK  [ë] tárgyatlan ige -tem [e], -ött, -jék (-jön) (<span style="color:green;font-weight:bold">bizalmas</span>)

<ul><li>Igekötős igék: elviccelődik.
</li><li>viccelődés; viccelődő.
