VISSZABESZÉL  tárgyatlan ige (<span style="color:green;font-weight:bold">bizalmas</span>, <span style="color:green;font-weight:bold">rosszalló</span>)
Utasításra, figyelmeztetésre kéretlenül, tiszteletlenül, bírálgatva, méltatlankodva válaszol; újra meg újra visszafelel; felesel. <span style="color:blue">Illetlen, szájas fiatalember: mindig visszabeszél az öregebbnek.</span>
<ul><li>visszabeszélés; visszabeszélő; visszabeszélt.
