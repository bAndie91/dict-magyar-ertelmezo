VEZETÉKES  [e-e-ë] melléknév
(<span style="color:green;font-weight:bold">postaügy</span>) Vezeték segítségével történő távközlés. || a. <span style="color:blue">Vezetékes rádió:</span> olyan berendezés, amely vmely adóállomásnak egy helyi központban rádión felvett műsorát vezetéken továbbítja az előfizetőkhöz, ill. hallgatókhoz. <span style="color:blue">A kórtermekben vezetékes rádió van.</span>
