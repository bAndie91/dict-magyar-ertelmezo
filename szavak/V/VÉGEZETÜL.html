VÉGEZETÜL  határozószó (<span style="color:green;font-weight:bold">választékos</span>)
Végül (13). □ Végezetül pedig  belökte a brácsást meg a cimbalmost a folyamba. (Mikszáth Kálmán) Tudom, hogy nem örülsz nekem, Klára, mégis elmegyek. Nem akarom, hogy valami ostobaságot kövess el végezetül. (Krúdy Gyula)
