VAKTÖLTÉNY  főnév
Riasztásra, díszlövésre v. gyakorlatozásra használt olyan töltény, amelyben a lőpor fölött nincs (éles) lövedék, csak ezt helyettesítő, a kilövés után a levegőben szétfoszló és ezért sebesülést nem okozó papírdugó. <span style="color:blue">A gyakorlaton a tüzérség és gyalogság vaktöltényt használt.</span>
