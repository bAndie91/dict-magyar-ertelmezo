VADHÚS [2]  főnév (<span style="color:green;font-weight:bold">orvostudomány</span>)
&lt;A bőr v. nyálkahártya megsebzésének helyén&gt; a kötőszöveteknek a sejtek burjánzása következtében létrejött szaporulata, amelyet rendsz. hám is borít (Caro luxurians). <span style="color:blue">Elvágta az ujját, vadhús nőtt a helyén.</span>
