VASAJTÓ  [s-a] főnév
Vaslemezből készült, ill. vaslemezzel borított, erős ajtó. <span style="color:blue">A börtön, a vár vasajtaja.</span> □ Nyílt a börtön vasajtaja  (Jókai Mór) Az öltözők vasajtaját viharosan nyitja ki és be a színházi szolga. (Krúdy Gyula)
<ul><li>vasajtós; vasajtójú.
