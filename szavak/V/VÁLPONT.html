VÁLPONT  főnév (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
&lt;Életben, sorsban, döntésben&gt; fordulópont. □ Csodás az emberszív, epedve vágyik, Fennen dobog egy-egy válpont felé, S midőn közel van vissza-visszaborzad. (Madách Imre) Hát most már itt vagyunk, édes jó hitvesem, a válpontnál. (Mikszáth Kálmán)
