VÉDBÁSTYA  főnév (<span style="color:green;font-weight:bold">régies</span>)
Védőbástya (kül. 2). □ A török császár megindult a keresztyén hit védbástyáját, Magyarországot összezúzni. (Jókai Mór) A megyéken, a régi magyar alkotmány e védbástyáin, folyt a harc. (Gyulai Pál)
