VILLANYOSZLOP  [ny-o] főnév
Szabad (nem földbe fektetett) villamosvezetéket, ennek szigetelőit tartó, fából, vasból v. vasbetonból készült oszlop; vezetékoszlop. <span style="color:blue">Az autó nekivágódott egy villanyoszlopnak.</span>
<ul><li>villanyoszlopos; villanyoszlopú.
</li></ul></div>
