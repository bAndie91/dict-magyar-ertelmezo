VALLÁSSZABADSÁG  [s-sz] főnév
Az a jogi helyzet, amelyben bárki bármilyen vallást szabadon gyakorolhat, ill. szabadon vallhatja felekezeten kívüli voltát is. <span style="color:blue">A legteljesebb vallásszabadság híve. Bocskai István síkra szállt a vallásszabadságért is.</span>
<ul><li>vallásszabadsági.
