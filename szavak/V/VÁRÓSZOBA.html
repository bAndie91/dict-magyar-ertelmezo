VÁRÓSZOBA  főnév
Várakozás céljára szolgáló, erre többé-kevésbé alkalmasan berendezett kisebb helyiség, szoba. <span style="color:blue">Orvosi várószoba; a hivatal zsúfolt várószobája.</span> □ Minduntalan haza kellett térnie, hogy a várószobájában felgyűlt betegeit ellássa. (Mikszáth Kálmán)
várószobai; várószobás.
