VARRÓASZTAL  főnév
Kisebb, fiókos asztal, amely mellett varrni szoktak; fiókjában a varráshoz szükséges tárgyakat, eszközöket tartják. □ Az ablaknál egy kis varróasztal volt. (Petőfi Sándor) Sírva ült le varróasztala mellé. (Gyulai Pál)
<ul><li>varróasztali; varróasztalka; varróasztalos.
