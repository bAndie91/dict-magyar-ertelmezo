VISSZAHAJTÁS [1]  főnév
A visszahajt [1] igével kifejezett cselekvés, művelet, ill. az a cselekvés, hogy vmit, vkit visszahajtanak (vhová); vminek v. ritk. vkinek vhová való visszaterelése. <span style="color:blue">Az állatoknak az istállóba, az ólba való visszahajtása.</span>
