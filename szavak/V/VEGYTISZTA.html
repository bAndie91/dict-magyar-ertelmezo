VEGYTISZTA  [e v. ë] melléknév (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Hozzá nem tartozó anyag(ok)tól mentes, mással nem kevert, nem szennyezett, tiszta &lt;vegyi anyag&gt;. <span style="color:blue">Vegytiszta alkohol, benzin</span>. || a. (<span style="color:green;font-weight:bold">ritka</span>) Vegyileg, vegyi eljárással tisztított &lt;anyag&gt;. <span style="color:blue">Vegytiszta</span> <span style="color:blue">ágytoll.</span>
