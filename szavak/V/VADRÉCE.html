VADRÉCE  főnév vadruca (<span style="color:green;font-weight:bold">népies</span>)
Vadkacsa, tőkés réce. □ Alföldi rónaság termő határiban, Derék tavat talál gém s vadruca. (Tompa Mihály) Fölkereste fészkit a réti madárnak, Szárcsa-, vadrucának, bíbicnek, sirálynak. (Arany János)
<ul><li>Szóösszetétel(ek): vadrécetojás.
</li><li>vadrécés.
