VÉDERŐVITA  [d-e] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
A véderő szervezéséről szóló s az 1888. évben az országgyűlés elé terjesztett törvényjavaslat körül kialakult hosszú és heves vita. □ [Az elnöki szék] a véderővita óta úgyszólván Dózsa György izzó trónusává lett. (Mikszáth Kálmán)
véderővitai.
