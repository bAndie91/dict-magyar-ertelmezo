VÉRRÖG  főnév (<span style="color:green;font-weight:bold">orvostudomány</span>)
Megalvadt vérből támadt apró rög (2) az erekben; rendsz. az ér falára tapad, s az eret gyak. elzárja (thrombus).
<ul><li>Szóösszetétel(ek): vérrögképződés.
</li><li>vérrögöcske; vérrögös.
</li></ul></div>
