VETŐHÁLÓ  főnév (<span style="color:green;font-weight:bold">halászat</span>)
A kerek hálók egyik fajtája, melynek az alsó inán ólomgolyók vannak; szétágazó zsinegről pöndörítve vetik a vízbe, úgyhogy az alja szoknya módjára szétterül.
<ul><li>vetőhálójú; vetőhálós.
</li></ul></div>
