VITÉZSÉGI  [ss; z-s] melléknév (<span style="color:green;font-weight:bold">katonaság</span>)
Vitézséggel szerzett v. vitézségért kapott. <span style="color:blue">Arany, ezüst</span> v. <span style="color:blue">bronz vitézségi érem.</span> □ A pénztárnál egy 48-as honvéd főhadnagy ült, egyenruhában, mellén a koszorús vitézségi renddel. (Jókai Mór)
