VÉGIGESIK  [g-e] tárgyatlan ige
&lt;Ember v. álló merev test&gt; elesik, ledől, és egész hosszában elterül vhol. <span style="color:blue">Végigesett a díványon, a padlón.</span> □ Nehéz zuhanás hangzott, mint ahogy valami súlyos, élettelen test hosszában végigesik a sárba. (Jókai Mór)
<ul><li>végigesés; végigesett; végigeső.
