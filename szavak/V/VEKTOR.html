VEKTOR  [ë v. e] főnév -t, -ok, -a v. -ja (<span style="color:green;font-weight:bold">fizika</span>)
Olyan mennyiség, amelynek  nagyságán kívül  iránya is van (pl. az elmozdulás, az erő, a gyorsulás, a sebesség). <span style="color:blue">Vektorok eredője, összeadása, összege. A vektort felbontja összetevőire.</span>
<ul><li>Szóösszetétel(ek): vektoranalízis; vektormennyiség.
