VITÁS  melléknév
Olyan, amiről vita folyik, ami még nincs eldöntve; kétségbevonható, vitatható. <span style="color:blue">Vitássá tesz vmit. Ez régóta vitás kérdés.</span> □ Hagyjuk a vitás pontokat személyes találkozásra. (Arany János) Soha a világ eleje óta nem merült föl köztük semminemű vitás kérdés. (Mikszáth Kálmán)
