VÉGIGGURUL  tárgyatlan ige
Gurulva végighalad vhol. <span style="color:blue">A pénzdarab leesett, és végiggurult a padlón.</span> □ Egy csomó lenfonál esett ki kosaramból, s végiggurult a szőnyegen. (Tolnai Lajos) Érezte, hogy egy könnycsepp gurul végig kezefején. (Mikszáth Kálmán)
<ul><li>végiggurulás; végigguruló; végiggurult.
</li></ul></div>
