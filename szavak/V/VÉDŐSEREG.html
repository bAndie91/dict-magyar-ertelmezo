VÉDŐSEREG  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
<ul><li>1. Vmely helységben, erődítményben állomásozó, annak biztonságáról gondoskodó fegyveres erő; helyőrség.
</li><li>2. A hadsereg más részeinek mozdulatait fedező fegyveres erő. <span style="color:blue">A védősereg fedezte a főerők elvonulását.</span>
</li></ul></div>
