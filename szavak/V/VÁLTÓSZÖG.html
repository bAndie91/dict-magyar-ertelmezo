VÁLTÓSZÖG  főnév (<span style="color:green;font-weight:bold">mértan</span>)
Két párhuzamos egyenest átszelő egyenes vonal metszéspontjainál keletkezett olyan szögek közül az egyik, amelyek mind az átmetsző egyenes, mind az átmetszett egyenesek különböző oldalán vannak, és egymással egyenlők. <span style="color:blue">Belső, külső váltószögek.</span>
