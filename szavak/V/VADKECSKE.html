VADKECSKE  főnév
<ul><li>1. A különféle fajtákban kitenyésztett házi kecske vadon élő őse.
</li><li>2. (<span style="color:green;font-weight:bold">állattan</span>) Az Alpokban honos, a házi kecskéhez hasonló, nagy és vastag szarvú, vörösesszürke színű, páros ujjú kérődző állat (Capra ibex).
</li></ul></div>
