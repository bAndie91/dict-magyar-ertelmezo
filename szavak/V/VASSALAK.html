VASSALAK  főnév
Különféle vasfajták olvasztásakor keletkező salak. <span style="color:blue">A kovácsműhelyben parázslott az elhulló vassalak. A vassalakot a betonkészítésben is hasznosítják.</span> □ Megeredt a szél. A fúvásától kigyulladt az égboltozat alja, és kékesvörös fényben izott, mint a vassalak. (Herczeg Ferenc)
