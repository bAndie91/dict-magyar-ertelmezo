VISSZATEGEZ  tárgyas ige
Te-nek szólítja azt, aki őt tegezi. <span style="color:blue">Idősebb munkatársát visszategezte.</span> □ Bontáné szólt Irmához, tegezte, Irma felelt,  de csakhamar érezhetővé vált, hogy nem meri Bontánét visszategezni. (Nagy Lajos)
