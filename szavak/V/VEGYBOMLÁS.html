VEGYBOMLÁS  [e v. ë] főnév (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Vegyi átalakulás, amelynek során vmely vegyület két v. több új anyagra bomlik. □ A természet örök élet, azaz physice [= fizikailag] semmi test nem hal meg, csak vegybomlás alá jő. (Arany János)
<ul><li>vegybomlási; vegybomlású.
</li></ul></div>
