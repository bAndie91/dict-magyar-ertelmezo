VÁMHIVATAL  főnév
Hivatal (13) a vámolással kapcsolatos ügyek intézésére, az államhatáron át bevitt áruk elvámolására, a kivetett vámok és illetékek beszedésére. <span style="color:blue">Belső, határszéli vámhivatal; a vámhivatalban kivált vmit; a vámhivatal letétbe helyez, visszatart vmit</span>.
