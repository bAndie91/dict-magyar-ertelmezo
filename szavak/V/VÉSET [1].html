VÉSET [1]  [e] tárgyas ige -tem, -ett [e, ë], vésessen [e-ë]
Elrendeli, meghagyja, hogy vmit vhova véssenek. <span style="color:blue">Nevet véset a gyűrűbe. Felírást véset a sírkőre.</span>
<ul><li>Igekötős igék: bevéset; belevéset; kivéset; körülvéset; levéset; megvéset; odavéset; rávéset.
</li><li>vésetés; vésetett; vésető.
</li></ul></div>
