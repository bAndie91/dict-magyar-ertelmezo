VÁSZONNADRÁG  főnév
Vászonból varrott rövid v. hosszú (felső) nadrág. □ Vadászujjasa, vászonnadrágja és molyette borztarisznyája fedezték testét. (Kölcsey Ferenc) Szürke vászonnadrág volt rajta és zubbony. (Babits Mihály)
