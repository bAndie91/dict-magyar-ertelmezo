VILÁGFIAS  melléknév -an (<span style="color:green;font-weight:bold">elavulóban</span>)
Világfihoz illő, rá jellemző, tőle származó &lt;magatartás, megnyilatkozás, külső&gt;. <span style="color:blue">Világfias életmód, felfogás, modor, öltözködés, viselkedés.</span> □ Végigment a korzón, bátran tekintett a lányok után, úgy érezte, hogy világfias és könnyed. (Kosztolányi Dezső)
