Sok embernek, kül. embertömegnek kegyetlen legyilkolása; mészárlás, vérengzés. <span style="color:blue">Vérfürdőt rendez.</span> □ A székelyfiaknak Mátéfalván vérfördő készítteték. (Kölcsey Ferenc) Ők emlegetnek törvényt és jogot, Ők az aradi vérfürdő után! (Szigligeti Ede)
