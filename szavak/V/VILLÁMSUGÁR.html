VILLÁMSUGÁR  főnév (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">választékos</span>)
A villámlás, villámcsapás fénye; villám. □ Egy függőleges villámsugár egyenesen a város közepére csapva le, megrendíté sújtó csattanásával a földet. (Jókai Mór)
