VAKRÉMÜLET  főnév
Hirtelen fellépő nagy(fokú) ijedség, rémület, amely rendsz. tömegben összegyűlt embereket annyira hatalmába kerít, hogy semmiféle ésszerű, józan megnyugtatással nem lehet lecsillapítani őket; pánik. <span style="color:blue">A színházban valaki tüzet kiáltott, s a közönséget nyomban vakrémület szállta meg.</span>
