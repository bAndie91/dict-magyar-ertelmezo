VESZEKEDŐS  [e-e-ë] melléknév -en, -ebb [e, e]
Olyan &lt;személy&gt;, aki természeténél fogva gyakran, sokat veszekszik v. szeret veszekedni. <span style="color:blue">Veszekedős asszony, gyerek.</span> || a. Ilyen személyre jellemző, tőle származó. <span style="color:blue">Veszekedős kedvében van. Veszekedős hangon beszélt.</span>
