VIRÁGÁLLAT  [g-á] főnév (<span style="color:green;font-weight:bold">állattan</span>)
&lt;A tengerek fenekén&gt; helyhez kötötten, olykor nagy telepekben élő, egyszerű szerkezetű állati lény; tapogatói gyakran élénk színű virágszirmokra emlékeztetnek. □ A virágállat farka gyökeret ver az élő földbe. (Jókai Mór)
