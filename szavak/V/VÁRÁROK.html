VÁRÁROK  [r-á] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
Várat, erődítményt körülvevő, rendsz. vízzel telt v. ostrom idején elárasztható mély, széles árok a támadás megnehezítésére, ill. megakadályozására. <span style="color:blue">A várárok fölött felvonóhíd vezetett a kapuhoz. </span>□ A várárokból kivágták a sánckarókat. (Jókai Mór)
