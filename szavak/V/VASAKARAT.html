VASAKARAT  [s-a] főnév
Nehézségek által meg nem ingatható, le nem győzhető, nagyon erős akarat. <span style="color:blue">Vasakarattal küzd vmiért. Vasakarata legyőzte a nehézségeket.</span> □ Batthyány vasakaratja  Széchenyit és Kossuthot egy pórázra fűzte. (Kemény Zsigmond)
