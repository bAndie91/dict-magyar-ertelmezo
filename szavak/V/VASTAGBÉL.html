<div class="szocikk">
VASTAGBÉL  főnév
A bélrendszernek alsó, vastag, többszakaszos része, amely a vékonybéltől és a vakbéltől a végbélig terjed, s amelyben főleg a tápláléknak nem emészthető része gyülemlik fel.
<ul><li>Szóösszetétel(ek): vastagbélhurut.
</li><li>vastagbeles; vastagbelű.
</li></ul></div>
