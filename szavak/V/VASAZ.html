VASAZ  tárgyas ige -tam, -ott, -zon
Azzal van elfoglalva, hogy vasból készített lemezzel, pánttal, abronccsal, sínnel v. más alkatrésszel lát el vmit. <span style="color:blue">Kerékagyat, tengelyt vasaz.</span> □ Patkót csinált, meg vasazta az ekevasat. (Móricz Zsigmond)
<ul><li>Igekötős igék: megvasaz.
</li><li>vasazás; vasazat; vasaztat.
