<div class="szocikk">
VAKHÍR  főnév (<span style="color:green;font-weight:bold">elavulóban</span>)
Jelentősebb, rendsz. szomorú v. megrendítő hír, amelyről később kiderül, ill. amelyről már eleve nyilvánvaló volt, hogy alaptalan. <span style="color:blue">Ez csak vakhír.</span> □ Valami vakhír terjedt el a táborban. (Jókai Mór)
<ul><li>Szóösszetétel(ek): vakhírterjesztő.
</li></ul></div>
