VÉSNÖK  főnév -öt, -e [e]
Díszítőelemeknek, betűknek, szövegeknek fémtárgyakba való bevésésével iparszerűen foglalkozó személy. <span style="color:blue">A vésnök a két arany karikagyűrűbe a menyasszony és a vőlegény nevét véste be.</span>
<ul><li>Szóösszetétel(ek): vésnökmunka.
</li><li>vésnöki; vésnökség.
