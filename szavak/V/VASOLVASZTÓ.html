VASOLVASZTÓ  [s-o] főnév (<span style="color:green;font-weight:bold">kohászat</span>)
Nyersvas előállítására különleges eljárással épített és megfelelő fölszereléssel ellátott aknás kemence, kohó; nagyolvasztó. || a. Vasgyár részlege, ahol a nyersvasat olvasztással előállítják. || b. Ennek épületei és telepe. || c. Az itt dolgozók összessége.
