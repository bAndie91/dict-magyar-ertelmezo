VÍGSÁGOS  melléknév -an, -abb (<span style="color:green;font-weight:bold">régies</span>)
<ul><li>1. Vígsággal járó, jókedvvel töltött, vidám. □ Minden vissza fog még térni. A régi öröm, jó barátok, vígságos téli esték. (Jókai Mór)
</li><li>2. Jókedvű, mulatozó, vígságra hajlamos. □ A vígságos sereg panaszkodni fog érted. (Csokonai Vitéz Mihály)
</li></ul></div>
