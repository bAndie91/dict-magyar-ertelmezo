TÚLZÁSBAVITEL  főnév
A túlzásba visz szókapcsolattal kifejezett cselekvés, ill. az a tény, hogy vmit túlzásba visznek; vminek a kelleténél, a kívánatosnál nagyobb mértékben való folytatása, űzése, gyakorlása. <span style="color:blue">A sportnak, a szórakozásnak túlzásbavitele.</span>
