TŐSZÁMNÉV  főnév (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
Olyan számnév, amely személy(ek)nek v. tárgy(ak)nak, dolognak, ill. dolgoknak a számát, esetleg mennyiségét fejezi ki (pl. egy, kettő, három, négy; kevés, sok). <span style="color:blue">A tőszámnévből képezzük a sorszámnevet, a törtszámnevet.</span>
<ul><li>tőszámnévű; tőszámneves; tőszámnévi.
</li></ul></div>
