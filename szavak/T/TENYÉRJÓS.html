TENYÉRJÓS  főnév
A tenyér redőinek, vonalainak vizsgálata alapján babonás szokás szerint jövendőt mondó, kézjóslással foglalkozó személy. <span style="color:blue">Egy szálhámos tenyérjósnál volt. Tenyérjósokhoz jár.</span> || a. jelzői használat(ban) A tenyér redőiből jósló &lt;személy&gt;. <span style="color:blue">Tenyérjós cigányasszony.</span>
