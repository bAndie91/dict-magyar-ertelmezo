TÚLSÓ  melléknév
A beszélővel átellenben levő, arrafelé eső. <span style="color:blue">A túlsó part</span> ←<span style="color:blue">; a folyó túlsó partja; a kert túlsó vége.</span> □ [Az idegen nyelvű segédcsapatok]  a fővezérnek a túlsó parton haladó seregéhez csatlakoztak. (Gárdonyi Géza) Veres tanító úr át akart menni a túlsó oldalra. (Móricz Zsigmond)
