A tömlöc(ben a rabok) őre; börtönőr. □ Majd ha az az átkozott tömlöctartó látja, hogy én nemes ember vagyok, tudom, bosszankodik. (Eötvös József) Ankerschmidt inte a tömlöctartónak, hogy hagyja magukra [őket]. (Jókai Mór)
