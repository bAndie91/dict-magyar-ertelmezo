TIKSZEM [2]  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
A kankalin rokonságába tartozó, mezőn, vetés közt, kertben gyomként tenyésző növény; keskeny, tojásdad levele, apró, pirosas v. kék virága van (Anagallis arvensis). <span style="color:blue">Mezei tikszemes.</span> || a. (<span style="color:green;font-weight:bold">népies</span>) Hérics.
