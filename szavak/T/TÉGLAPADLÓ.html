TÉGLAPADLÓ  főnév 
Főleg lakóépületek mellékhelyiségeinek (konyha, kamra, folyosó) v. melléképületeknek (istálló, mosókonyha, fáskamra) téglával burkolt padlója; téglaburkolat. <span style="color:blue">A konyha téglapadlóját kijavították.</span>
<ul><li>téglapadlójú; téglapadlós.
