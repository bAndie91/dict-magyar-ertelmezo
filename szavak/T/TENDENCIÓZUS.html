TENDENCIÓZUS  [ë-ë v. e-e] melléknév -an, -abb (<span style="color:green;font-weight:bold">választékos</span>)
Olyan, amiben főleg vki, vmi ellen irányuló tendencia van; célzatos, részrehajló, elfogult. <span style="color:blue">Tendenciózus beállítás, híresztelés, politikai megnyilatkozás; tendenciózusan állít be vmit.</span>
