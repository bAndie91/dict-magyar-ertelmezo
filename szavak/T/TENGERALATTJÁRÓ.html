TENGERALATTJÁRÓ  [r-a] főnév
Olyan hadihajó, amely a víz alá merülve is folytatni tudja útját; búvárhajó. □ A német tengeralattjárók miatt az amerikai szállítmányok irányt változtattak. (Kuncz Aladár)
<ul><li>Szóösszetétel(ek): tengeralattjáró-flotta; tengeralattjáró-háború; tengeralattjáró-harc.
</li></ul></div>
