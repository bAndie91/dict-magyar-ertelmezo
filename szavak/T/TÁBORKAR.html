TÁBORKAR  főnév (<span style="color:green;font-weight:bold">katonaság</span>, <span style="color:green;font-weight:bold">régies</span>)
A táborba szállt hadvezér, magasabb katonai parancsnok szűkebb környezetét, tanácsadó testületét alkotó tisztek összessége; törzskar, vezérkar. □ A tábornok pej paripáján ülve lovagolt táborkara előtt. (Jókai Mór)
