TÚROSODIK  tárgyatlan ige -tam, -ott, -jék (-jon) (<span style="color:green;font-weight:bold">régies</span>)
Fokozatosan túrossá válik; kisebesedik, feltörik, fekélyesedik, gennyed. <span style="color:blue">A rosszul nyergelt ló háta gyakran túrosodik. Túrosodik a seb.</span>
<ul><li>Igekötős igék: feltúrosodik; kitúrosodik; megtúrosodik.
</li><li>túrosodás; túrosodó; túrosodon.
</li></ul></div>
