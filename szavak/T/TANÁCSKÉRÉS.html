TANÁCSKÉRÉS  főnév
Az a cselekvés, hogy vki tanácsot kér vkitől; tanács kérése. <span style="color:blue">Baráti, jogi, orvosi tanácskérés. Tanácskérés végett jött.</span> □ A legénység tanakodni kezdett, hogy melyiket vesse ki a kettő közül? Én feleltem a tanácskérésre s íme, tanácsom által a hajó megmenekült. (Jókai Mór)
