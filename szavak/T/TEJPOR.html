TEJPOR  főnév
A tej víztartalmának teljes elpárologtatása útján kapott olyan por, amely a tej valamennyi alkatrészét és alaptulajdonságát megtartja, s vízzel ismét folyékony tejjé alakítható; szárított, porított tej.
<ul><li>Szóösszetétel(ek): tejporgyár.
</li><li>tejporos.
</li></ul></div>
