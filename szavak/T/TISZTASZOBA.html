TISZTASZOBA  főnév (<span style="color:green;font-weight:bold">népies</span>)
&lt;Főleg falusi házban&gt; az a szoba, amelyben általában nem szoktak tartózkodni, hanem állandóan tisztán áll, többnyire csak dísznek v. olyan vendég fogadására, akit különösképpen meg akarnak tisztelni. <span style="color:blue">Bevezették a tisztaszobába.</span>
