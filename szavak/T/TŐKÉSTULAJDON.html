TŐKÉSTULAJDON  főnév (<span style="color:green;font-weight:bold">jogtudomány</span>)
A termelési eszközök magántulajdonának az a formája, amelynek alapján a termelési eszközök (tőkés) tulajdonosa a termeléshez szükséges munkaerőt formailag egyenlő felek között létrejött szerződéssel vásárolja meg, s ezzel biztosítja a bérmunkások kizsákmányolását.
