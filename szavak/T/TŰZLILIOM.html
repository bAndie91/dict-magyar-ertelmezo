TŰZLILIOM  főnév
A liliomfélék családjába tartozó, nedves réteken, erdőkben elvadulva is tenyésző kerti dísznövény, élénksárga v. tűzpiros, nagy, tölcsér alakú virága van (Hemerocallis fulva); sásliliom. □ A tűzliliom jelképe az örökké lángoló szenvedélynek. (Kemény Zsigmond)
