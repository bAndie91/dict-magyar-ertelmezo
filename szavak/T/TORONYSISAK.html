TORONYSISAK  főnév (<span style="color:green;font-weight:bold">építészet</span>)
A toronynak henger v. hasáb alakú törzse fölé emelt, rendsz. magas kúp, gúla v. hagyma alakú, többnyire rézzel v. bronzzal bevont teteje. <span style="color:blue">Az orkán levitte a toronysisakot.</span>
