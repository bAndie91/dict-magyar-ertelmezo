TEJSZÍNŰ  melléknév
A tej színéhez hasonlóan enyhén sárgás- v. kékesfehér színű. <span style="color:blue">Tejszínű bőr, folyadék, kar, lég.</span> □ Tejszínű az arca, hófehér a karja. (Mikszáth Kálmán) A tejszínű, ragyogó szemhatáron rucarajok húzódtak a fiatal füzesek felé, mint megannyi szúnyograj. (Herczeg Ferenc)
