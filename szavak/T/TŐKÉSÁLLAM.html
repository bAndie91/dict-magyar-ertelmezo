TŐKÉSÁLLAM  [s-á] főnév
Olyan állam, amely a tőkés gazdasági rendszer alapján áll, és amelyben a politikai hatalom a tőkésosztály, ill. a monopóliumok kezében van. <span style="color:blue">A tőkésállam diktatúra a munkásosztály elnyomására, fékentartására a burzsoázia érdekében.</span>
