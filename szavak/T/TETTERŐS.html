TETTERŐS  [tt-e] melléknév (<span style="color:green;font-weight:bold">választékos</span>)
Olyan &lt;személy&gt;, akiben bőven van tetterő; életerős, nagy energiájú, cselekvésre kész és alkalmas, dinamikus. <span style="color:blue">Tetterős fiatalember. A feladat elvégzéséhez tetterős férfiakra van szükség.</span>
