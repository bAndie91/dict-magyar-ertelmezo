TETVEZ  [e-e] tárgyas ige -tem, -ett, -zen [e, ë, ë]
&lt;Fejet, hajat, ruhát, szövetet&gt; igyekszik megtisztítani, megszabadítani a benne levő tetvektől. <span style="color:blue">A majom tetvezi a fiát.</span>
<ul><li>Igekötős igék: áttetvez; kitetvez; összetetvez; végigtetvez.
</li><li>tetvezés; tetvezett; tetvező; tetveztet.
</li></ul></div>
