TUMULTUÓZUS * melléknév (-an), -abb (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">sajtónyelvi</span>)
Nagy lármával és kavarodással, felfordulással, csődülettel járó, zajosan kavargó, zűrzavaros &lt;esemény&gt;. <span style="color:blue">Tumultuózus jelenetek játszódtak le. A társulatban tumultuózus gyűlés volt.</span>
