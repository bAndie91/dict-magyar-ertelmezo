TÁMASZFAL  főnév (<span style="color:green;font-weight:bold">építészet</span>)
Olyan fal, amely vmely épületet, építményt megerősít, az oldalról v. felülről jövő nyomás ellen biztosít. □ Mint kerítés, támaszfal tűnik elő az új házsorok közül egy-egy idő kormozta bástyadarab. (Jókai Mór)
<ul><li>támaszfalas; támaszfalú.
</li></ul></div>
