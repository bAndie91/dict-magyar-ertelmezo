TÁMLÁS  melléknév
Támlával ellátott &lt;ülőhely&gt;. <span style="color:blue">Támlás pad. Támlás helyett támlátlan széket hozott.</span> □ A nagy nyárfa alatt támlás pad, előtte földbe ásott asztal. (Krúdy Gyula) Ráültem a támlás székre, szememet behúnytam, hogy pihenjek egy órácskát. (Nagy Lajos)
