TÁVVEZETÉK  főnév (<span style="color:green;font-weight:bold">villamosság</span>)
A nagyfeszültségű villamos áramot a fejlesztő erőműtől a nagyobb távolságra levő fogyasztóhoz v. fogyasztókörzethez vivő vezeték. <span style="color:blue">Távvezetékek építése.</span>
<ul><li>Szóösszetétel(ek): távvezeték-berendezés; távvezeték-oszlop.
</li><li>távvezetékes; távvezetéki.
</li></ul></div>
