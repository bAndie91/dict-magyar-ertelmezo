TÁTORJÁN [1]  főnév -t, -ok, -ja (<span style="color:green;font-weight:bold">növénytan</span>)
Fehér virágú, nagy szeldelt levelű, vastag törzsű, embermagasságú évelő növény, hazánkban csak a Balaton partjának löszös területén nő (Crambe tataria).
<ul><li>Szóösszetétel(ek): tátorjángyökér.
</li></ul></div>
