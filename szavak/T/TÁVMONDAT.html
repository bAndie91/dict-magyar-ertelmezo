TÁVMONDAT  főnév (<span style="color:green;font-weight:bold">katonaság</span>, <span style="color:green;font-weight:bold">hivatalos</span>)
Távbeszélőn adott, közölt rövidebb szolgálati v. hivatalos közlemény (jelentés, üzenet, parancs), amelyet rendsz. lejegyeznek és visszaolvasnak. <span style="color:blue">Távmondat érkezett; leadja, felveszi a távmondatot.</span>
<ul><li>távmondati; távmondatnyi; távmondatos.
