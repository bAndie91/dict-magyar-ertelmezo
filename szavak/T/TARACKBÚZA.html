TARACKBÚZA  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
Szálkátlan toklászú, sok és nehezen irtható gyökeret hajtó, élénkzöld, utakon, szántókon, száraz, füves helyeken közönséges gyomnövény (Agropyron repens); tarack [1]. || a. Ezt és a vele rokon pázsitfüveket magában foglaló növénynemzetség (Agropyron). 
<ul><li>tarackbúzás.
