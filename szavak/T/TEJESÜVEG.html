TEJESÜVEG  [s-ü] főnév
Tej tartására való, vastag falú, szabványos nagyságú, rövid nyakú, széles szájú és rendsz. kartonpapír koronggal lezárt üveg. <span style="color:blue">A tejcsarnok kirakata tele van tejesüvegekkel. A boltokban a tejesüvegeket visszaváltják.</span>
