TISZTELETTUDÓ  melléknév -n. v. -an, -bb
Az illető tisztelet megadásra kész, illedelmes, tisztességtudó. <span style="color:blue">Tisztelettudó fiatalember, gyermek, szolgák, tisztelettudón beszél, viselkedik.</span> □ Tisztelettudóan vette elő megbízólevelét, s átnyújtá a tiszteletesnek. (Jókai Mór)
