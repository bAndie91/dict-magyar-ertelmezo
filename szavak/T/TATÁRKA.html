TATÁRKA  főnév ..kát, ..kája
Zöldes virágú, széles levelű, a pohánkával rokon, egykor takarmánynak hazánkban is termesztett növény (Fagopírum tataricum). □ A hamu által termékennyé lett földet első évben bevetik tatárkával. (Jókai Mór)
<ul><li>Szóösszetétel(ek): tatárkaderce; tatárkaliszt; tatárkavetés.
