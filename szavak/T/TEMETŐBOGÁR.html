TEMETŐBOGÁR  főnév
A dögbogarak családjába tartozó olyan bogár, amely kisebb dögöket elföldel, hogy ivadékai számára biztosítsa az élelmet. □ [A hangyák] ráakadnak a lapulevél alatt egy temetőbogárra, mely komor magányában ás el a föld alá egy holt gyíkot. (Bársony István)
