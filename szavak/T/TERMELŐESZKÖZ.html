TERMELŐESZKÖZ  főnév (főleg többes számban) (<span style="color:green;font-weight:bold">közgazdaságtan</span>)
Az emberek által az anyagi javak termelésének folyamatában használt munkaeszközök és munkatárgyak összessége; (helyesebben:) termelési eszköz. <span style="color:blue">Magántulajdonban levő termelőeszközök; a termelőeszközök társadalmi tulajdona.</span>
