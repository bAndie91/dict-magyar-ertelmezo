TÖNKÖLY  főnév -t, -ök, -e [e]
A búzával egy nemzetségbe tartozó gabonaféle, melynek szeme kicséplésekor a toklászok között marad, és ezekből külön kell megszabadítani (Triticum spelta). □ Egy mérce tönköly (a leghitványabb gabonafaj) száz piaszter. (Jókai Mór)
tönkölyös; tönkölyű.
