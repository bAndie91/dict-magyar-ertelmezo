TEJOLTÓ  [j-o] főnév, (<span style="color:green;font-weight:bold">népies</span>) tejojtó
Főleg szopós borjú v. bárány gyomrából készült, a tejre erjesztőleg ható anyag, amelyet kül. a sajt készítésekor használnak. <span style="color:blue">Tejoltót tesz a tejbe. A juhtejből tejoltóval gomolyát készítenek.</span>
<ul><li>tejoltós.
