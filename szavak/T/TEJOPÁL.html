TEJOPÁL  [j-o] főnév (<span style="color:green;font-weight:bold">ásványtan</span>, <span style="color:green;font-weight:bold">ékszerészet</span>)
Tejszínű opál. <span style="color:blue">Gyűrűjében nagy tejopál van.</span> || a. jelzői használat(ban) Ebből v. ennek felhasználásával készült, ill. ebbe vésett. <span style="color:blue">Tejopál gyűrű, kő.</span> □ A bárónő egy gyűrűt vont le ujjáról, tejopál címer, apró gyémántokkal szegélyezve. (Herczeg Ferenc)
