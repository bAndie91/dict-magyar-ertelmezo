TÚLÓRA  [l-ó] főnév
Az az egyórai munkaidő, melyet vmely dolgozó a hivatalosan v. szerződésileg megállapított időn túl munkában tölt. <span style="color:blue">Túlórát</span> → <span style="color:blue">csúsztat. A múlt héten hat túlórája volt.</span> 
<ul><li>Szóösszetétel(ek): túlóradíj; túlórakeret; túlórapótlék; túlórarendszer.
</li><li>túlórai; túlórás.
</li></ul></div>
