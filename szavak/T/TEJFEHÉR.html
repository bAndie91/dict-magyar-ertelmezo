TEJFEHÉR  melléknév
A tej színéhez hasonlóan, egy kissé kékes árnyalatúan fehér. <span style="color:blue">Tejfehér arc, bőr, kéz, oldat; a láma tejfehér fénye.</span> □ Az asszony gyönyörű volt tejfehér arcával. (Mikszáth Kálmán) [A tűzben] ott sistereg a vas, míg csak tejfehérre nem tisztul. (Móricz Zsigmond)
