TÖPRENGÉS  főnév -t, -ek, -e [ë, e]
A töpreng igével kifejezett cselekvés. <span style="color:blue">Töprengésbe merül. Sok töprengés után végre döntött.</span> □ Erre bizony nem tudott felelni senki, hiába volt minden töprengés, találgatás. (Mikszáth Kálmán)
