TEREPVÁZLAT  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Vmely kisebb területről, terepről készült térképszerű, de a célnak megfelelően egyszerűsített, kevésbé pontos, vázlatos rajz. <span style="color:blue">A parancsnok átadta a terepvázlatot a járőrnek. Jelentéséhez terepvázlatot mellékelt.</span>
