TARLÓHÁNTÁS  főnév (<span style="color:green;font-weight:bold">mezőgazdaság</span>)
A tarlónak ekével, tárcsával, tárcsás boronával v. kultivátorral legfeljebb 13 cm mélyen történő felhasítása, ill. aláfordítása (közvetlenül az aratás után). <span style="color:blue">A tarlóhántás és az őszi mélyszántás idejében való elvégzése a korszerű talajművelés alapja.</span>
