TEREPTÁRGY  főnév (<span style="color:green;font-weight:bold">katonaság</span>, <span style="color:green;font-weight:bold">földrajz</span>)
Olyan nagyobb, feltűnő építmény, létesítmény (épület, híd, (vasúti) töltés, kút stb.) v. (<span style="color:green;font-weight:bold">ritka</span>) természetes képződmény (pl. fa), amely a földfelszín, a terep eredeti arculatát megváltoztatja, rá jellemző, s amelyet az egészen részletes térkép fel is tüntet.
</div>
