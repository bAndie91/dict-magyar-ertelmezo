TŰRÖMOLAJ  [m-o] főnév (<span style="color:green;font-weight:bold">népies</span>, <span style="color:green;font-weight:bold">tréfás</span>)
Béketűrés, türelem &lt;vmely baj, kellemetlenség elviselésében&gt;. <span style="color:blue">Elfogyott a tűrömolaja.</span> □ Ekkor már én is kifogytam a tűrömolajból. (Szigligeti Ede) Volt a jövő-menő udvari nép közt, aki tűrömolajat javallott [= a fogfájásra]. (Móra Ferenc)
