TÜDŐHÓLYAGOCSKA  főnév (rendsz. többes számban) (<span style="color:green;font-weight:bold">bonctan</span>)
A légutaknak kb. 0,2 mm átmérőjű, hólyag alakú végződése a tüdőben (alveolus); ebben megy végbe a gázanyagcsere (az oxigén felvétele, a széndioxid leadása). <span style="color:blue">A tüdőhólyagocskák kitágulnak. A vér a tüdőhólyagocskákban kap oxigént.</span>
</div>
