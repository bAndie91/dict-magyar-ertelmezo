TISZTELETADÁS  [t-a] főnév (<span style="color:green;font-weight:bold">választékos</span>)
Az a cselekvés v. magatartás, hogy egy v. több személy megadja a tiszteletet vkinek, vminek; tisztelet tanúsítása, nyilvánítása vki, vmi iránt. <span style="color:blue">Illő tiszteletadás; tiszteletadás a halottak hősök emlékének.</span>
