Olyan színű, mint a tűz lángja v. parazsa; sárgába hajló élénk piros (színű). □ Vad | robbanásként áttör a nap: | kék s fehér úszó szigetek | tolják szét s össze az eget, | lent tűzpiros giliszta von | csíkot a sárga homokon. (Szabó Lőrinc)
