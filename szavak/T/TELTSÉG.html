TELTSÉG  [teltség v. teleség] főnév -et, -e [ë, e] (csak egyes számban)
Vminek, esetleg vkinek telt, tele volta mint állapota v. tulajdonsága. <span style="color:blue">A gabonaszemek, a gyomor teltsége; az arc teltsége; a színek teltsége. Alakja elvesztette teltségét.</span>
<ul><li>teltségi.
