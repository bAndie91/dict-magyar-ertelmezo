TISZTÍTOTT  melléknév -an, -abb
Olyan, amit megtisztítottak, kitisztítottak. <span style="color:blue">Tisztított baromfi, krumpli, vetőmag, zöldség; tisztított ruha.</span> □ Szaladjon le a "Sziriusz" kávéházba, és hozzon fel egy másik pakli kártyát, szép tisztítottat. (Ambrus Zoltán)
