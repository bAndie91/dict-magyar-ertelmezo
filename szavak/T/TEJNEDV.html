TEJNEDV  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
Némely növény edényeiben levő, többnyire tejszerű nedv, amely a növény sérülése esetén szárából v. leveleiből szivárog; a növény számára tartalék tápanyagul v. állatok ellen védekezésül szolgál. <span style="color:blue">A vérehulló fecskefű tejnedve narancsszínű.</span>
</div>
