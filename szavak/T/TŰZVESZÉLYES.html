TŰZVESZÉLYES  [e-ë] melléknév (-en), (-ebb) [e, e]
Olyan &lt;anyag, tárgy&gt;, amely nagyon könnyen okoz v. okozhat tüzet, v. könnyen válhatik a tűz martalékává; gyúlékony, robbanékony. <span style="color:blue">Tűzveszélyes anyag, berendezés, ház, padlás, raktár.</span>
<ul><li>tűzveszélyesség.
</li></ul></div>
