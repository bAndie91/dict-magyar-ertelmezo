TEMPLOMOZ  [e] tárgyatlan ige -tam, -ott, -zon (<span style="color:green;font-weight:bold">ritka</span>)
Templomba jár v. megy. □ Abban az időben a remete tartotta fenn a hitet. A szegény köznép: a pásztor, a szénégető nem járhat a faluba templomozni, ellenben a remetét mindig ott találja a barlangjában. (Jókai Mór)
