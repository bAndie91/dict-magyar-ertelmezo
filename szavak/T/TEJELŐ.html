TEJELŐ  [e-e] melléknév
Olyan &lt;tehén v. más fejős állat&gt;, amely (vmilyen mértékben) tejel. <span style="color:blue">Jól tejelő kecske. Tehene szelíd, emellett jó tejelő. A mi tehenünk rosszabb tejelő, mint az övék.</span> □ Volt gulyám, juhnyájam, tejelő bivalyom. (Jókai Mór)
