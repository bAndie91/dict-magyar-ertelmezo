TÉLIRE  [e] határozószó
A tél idejére, tartamára. <span style="color:blue">Télire beköltözött a városba. Meghagyott télire egy oldal szalonnát.</span> □ A nyílhatatlan táblájú ablakokat ősz végén körültapasztják télire. (Mikszáth Kálmán) Küldjetek szappant, lóhúst s télire | apadt testünkre adjatok ruhát. (József Attila)
