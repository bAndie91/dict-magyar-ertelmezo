TENGERZÁR  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Ellenséges tengeri kikötőnek, partrésznek v. tengerrésznek hadihajókkal való elzárása a forgalomtól; blokád. <span style="color:blue">Tengerzár alá vesz; tengerzárt létesít; feloldja, megszünteti a tengerzárt. A tengerzár a tengeri háború egyik módja.</span>
