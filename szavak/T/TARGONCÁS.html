TARGONCÁS  melléknév és főnév -t, -ok, -a
Olyan (személy), akinek targoncája van, v. azzal dolgozik. <span style="color:blue">Targoncás gyerekek, lányok, munkások. Az állomás körül targoncások álldogálnak.</span> □ Vegye át az azaléákat, s egy targoncással hozassa haza. (Jókai Mór)
