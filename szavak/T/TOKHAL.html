TOKHAL  főnév
Az Atlanti-óceánban, a Fekete-tengerben és a Káspi-tóban élő, porcos vázú nagyobb hal; besózott ikrája kaviár néven kerül forgalomba (Acipenser sturio); tok [2]. || a. Ennek emberi fogyasztásra elkészített húsa mint étel. <span style="color:blue">Tokhal volt ebédre.</span>
