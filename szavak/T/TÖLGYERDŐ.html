TÖLGYERDŐ  [gy-e] főnév
Tölgyfákból álló erdő; tölgyfaerdő, tölgyes. <span style="color:blue">A hegyoldalt tölgyerdő borítja.</span> □ [A völgy] oldalait tölgy- és bükkerdő szegte be. (Kemény Zsigmond) [Szatmárban] igazi tölgyerdők voltak. (Móricz Zsigmond)
