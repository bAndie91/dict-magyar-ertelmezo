TÖRTSZÁM  főnév (<span style="color:green;font-weight:bold">mennyiségtan</span>)
Vmely, egységnél kisebb mennyiségnek számszerű kifejezése: két olyan szám hányadosa, amelyek közül az osztandó kisebb az osztónál; az előbbi a számláló, az utóbbi a nevező; tört (II.1). <span style="color:blue">Egész számok és törtszámok.</span>
<ul><li>törtszámos.
</li></ul></div>
