TURCSI  melléknév és főnév
<ul><li>I. melléknév (<span style="color:green;font-weight:bold">népies</span>) A disznó orrához hasonló &lt;orr&gt;; olyan, aminek a hegye kissé fölfelé áll; pisze. <span style="color:blue">Turcsi orr(ú).</span>
</li><li>II. főnév -t, -ja (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">régies</span>) Kicsiny, igénytelen külsejű lófajta, ill. ilyen ló neve. □ Volt négy bozontos szőrű turcsija. (Jókai Mór)
</li></ul></div>
