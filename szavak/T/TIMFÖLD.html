TIMFÖLD  főnév (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Bauxitból előállított alumíniumoxid (Al2O3), amelyből elektrolízissel az alumíniumot gyártják.
<ul><li>Szóösszetétel(ek): timföldcement; timföldgyár; timföldgyártás; timföldipar; timföldpala; timföldsalak; timföldvegyület; timföldüzem.
</li><li>timföldes.
</li></ul></div>
