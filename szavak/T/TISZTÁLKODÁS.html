TISZTÁLKODÁS  főnév -t, (-ok) -a
A tisztálkodik igével kifejezett cselekvés; az a tény, hogy vki, vmi tisztálkodik. <span style="color:blue">A gyerekek, a katonák tisztálkodása; a macska tisztálkodása. Ma nagy tisztálkodás lesz. Nincs alkalma tisztálkodásra. Nem szereti a tisztálkodást.</span>
<ul><li>tisztálkodási.
