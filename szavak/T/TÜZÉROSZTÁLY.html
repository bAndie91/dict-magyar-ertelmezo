TÜZÉROSZTÁLY  [r-o] főnév (<span style="color:green;font-weight:bold">katonaság</span>)
A tüzérségnek az a szervezési egysége, amely rendsz. három ütegből és a vezetéshez, utánpótláshoz stb. szükséges szervekből áll. <span style="color:blue">Légvédelmi, tábori tüzérosztály; fogatolt, gépvontatású tüzérosztály; a tüzérosztály laktanyája.</span>
<ul><li>tüzérosztályi.
