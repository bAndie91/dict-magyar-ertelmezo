TILTAKOZÓ  melléknév -n v. -an
Olyan, aki v. ami tiltakozik, tiltakozást fejez ki. <span style="color:blue">Tiltakozó gyűlés, jegyzék, sztrájk, távirat; tiltakozó emberek ezrei, felemeli tiltakozó szavát vmi ellen.</span> □ Száz fenyegető, tiltakozó vagy csodálkozó mozdulat keresztezte egymást. (Mikszáth Kálmán)
