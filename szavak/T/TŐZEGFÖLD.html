TŐZEGFÖLD  főnév
Tőzegből keletkezett, fekete, finom szemcsés, olykor homokkal kevert termőföld. <span style="color:blue">A tőzegföldet a kertészetben használják.</span> □ Ez [a virág] csak meleg vízforrás körül terem meg, sós talajú tőzegföldben. (Jókai Mór)
tőzegföldes; tőzegföldű.
