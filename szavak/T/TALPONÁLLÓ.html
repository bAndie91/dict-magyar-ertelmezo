TALPONÁLLÓ  [n-á] főnév (<span style="color:green;font-weight:bold">1945 után</span>)
Olyan rendsz. kisebb italbolt, ahol ülőhelyek nincsenek, és ezért a rendel italt, esetleg a (hideg) harapnivalót a vendégek állva fogyasztják el. <span style="color:blue">A főváros főútvonalain levő talponállókat megszüntetik.</span>
