TÁVIRATVÁLTÁS  [v-i] főnév
Az a tény, hogy vki táviratot intéz vkihez, és távirati választ kap tőle; az a tény hogy táviratot váltanak. <span style="color:blue">A két kormányfő szívélyes táviratváltása. Az ügylet megkötését többszöri táviratváltás előzte meg.</span>
<ul><li>táviratváltási.
