TOJÁSDAD  melléknév -on (-an)
Ellipszishez hasonló, elnyúltan gömbölyded. <span style="color:blue">Tojásdad alkú, arc, falevél.</span> □ Tojásdad telt arcát kellemes pirosság futotta el. (Tolnai Lajos) Tojásdad arc, a lehunyt hosszú pillájú szemek fölött a vékony kis íves szemöldökkel. (Móricz Zsigmond)
