TENGERRENGÉS  főnév (<span style="color:green;font-weight:bold">földtan</span>)
Olyan földrengés, amelynek fészke a tenger fenekén v. a tengerfenék alatt van, és amelyben a megrázott terület is csak a tengerre terjed ki. <span style="color:blue">A hajón is érezték a tengerrengést.</span>
