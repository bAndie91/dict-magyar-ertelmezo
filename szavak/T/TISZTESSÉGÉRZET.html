TISZTESSÉGÉRZET  [g-é] főnév (csak egyes számban)
Annak a megérzése, hogy mi fér össze a tisztességgel, mi tehető a tisztesség sérelme nélkül. <span style="color:blue">Van, nincs benne tisztességérzet. Felébredt benne a tisztességérzet. A legdurvábban megsértette tisztességérzetemet.</span>
