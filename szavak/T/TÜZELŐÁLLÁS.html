TÜZELŐÁLLÁS  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Az a hely, ahonnan vmely fegyverrel tüzelnek v. lőni szándékoznak. <span style="color:blue">Álcázott, fedett, hevenyészett, nyílt, rejtett, színlelt, tartós tüzelőállás; az aknavető, a géppuska tüzelőállása; az üteg tüzelőállása; tüzelőállásba megy; tüzelőállást foglal, változtat.</span>
