TÉLEN-NYÁRON  [ë] határozószó
Télen is, nyáron is; az egész évben, állandóan, mindig. <span style="color:blue">Télen-nyáron hideg vízben mosdik.</span> □ Télen nyáron pusztán az én lakásom. (Tompa Mihály) A falusi embernek egy szabad perce nincs, ha kötelességtudó minden pillanatban van munkája, télen-nyáron. (Móricz Zsigmond)
