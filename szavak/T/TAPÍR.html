TAPÍR  főnév -t, -ok, -ja
Trópusi erdőkben élő, a disznónál valamivel nagyobb, zömök testű, páratlan ujjú patás állat; ormányhoz hasonló, lefelé görbülő orra van (Tapirus). <span style="color:blue">Amerikai, indiai tapír.</span> 
<ul><li>Szóösszetétel(ek): tapírormány.
