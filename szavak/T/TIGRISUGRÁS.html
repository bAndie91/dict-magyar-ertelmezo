TIGRISUGRÁS  [s-u] főnév (<span style="color:green;font-weight:bold">sport</span>)
A talajtorna egyik gyakorlata, amelynek során a tornász páros lábbal elrugaszkodva, a levegőben átfordul, és nyakszirtjével, vállával a szőnyegre érve, azon fejezi be az átfordulást. <span style="color:blue">A tigrisugrás a legmutatósabb gyakorlatok közé tartozik.</span>
