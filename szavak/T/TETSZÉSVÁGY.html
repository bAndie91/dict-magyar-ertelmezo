TETSZÉSVÁGY  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Az a vágy, törekvés, amely arra irányul, hogy vki más(ok) tetszését megnyerje, tetszeni vágyás. <span style="color:blue">Beteges, hiú tetszésvágy; merő, puszta tetszésvágyból. A tetszésvágy sarkallta csupán.</span>
