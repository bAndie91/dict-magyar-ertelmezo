TOLÓRÚD  főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
&lt;Erő- és munkagépekben&gt; az a rúd alakú gépelem, amely az ide-oda való mozgatást forgó mozgássá, ill. a forgó mozgást ide-oda való mozgássá alakítja át.
<ul><li>Szóösszetétel(ek): tolórúdfej; tolórúdház; tolórúdvályú.
</li><li>tolórudas.
</li></ul></div>
