TAKARMÁNYRÉPA  főnév
Háziállatok takarmányozására termesztett fehér, sárga v. piros húsú, kerek, hosszúkás v. orsó alakú répa (marharépa, burgundi, tarlórépa stb.). <span style="color:blue">Takarmányrépát kapál, vet; takarmányrépát aprít, ad a marhának.</span>
<ul><li>Szóösszetétel(ek): takarmányrépa-szelet.
</li><li>takarmányrépás.
</li></ul></div>
