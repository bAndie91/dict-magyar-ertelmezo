TÉLIDŐ  [l-i] főnév (kissé <span style="color:green;font-weight:bold">régies</span>)
Tél; a tél időszaka. <span style="color:blue">Télidőn át a városban lakik.</span> □ Koronként jőnek hozzám emberek Ha jőnek erre tél-idő alatt, Adok tüzelni száraz ágakat. (Petőfi Sándor) Télidő volt, bús december, amilyent nem ért meg ember. (Kosztolányi DezsőPoe-fordítás)
