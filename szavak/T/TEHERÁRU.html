TEHERÁRU  [r-á] főnév (<span style="color:green;font-weight:bold">vasútügy</span>, <span style="color:green;font-weight:bold">hajózás</span>)
Darabonként v. vagonrakományként hajón v. tehervonaton fuvarlevéllel továbbított áru. <span style="color:blue">Teheráruként ad fel, szállít vmit. A teheráru megérkezett a pályaudvarra.</span>
<ul><li>Szóösszetétel(ek): teheráruforgalom; teheráruraktár.
</li><li>teherárus.
