TÉGLAGYÁR  főnév
Nagyobb, gépi berendezésű, téglát gyártó üzem, gyár (13). <span style="color:blue">A téglagyár termelése egyre növekszik.</span> □ A folyosón túl, nagyon messzire egy téglagyár kéménye emelkedett a sötétségben. (Krúdy Gyula)
<ul><li>téglagyári; téglagyáros.
