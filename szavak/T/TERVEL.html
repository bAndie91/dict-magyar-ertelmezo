TERVEL  [e-e] ige -t, -jen [ë] (<span style="color:green;font-weight:bold">ritka</span>)
Tervez (főként 2). □ Hiába tervelném, tudom, Nálunk nem épül kölni dóm. (Vajda János) Egy éneket kezdtél tervelni itt, Hogy fájó életed beléfelejtsed. (Tóth Árpád)
<ul><li>Igekötős igék: eltervel; kitervel.
</li><li>tervelés; tervelget; tervelő; tervelt.
</li></ul></div>
