TARTALÉKHAD  főnév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Tartalékban levő, tartaléknak szánt, harcba még nem vetett had. □ Midőn a [hannoveri] fejedelem hada már kifáradt a tatárokkali [= a tatárokkal való] viadalban, Feriz bég akkor hozá elő a pihent tartalékhadat. (Jókai Mór)
<ul><li>tartalékhadas; tartalékhadi.
