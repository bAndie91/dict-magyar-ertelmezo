TOJÁSLEPÉNY  főnév (<span style="color:green;font-weight:bold">konyhaművészet</span>)
Felvert tojásból és néhány evőkanál lisztből készült, palacsintasütőben sütött, lepényserű meleg (elő)étel, amelyet töltelék nélkül, ill. sós (sonka, hús, főzelék stb.) v. édes (gyümölcsíz) töltelékkel ízesítve fogyasztanak; omlett.
<ul><li>tojáslepényes.
</li></ul></div>
