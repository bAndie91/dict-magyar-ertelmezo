TENYERES-TALPAS  melléknév (<span style="color:green;font-weight:bold">rosszalló</span>)
Olyan &lt;személy, főleg nő&gt;, akinek nagy teste, főleg nagy húsos keze és vaskos lába van; nehézkes, kissé darabos mozgású, esetlen. □ Nem is látszott parasztlánynak. Nem volt olyan tenyeres-talpas, pirospozsgás, mint a Varga Örzsi. (Kosztolányi Dezső)
