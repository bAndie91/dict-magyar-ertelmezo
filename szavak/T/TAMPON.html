TAMPON  főnév -t, -ok, -ja (<span style="color:green;font-weight:bold">orvostudomány</span>)
Gézből v. vattából, esetleg mindkettőből készített keményebb csomó, amellyel vérzést csillapítanak, sebet tisztítanak, ecsetelnek. <span style="color:blue">Az orrsövényműtét utána az orvos tampont tett a beteg orrába.</span>
<ul><li>Szóösszetétel(ek): tamponkezelés.
</li><li>tamponos; tamponoz.
</li></ul></div>
