EGYUGYANAZON  [ëggyugyanazon; egy-ugyan-a] névmás, mutató (melléknévi) (<span style="color:green;font-weight:bold">ritka</span>)
Éppen, pontosan, ugyanaz a(z); egy és ugyanazon. □ Hiábavaló feleselés az egész, mert egyugyanazon emberről beszéltek mind a ketten. (Mikszáth Kálmán)
