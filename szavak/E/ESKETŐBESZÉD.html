ESKETŐBESZÉD  főnév
(<span style="color:green;font-weight:bold">vallásügy</span> v. <span style="color:green;font-weight:bold">hivatalos</span>) Esküvő alkalmával a pap v. a polgári szertartást végző személy által mondott beszéd; esküvői beszéd. □ A kenderesi esperes tartotta az esketőbeszédet. (Tolnai Lajos)
