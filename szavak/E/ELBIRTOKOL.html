&lt;Vmely ingó v. ingatlan vagyontárgyat&gt; hosszabb időn át békésen birtokol anélkül, hogy az a tulajdonos ez ellen tiltakoznék, és hogy ezt pörrel megtámadná. <span style="color:blue">A rokonság elbirtokolta az árván maradt gyermek vagyonát.</span>
