EHELYETT  [ehejëtt] határozószó, mutató
Az ismert, szóban forgó, imént említett v. odaértett dolog helyett. <span style="color:blue">El kellett volna mennie az iskolába, ehelyett azonban sétálni ment.</span> □ Puszta a kert, ehelyett a Szántóföld szépen virít. (Petőfi Sándor)
