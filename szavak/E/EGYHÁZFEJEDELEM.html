EGYHÁZFEJEDELEM  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Bíborosi, érseki v. (ritkábban) püspöki rangot viselő főpap. □ Az egyházfejedelem körüljár s aranytálból ételt oszt. (Jókai Mór) A nagy egyházfejedelmet veszélynek kitenni nem lehet  (Eötvös Károly)
