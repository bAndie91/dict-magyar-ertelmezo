EMBERSOR  főnév (főleg -ba, -ban ragos alakban) (<span style="color:green;font-weight:bold">népies</span>)
Az az életkor, amelyben vmely fiú felnőttnek, férfinak számít. <span style="color:blue">Embersorba jut, kerül, lép; embersorban van. Ő még nem embersorba való.</span> □ Láttad fiamat?  Embersorba nől már. (Vas Gereben)
