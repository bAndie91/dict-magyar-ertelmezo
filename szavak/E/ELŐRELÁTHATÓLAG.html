ELŐRELÁTHATÓLAG  határozószó
Úgy, ahogy bizonyos jelekből előre következtetni lehet; minden valószínűség szerint. <span style="color:blue">Most már előreláthatólag meleg idő lesz. A darab előreláthatólag nagy sikert fog aratni.</span> □ Ahova ezek csatlakoznak a legvégén, előreláthatólag ott lesz a diadal. (Mikszáth Kálmán)
