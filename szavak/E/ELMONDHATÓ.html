ELMONDHATÓ  melléknév
Olyan &lt;dolog&gt;, amelyet el lehet, el szabad mondani vkinek, kül. olyan, amelyet a hallgatók megbotránkoztatása nélkül el lehet mondani; nem szeméremsértő. <span style="color:blue">Elmondható anekdota, vicc. Ez az értesülés, ez a hír neki is elmondható.</span>
