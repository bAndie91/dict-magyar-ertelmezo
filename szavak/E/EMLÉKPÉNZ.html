EMLÉKPÉNZ  főnév (<span style="color:green;font-weight:bold">elavult</span>)
Vmely történelmi esemény, évforduló emlékére vert és erre föliratában utaló, egyébként a forgalomban levővel azonos értékű és súlyú pénz; érme. □ A ritka emlékpénz  egyik oldalán  Rákóczi Ferenc daliás mellképe látható. (Jókai Mór)
