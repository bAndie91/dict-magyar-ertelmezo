EGYSÉGESEDIK  [ë-ë-ë] tárgyatlan ige -ett, -jék (-jen) [ë, ë] (csak 3. személyben)
Egységessé, egyöntetűvé válik. <span style="color:blue">A nyelvjárási különbségek eltűnésével nyelvünk egyre inkább egységesedik. A gyártási eljárások egybehangolása révén egységesedett a minőség is.</span>
<ul><li>egységesedés; egységesedő.
