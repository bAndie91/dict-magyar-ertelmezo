ERDŐSÍTÉS  főnév -t, -ek, -e [ë, e]
Az erdősít igével kifejezett tevékenység, az a cselekvés, hogy vmely területet erdősítenek; erdő(k) ültetése, létesítése, telepítése a talaj és az éghajlati viszonyok megjavítására. <span style="color:blue">Az Alföld erdősítésének terve.</span>
<ul><li>erdősítési.
