EMELŐDARU  főnév
Olyan emelőgép, amellyel nehéz tárgyakat függőleges irányban mozgatnak, és kisebb távolságon szállítanak. <span style="color:blue">Az uszályból emelődaruval rakják ki a nagyobb darabárut.</span> □ Zsúfolt hajók úsztak, sikított a gőz, emelődaruk lánca nyikorgott. (Karinthy Frigyes)
