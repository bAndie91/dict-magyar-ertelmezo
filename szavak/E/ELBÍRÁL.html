ELBÍRÁL  tárgyas ige
Állást foglalva érdem, jogosság, helyesség szempontjából megbírál vmit; döntést hoz, megítél. <span style="color:blue">Ki tudja azt elbírálni, hogy így volt-e helyes. A bizottság elbírálja a pályázatokat.</span>
<ul><li>elbírálható; elbíráló; elbírált; elbíráltat.
