EGYKETTŐRE  [ëtykettőre] határozószó (<span style="color:green;font-weight:bold">bizalmas</span>)
Rendkívül rövid idő alatt; nagyon hamar, nagyon gyorsan. <span style="color:blue">Egykettőre odaértek. Egykettőre kiürült a terem. Egykettőre meglesz az ebéd.</span> □ Itassa meg ezeket a lovakat. De egykettőre, mert indulunk! (Nagy Lajos)
</div>
