EBSZŐLŐ  főnév
A burgonyával, paradicsommal rokon, vízparton, nedves cserjésben tenyésző mérges növény; virága ibolyaszínű, termése apró, hosszúkás, piros bogyó; kesernyés csucsor (Solanum dulcamara). □ A barátság mint a burján, Az ebszőlő, a bojtorján Szivökben eggyé fonódott. (Arany János)
