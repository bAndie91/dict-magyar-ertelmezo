ELLENANYAG  [n-a] főnév (<span style="color:green;font-weight:bold">biológia</span>)
A szervezetbe került káros, mérgező v. idegen anyag hatásának közömbösítésére, leküzdésére a szervezet által termelt v. a szervezetbe kívülről juttatott anyag (pl. antitoxin, ellenméreg). <span style="color:blue">A szervezet ellenanyagok termelésével védekezik.</span>
</div>
