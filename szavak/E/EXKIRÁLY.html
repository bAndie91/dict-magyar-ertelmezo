EXKIRÁLY  főnév
Korábban királyként uralkodó, de trónjától megfosztott v. arról lemondott személy. <span style="color:blue">Az albán, az angol, a jugoszláv, az olasz, a román exkirály.</span> □ Sokkal jobb dolog nyugalmazott kapitánynak lenni, mint exkirálynak. (Jókai Mór)
