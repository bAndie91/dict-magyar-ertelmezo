ELŐTEREM [2]  főnév (<span style="color:green;font-weight:bold">régies</span>)
&lt;Nagyobb épületben&gt; az a terem, amelyből bejárat nyílik a többi terembe v. a fogadóterembe. □ Az udvarmester bejött az előteremből, s valamit súgott az ifjú hercegnő fülébe. (Jókai Mór)
