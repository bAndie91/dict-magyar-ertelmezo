<div class="szocikk">
ELLENÉRV  [n-é] főnév
Vmely érvvel, tétellel szemben annak megcáfolására v. gyengítésére mondott, előadott ellentétes érv. <span style="color:blue">Ellenérvként azt hozták fel, hogy  Ellenérveket sorakoztat fel.</span> □ Mi nem kíséreltük meg a választ, noha érveire hasonló ellenérveket hozhattunk volna fel. (Kuncz Aladár)
</div>
