ELVÉTÉS  főnév -t, -e [e] (csak egyes számban)
Az elvét igével kifejezett cselekvés, ill. történés; az a cselekvés, ill. történés, hogy vmit elvétenek; vminek tájékozatlanságból v. szórakozottságból való eltévesztése, elhibázása, összecserélése. <span style="color:blue">Az ajtó, a cél, a házszám, az irány, a lépés elvétése.</span>
</div>
