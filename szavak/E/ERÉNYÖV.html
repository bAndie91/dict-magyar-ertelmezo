ERÉNYÖV  [ny-ö] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
Fémből, elefántcsontból v. bőrből készült, zárral ellátott szerkezet, amelyet  állítólag  a lovagkorban az asszonyok altestére csatoltak a házastársi hűség biztosítása végett; szeméremöv, szüzességi öv.
<ul><li>erényöves.
