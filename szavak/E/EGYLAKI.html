EGYLAKI  melléknév és főnév -t, -ak (személyragos alakban nem haszn.) (<span style="color:green;font-weight:bold">növénytan</span>)
Olyan (növény), melynek porzós és termős virága ugyanazon az egyeden nő. <span style="color:blue">Egylaki növény a kukorica, a mogyoró. Az egylakiak közé tartozik a tök, a fenyőfa, a diófa.</span>
