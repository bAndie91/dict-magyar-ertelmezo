ELBÁGYAD  tárgyatlan ige
A bágyadtság elfogja, erőt vesz rajta; bágyadt lesz. <span style="color:blue">A hőségtől egészen elbágyad.</span> □ A lélek úgy megkívánja az eledelt, mint a szív s a test,  az is elbágyad, elhervad anélkül. (Széchenyi István)
<ul><li>elbágyadás; elbágyadó; elbágyadt.
