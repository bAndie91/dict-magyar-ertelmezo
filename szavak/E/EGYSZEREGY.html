EGYSZEREGY  [ëtyszërëggy; r-e] főnév
Az egytől tízig (vagy esetleg egytől százig) terjedő egész számok szorzatai, ill. az ezeket tartalmazó táblázat. → <span style="color:blue">Kis egyszeregy; → nagy egyszeregy.</span> □ Az egyszeregy, bár meg nem dönthető, Képzelmi szósszal bé nem önthető. (Arany János)
