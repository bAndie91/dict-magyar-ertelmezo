EGYEZKEDIK  [ëggyeszkëdik] tárgyatlan ige -tem, -ett, -jék (-jen) [e, ë, ë]
Egymástól eltérő álláspontok összeegyeztetése céljából kölcsönös engedmények reményében tárgyal, alkudozik. <span style="color:blue">Egyezkednek a béralap tárgyában. A peres felek már egyezkednek.</span>
<ul><li>Igekötős igék: kiegyezkedik.
</li><li>egyezkedő.
</li></ul></div>
