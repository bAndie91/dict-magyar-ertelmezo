EMÖGÉ  [emögé] határozószó, mutató (<span style="color:green;font-weight:bold">ritka</span>)
Az imént említett v. az előzményekből ismert dolog mögé. <span style="color:blue">Ne emlegesd folyton, hogy leveszed a kezed a fiadról: úgysem bújhatsz emögé a felelősség elől.</span>
