ELLENIRAT  [n-i] főnév (<span style="color:green;font-weight:bold">régies</span>)
Olyan írásmű, amelyben a szerző vmely más írásműben foglalt tételeket, állításokat, érveket igyekszik megcáfolni; vitairat. □ Egy hosszú, több íves elleniratban bebizonyítá, hogy a felsorolt írók  csak a napok uralkodó hangulatának voltak tolmácsai. (Jókai Mór)
