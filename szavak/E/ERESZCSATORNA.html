ERESZCSATORNA  főnév
A tető alján v. közvetlenül az eresz alatt elhelyezett, fémből készült, félhenger alakú, hosszúkás vályú a tetőről lefolyó eső, hólé összegyűjtésére (s a lefolyó csatornán át a talajra v. a csatornahálózatba való vezetésére).
