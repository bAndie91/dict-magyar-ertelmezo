EGYEL  [ëggyel] tárgyas ige -t, -jen [ë] (<span style="color:green;font-weight:bold">mezőgazdaság</span>)
&lt;Sorba vetett, sűrűn, bokrosan nőtt kapásnövényt: kukoricát, répát stb.&gt; úgy ritkít, hogy egy bokorban csak egyetlen növényt hagy meg. <span style="color:blue">Répát egyel.</span>
<ul><li>Igekötős igék: kiegyel; megegyel.
</li></ul></div>
