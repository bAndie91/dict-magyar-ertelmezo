EMLÉKMŰ  főnév
Nagyobb szabású építészeti v. képzőművészeti alkotás, amely vmely eseményre v. személyre emlékeztet, ezek emlékét örökíti meg. <span style="color:blue">A gellérthegyi hősi emlékmű; millenniumi emlékmű; emlékművet állít, emel.</span>
<ul><li>Szóösszetétel(ek): emlékműavatás.
</li><li>emlékműves.
</li></ul></div>
