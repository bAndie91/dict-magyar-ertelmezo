EZÜSTPAPÍR  főnév
Ónból v. alumíniumból igen vékonyra hengerelt és kalapált hártyaszerű, ezüstfényű lemez; főként a kiszáradástól megóvandó élelmiszerek csomagolására és a villamosiparban haszn.; sztaniol. <span style="color:blue">Ezüstpapírba burkolt, csomagolt csokoládé, sajt, szaloncukor.</span>
