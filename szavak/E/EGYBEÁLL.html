<ul><li>1. &lt;Anyag&gt; összesűrűsödve, összefagyva egy darabbá tömörül, több különálló része egyesül. <span style="color:blue">A fagylalt hamar egybeállott.</span>
</li><li>2. &lt;Több személy&gt; vmely célra egyesül, összeáll (2). <span style="color:blue">Többen egybeálltak, hogy céljukat elérjék.</span>
</li><li>egybeállás; egybeálló; egybeállott.
