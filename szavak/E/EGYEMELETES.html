EGYEMELETES  [ëggyemeletës; gy-e] melléknév
Olyan &lt;építmény&gt;, amely földszinti részből és az erre épített emeletből áll; olyan, amelynek egy emelete van. <span style="color:blue">Egyemeletes iskola, lakóházak.</span> □ A hold apró faházakat világít meg. Mind egyforma ház. Egyemeletes. (Gárdonyi Géza)
