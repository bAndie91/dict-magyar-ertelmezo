ESTHOMÁLY  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Naplemente utáni gyenge világosság; esti szürkület. <span style="color:blue">A tájra boruló esthomály tompa fényében.</span> □ Csak a habok locsogtak, lágyan, halkan: az esthomály sötét acélszínűre festette őket. (Mikszáth Kálmán)
