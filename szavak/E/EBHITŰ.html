EBHITŰ  melléknév és főnév -t, -ek, -je [e, e] (<span style="color:green;font-weight:bold">történettudomány</span>, <span style="color:green;font-weight:bold">rosszalló</span>)
&lt;A mohamedánok szempontjából, a török harcok és a hódoltság idején&gt; nem mohamedán vallású, hanem keresztény (személy); kutyahitű, gyaur. □ Szél verje össze a bokájukat az ebhitűeknek. (Herczeg Ferenc)
