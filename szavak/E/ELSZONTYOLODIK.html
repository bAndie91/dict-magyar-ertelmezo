ELSZONTYOLODIK  tárgyatlan ige -tam, -ott, -jék (-jon) (<span style="color:green;font-weight:bold">bizalmas</span>)
Vmi miatt észrevehetőleg kedvét veszti; elkedvetlenedik, elszomorodik. <span style="color:blue">A szomorú hír hallatára bizony elszontyolodott.</span> □ Volt, nincs, azért ugyan ne szontyolodj el. (Mikszáth Kálmán)
<ul><li>elszontyolodás; elszontyolodó; elszontyolodott.
