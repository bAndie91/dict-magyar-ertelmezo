ELÍRÁS  [l-í] főnév
&lt;Írásban&gt; vigyázatlanságból v. sietségből ejtett hiba; írásbeli tévedés. <span style="color:blue">A név, lakáscím elírása. Tudja ő a helyesírást, ez csak elírás lehet. A tévedés elírásból származik (ered).</span>
<ul><li>Szóösszetétel(ek): elírásmentes.
</li><li>elírási.
</li></ul></div>
