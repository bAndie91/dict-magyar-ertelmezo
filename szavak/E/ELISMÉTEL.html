ELISMÉTEL  [l-i] tárgyas ige
Ismét elmond, előad, ismételten elmond vmit. <span style="color:blue">Egy kérdést százszor elismétel. Minden szót elismétel. Ismételd el a kérdést.</span>
<ul><li>elismételget; elismételhető; elismételt; elismételtet; elismétlés; elismétlő.
