ELMEZAVAR  főnév (<span style="color:green;font-weight:bold">orvostudomány</span>)
Az elmének a tudat kisebb-nagyobb fokú zavarával (1) kapcs. állapota. <span style="color:blue">Hűdéses elmezavar.</span> □ Amint a szemeit, arcát nézegetné lopva, nem elmezavart olvasott le azokból, hanem éhséget. (Mikszáth Kálmán)
