EOZIN  [ë] főnév -t, -ok, -ja (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Kristályos, csillámló por, ill. a belőle készült fémes fényű festék, amelyet a kelmefestésben és főleg kerámiai tárgyak mázának készítéséhez használnak. <span style="color:blue">Híresek a pécsi Zsolnay-gyár eozinnal bevont vázái.</span>
<ul><li>eozinos.
