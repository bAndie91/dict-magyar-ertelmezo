EGYENÉRTÉKSÚLY  [n-é] főnév (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Vmely elemnek az a grammokban kifejezett mennyisége, amely 1 gramm hidrogénnal alkot vegyületet. <span style="color:blue">Az elemek egyenértéksúlyuk arányában vegyülnek. Az oxigén egyenértéksúlya atomsúlyának a felével egyenlő.</span>
