EKKORON  [e] határozószó, mutató (<span style="color:green;font-weight:bold">régies</span>)
Az előbb említett, szóban forgó múltbeli eseménnyel egyidejűleg v. az említett elmúlt időben. □ Ekkoron [= a Pyrrhus elleni háborúk idején] a rómaiaknál legnagyobb divatú ezüst pénz volt a tízkrajcáros. (Dugonics András)
