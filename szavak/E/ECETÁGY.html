ECETÁGY  [t-á] főnév (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Ecetsav-baktériumok telepe, melynek hatására a ráöntött szeszes folyadék ecetesedni kezd. <span style="color:blue">Bort önt az ecetágyra.</span> □ Az ecetágyon a friss fölöntés hamarább savanyodik. (Vas Gereben)
