EMU  [ë] főnév -t, -ja (<span style="color:green;font-weight:bold">állattan</span>)
A futómadarak rendjébe tartozó ausztráliai madárnem, ill. ennek vmelyik egyede. Testalkata kisebb a struccénál, nyaka, lába rövidebb, magassága 1 1/22 m között van, színe barna. <span style="color:blue">Foltos emu, újhollandi emu.</span>
