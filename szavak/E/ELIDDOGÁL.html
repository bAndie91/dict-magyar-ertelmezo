ELIDDOGÁL  [l-i] ige
<ul><li>1. tárgyatlan Hosszabb időt iddogálással eltölt. <span style="color:blue">Eliddogált egész este.</span>
</li><li>2. tárgyas &lt;Pénzt, értéket&gt; lassanként eliszik, iddogálva elpazarol. <span style="color:blue">Eliddogálta a keresetét. Lassan eliddogálta mindenét.</span>
</li><li>eliddogálás; eliddogáló; eliddogált.
