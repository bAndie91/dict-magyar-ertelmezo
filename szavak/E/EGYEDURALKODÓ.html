EGYEDURALKODÓ  [d-u] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
Olyan uralkodó, főleg király v. császár, aki a törvényhozó, esetleg a végrehajtó hatalmat is teljes egészében, osztatlanul gyakorolja. <span style="color:blue">Valamely ókori város egyeduralkodója.</span>
<ul><li>egyeduralkodói.
