EZENKÖZBEN  határozószó, mutató (<span style="color:green;font-weight:bold">régies</span>)
Az imént említett v. részletezett eseménnyel egyidejűleg; azalatt, míg az imént említettek történtek; eközben, ezalatt. □ Egy-egy különösebb kifejezés ezenközben ki-kicsúszott a szájából. (Mikszáth Kálmán)
