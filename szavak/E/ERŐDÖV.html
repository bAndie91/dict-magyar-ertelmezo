ERŐDÖV  [d-ö] főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Egymástól tervszerűen megszabott távolságra elhelyezett erődökből v. erődcsoportokból álló öv; ill. az ezzel védett zárt terep. <span style="color:blue">A határ mentén erődöv volt. Az erődövön nehéz az áttörés.</span>
</div>
