ELGŐZÖLÖG  tárgyatlan ige
&lt;Cseppfolyós (ritk. szilárd) anyag&gt; teljes tömegében gáznemű halmazállapotba megy át, gőzzé válik, s így eltávozik, eltűnik. <span style="color:blue">A hús már puhára főtt, a víz elgőzölgött róla.</span>
<ul><li>elgőzölgés; elgőzölgő; elgőzölgött; elgőzölögtet.
