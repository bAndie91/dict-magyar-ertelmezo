ELKÓBOROL  tárgyatlan ige
<ul><li>1. &lt;Ember, állat&gt; anélkül, hogy tudnák, merre jár, hosszabb ideig, rendsz. nagyobb területen kóborol; elkóborog. <span style="color:blue">A jószág messzire elkóborol.</span>
</li><li>2. Kóborolva eljut vhová, vmeddig. <span style="color:blue">Elkóborolt egész a harmadik határba.</span>
</li><li>elkóborlás; elkóborló; elkóborolt.
</li></ul></div>
