EZÜSTFENYŐ  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
A fenyőfélék családjába tartozó s a kertészetben sűrűn termesztett díszfa; levelei hamvasszürkék v. ezüstösek, szúrós hegyűek, toboza rövid; a hideget, szárazságot jól tűri (Picea pungens).
<ul><li>ezüstfenyős.
