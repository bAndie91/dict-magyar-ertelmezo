ELLENPÁPA  [mp v. np] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
Az a személy, akit vmely egyházi párt a hatalmon levő pápa mellett és ellen törvényellenesen pápává választott. □ Három pápa volt  a keresztyén világban, kettő ellenpápa, a harmadik az igazi. (Jókai Mór)
<ul><li>ellenpápai; ellenpápaság.
