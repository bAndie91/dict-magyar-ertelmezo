ELVHŰSÉG  főnév (<span style="color:green;font-weight:bold">sajtónyelvi</span>)
A helyesnek megismert elvekhez való következetes ragaszkodás, erkölcsi felelősségérzetből fakadó hűség; az elvek mellett való állhatatos kitartás. <span style="color:blue">Kommunista, szocialista elvhűség; rendíthetetlen, törhetetlen elvhűség. Elvhűsége mások számára is példa lehet.</span>
