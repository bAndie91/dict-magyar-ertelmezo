ELADATLAN  [l-a] melléknév -ul
Olyan &lt;árucikk&gt;, amelyet (még) nem adtak el, amely (még) nem talált vevőre; el nem adott. <span style="color:blue">Eladatlan jegyek, újságok. A piacon sok az eladatlan gyümölcs. Az áruból nagy mennyiség maradt eladatlan(ul).</span>
