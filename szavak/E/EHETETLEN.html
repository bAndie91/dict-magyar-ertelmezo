EHETETLEN  [ë-e-e-e] melléknév -ül, -ebb [e]
Állapotánál v. elkészítésénél fogva emberi táplálkozásra alkalmatlan &lt;étel&gt;. <span style="color:blue">Az eper megromlott, ehetetlen. Ehetetlen ételt adott a munkásoknak. Ehetetlenül rossz a főztje.</span> □ A prófunt felében penészes volt és ehetetlen. (Jókai Mór)
<ul><li>ehetetlenség.
