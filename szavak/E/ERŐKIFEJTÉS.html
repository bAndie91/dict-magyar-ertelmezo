ERŐKIFEJTÉS  [e-e] főnév -t, -ek, -e [ë, e]
Testi v. szellemi erő(k), képesség(ek) céltudatos összpontosítása, kifejtése és fölhasználása vmire, vminek az elvégzésére. <span style="color:blue">Ehhez a munkához nagy erőkifejtésre van szükség. A versenyszerű sport teljes erőkifejtést kíván.</span>
<ul><li>erőkifejtéses; erőkifejtési.
