ELISZAPOSODIK  [l-i] tárgyatlan ige
&lt;Víz, meder, talaj&gt; egészen, teljesen iszapossá válik, s így vmilyen szempontból elromlik. <span style="color:blue">A csatorna medre eliszaposodott. A holt ág eliszaposodik.</span>
<ul><li>eliszaposodás; eliszaposodó; eliszaposodott.
