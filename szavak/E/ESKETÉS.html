ESKETÉS  főnév -t, -ek, -e [ë, e]
Az esket igével kifejezett (hivatalos) eljárás, cselekvés; az az eljárás, hogy vkit esketnek. <span style="color:blue">A fiatalok, a katonák esketése. Az esketést a plébános végezte.</span> □ A leányok mindig sírnak az esketésnél. (Eötvös József)
<ul><li>esketési.
