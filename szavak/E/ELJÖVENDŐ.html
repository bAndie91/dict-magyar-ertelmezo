ELJÖVENDŐ  melléknév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
<ul><li>1. Olyan, aki a jövőben fog megszületni. <span style="color:blue">Az eljövendő nemzedék(ek).</span>
</li><li>2. Olyan, ami a jövőben bekövetkezik, megtörténik, létrejön; jövő, jövendő. <span style="color:blue">Az eljövendő események; az eljövendő világbéke.</span> □ Mindent tud, ami elmúlt és ami eljövendő. (Jókai Mór)
</li></ul></div>
