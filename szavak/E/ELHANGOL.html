ELHANGOL  tárgyas ige
<ul><li>1. (<span style="color:green;font-weight:bold">zene</span>) &lt;Hangszert&gt; rosszul, hamisan hangol, összhangját elrontja.
</li><li>2. (<span style="color:green;font-weight:bold">rádiótechnika</span>) &lt;Rádiókészüléket&gt; a rezgőkör önindukcióját v. kapacitását megváltoztatva, más, nem kívánt hullámhosszra állít.
