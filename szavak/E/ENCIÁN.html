ENCIÁN  [ë v. e] főnév -t, -ok, -ja
Alacsony, sűrűn leveles, egy-két éves, főleg magas hegyvidéken tenyésző növény; virága tölcsér alakú, égszínkék v. liláskék (Gentiana austriaca); tárnics (1). || a. Ennek virága.
<ul><li>Szóösszetétel(ek): enciánkék.
</li><li>enciános.
</li></ul></div>
