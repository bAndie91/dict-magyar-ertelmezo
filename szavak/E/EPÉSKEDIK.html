Keserű, csípős szavakat mond, gúnyos megjegyzéseket tesz. <span style="color:blue">Mindenkivel epéskedik, ilyen a természete. Ne epéskedj!</span>
<ul><li>Igekötős igék: visszaepéskedik.
</li><li>epéskedés; epéskedő.
