EGYPATÁS  főnév (rendsz. többes számban) (<span style="color:green;font-weight:bold">állattan</span>, <span style="color:green;font-weight:bold">régies</span>)
<span style="color:blue">Egypatások:</span> a lófélék családja; az ide tartozó állatoknak az ősi öt ujja közül csak a középső maradt meg pata alakjában (Solidungula). <span style="color:blue">Az egypatások közé a ló, a szamár és a zebra tartozik.</span>
