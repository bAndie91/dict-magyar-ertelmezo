EKLÉZSIAKÖVETÉS  főnév (<span style="color:green;font-weight:bold">vallásügy</span>)
&lt;A református egyházban&gt; a gyülekezeti fegyelem gyakorlásának az a módja, melynek során az egyház ellen vétő személy nyilvánosan megvallja bűnét és a gyülekezetet ünnepélyesen megköveti. □ Az eklézsiakövetést nem törölte el semmiféle zsinat. (Ady Endre)
