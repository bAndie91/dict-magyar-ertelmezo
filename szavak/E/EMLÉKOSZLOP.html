EMLÉKOSZLOP  [k-o] főnév
Rendsz. kőből faragott oszlop, vmely jelentős esemény v. személy emlékének megörökítésére; tetején gyak. szobor áll. <span style="color:blue">A millenniumi emlékoszlop a Hősök terén; a szovjet hősök emlékoszlopa; emlékoszlopot állít, emel.</span>
<ul><li>emlékoszlopos.
</li></ul></div>
