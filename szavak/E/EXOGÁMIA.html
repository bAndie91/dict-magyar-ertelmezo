EXOGÁMIA  [ëgzogámia v. ëkszogámia] főnév ..iát, ..iája (<span style="color:green;font-weight:bold">néprajz</span>)
Primitív népeknek a természetes nemi ösztönön, ill. egyéb körülményeken (pl. nőhiányon alapuló) az a szokása, hogy csak idegen törzsbeliekkel házasodhatnak össze; törzsön kívüli házasság.
