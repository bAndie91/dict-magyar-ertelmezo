ELCSUKLIK  tárgyatlan ige
<span style="color:blue">Elcsuklik a hangja:</span> &lt;főleg elérzékenyüléstől&gt; beszéde csukló hangot adva megakad, v. fojtottá válik. □ Nem tudott többet mondani: a hangja elcsuklott. (Gárdonyi Géza) Attól félt, hogy elcsuklik a hangja. (Kosztolányi Dezső)
<ul><li>elcsuklás; elcsukló; elcsuklott.
