ESZMÉLÉS  főnév -t, (-ek), -e [ë, e] (<span style="color:green;font-weight:bold">választékos</span>)
Az eszmél igével kifejezett folyamat; öntudatra ébredés, ocsúdás. <span style="color:blue">Ájulásból, álomból való eszmélés; magára eszmélés.</span> □ Szendén illessed fájdalmát szivének, Hogy eszmélése kínzó ne legyen. (Arany János)
