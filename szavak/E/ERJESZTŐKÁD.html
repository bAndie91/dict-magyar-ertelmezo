ERJESZTŐKÁD  főnév (<span style="color:green;font-weight:bold">szőlészet</span>)
Régebben sör, ma főleg vörösbor erjesztésére haszn., leggyakrabban tölgyfából, esetleg krómnikkel acélból v. üveggel bélelt betonból készült, általában csonka kúp alakú, befedhető, 4080 hl-es kád.
