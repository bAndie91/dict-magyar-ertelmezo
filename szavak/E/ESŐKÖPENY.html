ESŐKÖPENY  főnév
Vízhatlan anyagból készült köpeny (1a); a felsőruha felett védelmül viselik eső ellen. <span style="color:blue">Esőköpeny volt rajta, nem ázott meg.</span> □ Átlátszó, angol esőköpenyben jött-ment a lépcsőn. (Kosztolányi Dezső)
<ul><li>Szóösszetétel(ek): esőköpenygyár; esőköpenygyártás; esőköpenyüzem.
</li><li>esőköpenyes.
</li></ul></div>
