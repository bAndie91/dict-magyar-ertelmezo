ELEKTRON [2]  [ë-ë v. e-e] főnév -t, -ja (csak egyes számban) (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Legnagyobb részben magnéziumból, kisebb arányban cinkből és alumíniumból álló igen szilárd fémötvözet; főleg repülőgép-alkatrészeket gyártanak belőle.
<ul><li>Szóösszetétel(ek): elektronfém.
</li></ul></div>
