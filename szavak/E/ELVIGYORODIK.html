ELVIGYORODIK  tárgyatlan ige -tam, -ott, -jék, (-jon) (<span style="color:green;font-weight:bold">rosszalló</span>)
Vigyorogva elneveti magát; vigyorgásra húzza a száját. □ A cigány elvigyorodott. Végigpillantott a saját rongyos öltözetén. (Gárdonyi Géza)
<ul><li>elvigyorodás; elvigyorodó; elvigyorodott.
