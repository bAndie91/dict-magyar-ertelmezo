EGYENJOGÚSÍT  [ëgyenjogúsít] tárgyas ige -ott, -son; -ani
Egyenjogúvá tesz vkit, egyenjogúságot biztosít vkinek. <span style="color:blue">Népi demokráciánk egyenjogúsította a nőket. A 48-as forradalom egyenjogúsította a jobbágyokat.</span>
<ul><li>egyenjogúsítás; egyenjogúsító; egyenjogúsított; egyenjogúsíttat.
</li></ul></div>
