EVEZŐTOLL  főnév (<span style="color:green;font-weight:bold">állattan</span>)
<span style="color:blue">Evezőtollak:</span> a madarak szárnyának felületét alkotó, a repülésben legfőbb szerepet játszó tollak. <span style="color:blue">Az evezőtollak hosszúságától és nagyságától függ a szárny alakja.</span>
