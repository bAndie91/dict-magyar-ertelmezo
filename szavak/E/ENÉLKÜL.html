ENÉLKÜL  [enélkül] határozószó, mutató
A szóban forgó, az imént említett v. odaértett közeli dolog v. körülmény nélkül. <span style="color:blue">Először döntsünk az első kérdésről; enélkül nincs értelme, hogy a többire rátérjünk. Most leteszem hátralevő vizsgáimat, mert enélkül nem boldogulok.</span>
</div>
