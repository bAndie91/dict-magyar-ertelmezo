GYÜMÖLCSKENYÉR  főnév
Darabokra vágott cukrozott gyümölccsel, dióval, mandulával (gyak. csokoládédarabkákkal is) összekevert és kisütött piskótatészta; püspökkenyér. || a. Vékony sült tésztába burkolt, cukorszirupban összekevert különféle gyümölcsből, esetleg csokoládéból készült csemege.
