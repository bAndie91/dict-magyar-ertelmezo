GYÁSZRUHA  főnév
Gyász jeléül viselt fekete ruha. <span style="color:blue">Gyászruhát ölt, visel; leveti a gyászruhát.</span> □ A királynén fátyolos gyászruha volt. (Gárdonyi Géza) Gyászruhát nem kellett öltenie, mert ő mindig feketében járt. (Kosztolányi Dezső)
<ul><li>gyászruhájú; gyászruhás.
