GYENGÉLL  [ë] tárgyatlan ige -t, -jen [ë] gyöngéll
&lt;Vmely szempontból&gt; gyengének tart vkit v. vmit. <span style="color:blue">Gyengélli a gyereket a munkára. Gyengéllem a kávét. Gyengéllte a ház alapzatát. Gyengélli a vetést.</span> □ Gyengélled az éljen hangokat! Mire az ország végeig érnek, orkánná izmosodnak. (Mikszáth Kálmán)
