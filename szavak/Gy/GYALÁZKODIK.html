GYALÁZKODIK  tárgyatlan ige -tam, -ott, -jék (-jon)
Vkinek, vminek becsületét ismételten v. folyton gyalázza, ócsárolja, becsmérli; gyalázatos rágalmakat szór vkire. <span style="color:blue">Tehetetlen dühében csak gyalázkodik. Állandóan gyalázkodott, ezért már nem szívesen hallgatták.</span>
<ul><li>gyalázkodó.
</li></ul></div>
