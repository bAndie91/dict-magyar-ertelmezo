GYALOGSZÉK  főnév (<span style="color:green;font-weight:bold">népies</span>)
Rendsz. keményfából készült, zsámoly alakú, támla nélküli, négy lábú, alacsony szék. □ Elővett egy kis fekete táblás jegyzőkönyvet, leült a gyalogszékre, lapozott a könyvecskében. (Nagy Lajos)
