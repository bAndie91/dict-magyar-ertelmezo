GYÜMÖLCSCUKOR  főnév (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Szabad állapotban az édes gyümölcsben és a mézben előforduló, vegytiszta alakban fehér, vízben jól oldódó, kristályos cukor, mely élesztő hatására erjedéssel alkohollá és szénsavvá bomlik.
