GYÚJTÓLÖVEDÉK  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Vmely gyújtó anyaggal (foszforral, kénnel, termittel stb.) töltött lövedék, amelynek töltete robbanás után igen magas hőfokon ég, s a közelben levő gyúlékony anyagokat meggyújtja.
