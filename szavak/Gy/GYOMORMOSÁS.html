GYOMORMOSÁS  főnév (<span style="color:green;font-weight:bold">orvostudomány</span>)
A gyomor ártalmas v. mérgező tartalmának a szájon át levezett gumicsövön keresztül vmely folyadékkal, főként vízzel történő kiöblítése. <span style="color:blue">Gyomormosást alkalmaz, végez.</span>
