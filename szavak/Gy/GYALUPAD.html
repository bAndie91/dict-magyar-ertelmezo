GYALUPAD  főnév
Kb. 2 m hosszú, asztalhoz hasonló, nehéz, erős faállvány, melyre a gyalulandó tárgyat csavarokkal és ékekkel rögzítik. <span style="color:blue">Az asztalos a gyalupad mellett állva gyalulja a deszkát.</span> □ Az asztalos felállt a forgácsból. A gyalupadhoz támaszkodott. (Móricz Zsigmond)
