GYÜMÖLCSÖSKERT  főnév (<span style="color:green;font-weight:bold">régies</span>)
Gyümölcsös (II. 1). □ Egy kis tarka madár víg kedvében Szép gyümölcsöskertnek ment reptében. (Faludi Ferenc) Közelget az ősz, a gyümölcsöskertben fa fa után kivesz, anélkül, hogy újakat raknánk helyébe. (Arany János)
