GYURGYALAG  főnév -ot, -ja gurgyalag (<span style="color:green;font-weight:bold">állattan</span>)
Rigó nagyságú, löszfalakba vájt üregekben fészkelő, fullánkos rovarokkal táplálkozó madár; begye aranysárga, melle, hasa sötétzöld, homloka töve fehér, aztán zöld, szemén fekete sáv, tarkója, dolmánya fahéj színű (Merops apiaster).
