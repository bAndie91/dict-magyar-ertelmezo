GYÜMÖLCSLÉ  főnév
<ul><li>1. Az érett, édes gyümölcsből kisajtolt nyers v. főtt lé, természetes v. cukrozott állapotban.
</li><li>2. (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">népies</span>) Olyan habart leves, amelybe egy- v. többféle gyümölcsöt főznek bele. <span style="color:blue">Legszokottabb gyümölcslé az almaleves és a meggyleves. A cibere is gyümölcslé.</span>
</li></ul></div>
