GYÚJTÓLENCSE  főnév (<span style="color:green;font-weight:bold">régies</span>)
Egyik v. mindkét oldalán domborúra csiszolt lencse (6), amely a ráeső napsugarakat egy pontban, a gyújtópontban egyesíti, úgyhogy az e pontban levő gyúlékony anyag meggyullad; nagy gyűjtőlencse. <span style="color:blue">A gyerek gyújtólencsével papírdarabokat gyújtott meg.</span>
<ul><li>gyújtólencsés.
