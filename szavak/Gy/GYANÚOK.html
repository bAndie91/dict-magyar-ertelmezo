GYANÚOK  főnév (<span style="color:green;font-weight:bold">jogtudomány</span>)
Olyan tény v. jelenség, mely alkalmas arra, hogy vki ellen gyanút keltsen. <span style="color:blue">Kellő gyanúok nélkül. Súlyos gyanúok alapján tartóztatták le.</span> □ Miért ne írhatná a pasquillokat [= paszkvillusokat] egy asszony? Sőt van is rá némi gyanúok. (Mikszáth Kálmán)
