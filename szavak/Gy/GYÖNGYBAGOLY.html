GYÖNGYBAGOLY  főnév (<span style="color:green;font-weight:bold">állattan</span>)
Majdnem varjú nagyságú bagoly; a csőre és a szeme körül szív alakú fátyol (4) van, hamuszínű hátán sok fehér és sötét gyöngyözés; házak, templomtornyok, csűrök környékén fészkel (Tyto alba guttata).
