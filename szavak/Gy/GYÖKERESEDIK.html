GYÖKERESEDIK  [e-e-ë] tárgyatlan ige -tem, -ett [e, ë], -jék (-jen) [ë] (főleg 3. személyben)
&lt;Növény&gt; gyökeret ereszt, növeszt, hajt. <span style="color:blue">A facsemete már gyökeresedik. A sziklás talajba ültetett fa nehezen gyökeresedik.</span>
<ul><li>Igekötős igék: meggyökeresedik.
</li><li>gyökeresedés; gyökeresedett; gyökeresedő.
