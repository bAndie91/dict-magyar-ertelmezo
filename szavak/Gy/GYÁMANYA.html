GYÁMANYA  [m-a] főnév
<ul><li>1. (<span style="color:green;font-weight:bold">hivatalos</span>) Az anya mint kiskorú gyermekeinek természetes gyámja, férje halála után.
</li><li>2. A gyám (1a) feladatát betöltő nő, kül. az olyan nő, aki árvát gondjába vesz v. örökbe fogad, és gyermekeként nevel; nevelőanya.
</li><li>gyámanyai.
</li></ul></div>
