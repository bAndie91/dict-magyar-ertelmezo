GYÚJTALÉK  [ú v. u] főnév -ot, -a
<ul><li>1. (<span style="color:green;font-weight:bold">tájszó</span>) Tűz gyújtásához haszn. hasított aprófa, vékony ágfa, forgács v. más gyúlékony anyag; gyújtós.
</li><li>2. (<span style="color:green;font-weight:bold">katonaság</span>, <span style="color:green;font-weight:bold">régies</span>) Gyújtólövedékek megtöltésére haszn., igen nagy hőfokú lánggal égő anyag.
</li></ul></div>
