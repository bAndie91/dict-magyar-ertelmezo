SZILIKÁT  főnév -ot, -ja (<span style="color:green;font-weight:bold">ásványtan</span>, <span style="color:green;font-weight:bold">vegyi ipar</span>)
A kovasav vmely sója, a szilícium fontos vegyülete, amely a kőzetekben a földkéreg nagy részét alkotja; ipari felhasználása jelentős. <span style="color:blue">A porcelán és az üveg is szilikát.</span>
<ul><li>Szóösszetétel(ek): szilikátolvadék.
</li><li>szilikátos.
