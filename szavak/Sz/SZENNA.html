<div class="szocikk">
SZENNA  [ë] főnév szennát, szennája
A hüvelyesek családjába tartozó meleg égövi cserje (Cassia acutifolia v. angustifolia), amelynek a leveleiből (Folia sennae) kivont gyógyanyag a hashajtó teakeverékeknek alkotórésze.
<ul><li>Szóösszetétel(ek): szennafa; szennalevél.
</li><li>szennás.
</li></ul></div>
