SZÍVESLÁTÁS  főnév (<span style="color:green;font-weight:bold">népies</span>)
A vendég szíves fogadása (1), az iránta tanúsított sokoldalú előzékenység, esetleg étellel, itallal való ellátása is. <span style="color:blue">Köszönöm, köszönjük a szíveslátást.</span> □ A krónika bőbeszédű a szíveslátás leírásában. (Mikszáth Kálmán)
