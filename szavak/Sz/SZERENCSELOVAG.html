SZERENCSELOVAG  főnév (<span style="color:green;font-weight:bold">rosszalló</span>)
Olyan férfi, aki kalandos vállalkozásokkal, kalandor módjára igyekszik anyagilag és társadalmilag előnyös helyzetet biztosítani a maga számára. □ [Biberach] egyike azon idegen szerencselovagoknak, kiknek híjával sohasem volt hazánk. (Gyulai Pál)
