SZEMFEDÉL  főnév szemfödél (<span style="color:green;font-weight:bold">régies</span>)
Szemfedő. □ De vakságtól ki már nem fél, Minek annak a szemfedél? (Csokonai Vitéz Mihály) Oh mondd: ha előbb halok el, tetemimre Könnyezve borítasz-e szemfödelet? (Petőfi Sándor) A szemfödelet rángatja hideg szél: Elhervad a rózsa, lehull a levél. (Vajda János)
