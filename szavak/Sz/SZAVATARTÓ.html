SZAVATARTÓ  melléknév
Az adott szót v. ígéretet mindig megtartó, beváltó &lt;személy&gt;. <span style="color:blue">Szavatartó ember.</span> □ A király pedig, mint szavatartó ember, Összeadta őket szíves szerelemmel. (Arany János) Szavatartó, amit kimond, azt megállja. (Jókai Mór)
