SZAPPANFŰ  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
A szegfűvel egy családba tarozó, töltéseken, ártereken közönséges, fehér v. pirosló virágú, lándzsás levelű növény (Saponaria officinalis). <span style="color:blue">Orvosi szappanfű.</span> || a. Heverő szárú, alacsony, gyepes, kicsiny levelű kerti dísznövény (Saponaria ocymoides).
