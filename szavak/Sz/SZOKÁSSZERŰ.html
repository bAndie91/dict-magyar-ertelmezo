SZOKÁSSZERŰ  [s-sz] melléknév -en [e] (<span style="color:green;font-weight:bold">ritka</span>)
Az egyén v. a közösség szokásából eredő, e szokás alapján történő; megszokott, szokásos. <span style="color:blue">Elvégzi szokásszerű napi sétáját.</span> □ A szokásszerű előzetes kérdések után a dolog érdemére tértek. (Mikszáth Kálmán)
