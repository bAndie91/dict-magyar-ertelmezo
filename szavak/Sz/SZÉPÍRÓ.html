SZÉPÍRÓ  [p-í] főnév (<span style="color:green;font-weight:bold">választékos</span>)
Művészi célzattal és eszközökkel dolgozó prózaíró. <span style="color:blue">Költők és szépírók; tudományos írók és szépírók.</span> □ Úgynevezett "szépíró", aki a női olvasóközönségnek kedvében tud járni, már bőségesen volt Magyarországon. (Krúdy Gyula)
