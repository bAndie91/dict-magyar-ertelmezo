SZÍVHALLGATÓ  főnév (<span style="color:green;font-weight:bold">orvostudomány</span>)
Tölcsérszerű, merev gumicsőre szerelt s a fülhöz illeszthető kagyló, amellyel a testben keletkező hangok felerősödve jutnak az orvos fülébe; hallócső. □ A főorvos  felső zsebéből kikandikált az elmaradhatatlan szívhallgató. (Kosztolányi Dezső)
