SZIVÁRVÁNYHÁRTYA  főnév (<span style="color:green;font-weight:bold">bonctan</span>)
A szemgolyó középső burkának elülső, kör alakú szakasza, melynek festéktartalma a szem színét megadja, s melynek közepén a pupilla van; írisz.
<ul><li>Szóösszetétel(ek): szivárványhártya-gyulladás.
</li></ul></div>
