SZÍVTÉPŐ  melléknév (-n) v. (-en) [e] (<span style="color:green;font-weight:bold">választékos</span>)
<ul><li>1. Olyan, ami a legnagyobb fokú szánalomra, részvétre indít, ami megrendítően hat; megdöbbentő, megrázó. <span style="color:blue">Szívtépő látvány, panasz, zokogás.</span>
</li><li>2. Súlyos lelki megpróbáltatást, kínt okozó. <span style="color:blue">Szívtépő fájdalom, szenvedés.</span>
</li></ul></div>
