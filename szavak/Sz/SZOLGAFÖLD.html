SZOLGAFÖLD  főnév (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">költői</span>)
Olyan ország, ahol a népnek nincs szabadsága. □ Rabok voltunk mostanáig, Kárhozottak ős apáink, Kik szabadon éltek haltak, Szolgaföldben nem nyughatnak. (Petőfi Sándor)
