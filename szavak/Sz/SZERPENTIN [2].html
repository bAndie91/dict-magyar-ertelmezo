SZERPENTIN [2]  [ë-ë v. e-e] főnév -t, -ek, -je [ë, e] (<span style="color:green;font-weight:bold">ásványtan</span>)
Zöldessárga v. zöld színű, zsíros fényű, foltos v. hullámos rajzú, lágy ásvány; kisebb dísztárgyakat készítenek belőle. <span style="color:blue">Közönséges, nemes szerpentin.</span>
<ul><li>Szóösszetétel(ek): szerpentinazbeszt; szerpentinkő.
</li><li>szerpentines.
</li></ul></div>
