SZŐRTÜSZŐ  főnév (<span style="color:green;font-weight:bold">biológia</span>)
A hámrétegnek az irhába való tasakszerű, ferde betüremkedése; ebből nő ki a szőr-, ill. hajszál. <span style="color:blue">A szőrtüszők gennyes gyulladása a furunkulus.</span>
<ul><li>Szóösszetétel(ek): szőrtüszőatka.
</li><li>szőrtüszőjű; szőrtüszős.
