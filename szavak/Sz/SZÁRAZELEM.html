SZÁRAZELEM  [z-e] főnév (<span style="color:green;font-weight:bold">villamosság</span>)
Olyan, villamos áramot termelő elem, amelynek elektródjai nem folyadékba, hanem vmely pépes anyagba (pl. fűrészporba felszívatott szalmiáksó-oldatba) vannak beágyazva. <span style="color:blue">Nem galván-, hanem szárazelemet használ.</span>
<ul><li>szárazelemes; szárazelemű.
</li></ul></div>
