SZECSKAVÁGÓ  főnév (<span style="color:green;font-weight:bold">mezőgazdaság</span>)
Szecska készítésére való gép; a vályúszerű tartóba tett szálas takarmányt szeges hengerpár továbbítja a felaprózást végző éles pengékhez, amelyek egy forgó kerékre vannak erősítve. <span style="color:blue">Motoros szecskavágó. A szecskavágó elvágta a kezét. Kézzel hajtja a szecskavágót.</span>
