SZÖGFÜGGVÉNY  főnév (<span style="color:green;font-weight:bold">mértan</span>)
Az a függvény, amely a derékszögű háromszög vmelyik két oldala között fennálló arányt a háromszög egyik hegyes szögének függvényeként fejezi ki. <span style="color:blue">A szinusz és koszinusz szögfüggvények.</span>
<ul><li>Szóösszetétel(ek): szögfüggvénytáblázat.
</li></ul></div>
