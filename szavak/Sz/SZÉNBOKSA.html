<div class="szocikk">
SZÉNBOKSA  [mb v. nb] főnév
Kúp alakú v. hosszúkás farakás, amelyet lombbal, földdel és szénporral takarnak be, hogy a felhalmozott fához csak annyi levegő jusson, amennyi elegendő ahhoz, hogy a felhalmozott fa tökéletlen égéssel faszénné égjen. <span style="color:blue">Füstöl a szénboksa.</span>
</div>
