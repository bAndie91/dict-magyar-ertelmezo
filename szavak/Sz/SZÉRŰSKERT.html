SZÉRŰSKERT  főnév (<span style="color:green;font-weight:bold">népies</span>)
A telek azon része, ahol kazlakban, boglyákban, kalangyákban takarmányféléket halmoznak fel; szérű. □ A roppant, húsz holdnyi tér, melyet az udvar, park és szérűskertek képeztek, el volt lepve ökrökkel. (Jókai Mór)
szérűskertes; szérűskerti.
