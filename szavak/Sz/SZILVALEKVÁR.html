SZILVALEKVÁR  főnév
Érett szilvából, rendsz. cukor nélkül, sűrűre főzött lekvár. <span style="color:blue">Szilvalekvárt tesz a buktába. Szilvalekvárral keni meg a kenyeret.</span> □ Sok szilvalekvárt ettünk. És rengeteg főtt kukoricát. Ez mindig volt. (Móricz Zsigmond)
<ul><li>Szóösszetétel(ek): szilvalekvárfőző.
