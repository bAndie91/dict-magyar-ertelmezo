SZÉNVONÓ  főnév (<span style="color:green;font-weight:bold">népies</span>)
Hosszú nyélre erősített, rendsz. háromszög, félkör v. trapéz alakú lap, amellyel a kemencéből fűtés közben kihúzzák a parazsat; kuruglya. □ Csak a pékek mennek a tűzbe. De most is csak a szénvonóval. (Jókai Mór)
