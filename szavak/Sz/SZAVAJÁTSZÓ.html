SZAVAJÁTSZÓ  melléknév (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">régies</span>)
Olyan, aki játszik a szavával, kijelentéseivel; olyan, akinek nem lehet hinni, nem lehet szavait komolyan venni; nem szavahihető, megbízhatatlan. □ S az öreg tatár beszédét, Noha kétség nincs felőle, Bizonyítá a templomnak Egy nem szavajátszó őre. (Arany János)
</div>
