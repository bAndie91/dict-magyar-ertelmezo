SZEMFEDŐ  főnév szemfödő
Könnyű, áttört v. ritka anyagból, rendsz. tüllből, olykor papírból készült lepel, amellyel a halottat a koporsóban letakarják. <span style="color:blue">Csipkés szemfedő.</span> □ Nincsen apám, se anyám, se istenem, se hazám , se bölcsöm, se szemfödőm. (József Attila)
