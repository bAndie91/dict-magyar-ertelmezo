SZÓTARTÓ  melléknév (-an) v. (-n), -bb (<span style="color:green;font-weight:bold">ritka</span>)
Olyan &lt;személy&gt;, aki adott szavát megtartja, ígéretét teljesíti; szavatartó. □ Bizony, szótartóbb ember volnék, ha helyzetem nem ily "kivételes". (Arany János)
