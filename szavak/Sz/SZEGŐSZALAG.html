SZEGŐSZALAG  főnév (<span style="color:green;font-weight:bold">ruházkodás</span>)
Textilanyagból készült olyan szalag, amellyel vmely ruhadarab szélét beszegik, hogy a foszlástól, rojtosodástól megvédjék, v. hogy vele a ruhadarabot díszítsék. <span style="color:blue">Szegőszalagot varrt a kötényére.</span>
<ul><li>szegőszalagos.
