SZÓKAPCSOLAT  főnév (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
Két v. több szónak jelentésbeli összefüggésük szempontjából tekintett, nyelvtanilag megszerkesztett kapcsolata (pl. regényt ír; gurul a nevetéstől). → <span style="color:blue">Állandó</span> v. <span style="color:blue">állandósult szókapcsolat; alkalmi</span> v. <span style="color:blue">szabad szókapcsolat</span>.
