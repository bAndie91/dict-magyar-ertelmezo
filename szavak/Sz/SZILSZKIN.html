SZILSZKIN  főnév -t, -ek, -je [ë, e]
Egy fókafajtának selymes, fekete v. barnásfekete, értékes, nemes prémje. <span style="color:blue">Valódi szilszkin.</span> || a. Ennek festett nyúlbőrből készült utánzata.
<ul><li>Szóösszetétel(ek): szilszkinbunda; szilszkinutánzat.
