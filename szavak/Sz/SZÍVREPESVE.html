SZÍVREPESVE  [e-ë-e v. e-e-e] határozószó (<span style="color:green;font-weight:bold">választékos</span>)
A nagy örömtől, elragadtatástól boldogan; boldog örömmel; repeső szívvel. <span style="color:blue">Szívrepesve rohant hazatérő férje elé.</span> □ Szív-repesve vár rá a szelíd leány, Szív-repesve jő már anyja is. (Vörösmarty Mihály)
