SZAKA [1]  főnév szakát, szakája (<span style="color:green;font-weight:bold">tájszó</span>)
A kerék talpából kitört, kihullott v. kivágott darabka. <span style="color:blue">Szakat</span> → <span style="color:blue">vet a kerék.</span> □ Mind a négy pej lovam törje ki a lábát, Vessen a hintómnak négy kereke szakát. (népköltés)
