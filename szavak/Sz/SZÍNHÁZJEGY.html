SZÍNHÁZJEGY  főnév
Olyan jegy, amely a színházi nézőtér vmely helyének egy előadás tartalmára való elfoglalására jogosít. <span style="color:blue">Olcsó, kedvezményes színházjegy; színházjegyet vált. Elővételben vette meg a színházjegyeket.</span>
<ul><li>Szóösszetétel(ek): színházjegyiroda.
