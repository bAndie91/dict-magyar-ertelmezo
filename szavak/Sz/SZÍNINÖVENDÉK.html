SZÍNINÖVENDÉK  főnév
Színészeket képző (fő)iskola hallgatója, növendéke. <span style="color:blue">Elsőéves, harmadéves színinövendék. Már színinövendék korában feltűnt tehetségével.</span> □ A leány színinövendék, s mostanában Adolf barátnője. (Nagy Lajos)
színinövendékes; színinövendéki.
