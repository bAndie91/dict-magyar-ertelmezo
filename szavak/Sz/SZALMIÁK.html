SZALMIÁK  főnév -ot, -ja (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Az ammónia vizes oldata: színtelen, szúrós szagú, könnyeztető hatású folyadék, amelyet a vegyészetben kémszerül, a háztartásban pedig tisztítószerként használnak: szalmiákszesz.
<ul><li>Szóösszetétel(ek): szalmiákcukor; szalmiáksó.
</li><li>szalmiákos; szalmiákoz.
</li></ul></div>
