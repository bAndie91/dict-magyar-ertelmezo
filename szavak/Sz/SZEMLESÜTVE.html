SZEMLESÜTVE  [ë-ë-e] határozószó (<span style="color:green;font-weight:bold">választékos</span>)
Szemét lesütve, rendsz. szégyenkezésében v. tartózkodása jeleként. <span style="color:blue">Szemlesütve bevall vmit; szemlesütve hallgatja a pirongatást. Az egész vita alatt szemlesütve ült a helyén.</span> □ Hazudtam  szólalt meg szemlesütve az asszony. (Ambrus Zoltán)
