SZÉKINGER  [k-i] főnév (<span style="color:green;font-weight:bold">ritka</span>)
A bélcsatornában jelentkező olyan inger, amely a bél tartalmának, a bélsárnak a végbélen át történő kiürítésére, székelésre (1) késztet; székelési inger. <span style="color:blue">Bevette a hashajtót, még sincs székingere.</span>
<ul><li>székingeres.
</li></ul></div>
