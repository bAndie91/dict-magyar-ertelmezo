SZÉGYENVALLÁS  főnév (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Vmely célnak, szándéknak, vállalkozásnak vkire szégyent hozó meghiúsulása, ill. a megszégyenülés állapota. □ Édesanyám boldog volt, hogy mentek, csak ki, ki ebből a faluból, szégyenvallás földjéből. (Móricz Zsigmond)
