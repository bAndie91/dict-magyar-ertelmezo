SZÉNMONOXID  [mm v. nm] főnév (<span style="color:green;font-weight:bold">vegyi ipar</span>)
A szén tökéletlen égésekor keletkező színtelen, szagtalan, de súlyosan mérgező gáz; az égést nem táplálja, de maga kékes lánggal ég; széngáz (a) (CO). <span style="color:blue">A szénmonoxid a vörös vérsejteket pusztítja.</span>
