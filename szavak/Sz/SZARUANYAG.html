SZARUANYAG  főnév (<span style="color:green;font-weight:bold">biológia</span>)
&lt;Állaton, emberen&gt; a bőr felső sejtjeinek elhalt és megkeményedett tömege, a szőr, haj, köröm, szarv alapanyaga; a fehérjék csoportjába tartozó kén tartalmú vegyület. 
<ul><li>Szóösszetétel(ek): szaruanyag-feldolgozó.
</li><li>szaruanyagú.
</li></ul></div>
