SZÁK  főnév -ot, -ja (<span style="color:green;font-weight:bold">halászat</span>)
Hosszú nyélre erősített háló [1] (2), amellyel lapátolásszerűen emelik ki a halat; főleg tógazdaságokban v. jég alatti halászatban használják. → <span style="color:blue">Ujjas szák.</span> □ Több halászlegény nagy merítő szákkal lapátolja ki a lék szájára tolt eleven tömeget. (Jókai Mór)
