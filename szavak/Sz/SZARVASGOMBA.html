SZARVASGOMBA  főnév
Jóízű ehető gomba; termőteste gumó alakú; a talajban, fák gyökereivel együttélésben fejlődik (Tuber aestivum). □ Szarvasgombát eszik a császár szilveszteri vacsoráján. (Kosztolányi Dezső)
<ul><li>Szóösszetétel(ek): szarvasgomba-pástétom.
</li><li>szarvasgombás.
