SZIDALMAZ  tárgyas ige -tam, -ott, -zon (<span style="color:green;font-weight:bold">választékos</span>)
Szidalmakkal illet, hosszasabban szid vkit, vmit. <span style="color:blue">Összevesztek, és durván szidalmazták egymást.</span> □ Ez, tudom, hogy nem jön többé hozzám, s majd szidalmaz országszerte. (Jókai Mór)
<ul><li>Igekötős igék: végigszidalmaz.
</li><li>szidalmazó; szidalmazott.
