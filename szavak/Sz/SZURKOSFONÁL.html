SZURKOSFONÁL  főnév szurkosfonal
&lt;A cipésziparban:&gt; szurokkal bekent, bőr varrására haszn. kenderfonál. □ Az egyszeri ember minduntalan kaptát és szurkosfonalat emelgetvén, ráismertek, hogy őkigyelme varga! (Vas Gereben) Juci lányom bizony nem fog szurkosfonalat fonni senki vargájának. (Jókai Mór)
