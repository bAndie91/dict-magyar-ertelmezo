SZIKLAPART  főnév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Sziklából álló v. nagyon sziklás és gyak. meredek part. □ Ült a lyányka boldogan tűnődve Sziklaparton a tenger fölött. (Petőfi Sándor) A fenékig befagyott folyam a két sziklapart között megrekedt. (Jókai Mór)
sziklaparti; sziklapartos; sziklapartú.
