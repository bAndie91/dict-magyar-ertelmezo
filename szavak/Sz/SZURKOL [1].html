SZURKOL [1]  tárgyas ige -t, -jon
Szurokkal ken vmit. <span style="color:blue">Szurkolják a fonalat, a hordót, a csónak fenekét. A kerítés oszlopait még szurkolni kell.</span>
<ul><li>Igekötős igék: beszurkol; kiszurkol; körülszurkol; megszurkol; összeszurkol.
</li><li>szurkolható; szurkoló; szurkolt; szurkoltat.
</li></ul></div>
