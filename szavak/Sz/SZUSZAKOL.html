SZUSZAKOL  tárgyas ige -t, -jon (<span style="color:green;font-weight:bold">tájszó</span>, <span style="color:green;font-weight:bold">hangfestő</span>)
<span style="color:blue">Vmibe szuszakol vmit:</span> vmibe gyömöszöl, tömköd, dug vmit. <span style="color:blue">Kenyeret, szalonnát szuszakolt a tarisznyájába.</span>
<ul><li>Igekötős igék: átszuszakol; beszuszakol; beleszuszakol; teleszuszakol.
</li><li>szuszakolás; szuszakoló; szuszakolt.
</li></ul></div>
