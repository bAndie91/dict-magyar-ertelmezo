SZENTES [2]  [e-ë] főnév -t, (-ek), -e [ë, e] (<span style="color:green;font-weight:bold">tájszó</span>)
Halászbárkának lakásul haszn. helyisége, amelynek homlokzatára a hajó védőszentjének képét v. nevét szokták festeni. □ Az egyik [halász] halat tisztít, a másik bemegy az álló bárkán a szentesbe. A bárkán a lakás a szentes. (Tömörkény István)
