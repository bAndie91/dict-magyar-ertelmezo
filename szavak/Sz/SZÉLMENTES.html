<ul><li>1. Olyan &lt;idő&gt;, amikor nem fúj a szél, amikor szélcsend van. <span style="color:blue">Szélmentes időben indult el a hajó.</span>
</li><li>2. Olyan &lt;hely&gt;, amely széltől védett, ahol a szél általában nem fúj. <span style="color:blue">Szélmentes kikötő, oldal, udvar, utca.</span>
</li><li>szélmentesség.
