SZÁRNYÉPÜLET  [ny-é] főnév (<span style="color:green;font-weight:bold">építészet</span>)
Vmely nagyobb épületnek olyan alárendelt, gyakran utólag épített része, amely az épület fő részével belülről is összeköttetésben van. □ A nyugati szárnyépületbe összegyűlt nép megkísérté betörni a nehéz ajtókat. (Jókai Mór)
<ul><li>szárnyépületi.
