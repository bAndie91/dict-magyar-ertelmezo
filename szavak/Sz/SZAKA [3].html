SZAKA [3]  főnév szakát, szakája (<span style="color:green;font-weight:bold">tájszó</span>)
A szigonynak v. a horognak hegyes levél alakú, nyílhegyhez hasonló része, amelynél fogva a horog v. a szigony beleakad a megfogott hal torkába, ill. testébe. <span style="color:blue">Letörött a horog szakája.</span>
