SZÉKHÁT  főnév
A széknek (szék [1]) az üléslaphoz függőlegesen v. kissé ferdén odaerősített, magasabbra emelkedő része, támlája, melyhez a rajta ülő a hátát támasztja. <span style="color:blue">Faragott, fonott székhát.</span> □ A széknek fele részét vette igénybe, nehogy a székhátnak dülleszkedjék. (Vas Gereben)
