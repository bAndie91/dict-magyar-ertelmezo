SZÉNMEDENCE  [mm v. nm] főnév (<span style="color:green;font-weight:bold">bányászat</span>)
A földkéregnek olyan besüllyedt része, amelyben egykori lápok elpusztult növényanyagából széntelepek halmozódtak fel, s amelynek területén rendsz. szénbányák vannak. <span style="color:blue">A dorogi, a pécsi, a salgótarjáni szénmedence.</span>
