SZAKKATALÓGUS  főnév (<span style="color:green;font-weight:bold">tudományos</span>)
Olyan (könyvtári) címjegyzék, katalógus, amelyben a művek szakok, tárgykörök szerint, vmilyen osztályozási rendszer alapján vannak csoportosítva. <span style="color:blue">Tizedes rendszerű szakkatalógus. A szakkatalógusból kiírta a kérdés irodalmát.</span>
<ul><li>szakkatalógusi; szakkatalógusos.
