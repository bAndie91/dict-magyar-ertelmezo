SZIVARFA  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
Terebélyes alacsonyabb díszfa; levelei ép szélűek, a párta harang alakú, a virágok hatalmas, széles bugában állanak (Catalpa bignonioides). <span style="color:blue">Japán, közönséges, pompás szivarfa.</span>
