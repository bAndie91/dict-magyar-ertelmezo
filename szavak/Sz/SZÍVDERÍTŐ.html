SZÍVDERÍTŐ  melléknév (<span style="color:green;font-weight:bold">választékos</span>)
Jóleső derűt okozó, vidám hangulatot keltő, vidámító. <span style="color:blue">Szívderítő jelenet, mozzanat, pillanat, zene.</span> □ A bohó farsangok szívderítő figuráiból, az elképzelések és titkos álmok csodaszép alakjaiból ő maradt meg ez esztendő karneváljában, a vándorkatona. (Krúdy Gyula)
