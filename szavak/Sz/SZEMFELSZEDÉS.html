SZEMFELSZEDÉS  [ë-ë-ë v. ë-e-ë] főnév -t, (-ek), (-e) [ë, e] szemfölszedés [ë, ë]
Az az eljárás, amellyel a selyemből v. műanyagszálból készült női harisnyának hosszirányban felbomlott szemeit horgas tűvel újra egymásba fűzik. <span style="color:blue">Szemfelszedést vállal, végez.</span>
