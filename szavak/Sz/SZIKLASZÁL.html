SZIKLASZÁL  főnév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
A hegyről hosszan kinyúló, előre v. fölfelé meredő, de a hegy egészével összefüggő, rendsz. magányos nagy szikla. □ A legmagasabb hegytetőn állok, egy meredek sziklaszálon. (Jókai Mór)
