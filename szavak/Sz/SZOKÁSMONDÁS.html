SZOKÁSMONDÁS  főnév
Gyakran használt s rendsz. szólás- v. közmondásszerű kijelentés, mondás. <span style="color:blue">Jobb későn, mint soha, mondja a szokásmondás.</span> □ Sok lúd disznót győz, így a szokásmondás. (Kaffka Margit) Szokásmondás hogy aki nem akar megöregedni, akassza fel magát. (Móra Ferenc)
