SZEMTENGELY  főnév (<span style="color:green;font-weight:bold">bonctan</span>)
A szem fénytörő közegeinek közepén áthaladó, képzeletbeli egyenes vonal, amely az ideghártyát a sárga folttól kissé fölfelé éri. <span style="color:blue">A szemtengely elferdülése.</span>
<ul><li>Szóösszetétel(ek): szemtengely-elfordulás; szemtengely-ferdülés.
</li><li>szemtengelyű.
