SZERENCSEFILLÉR  főnév
Vadonatúj v. fényesre csiszolt, ill. csillogó fémmel (arany, ezüst stb.) bevont csekély értékű, rendsz. egyfilléres pénzdarab, amely &lt;babonás hiedelem szerint&gt; szerencsét hoz tulajdonosának. <span style="color:blue">Szilveszterkor szerencsefilléreket ajándékozott ismerőseinek.</span>
