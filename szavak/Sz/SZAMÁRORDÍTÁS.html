SZAMÁRORDÍTÁS  [r-o] főnév
Az a tény, hogy a szamár ordít, ill. az ordításkor hallatott hangja; a szamár ordítása. <span style="color:blue">Szamárordítást hallott.</span>
<ul><li>Közmondás(ok): (<span style="color:green;font-weight:bold">gúnyos</span>) <span style="color:blue">Szamárordítás nem hallatszik a mennyországba:</span> ostoba ember szájaskodására, nagyhangú vádaskodására nem szokás adni semmit.
</li></ul></div>
