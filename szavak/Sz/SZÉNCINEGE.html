SZÉNCINEGE  főnév széncinke
A cinegék családjába tartozó, veréb nagyságú, hasznos rovarirtó énekes madár (Parus maior); felül olajzöld, alul szénsárga, feje és nyaka fekete. □ [A] szürke sármányok is megérkeznek, szintúgy a széncinege is. (Vas Gereben)
