SZALU  főnév -t, -ja (<span style="color:green;font-weight:bold">tájszó</span>)
Meghajlított, lapjával a nyélre keresztben, kapaszerűen álló fejsze, amelyet ácsok, bognárok, teknővájók használnak fatörzs, gerenda, fadarab kivájására, hordódongák faragására stb.; vájó, hornyoló, völgyelő fejsze.
