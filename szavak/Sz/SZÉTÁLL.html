SZÉTÁLL  [t-á] tárgyatlan ige
&lt;Több tárgy v. egy, rendsz. részekből álló tárgy, testrész&gt; olyan helyzetben van, hogy a tagok v. részek az átlagoshoz képest távolabb vannak egymástól. <span style="color:blue">Szétáll a füle; szétáll az ökör szarva; szétállnak az ujjai. Fekete haja csomókban áll szét.
szétállás; szétálló.
