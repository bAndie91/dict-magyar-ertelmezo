NÉPTELENÍT  tárgyas ige -ett, -sen [ë, ë]; -eni [e] v. (-ni) (<span style="color:green;font-weight:bold">ritka</span>)
Lassan, folyamatosan néptelenné tesz; okozza, előidézi, hogy vmi néptelenné, ill. egyre néptelenebbé váljék.
<ul><li>Igekötős igék: elnéptelenít.
</li><li>néptelenítés; néptelenített; néptelenítő.
</li></ul></div>
