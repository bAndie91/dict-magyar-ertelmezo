NAPTÁVOL  főnév (<span style="color:green;font-weight:bold">csillagászat</span>)
A bolygók és az üstökösök elliptikus pályájának az a pontja, amely a Naptól a legtávolabb van (afélium). <span style="color:blue">A Föld naptávolban van.</span> □ Észlelhető volt [az üstökös] hatása a naptávolban álló Jupiteren és Marson. (Jókai Mór)
