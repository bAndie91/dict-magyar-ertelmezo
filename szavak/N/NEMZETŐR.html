NEMZETŐR  [t-ő] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
Az 1848-ban alakult magyar nemzetőrségnek a tagja. □ Pákozdnál tízezer emberrel rakatták le a szuronyos puskát a kaszás nemzetőrök. (Jókai Mór)
<ul><li>Szóösszetétel(ek): nemzetőrtiszt; nemzetőr-zászlóalj.
</li><li>nemzetőri.
