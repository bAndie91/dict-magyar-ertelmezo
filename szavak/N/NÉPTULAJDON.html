NÉPTULAJDON  főnév (<span style="color:green;font-weight:bold">1945 után</span>, <span style="color:green;font-weight:bold">sajtónyelvi</span>)
A nép (12) tulajdona; kül. a társadalmi tulajdonba vett termelési eszközök olyan államban, amelyben a hatalom a dolgozó népé. <span style="color:blue">A néptulajdonba vett üzemek.</span>
