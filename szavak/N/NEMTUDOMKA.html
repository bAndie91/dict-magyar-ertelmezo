NEMTUDOMKA  [e v. ë] főnév -kát,-kája (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">tréfás</span>)
Az, aki akár tudatlansága miatt, akár tettetésből minden kérdésre így felel: "Nem tudom". □ [A vallatáskor] Anna semmit sem tudott   Valóságos "nemtudomka" vagy, édes fiam  dorgálta a bíró. (Mikszáth Kálmán)
