NADRÁGSZÁR  főnév
A nadrágnak a combot és a lábszárat takaró (két) ága. <span style="color:blue">Sáros a nadrágszárad.</span> □ Lábszárai kályhacsőhöz hasonló nadrágszárakba voltak bújtatva. (Krúdy Gyula) Fölhúzta a nadrágszárakat a combján, aztán leült. (Kosztolányi Dezső)
nadrágszárú.
