NARANCSVIRÁG  főnév
A narancsfának jó illatú, fehér színű virága. □ A vőlegény a helyzethez illő tisztes ábrázatot vág, s a gép egy pillanat alatt megörökíti a menyasszonyi fátyolt, a narancsvirágot. (Ambrus Zoltán)
<ul><li>Szóösszetétel(ek): narancsvirágvíz.
</li><li>narancsvirágos.
