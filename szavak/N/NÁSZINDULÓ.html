NÁSZINDULÓ  [sz-i] főnév
Hangszerre szerzett mérsékelt, bár lüktető ütemű induló, amely díszesebb esküvőkön rendsz. a násznép felvonulását kíséri. <span style="color:blue">A Szentivánéji álom nászindulója.</span> □ Ha pénzünk lesz, az orgonán Lohengrin nászindulóját játszatjuk egy hozzáértő mesterrel. (Krúdy Gyula)
nászindulós.
