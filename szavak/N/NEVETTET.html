NEVETTET  [e-e-e] tárgyas ige -tem, -ett [e, ë], ..ttessen [e-ë]
&lt;Tréfáival, vidám ötleteivel v. furcsaságával&gt; nevetésre késztet, ingerel vkit, nevetést, nevetséget (1) kelt. <span style="color:blue">Mókáival folyton nevetteti társait.</span>
<ul><li>Igekötős igék: agyonnevettet; kinevettet; megnevettet.
</li><li>nevettetés.
