NŐHALLGATÓ  főnév
(<span style="color:green;font-weight:bold">hivatalos</span>) Vmely főiskola, egyetem v. felsőbb fokú tanfolyam hallgatóságának női tagja. <span style="color:blue">A főiskolára sok nőhallgatót vettek föl.</span> || a. Vmely előadás közönségének női tagja. <span style="color:blue">A felolvasás nőhallgatói; a rádió nőhallgatói.</span>
