NÉPHIT  főnév (<span style="color:green;font-weight:bold">választékos</span>)
A nép (3a) körében általánosan elterjedt s rendsz. hiedelmen v. babonán alapuló hagyományos hit. □ Az isten áldása kikerülte háza tájékát, mint a néphit szerint az olyan határt szokta, melyen keresztül halottat visznek. (Mikszáth Kálmán)
