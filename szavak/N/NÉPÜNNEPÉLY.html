<div class="szocikk">
NÉPÜNNEPÉLY  [p-ü] főnév
Nagy tömegek számára rendezett, rendsz. sok szórakozási lehetőséget nyújtó, nagyszabású ünnepély, mulatság. <span style="color:blue">Népünnepélyt rendeztek a folyó partján.</span> □ Semmi sem volt komikusabb a népünnepélyen, mint az, hogy a kivégzendő ökröt a hadastyánok kísérték. (Mikszáth Kálmán)
</div>
