NÓTAFA  főnév (<span style="color:green;font-weight:bold">népies</span>)
Sok (régi) nótát ismerő, gyak. maga is nótákat költő, dalos kedvű (falusi) személy. <span style="color:blue">Meghalt a falu öreg nótafája. Ezt a nótát egy nótafától tanulta.</span> □ [Dankó Pista] nótafa csak kint a zizegő homokon lehetett. (Móra Ferenc)
