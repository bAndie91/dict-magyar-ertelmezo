NÁSPÁNGOL  tárgyas ige -t, -jon, (<span style="color:green;font-weight:bold">tájszó</span>) náspágol (<span style="color:green;font-weight:bold">ritka</span>, kissé <span style="color:green;font-weight:bold">tréfás</span>)
&lt;Bottal v. más eszközzel&gt; alaposan üt, ver vkit; püföl, páhol. <span style="color:blue">Éppen a fiát náspángolta, amikor beléptem.</span>
<ul><li>Igekötős igék: elnáspángol; megnáspángol; végignáspángol.
</li><li>náspángolás; náspángoló.
</li></ul></div>
