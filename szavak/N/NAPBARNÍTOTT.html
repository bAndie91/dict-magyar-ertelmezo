NAPBARNÍTOTT  melléknév (-an) napbarnította
Olyan, akinek, aminek a bőre a napon barnára sült le. <span style="color:blue">Egészséges, napbarnított legények.</span> □ Harcvágy ég nap-barnította arcán. (Madách Imre) Kijött a mindenes, egy öreg, fehér bajuszú, napbarnított férfi. (Jókai Mór)
napbarnítottság.
