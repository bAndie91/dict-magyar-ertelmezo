NEOLOGIZMUS  [ë] főnév -t, -ok, -a (<span style="color:green;font-weight:bold">nyelvtudomány</span>) Tudatosan alkotott új szó v. vmely szónak új jelentésben való használata, új szókapcsolat v. új nyelvtani alak, ill. az ilyeneket kedvelő irodalmi stílus. □ Dessewffy bár nem túlzó purista, barátja volt a neologizmusnak. (Csengery Antal)
