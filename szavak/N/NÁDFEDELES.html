NÁDFEDELES  melléknév nádfödeles
Náddal (3) fedett. <span style="color:blue">Nádfedeles ház, kunyhó.</span> □ Elül a mi házunk, emeletes, de mégis fehérre meszelt | zöld ablakokkal; oldalt a szomszédé, alacsony, falusi, | nádfödeles. (Babits Mihály) A régi iskola  alacsony volt s nádfedeles. (Móricz Zsigmond)
