NEVETHETNÉK  [e-e-e] főnév -je [e] (csak birtokos személyraggal) (<span style="color:green;font-weight:bold">bizalmas</span>)
Kedv, inger a nevetésre. <span style="color:blue">Nevethetnékje támad vmitől:</span> nevetésre ingerli vmi; <span style="color:blue">nevethetnékje van. Nincs valami nagy nevethetnékem.</span> □ Berti majd megvágta magát a borotvával, olyan nevethetnékje volt. (Móricz Zsigmond)
