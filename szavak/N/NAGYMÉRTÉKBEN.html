NAGYMÉRTÉKBEN  [e] határozószó nagyobb mértékben
Jelentős, számottevő mértékben; jelentősen, tetemesen. <span style="color:blue">A behozatal nagymértékben csökkent. Az újítás nagymértékben fokozza a termelékenységet. A sikerhez ők is nagymértékben hozzájárultak.</span>
