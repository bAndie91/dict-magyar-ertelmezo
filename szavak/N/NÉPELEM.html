NÉPELEM  [p-e] főnév
<ul><li>1. (<span style="color:green;font-weight:bold">ritka</span>) A népnek (12) alkotórészét tevő népcsoport (1). □ Minden nemzetiség különböző népelemekből származott. (Eötvös József)
</li><li>2. (<span style="color:green;font-weight:bold">régies</span>) A nép (12) vmelyik rétege v. az ehhez tartozó személy. □ A bérkocsis: az Rómában a legrokonszenvesebb népelem. (Jókai Mór)
</li></ul></div>
