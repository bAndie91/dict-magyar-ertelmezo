ÖNVESZÉLYES  melléknév -en, (-ebb) [e, e]
Saját magára, egészségi állapotára veszélyes &lt;személy&gt;. <span style="color:blue">Önveszélyes őrült.</span> □ Nem lehetek félbolond szökevény se, aki elhagyván a szanatóriumot a megengedett idő előtt, köz- és önveszélyessé válik. (Krúdy Gyula)
