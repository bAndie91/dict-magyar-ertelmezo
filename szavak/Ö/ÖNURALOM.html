ÖNURALOM  [n-u] főnév
Vkinek saját érzelmei, indulatai, szenvedélyei feletti uralma; önfegyelem. <span style="color:blue">Nagy önuralma van; elveszti, megőrzi, visszanyeri önuralmát.</span> □ A vacsora végén már tisztára őrült volt,  Elvesztette az egész önuralmát. (Móricz Zsigmond)
önuralmi; önuralmú.
