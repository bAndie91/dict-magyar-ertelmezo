ÖNVALLOMÁS  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Az a vallomás, amelyet vki önszántából, önként, saját magáról, vmely tettéről, bűnéről tesz. <span style="color:blue">Kegyetlen, keserű, kíméletlen, marcangoló, őszinte önvallomás.</span> □ Az önvallomás nem föltétlen bizonyíték. Kivált ilyen esetben egy gyönge idegzetű női egyénnél. (Kaffka Margit)
