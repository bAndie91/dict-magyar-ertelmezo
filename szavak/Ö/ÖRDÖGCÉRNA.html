ÖRDÖGCÉRNA  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
Rendsz. sövénynek ültetett, sűrű, bokros cserje; liláspiros, egész nyáron át nyíló virága s piros bogyótermése van (Lycium halimifolium); licium, sefűsefa. □ [Az aggastyán] füvet tart egy tálcán; közönséges réti lóhere  ördögcérnával keverve. (Mikszáth Kálmán)
