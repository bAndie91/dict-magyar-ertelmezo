ÖSSZETARTOZÓSÁG  [e] főnév -ot, -a (csak egyes számban) (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">választékos</span>)
Az a sajátság, tulajdonság, kapcsolat, állapot, hogy két v. több személy, dolog összetartozik, összetartozó; összetartozás. <span style="color:blue">Az összetartozóság érzése; a házastársak összetartozósága.</span>
