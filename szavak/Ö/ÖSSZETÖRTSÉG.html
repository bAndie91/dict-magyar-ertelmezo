ÖSSZETÖRTSÉG  [összetörtség v. összetörcség] főnév -et, -e [ë, e] (csak egyes számban) (<span style="color:green;font-weight:bold">választékos</span>)
Annak a testi-lelki, ill. kedélyállapota, aki össze van törve (összetör 56). <span style="color:blue">Látszik rajta az összetörtség. Gyásza idézte elő ezt a nagy összetörtséget.</span>
