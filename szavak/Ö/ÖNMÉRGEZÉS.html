ÖNMÉRGEZÉS  [mm v. nm] főnév (<span style="color:green;font-weight:bold">ritka</span>)
Önmagunk megmérgezése öngyilkossági szándékból v. más módon. <span style="color:blue">Az iszákosság is egy neme az önmérgezésnek. Önmérgezést követett el.</span> □ Önmérgezésről szó sem lehet, mert a gróf  nagyon is ragaszkodott az élethez. (Jókai Mór)
önmérgezési.
