ÖLEB  [l-e] főnév
A legkisebb fajtájú, kedvtelésre tartott kutya. □ [Az úri hölgyhöz.] Szeretsz pompát, hizelgő csapodárt, Hintót, lovat, sőt hitvány ölebet. (Vörösmarty Mihály) Selyemszőrű, kis fekete öleb, a nyakán máslira kötött piros selyemszalaggal. (Kuncz Aladár)
ölebecske; ölebes.
