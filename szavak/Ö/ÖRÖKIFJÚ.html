ÖRÖKIFJÚ  [k-i] melléknév (<span style="color:green;font-weight:bold">választékos</span>)
Olyan, aki, ami sokáig fiatalos, öregségben sem megtört, akin, amin nem látszik, nem érződik az öregség. <span style="color:blue">Örökifjú kedély, nagymama.</span> □ [Az] örökifjú asszony ismét rálehellte egész idealizmusát. (Justh Zsigmond)
örökifjúság.
