ÖSSZEKEN  tárgyas ige
&lt;Híg v. szennyező hatású anyaggal&gt; itt is, ott is bekenve bepiszkít vmit. <span style="color:blue">Ruháját festékkel összekente. Csirizzel összekente a tenyerét. A kályhát tisztította, és a korommal összekente magát.</span>
<ul><li>összekenés; összekenhető; összekenő; összekent.
