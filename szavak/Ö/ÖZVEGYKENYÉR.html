ÖZVEGYKENYÉR  főnév (<span style="color:green;font-weight:bold">régies</span>)
Özvegyi állapot, özvegyi élet, kül. özvegységre jutott asszonynak, (<span style="color:green;font-weight:bold">ritka</span>) férfinak keserves élete. <span style="color:blue">Özvegykenyéren él:</span> özvegyi állapotban él; <span style="color:blue">özvegykenyérre jutott.</span>
