ÖNAKARAT  [n-a] főnév (<span style="color:green;font-weight:bold">régies</span>)
Vkinek saját, tulajdon akarata, elhatározása. <span style="color:blue">Önakaratból.</span> □ Körödbe helyze [= helyezett] végzetem szeszélye, S önakarat im száműzésbe visz. (Madách Imre) Nem volt semmi önakarata; engedett magával mindent tenni. (Jókai Mór)
önakaratú.
