ÖNTELTSÉG  [tárgyas v. cs] főnév -et, -e [ë, e] (csak egyes számban)
Az öntelt melléknévvel kifejezett jellembeli tulajdonság; önhittség. <span style="color:blue">Nincs benne semmi önteltség.</span> □ Önteltség volt tőle baráti ragaszkodásomban  többet látni a valónál. (Kemény Zsigmond)
