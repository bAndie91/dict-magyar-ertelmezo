ÖNJELÖLT  főnév (<span style="color:green;font-weight:bold">rosszalló</span>)
Az, aki saját magát rendsz. csekély érdem v. jogosultság alapján s az illetékesek, a tömegek támogatása nélkül jelöli, jelölteti v. szóba hozatja vmilyen tisztségre, állásra, esetleg más, arra érdemes egyén háttérbe szorításával.
önjelölti; önjelöltség.
