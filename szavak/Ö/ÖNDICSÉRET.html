ÖNDICSÉRET  főnév
Az a dicséret, amellyel vki önmagát illeti, kiemeli. <span style="color:blue">Az öndicséret mindig ellenszenvet kelt.</span> (<span style="color:green;font-weight:bold">szójárás</span>) <span style="color:blue">Öndicséret büdös.</span> □ Kénytelen vagyok, a hű elbeszélés tekintetéből, itt a tanácsos saját szavait adni elő, s így az olvasó ezt ne vegye öndicséretnek. (Petőfi Sándor)
