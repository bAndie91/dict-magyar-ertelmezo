ÖKLE  [e] főnév öklét, ökléje [e] (<span style="color:green;font-weight:bold">állattan</span>)
Kisebb, fehér, de keserű húsú, édesvízi hal; teste kétoldalt össze van nyomva, ívás idején pompás színekben tarkállik. <span style="color:blue">Szivárványos ökle.</span> || a. A pontyfélék (Cyrinidae) családjába tartozó halak nemzetsége (Rhodeus).
