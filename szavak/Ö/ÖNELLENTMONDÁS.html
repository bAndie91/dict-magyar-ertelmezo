ÖNELLENTMONDÁS  [n-e] főnév
Az a tény, hogy vki későbbi kijelentéseiben, megnyilvánulásaiban ellentétbe kerül korábbi állításával v. állításaival, s így önmagát cáfolja, hazudtolja meg. <span style="color:blue">Önellentmondásokba keveredik. Kijelentései hemzsegtek az önellentmondásoktól.</span>
önellentmondásos.
