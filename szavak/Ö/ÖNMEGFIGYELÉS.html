ÖNMEGFIGYELÉS  [mm v. nm] főnév (<span style="color:green;font-weight:bold">választékos</span>)
A bennünk végbemenő lelki folyamatoknak, saját magunk viselkedésének, magatartásának megfigyelése. <span style="color:blue">Az önmegfigyelés a lélektan egyik vizsgálati módszere. Önmegfigyeléssel tudatosíthatjuk magunkban hibáinkat.</span>
önmegfigyeléses; önmegfigyelési.
