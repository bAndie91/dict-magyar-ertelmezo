ÖNARCKÉP  [n-a] főnév
Olyan kép, főleg arckép v. mellkép, amelyen a festő, rajzoló önmagát ábrázolja. <span style="color:blue">Önarcképet fest, rajzol. Önarcképét is kiállította.</span> || a. (<span style="color:green;font-weight:bold">ritka</span>) Szobor, plasztikai alkotás, mely rendsz. csak a művész fejét ábrázolja. <span style="color:blue">Önarcképet farag, mintáz.</span>
</div>
