ÖRDÖGHINTA  főnév (<span style="color:green;font-weight:bold">népies</span>)
Földbe ásott cölöpre szerelt, egy v. több rúdból álló, kezdetleges falusi körhinta, mely tengelyén forgatható s ülő alkalmatossággal van felszerelve. <span style="color:blue">A legények veszettül hajtották az ördöghintát.</span> □ Az öregúr szédült, mintha ördöghintán ülne. (Herczeg Ferenc)
ördöghintás.
