ÖNINDÍTÓ  [n-i] főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Robbanómotor megindításához használatos olyan, rendsz. elektromos szerkezet, amely (gomb)nyomásra a főtengelyt addig forgatja, míg a gyújtás a motorban meg nem történik. □ Ne fáradjon, fiam, nem kell kurblizni, van nálam önindító. (Karinthy Frigyes)
önindítós.
