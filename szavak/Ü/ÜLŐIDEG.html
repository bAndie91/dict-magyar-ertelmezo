ÜLŐIDEG  főnév
A gerincvelő alsó részéből kiágazó s a faron, a comb hátsó felületén, a lábon a talpig húzódó gazdag ideg(hálózat) (nervus ischiadicus). <span style="color:blue">Az ülőidegnek fájdalmas megbetegedése a zsába.</span>
<ul><li>Szóösszetétel(ek): ülőideg-gyulladás; ülőidegzsába.
</li><li>ülőidegi.
</li></ul></div>
