ÜLEDÉKES  [e-ë] melléknév -en, -ebb [e, e]
<ul><li>1. Olyan &lt;folyadék&gt;, amelyből üledék válik ki. <span style="color:blue">Üledékes bor, kávé, víz; üledékes vizelet.</span>
</li><li>2. (<span style="color:green;font-weight:bold">földtan</span>) Olyan &lt;kőzet, föld&gt;, amely bizonyos anyagok leülepedésének következtében jött létre. <span style="color:blue">Üledékes kőzet, talaj.</span>
</li><li>üledékesség.
</li></ul></div>
