ÜLŐGUMÓ  főnév
A magasabb rendű gerinces állatok ülőcsontján kifejlődött, (erősen) kiemelkedő gumó (Tuber ischiadicum). <span style="color:blue">Az ember testsúlya üléskor nagyrészt az ülőgumón nyugszik. Vöröskék színével különösen feltűnő a páviánok ülőgumója.</span>
<ul><li>ülőgumójú; ülőgumós.
