ÜLŐSZTRÁJK  [ő-sz] főnév (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">1945 előtt</span>)
&lt;Kapitalista viszonyok között&gt; a munka megszüntetésének az a fajtája, amikor a munkások az üzem gépei mellett ülve, termelő munkát nem végeznek, s az esetleg dolgozni szándékozókat a munka elvégzésében megakadályozzák.
<ul><li>ülősztrájkos.
