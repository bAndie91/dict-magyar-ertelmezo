ÜSZŐBORJÚ  főnév, (<span style="color:green;font-weight:bold">tájszó</span>) üszőbornyú (<span style="color:green;font-weight:bold">népies</span>)
Nőstény borjú, üsző. □ Egyetlen tehenének üszőbornya döglött meg. (Eötvös József) Tegnap a hízó kergette meg az üszőborjút. (Jókai Mór) Ezt a holmit bizony egy üszőbornyú is elhúzná. (Mikszáth Kálmán)
