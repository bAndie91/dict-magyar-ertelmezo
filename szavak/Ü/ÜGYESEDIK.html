ÜGYESEDIK  [e-ë] tárgyatlan ige -tem, -ett [e, ë], -jék (-jen) [ë] (-t ragos mértékhatározóval is)
Fokozatosan ügyessé v. ügyesebbé válik. <span style="color:blue">Már ügyesedik a gyerek; ügyesedik a keze, a tolla. Sokat ügyesedett, amióta nem láttam.</span>
<ul><li>Igekötős igék: megügyesedik.
</li><li>ügyesedés; ügyesedett; ügyesedő.
</li></ul></div>
