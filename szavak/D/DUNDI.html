DUNDI  melléknév és főnév (<span style="color:green;font-weight:bold">bizalmas</span>)
<ul><li>I. melléknév Pufók, gömbölyded, egészségesen kövérkés &lt;gyermek, ill. ennek arca, végtagja&gt;. <span style="color:blue">Szép kis dundi gyerek; dundi arca, keze, lába van.</span>
</li><li>II. főnév -t, -ja Ilyen gyerek v. kis termetű, kövérkés, fiatal leány. <span style="color:blue">Oh te kis dundi.</span>
</li></ul></div>
