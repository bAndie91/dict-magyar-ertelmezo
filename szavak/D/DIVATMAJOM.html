DIVATMAJOM  főnév (<span style="color:green;font-weight:bold">gúnyos</span>)
A legújabb divat (2) szerint, feltűnő, rikító módon öltözködő személy, főként férfi; divatbáb, piperkőc, jampec. <span style="color:blue">Ostoba divatmajom. Így csak a divatmajmok öltözködnek.</span>
