DACOLÁS  főnév -t, -ok, -a
A dacol igével kifejezett cselekvés, magatartás; az a tény, hogy vki dacol vkivel, vmivel; makacskodás, ellenszegülés. <span style="color:blue">A hatósági intézkedésekkel való dacolás súlyos következményekkel jár.</span> □ Csák Máté büszkesége, Petrőczy dacolása  kel és száll itt örökké. (Jókai Mór)
