DUGVÁNY  főnév -t, -ok, -a (<span style="color:green;font-weight:bold">kertészet</span>)
A magról nehezen szaporodó növényről lemetszett, életképes ág, hajtás, vessző, amely elültetve gyökeret ereszt, s új növénnyé fejlődik. <span style="color:blue">A szőlőt dugvánnyal szaporítják.</span>
<ul><li>Szóösszetétel(ek): dugvány-cukorrépa; dugványinda.
</li><li>dugványos.
</li></ul></div>
