DRUSZA  főnév druszát, druszája (<span style="color:green;font-weight:bold">bizalmas</span>)
&lt;A beszélővel v. a szóban forgó személlyel&gt; azonos keresztnevű ember, főleg férfi. <span style="color:blue">Hogy vagy, druszám? A druszád is eljött. Druszák vagyunk.</span> □ Ejnye no  kiáltott fel a bakter.  Kelmed az, Bokros druszám? (Mikszáth Kálmán)
