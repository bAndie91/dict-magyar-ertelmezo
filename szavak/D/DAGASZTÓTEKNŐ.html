DAGASZTÓTEKNŐ  főnév
Kenyérsütésnél használt teknő, melyben a kenyér tésztáját dagasztják és kelesztik. <span style="color:blue">A dagasztóteknőben dagasztja a kenyeret.</span> □ A dagasztó tekenőjét adja ide kelmed. (Arany János) A parasztasszonyok ott hagyták a dagasztóteknőt. (Mikszáth Kálmán)
