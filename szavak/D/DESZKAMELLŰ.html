DESZKAMELLŰ  [ë-e] melléknév (<span style="color:green;font-weight:bold">bizalmas</span>, kissé <span style="color:green;font-weight:bold">gúnyos</span>)
Lapos, fejletlen mellű &lt;nő&gt;. □ A fekete éjszaka jött is, azaz csak csoszogott egy deszkamellű öreg, pápaszemes német gouvernante [= nevelőnő] képében. (Mikszáth Kálmán)
