DÜLMIRIGY  főnév (<span style="color:green;font-weight:bold">orvostudomány</span>)
A hím emlősállatok és a férfi húgyhólyagjának nyílásánál levő (embernél gesztenye nagyságú és alakú) belső mirigy, amelynek váladéka az ondósejtek mozgását segíti elő; prosztata. <span style="color:blue">A dülmirigy gyulladása, túltengése.</span>
