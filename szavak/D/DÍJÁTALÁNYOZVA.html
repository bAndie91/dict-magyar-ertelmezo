DÍJÁTALÁNYOZVA  [j-á] határozószó (<span style="color:green;font-weight:bold">postaügy</span>)
Olyan módon, hogy a feladó (közület) havonta átalányban bérmentesíti összes levélpostai jellegű küldeményeit. <span style="color:blue">Díjátalányozva érkezett. A hivatal díjátalányozva adja fel postáját.</span>
