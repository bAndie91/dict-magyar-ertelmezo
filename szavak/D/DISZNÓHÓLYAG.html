DISZNÓHÓLYAG  főnév
<ul><li>1. A disznó hugyhólyagja.
</li><li>2. (<span style="color:green;font-weight:bold">régies</span>) Az ebből készült, dohány v. pénz tartására való, használt zacskó. <span style="color:blue">Elővette a disznóhólyagot és megtömte pipáját.</span> □ Kihúzott egy disznóhólyagot, akkora csimbókkal, mint egy pogácsaalma, a padlózat alul. (Mikszáth Kálmán)
</li></ul></div>
