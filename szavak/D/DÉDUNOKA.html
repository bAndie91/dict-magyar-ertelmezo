DÉDUNOKA  [d-u] főnév
A harmadfokú leszármazott, az unoka gyermeke &lt;a dédszülő(k)höz való viszonyában&gt;. <span style="color:blue">A nagymamám még megérte dédunokája születését.</span> □ Kezén fogta dédunokáját. (Herczeg Ferenc)
<ul><li>dédunokai; dédunokás.
