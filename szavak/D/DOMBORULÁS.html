DOMBORULÁS  főnév -t, (-ok), -a (<span style="color:green;font-weight:bold">ritka</span>)
A domborul igével kifejezett folyamat, ill. főként állapot, helyzet; az a tény, hogy vmi domborul; domborodás. <span style="color:blue">A kabát mellrészének domborulása. A föld enyhe domborulása jelezte, hol ásták el a ládát.</span>
<ul><li>domborulási.
