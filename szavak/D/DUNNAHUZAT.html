DUNNAHUZAT  főnév dunyhahuzat
A dunyhának vászonból v. ritk. más szövött anyagból való, egyik keskeny oldalán összevarratlanul hagyott s gombokkal zárható külső burkolata, huzata; dunnahéj. <span style="color:blue">Fehér, tarka dunnahuzat; lehúzza a dunnahuzatot.</span>
