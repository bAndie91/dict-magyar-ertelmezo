DESZKAFAL  főnév
Rendsz. favázra egy- v. kétsorosan ráerősített deszkákból álló fal; főleg helyiségek elválasztására v. kerítésül haszn. <span style="color:blue">Belső, külső deszkafal; vékony deszkafal. A termet deszkafallal ketté választották.</span>
<ul><li>deszkafalas; deszkafalú.
</li></ul></div>
