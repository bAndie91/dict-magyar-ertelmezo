DUGA [2]  főnév dugát, dugája (<span style="color:green;font-weight:bold">tájszó</span>)
<ul><li>1. Kis gát, töltés; a patak vizének egy ponton való elzárása és elvezetése.
</li><li>2. A halászásnak egyik módja; a vizet a patakból oldalt kivezetik, és a halakat a kiszáradt patak fenekén összefogdossák; rablóhalászat.
</li></ul></div>
