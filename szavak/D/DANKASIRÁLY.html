DANKASIRÁLY  főnév (<span style="color:green;font-weight:bold">állattan</span>)
A sirályok rendjébe tartozó, majdnem varjú nagyságú, nagyobb vizeinken élő, nádasainkban közönséges költöző madár; háta halvány kékes, hasa, szárnya és farka fehér; főleg rovarokkal táplálkozik (Larus ridibundus).
<ul><li>dankasirályos.
</li></ul></div>
