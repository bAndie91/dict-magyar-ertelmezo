DICSŐSÉGVÁGY  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Az az ösztönző törekvés, hogy vki a társadalom elismerését kiérdemelje, kimagasló teljesítményével, szereplésével v. kiváló magatartásával hírnevet szerezzen magának, dicsőséget arasson; dicsvágy, dicsszomj. <span style="color:blue">A dicsőségvágy sarkallta tetteiben.</span>
</div>
