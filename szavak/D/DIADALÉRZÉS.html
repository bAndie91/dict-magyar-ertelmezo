DIADALÉRZÉS  [l-é] főnév (<span style="color:green;font-weight:bold">választékos</span>)
A diadalnak (12), a sikernek kivívásán érzett büszke öröm; diadalérzet. <span style="color:blue">Még él szívében a diadalérzés.</span> □ Kádas elbeszélte diadalérzéssel Az álarcosak mit tettek a vitézzel. (Arany János)
