DIVATHÖLGY  főnév (gyak. <span style="color:green;font-weight:bold">rosszalló</span>)
Olyan nő, aki mindig a legújabb divat szerint öltözik, akinek fő gondja a divat, a társasági élet. □ Első gavallérja a fővárosnak, felesége divathölgy. (Jókai Mór) Varrjuk a divathölgy ruháját, |  bérünk van, nincsen örömünk. (József Attila)
