DERŰRE-BORÚRA  [e-e] határozószó (<span style="color:green;font-weight:bold">rosszalló</span>)
A szükségesnél gyakrabban és megfontolás nélkül; unos-untalan és bolondjában. <span style="color:blue">Vásárol derűre-borúra, csak úgy dobálja a pénzt.</span> □ Némely ember derűre-borúra csak is-t ír, oda is, hová egyszerű csak kellene. (Arany János)
</div>
