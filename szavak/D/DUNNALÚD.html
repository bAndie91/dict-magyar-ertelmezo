DUNNALÚD  főnév (<span style="color:green;font-weight:bold">állattan</span>)
A lúdfélék családjába tartozó, északon honos tengeri madár (Somateria mollissima); rendkívül finom pehelytollát ágynemű töltésére használják.
<ul><li>Szóösszetétel(ek): dunnalúdpehely.
</li></ul></div>
