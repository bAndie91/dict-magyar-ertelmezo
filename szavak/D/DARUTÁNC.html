DARUTÁNC  főnév (<span style="color:green;font-weight:bold">néprajz</span>)
Játékos székely tánc, melyben a legények egymás mögé sorban állnak, s az előtáncos kígyózó vonalban seprűvel v. csomóba kötött kendővel ütögetve kergeti az utolsó táncost. □ Emlékszem parasztlakodalmakból egy táncra, darutáncnak hívták. (Arany János)
