DÖNTVÉNY  főnév -t, -ek, -e [ë, e] (<span style="color:green;font-weight:bold">jogtudomány</span>, <span style="color:green;font-weight:bold">1945 előtt</span>)
A legfelsőbb bíróság által vmely peres v. jogi ügy eldöntése során hozott elvi jelentőségű határozat, amely kötelező irányelv volt az alsó fokú bíróságok számára. <span style="color:blue">A Kúria jogegységi döntvénye.</span>
<ul><li>Szóösszetétel(ek): döntvényjog.
