DRÓTAKADÁLY  [t-a] főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Bakokra v. karókra erősített szögesdrótból álló akadály, fonadék az ellenséges gyalogság feltartóztatására. <span style="color:blue">A lövészárok előtt drótakadály húzódott. A gyalogságnak ötszörös drótakadályon kellett áttörnie.</span>
<ul><li>drótakadályos.
</li></ul></div>
