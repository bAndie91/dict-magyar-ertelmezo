DÖBÖZ  főnév -t, -ök, -e [e] (<span style="color:green;font-weight:bold">elavult</span>, <span style="color:green;font-weight:bold">tájszó</span>)
Rendsz. fából, fakéregből, háncsból készült kisebb hengeres v. hordó alakú fedeles edény, túró, dohány, paprika, lekvár tartására. □ Fain jó verpeléti van a döbözben. (Jókai Mór)
