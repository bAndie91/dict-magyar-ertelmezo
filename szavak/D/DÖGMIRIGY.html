DÖGMIRIGY  főnév (csak egyes számban) (<span style="color:green;font-weight:bold">régies</span>)
A mirigyeket megtámadó pusztító járvány; pestis, döghalál, dögvész. □ Még alig 17 éves [korában], veszté el dögmirigyben szüléit. (Jósika Miklós) A labancok a dögmirigy miatt kénytelenül kitakarodtak. (Jókai Mór)
