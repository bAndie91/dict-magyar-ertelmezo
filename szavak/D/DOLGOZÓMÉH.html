DOLGOZÓMÉH  főnév (<span style="color:green;font-weight:bold">állattan</span>)
Petét nem rakó, meddő nőstény méh, mely a méhek társadalmában a méz és virágpor gyűjtését és a lép építéséhez szükséges viasz készítését végzi. <span style="color:blue">A dolgozóméhek táplálják és nevelik a méhcsaládot.</span>
