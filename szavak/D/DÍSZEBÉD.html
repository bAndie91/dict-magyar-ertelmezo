DÍSZEBÉD  [sz-e] főnév
Vki(k)nek, vminek tiszteletére, emlékére rendezett ünnepélyes ebéd. <span style="color:blue">A küldöttséget díszebéddel fogadták.</span> □ Nagy díszebédet rendeztünk tiszteletökre. (Jókai Mór) Ki mondaná azokat a csodaszép toasztokat a díszebédeknél  (Mikszáth Kálmán)
