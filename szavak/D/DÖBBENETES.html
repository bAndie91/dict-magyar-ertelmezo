DÖBBENETES  [e-e-ë] melléknév -en, -ebb [e, e] (<span style="color:green;font-weight:bold">választékos</span>)
Döbbenetet keltő, megdöbbentő, megrázó. <span style="color:blue">Döbbenetes esemény, látvány.</span> □ Az orvosi mesterségnek sok döbbenetes szomorúsága van, de akad benne megannyi vidámság is. (Kosztolányi Dezső)
