DÉLSZLÁV  [l-sz] főnév és melléknév
<ul><li>I. főnév <span style="color:blue">A délszlávok:</span> zömükben a Jugoszlávia területén élő szláv népek együttvéve.
</li><li>II. melléknév A délszlávokhoz tartozó, rájuk jellemző, tőlük származó, velük kapcs. <span style="color:blue">Délszláv irodalom; délszláv népek; délszláv népviseletek.</span>
</li></ul></div>
