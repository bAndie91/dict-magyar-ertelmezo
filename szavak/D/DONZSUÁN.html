DONZSUÁN  főnév -t, -ok, -ja (<span style="color:green;font-weight:bold">választékos</span>)
A nőkre nagy hatással levő, hódító férfi; vakmerő, veszedelmes, lelkiismeretlen nőcsábító, aki mindig új meg új hódításokra tör; nőcsábász, szoknyavadász. <span style="color:blue">A donzsuán gyakran szerepel a színműirodalomban.</span>
<ul><li>donzsuáni; donzsuánkodik; donzsuánság.
