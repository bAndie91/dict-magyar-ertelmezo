DÉLELŐTTI  [l-e] melléknév
Reggel és dél közötti, délelőtt levő &lt;idő, időszak&gt;. <span style="color:blue">A kora délelőtti órákban.</span> □ Enyingre délelőtti tíz órakor érkezett. (Vas Gereben) || a. Délelőtt előforduló, történő, délelőtt végzett &lt;esemény, ill. cselekvés&gt;. <span style="color:blue">Délelőtti séta, munka.</span>
