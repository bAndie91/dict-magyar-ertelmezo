DOSZTIG * határozószó (főleg mondat végén, toldásszerűen) (<span style="color:green;font-weight:bold">bizalmas</span>)
Mértéken felül, fölös mennyiségben; jóllakásig, untig. <span style="color:blue">Van belőle dosztig. Eszik dosztig. Volt ott ennivaló dosztig. Dosztig van vmely dologgal:</span> most már elege van belőle; torkig van vele. □ Ma együtt iszunk dosztig. (Jókai Mór)
