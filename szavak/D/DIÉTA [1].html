DIÉTA [1]  főnév diétát, diétája
Különleges egészségügyi szempontok szerint összeállított étrend. → <span style="color:blue">Epés diéta; diétát tart:</span> vmilyen étrend szerint él. □ Egy heti diétát tartottam. (Herczeg Ferenc) [Az új étrend] óriási haladás volt az elmúlt hetek diétája után. (Hunyady Sándor)
