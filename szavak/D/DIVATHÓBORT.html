DIVATHÓBORT  főnév
Célszerűtlen, feltűnő, furcsa divat, az uralkodó divat értelmetlen túlzása. <span style="color:blue">Az akkori viselet divathóbortja.</span> □ [Hadat üzentek a] bizarr divathóbortoknak, mik a merészben, a kirívóban, az érzék-ingerlőben  keresték a divat változatait. (Jókai Mór)
