DÍSZSÍRHELY  [sz-s] főnév
Különleges érdemeket szerzett kiváló személyiség holtteste számára a hatóság által kijelölt és ingyen átengedett temetkezési hely a temető vmelyik főútvonala mentén v. más szembetűnő pontján. <span style="color:blue">A főváros díszsírhelyet adományozott a költőnek.</span>
<ul><li>díszsírhelyes; díszsírhelyi.
</li></ul></div>
