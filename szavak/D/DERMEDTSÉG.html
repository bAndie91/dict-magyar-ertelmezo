DERMEDTSÉG  [dermetség v. dermeccség] főnév -et, -e [ë, e] (csak egyes számban)
A dermedt (1, 2) melléknévvel kifejezett állapot; vkinek, vminek ilyen volta. <span style="color:blue">Fagyos dermedtség; a tagok, az izmok dermedtsége; a megrémült emberek dermedtsége; dermedtségéből felocsúdik.</span>
</div>
