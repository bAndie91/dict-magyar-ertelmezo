HEPEHUPA  [e-e] főnév ..át, ..ája (<span style="color:green;font-weight:bold">hangfestő</span>)
Buckák és kisebb gödrök váltakozása vmely területen, ill. útszakaszon. □ Elkezdtek az ingovány mohos hepehupái között a lidércek táncolni. (Jókai Mór) [Jókai leendő kertje] most csupa szikla, csupa hasadék, hepehupa. (Mikszáth Kálmán)
