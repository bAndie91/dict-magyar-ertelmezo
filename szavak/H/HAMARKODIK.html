HAMARKODIK  tárgyatlan ige -ott, -jék (-jon) (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Meggondolatlanul, hirtelenkedve, kapkodva cselekszik, tesz vmit, ill. így működik. □ A fül második Érzés [= érzék], gyakran hibáz, hamarkodik. (Arany János)
<ul><li>Igekötős igék: elhamarkodik.
</li><li>hamarkodás; hamarkodó.
</li></ul></div>
