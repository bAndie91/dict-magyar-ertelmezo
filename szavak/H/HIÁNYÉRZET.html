HIÁNYÉRZET  [ny-é] főnév
Olyan nyugtalanító, izgató, pontosan meg nem határozható, látszólag megokolatlan érzés, amely rendsz. csak vmely tárgy bírása, vmely kívánság kielégítése után szűnik meg. □ Ha így, felfokozott igényekkel kívánom a regényt, akkor hiányérzetem marad a könyv után. (Nagy Lajos)
