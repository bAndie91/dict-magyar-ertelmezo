HÖLGYKOSZORÚ  főnév (<span style="color:green;font-weight:bold">választékos</span>, <span style="color:green;font-weight:bold">tréfás</span>)
Nőkből álló nagyobb társaság, nők csoportja egy társaságban. <span style="color:blue">Díszes hölgykoszorú.</span> □ A mi hercegünk  közönyösen lépett a hölgykoszorú közé. (Jókai Mór) A második kupát a hölgykoszorúért ürítettük. (Krúdy Gyula)
