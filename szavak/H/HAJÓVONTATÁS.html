HAJÓVONTATÁS  főnév
Nem önmagától haladó hajó, uszály vontatása, elöl ráerősített (drót)kötéllel, egy másik (vontató)hajó v. a parton haladó gépjármű, lovak v. emberek által. <span style="color:blue">Motoros hajóvontatás; hajóvontatás lovakkal; hajóvontatás a Volgán. Az emberi erővel való hajóvontatás rabszolgamunka volt.</span>
