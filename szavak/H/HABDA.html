HABDA  főnév habdát, habdája (<span style="color:green;font-weight:bold">tájszó</span>)
<ul><li>1. Bakancs v. bocskor fölött viselt, csőszerű, a csizmaszárra emlékeztető, bőr lábszárvédő.
</li><li>2. (<span style="color:green;font-weight:bold">ritka</span>) Idomtalanul nagy, hosszú szárú, bő csizma. □ [A fullajtárnak] nagy, combszárig [= térden felül] érő habdái voltak, felkötött sarkantyúval. (Jókai Mór)
</li></ul></div>
