HABKŐ  főnév (<span style="color:green;font-weight:bold">ásványtan</span>)
Selymesen fehér v. szürke, finoman likacsos, üvegszerű vulkáni eredetű kőzet v. ehhez hasonló jellegű készítmény, amelyet csiszolásra használnak. <span style="color:blue">Mesterséges habkő:</span> őrölt kvarc és homok égetett keveréke.
