HADMÉRNÖK  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Mérnöki oklevelet szerzett olyan katonatiszt, akinek feladata, hogy a honvédelem műszaki munkálatait (erődítés, út-, híd-, repülőtér-építés stb.) irányítsa.
<ul><li>hadmérnöki; hadmérnökség.
</li></ul></div>
