HÓSÁRMÁNY  főnév (<span style="color:green;font-weight:bold">állattan</span>)
A pintyfélék családjába tartozó madár; nyáron hófehér, csak dolmánya, némely evezőtolla és középső farktolla fekete, télen ezek közül némelyek fahéj színűek v. rozsdasárgák (Passerina nivalis). <span style="color:blue">A hósármány nálunk csak téli vendég.</span>
