HANGUTÁNZÓ  [g-u] melléknév (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
Olyan &lt;nyelvi kifejezés, kül. szó&gt;, amely vmely természeti jelenség, folyamat, cselekvés, történés hangját, ill. állati, emberi hangot artikulált hanggal igyekszik utánozni (pl. cuppog, locsog, kakukk, pitypalatty stb.).
