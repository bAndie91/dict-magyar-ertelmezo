HULLÁMSÍR  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Mély, nagy víz, amelybe vki belefulladt, vmi elsüllyedt. <span style="color:blue">A hullámsírban pihen.</span> □ Hullámsír temeti A kincset és hajót. (Vörösmarty Mihály) Ott a diadal mámorában, az ünnepség fénykörében  zuhantak a hullámsírba. (Jókai Mór)
