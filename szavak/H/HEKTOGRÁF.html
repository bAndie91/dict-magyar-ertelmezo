HEKTOGRÁF  [ë] főnév -ot, -ja (<span style="color:green;font-weight:bold">régies</span>)
Régi fajta sokszorosító készülék; a különleges tintával írt v. rajzolt eredetiről zselatinréteg közvetítésével készítettek rajta levonatokat.
<ul><li>Szóösszetétel(ek): hektográflemez; hektográflevonat; hektográftinta.
</li><li>hektografál; hektográfos.
</li></ul></div>
