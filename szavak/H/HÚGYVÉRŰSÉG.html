HÚGYVÉRŰSÉG  főnév -et, -e [ë, e] (<span style="color:green;font-weight:bold">orvostudomány</span>)
A vesének abból eredő megbetegedése, hogy azok az anyagok, amelyeket rendes körülmények között a vese vizelet formájában választ ki, a vérben maradnak, s ott mérgező hatást fejtenek ki (uraemia).
