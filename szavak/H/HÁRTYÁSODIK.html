HÁRTYÁSODIK  tárgyatlan ige -ott, -jék (-jon) (csak 3. személyben)
Egyre hártyásabb lesz, hártya képződik rajta. <span style="color:blue">Hártyásodik a jég, a tej, a víz.</span>
<ul><li>Igekötős igék: behártyásodik; meghártyásodik.
</li><li>hártyásodás; hártyásodó.
</li></ul></div>
