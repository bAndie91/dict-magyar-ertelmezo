HITÁGAZAT  [t-á] főnév (<span style="color:green;font-weight:bold">vallásügy</span>)
&lt;Főleg katolikusoknál&gt; a tételes hitvallás egy-egy összefüggő része, fejezete, szakasza; hitcikkely. □ Hitágazatokat illetőleg, felekezetekre oszlott a keresztyén társadalom. (Eötvös József)
