HARCMÓD  főnév
A harc vívásának vmely korra, közösségre, személyre stb. jellemző módja; harcmodor. <span style="color:blue">A régi magyarok harcmódja. Ez a harcmód nagyon régi.</span> □ Befészkeled  magad a legfőbbek bizalmába  s kitudod országuk titkait,  harcmódjukat. (Jókai Mór)
