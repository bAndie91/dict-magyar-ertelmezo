HŐSCINCÉR  főnév (<span style="color:green;font-weight:bold">állattan</span>)
A cincérek családjába tartozó, kb. 5 cm nagy, fekete színű, hosszú csápú, karcsú alakú, főleg tölgyesekben élő kártékony növényevő bogár (Cerambys cerdo). □ Nyíl koccant ablakomnak  Zsupsz! Tán szárnyas skorpiót | vertem le?  Nem: hőscincért! ragyogót! (Szabó Lőrinc)
