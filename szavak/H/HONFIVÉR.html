HONFIVÉR  főnév (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">költői</span>)
Vkinek hazájáért kihullott, kiontott vére. □ Vért piroslik hősi arculatja, Honfivért a kardnak markolatja. (Vörösmarty Mihály) Van-e ott folyó és földje jó? Legelőin fű kövér? Használt-e a megöntözés: A pártos honfivér? (Arany János)
