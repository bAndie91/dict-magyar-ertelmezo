HÚGYKŐ  főnév (<span style="color:green;font-weight:bold">orvostudomány</span>)
A vizeletben oldott anyagokból kóros körülmények között a vesemedencében, a húgyhólyagban v. a húgycsőben lecsapódó, néha ököl nagyságúra megnövő képződmény; vesekő. <span style="color:blue">A húgykövet, ha nagy, műtéttel kell eltávolítani.</span>
<ul><li>Szóösszetétel(ek): húgykő-operáció.
</li><li>húgyköves.
</li></ul></div>
