HONFIBÚ  főnév (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">költői</span>)
A haza sorsa miatt érzett aggodalom, keserűség, bánat. □ A honfibú, mely elzsibbaszta minket, Tenálad munkás fájdalom leve. (Arany János) Oh aki érze honfibút a férfi, Azt már nagyobb bú a földön nem éri. (Madách Imre)
