HATTYÚPRÉM  [ú-p] főnév (<span style="color:green;font-weight:bold">régies</span>)
A hattyú tollas bőréből cserzés útján készült, a régi időkben nagyra becsült prém; főleg női ruházat díszítésére használták. □ Vállán fehér bársony panyóka kacagány hattyúprémmel. (Jókai Mór)
