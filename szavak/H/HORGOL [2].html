HORGOL [2]  tárgyas ige -t, -jon (<span style="color:green;font-weight:bold">népies</span>)
Vkit rendsz. ingerelve, bosszantva zavarba próbál ejteni, zaklat; hergel. □ Nyáron a déli pihenőkön, télen a búbos mellett előre kieszelt számokkal horgolja a fiát. (Gárdonyi Géza)
