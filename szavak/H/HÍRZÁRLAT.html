HÍRZÁRLAT  főnév (<span style="color:green;font-weight:bold">hivatalos</span>)
Egyes hadi fontosságú v. államérdeket érintő eseményekről, ill. eljárásokról szóló híranyag nyilvánosságra hozatalának a kormány v. vmely szerve részéről történő megtiltása. <span style="color:blue">Hírzárlatot rendeltek el.</span>
