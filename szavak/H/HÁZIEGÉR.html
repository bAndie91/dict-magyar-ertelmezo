HÁZIEGÉR  főnév (<span style="color:green;font-weight:bold">állattan</span>)
A rágcsálók rendjébe tartozó, kis, káros emlősállat; háta (egér)szürke, hasa világosabb, sárgásbarna; farka kb. a feje és a teste hosszával egyenlő; vegyes táplálékon él (lakásokban, malmokban, raktárakban stb.) (Mus musculus). <span style="color:blue">A háziegér szapora állat.</span>
