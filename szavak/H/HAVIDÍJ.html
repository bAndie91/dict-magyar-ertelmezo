HAVIDÍJ  főnév (<span style="color:green;font-weight:bold">régies</span>)
Munkavállalónak előre megállapított összegű fizetése, amelyet havonta kap, ill. ennek egy hónapra szóló összege; havibér. □ Egy  főtiszt egy nyitott láda mellett állt, melyből az utolsó havidíjat osztá a távozóknak. (Jókai Mór)
