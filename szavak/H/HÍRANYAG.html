HÍRANYAG  [r-a] főnév (<span style="color:green;font-weight:bold">hírlapírás</span>)
A hírszerző, híradó, hírterjesztő, tájékoztató szolgálatok, szervezetek tevékenységének anyagát adó, vmely szempontból egységet alkotó hírek összessége. <span style="color:blue">Kőnyomatos híranyag. Gazdag az újság híranyaga. A kémek híranyagot juttattak el megbízóiknak.</span>
