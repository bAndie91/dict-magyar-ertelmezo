HALÁLESET  [l-e] főnév (<span style="color:green;font-weight:bold">hivatalos</span>, <span style="color:green;font-weight:bold">választékos</span>)
Az az esemény, hogy vki meghal(t); vkinek a halála. <span style="color:blue">Több haláleset volt a családban.</span> □ Mindenki a halálesetről beszélt a faluban. (Mikszáth Kálmán)
<ul><li>Szóösszetétel(ek): haláleset-felvétel.
</li></ul></div>
