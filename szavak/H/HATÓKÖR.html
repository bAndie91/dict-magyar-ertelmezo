HATÓKÖR  főnév (rendsz. birtokos személyraggal) (<span style="color:green;font-weight:bold">választékos</span>)
Az a terület, kör, amelyen belül vmely tevékenységnek, főleg hatóerőnek, hatóképességnek a hatása még érvényesül. <span style="color:blue">A robbanás hatóköre. A folyóirat hatóköre csekély volt.</span>
<ul><li>hatóköri; hatókörös; hatókörű.
