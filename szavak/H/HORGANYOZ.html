HORGANYOZ  tárgyas ige -tam, -ott, -zon
Azzal van elfoglalva v. az a foglalkozása, hogy horgannyal, cinkkel bevon vmit. <span style="color:blue">Gépalkatrészt, kanalat, lábost horganyoz.</span>
<ul><li>Igekötős igék: behorganyoz; meghorganyoz.
</li><li>horganyozás; horganyozó; horganyozott; horganyoztat.
</li></ul></div>
