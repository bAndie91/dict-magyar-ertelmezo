HEGYZUG  főnév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Hegyek közé benyúló, nehezen hozzáférhető, szűk völgy. <span style="color:blue">Barátságtalan, elhagyatott, kies, sötét hegyzug.</span> □ Valahol a negyedik-ötödik megyében lehet az a menhely;  olyan hegyzugban, ahova csak egy helyen van bejárás. (Jókai Mór)
