HONVÉDSEREG  főnév (<span style="color:green;font-weight:bold">régies</span>)
A honvédségnek egy nagyobb egysége; honvédekből álló sereg. □ [Eszék] védelmére ott van egy jókora honvédsereg. (Jókai Mór) A honvédsereg  elpusztult, a szent ügy  elbukott. (Eötvös Károly)
