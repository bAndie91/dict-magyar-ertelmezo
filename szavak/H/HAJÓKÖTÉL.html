HAJÓKÖTÉL  főnév
Hajókon haszn., kender- v. drótszálból álló, többszörös sodrású, erős, nagyon vastag kötél. □ Az apját leütötte a hajókötél, a vízbe fulladt. (Jókai Mór) Jó nagy izmok vannak a karjaikban, olyanok, hogy azok már igazán beillenének hajókötélnek. (Tömörkény István)
