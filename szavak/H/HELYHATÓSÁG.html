HELYHATÓSÁG  főnév (<span style="color:green;font-weight:bold">hivatalos</span>)
Olyan hatóság, amelynek működési köre, ill. hatásköre az ország területének csak egy részére (község, járás, város, megye stb.) terjed ki. □ E jogot kétféleképpen gyakorolták: az országgyűlésen és a helyhatóságban, azaz a megyékben. (Vas Gereben)
<ul><li>helyhatósági.
