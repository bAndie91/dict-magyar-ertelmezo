HAJFONAT  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Hajból font fonadék; varkocs, copf. <span style="color:blue">Egyágú, kétágú hajfonat; vastag hajfonatok.</span> □ A gazdag hajfonat észbontón himbálózott a nyaka körül. (Mikszáth Kálmán) Két kis szöszke hajfonata röpköd a nyakán. (Gárdonyi Géza)
<ul><li>hajfonatos; hajfonatú.
