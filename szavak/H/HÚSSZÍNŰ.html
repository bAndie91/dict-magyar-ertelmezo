HÚSSZÍNŰ  [s-sz] melléknév
A friss, nyers állati hús (1) színére emlékeztető, halványvörös(es) színű. <span style="color:blue">Hússzínű festék, ruha.</span> □ Sovány és vékony arcú lány volt, halvány hússzínű bőre volt, s finom szája és igen okos szeme. (Móricz Zsigmond)
