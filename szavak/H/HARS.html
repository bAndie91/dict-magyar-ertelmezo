HARS  melléknév (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">költői</span>)
Harsány, harsogó, erős hangon szóló. □ Mári szolgálónk, a néma, Hirtelen, hars nótákat dalolt: Különös, Különös nyár-éjszaka volt. (Ady Endre) Hangok játéka is vonzott:  hars kukurikú | hajnal előtt, tavi békazene. (Szabó Lőrinc)
