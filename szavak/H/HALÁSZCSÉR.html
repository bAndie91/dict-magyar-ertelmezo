HALÁSZCSÉR  főnév (<span style="color:green;font-weight:bold">állattan</span>)
A sirályok rendjébe tartozó, rigó nagyságú, de hosszú szárnya és farka miatt nagyobbnak látszó, fekete fejű, vörös csőrű és lábú, kék és fehér testű halászó madár (Sterna hirundo); halászka.
