HEGYOLDAL  [gy-o] főnév
A hegy felszínének a hegycsúcs és a hegyláb között elterülő része. <span style="color:blue">Erdős, lejtős, meredek, sziklás hegyoldal. A hegyoldal tele van szőlővel. Lejtős hegyoldalon kígyózik az út.</span> □ A hátamon | vittem fel egyszer a hegyoldalon | egy beteget. (Szabó Lőrinc)
<ul><li>hegyoldali.
