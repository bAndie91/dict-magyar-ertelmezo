HORGÁSZZSINEG  [sz-zs] főnév
A horgászbot végéhez rögzített v. a boton levő orsóra feltekerhető vékony, erős zsineg v. selyemből, erős, rugalmas műanyagból készült hosszú zsinór. <span style="color:blue">A horgászzsineg végén függ a horog. A horgász a menekülő hal után eresztette a horgászzsineget.</span>
