HANGUGRATÁS  [g-u] (<span style="color:green;font-weight:bold">nyelvtudomány</span>, <span style="color:green;font-weight:bold">régies</span>)
A szó hangalakjának ragozás v. képzés közben történő olyan változása, melynek során a két mássalhangzó közt levő magánhangzó kiesik. <span style="color:blue">A "bokor" szó tárgyragos alakja hangugratással "bokrot".</span>
