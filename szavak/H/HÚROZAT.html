HÚROZAT  főnév -ot, -a
Vmely eszközre, rendsz. sokhúrú hangszerrel felszerelt húrok összessége; húrozás (2). <span style="color:blue">A cimbalom, a hárfa, a zongora húrozata; a teniszütő húrozata. Erre a hangszerre új húrozat kell. A pianínó egész húrozata lehangolódott.</span>
