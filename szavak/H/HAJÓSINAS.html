HAJÓSINAS  [s-i] főnév
<ul><li>1. (<span style="color:green;font-weight:bold">régies</span>) Olyan 1417 éves fiú, aki kereskedelmi v. iskolahajón gyakorlati úton készül hajósnak, matróznak.
</li><li>2. Olyan kamaszkorban levő fiú, aki vmely kereskedelmi hajón mindenféle kisegítő munkát végez.
</li><li>hajósinasi; hajósinaskodik.
</li></ul></div>
