HIÚZ  főnév -t, -ok, -a
A macskával rokon, de annál nagyobb, rövid farkú, hosszú lábú ragadozó állat; fülén szőrpamat, pofáján dús barkó van (Lynx). <span style="color:blue">Kanadai, közönséges, mocsári, sivatagi hiúz.</span>
<ul><li>Szóösszetétel(ek): hiúzprém.
</li></ul></div>
