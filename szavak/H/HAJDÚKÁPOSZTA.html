HAJDÚKÁPOSZTA  főnév (<span style="color:green;font-weight:bold">tájszó</span>)
Rétegesen rakott, párolt savanyú káposztából, füstölt szalonnából, sült húsból, kolbászból paprikásan, tejfölösen készített s lábasban megsütött étel. □ Sütöttem egy kis kolbászt hajdúkáposztával. (Tolnai Lajos)
