HAJPOROS  melléknév (<span style="color:green;font-weight:bold">régies</span>)
Hajporral behintett v. olyan, amire hajpor került. <span style="color:blue">Hajporos paróka.</span> || a. Olyan &lt;személy&gt;, akinek haja hajporral van behintve. <span style="color:blue">Hajporos gavallér.</span> □ Burnótos [szelencéje]  fedelére egy hajporos dáma volt festve. (Mikszáth Kálmán)
