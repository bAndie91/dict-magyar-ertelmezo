HUSZÁRLÓ  főnév
Katonai, főleg lovassági szolgálatra haszn. szilaj, gyors, fegyelmezett hátasló. <span style="color:blue">Kivénhedt huszárló. Az egykori huszárló felfigyelt a trombita hangjára.</span> □ Ha nem jó a rúd mellett kocsis lónak, még mindig jó lesz huszárlónak. (Eötvös Károly)
