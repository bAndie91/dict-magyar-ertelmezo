HISZEKEGY  [hiszëkëggy; k-e] főnév -et, -e [e, e] (csak egyes számban) (<span style="color:green;font-weight:bold">vallásügy</span>)
A kereszténység "Hiszek egy Istenben" kezdetű hitvallása; apostoli hitvallás. □ A "Hiszekegy" ugyanaz a kálvinistának, ami a pápistának, a lutheránusnak, a görögnek. (Jókai Mór)
