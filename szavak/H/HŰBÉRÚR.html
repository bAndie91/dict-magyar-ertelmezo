HŰBÉRÚR  [r-ú] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
A hűbérbirtok tulajdonosa, akinek hűbérese v. jobbágya van; feudális földesúr. <span style="color:blue">Hatalmaskodó hűbérúr.</span> □ A vértanúk vetését a hűbérurak aratták. (Juhász Gyula)
