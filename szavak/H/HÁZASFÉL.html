HÁZASFÉL  főnév (<span style="color:green;font-weight:bold">hivatalos</span>)
A házastársak közül az egyik; a férj, ill. a feleség. <span style="color:blue">A bíróság mindkét házasfelet meghallgatta.</span> □ Kiengesztelődéssel  végezték be a házasfelek a komoran indult vitatkozásukat. (Tolnai Lajos)
