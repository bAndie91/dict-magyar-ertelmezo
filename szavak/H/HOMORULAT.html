HOMORULAT  főnév -ot, -a
Vmely test, tárgy felületének befelé görbülése, öblös bemélyedése. <span style="color:blue">A dagasztóteknő, az üst homorulata.</span> □ Újra megindult a munka;  nagy kőmedencék lőnek [= lettek] vésve a sziklák homorulatán. (Jókai Mór)
<ul><li>Szóösszetétel(ek): homorulatsimító.
