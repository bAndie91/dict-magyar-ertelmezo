HELYREÁLL  tárgyatlan ige
Megrongált állapotából ismét rendes, megszokott állapotába kerül, v. megszakadt folyamata újra megindul. <span style="color:blue">Helyreáll a béke; helyreáll vkinek az egészsége; helyreáll az egyensúly, a rend, a termelés.</span>
<ul><li>helyreállás; helyreálló; helyreállott.
</li></ul></div>
