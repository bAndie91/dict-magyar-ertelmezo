HANGYÁSZ  főnév -t, -ok, -a (<span style="color:green;font-weight:bold">állattan</span>)
A foghíjasok rendjébe tartozó, hosszú nyelvű dél-amerikai emlősállat, amely hangyákkal és termeszekkel táplálkozik. || a. Az ilyen és az ezekhez hasonló foghíjasokat magába foglaló állatnem (Myrmecophaga).
<ul><li>Szóösszetétel(ek): hangyászmedve; hangyászsün.
