HABKÖNNYŰ  melléknév (<span style="color:green;font-weight:bold">választékos</span>)
Olyan lenge, finom, könnyű, mint a hab. <span style="color:blue">Habkönnyű selyemruha.</span> □ A jelmez  arany csillagokkal átszőtt, habkönnyű ruha, mely minden mozdulatnál az idomhoz simul. (Jókai Mór) || a. Nagyon finom, könnyű &lt;ételféle, sütemény&gt;. <span style="color:blue">Habkönnyű felfújt, piskóta.</span>
