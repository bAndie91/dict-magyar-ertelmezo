<div class="szocikk">
HAZAKÉREDZKEDIK  tárgyatlan ige hazakérezkedik
Kéri, hogy engedjék haza, ill. kérésével eléri, hogy hazaengedik. <span style="color:blue">Öt óra után hazakéredzkedik. A gyerek rosszul volt, hazakéredzkedett.</span>
<ul><li>hazakéredzkedés; hazakéredzkedett; hazakéredzkedő.
</li></ul></div>
