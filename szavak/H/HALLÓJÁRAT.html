HALLÓJÁRAT  főnév (<span style="color:green;font-weight:bold">bonctan</span>)
A fülnek a fülkagylóból befelé vezető csatornája. <span style="color:blue">Külső hallójárat:</span> a dobhártyáig vezető csatorna, amely a hanghullámokat továbbítja; <span style="color:blue">belső hallójárat:</span> a fül belsejében a hallóideget magába záró csatorna.
