HOMOKSIVATAG  főnév
Futóhomokkal borított, nagy kiterjedésű, terméketlen terület; homokos sivatag. <span style="color:blue">A homoksivatagban utazó karavánt sok veszély fenyegeti.</span> || a. (<span style="color:green;font-weight:bold">átvitt értelemben</span>) □ E kellemes oáz, homoksivatagok közt,  illő  [Orczyhoz] s költészetéhez. (Arany János)
