HEGYES [1]  [ë-e] melléknév -en, -ebb [e, e]
Olyan &lt;tájék, terület&gt;, amely hegyekben bővelkedik, ahol hegyek vannak. <span style="color:blue">Hegyes vidék.</span> □ A sziget áldott volt  | Képe hasonlító egy kis földi világhoz: Itt hegyes, ott völgyes. (Vörösmarty Mihály)
<ul><li>Szóösszetétel(ek): hegyes-völgyes.
