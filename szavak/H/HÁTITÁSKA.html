HÁTITÁSKA  főnév
Az iskolás gyermekeknek háton hordott, bőrrel v. vászonnal bevont kemény kartonból való táskája könyvek, írószerek számára. □ [A gyereket] iskolába adtam. Az is valami nagy érzés volt, mikor hátitáskát vettem neki és palatáblát. (Gárdonyi Géza)
<ul><li>hátitáskájú; hátitáskás.
