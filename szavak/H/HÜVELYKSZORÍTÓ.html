HÜVELYKSZORÍTÓ  főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
Középkori kínzószerszám; a vallatott személy hüvelykujjának összeszorítására való, rendsz. vasból készült eszköz, melyet addig csavartak egyre szűkebbre, míg az illető vallomást nem tett; hüvelykcsavar.
