Hazaszeretet, honszeretet. □ [Liszt Ferenchez.] És ha honszerelmet költenél fel,  Zengj nekünk hatalmas húrjaiddal, Hogy szivekbe menjen által a dal. (Vörösmarty Mihály) Csak mécsvilágom s honszerelmem ég. (Petőfi Sándor)
