<div class="szocikk">
HALŐR  [l-ő] főnév
&lt;Halgazdaságokban&gt; az az alkalmazott, akinek feladata a halak etetése, szaporítása, teleltetése és egyéb szükséges gyakorlati munkák végzése, azonkívül a halállománynak orvhalászoktól való megvédése. <span style="color:blue">A halőr megetette a pontyokat.</span>
<ul><li>halőri; halőrködik; halőrség.
</li></ul></div>
