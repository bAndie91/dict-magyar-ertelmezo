HAJADONFŐTT  határozószó
Fedetlen fejjel, kalap, fejkendő v. sapka nélkül. <span style="color:blue">Hajadonfőtt jár az utcán.</span> □ A kegyes atya  még mindig egészséges. Hajadonfőtt járt most is a szabadban. (Jókai Mór) Ott állt  hajadonfőtt, zúzmarás hajával, sárga bőrű, kis horpadt koponyájával. (Kosztolányi Dezső)
