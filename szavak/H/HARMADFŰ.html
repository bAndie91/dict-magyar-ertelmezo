HARMADFŰ  melléknév (<span style="color:green;font-weight:bold">népies</span>)
Harmadik évében levő, harmadéves &lt;csikó, borjú&gt;. <span style="color:blue">Harmadfű borjú, csikó, tinó, üsző.</span> □ És szívem tombol, mint a harmadfü csikó, ha A pányvás kötelet legelőször dobja nyakába A pásztor. (Petőfi Sándor) A lógós mégcsak harmadfű csikó. (Jókai Mór)
