HÚGYSAV  főnév (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Fehér, kristályos, savas vegyület; az emberi és az állati szervezetben az anyagcsere folyamatának terméke, amely a vizeletben ürül ki, de a vér, az epe, a nyál is tartalmazza, és felszaporodása különféle betegségeket okozhat (Acidum uricum, H4C5N4O3).
<ul><li>húgysavas.
</li></ul></div>
