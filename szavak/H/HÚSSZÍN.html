HÚSSZÍN  [s-sz] főnév és melléknév
<ul><li>I. főnév A friss, nyers állati hús (1) színére emlékeztető, halványvörös(es) szín. <span style="color:blue">Sokan nem szeretik a hússzínt. Sikerült jó hússzínt kikevernie.</span>
</li><li>II. melléknév Hússzínű. <span style="color:blue">Hússzín ing, ruha, sál.</span>
</li></ul></div>
