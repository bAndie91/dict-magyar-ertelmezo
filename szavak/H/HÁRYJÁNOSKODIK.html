HÁRYJÁNOSKODIK  [hárijánoskodik] tárgyatlan ige -tam, -ott, -jék (-jon) (<span style="color:green;font-weight:bold">gúnyos</span>)
Kitalált v. mértéktelenül felhagyított élményekkel, sikerekkel, főleg hadi tettekkel nagy hangon (gyakran) dicsekszik. <span style="color:blue">Ugyan mit háryjánoskodsz már megint!</span>
<ul><li>háryjánoskodás; háryjánoskodó.
</li></ul></div>
