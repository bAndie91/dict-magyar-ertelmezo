HARMATFŰ  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
Tőzegmohás lápokban tenyésző, apró évelő növény, amely bíborpiros mirigyszőreinek harmatként csillogó, ragadós váladékával a rászálló rovarokat fogva tartja, lágy részeiket feloldja és elszívja (Drosera rotundifolia).
