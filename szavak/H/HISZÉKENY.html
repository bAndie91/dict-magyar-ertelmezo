HISZÉKENY  [ë] melléknév -en, -ebb [e, e]
Olyan &lt;személy&gt;, aki bármiben könnyen hisz, akit könnyű félrevezetni. <span style="color:blue">Hiszékeny nő, vevő. Becsapja a hiszékeny embereket.</span> □ Ignácius,  te ma is a régi könnyelmű, hiszékeny, ábrándos férfiú vagy. (Krúdy Gyula)
