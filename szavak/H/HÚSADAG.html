HÚSADAG  [s-a] főnév
<ul><li>1. Vmely húsételből egy-egy főre jutó adag. <span style="color:blue">Mindenki megkapta a húsadagját.</span>
</li><li>2. &lt;Kötött élelmiszer-forgalom idején&gt; a húsból vmely meghatározott időre (egy-egy hónapra, hétre, napra) egy főre megállapított mennyiség.
</li></ul></div>
