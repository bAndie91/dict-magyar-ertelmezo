HOMLOKÜREG  [k-ü] főnév (<span style="color:green;font-weight:bold">bonctan</span>)
Az orrüreggel szűk csatornán át közlekedő, nyálkahártyával borított páros üreg a homlokcsontok között. <span style="color:blue">A homloküreg hűléses megbetegedése gyakori.</span>
<ul><li>Szóösszetétel(ek): homloküreg-gyulladás.
</li></ul></div>
