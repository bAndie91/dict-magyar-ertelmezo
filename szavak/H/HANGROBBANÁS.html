HANGROBBANÁS  főnév (<span style="color:green;font-weight:bold">repülés</span>, <span style="color:green;font-weight:bold">1945 után</span>)
A hang terjedésénél sebesebben haladó repülőgéptől előidézett robbanásszerű hang; akkor keletkezik, ha a hang terjedésének sebességét éppen átlépő repülőgéptől előzőleg és pillanatnyilag kibocsátott hanghullámok azonos fázisban találkoznak.
