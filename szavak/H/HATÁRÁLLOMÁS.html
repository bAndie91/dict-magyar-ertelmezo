<div class="szocikk">
HATÁRÁLLOMÁS  [r-á] főnév (<span style="color:green;font-weight:bold">közlekedés</span>)
Vmely ország határán levő v. a határhoz legközelebb eső vasúti v. hajóállomás, ahol a szomszédos ország közlekedési vonalai csatlakoznak, s ahol rendsz. az útlevél- és vámvizsgálatot bonyolítják le. <span style="color:blue">A határállomáson történt meg a vámvizsgálat.</span>
</div>
