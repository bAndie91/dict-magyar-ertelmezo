HAJTŰKANYAR  főnév (<span style="color:green;font-weight:bold">közlekedés</span>)
A hajtű behajlására emlékeztető éles kanyar, amely után az út következő szakasza a kanyar előtti résszel csaknem párhuzamosan folytatódik visszafelé. <span style="color:blue">Veszedelmes hajtűkanyar. A hegyi út tele van hajtűkanyarokkal.</span>
