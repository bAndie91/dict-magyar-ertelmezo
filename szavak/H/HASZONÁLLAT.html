<div class="szocikk">
HASZONÁLLAT  [n-á] főnév (<span style="color:green;font-weight:bold">állattenyésztés</span>)
Olyan háziállat, amelyet az ember azért tart, mert húsa v. vmely terméke (pl. prémje, teje) hasznot hajt neki. <span style="color:blue">A házinyúl, a juh, a sertés haszonállat; a haszonállatok összeírása.</span>
<ul><li>Szóösszetétel(ek): haszonállat-összeírás; haszonállattartás.
</li></ul></div>
