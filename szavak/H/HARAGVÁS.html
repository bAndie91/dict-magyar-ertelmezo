HARAGVÁS  főnév -t, (-ok), -a (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
A haragszik igével kifejezett lelki folyamat, állapot, magatartás; az a tény, hogy vki haragszik; harag. □ [Ady emlékezete.] Meghalt? Hát akkor  Mért békítik a símák alattomba | lány-duzzogássá haragvásait? (József Attila)
