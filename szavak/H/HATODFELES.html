HATODFELES  melléknév (<span style="color:green;font-weight:bold">irodalomtudomány</span>)
Öt teljes és egy csonka lábból álló &lt;jambikus lejtésű sor&gt;, amelyben az ötödik láb mindig jambus, az előző lábakban előfordulhat spondeus is. (Pl.: Egy szó || nyilal || lott a || hazán || keresz || tül). <span style="color:blue">Hatodfeles jambus, sor.</span>
