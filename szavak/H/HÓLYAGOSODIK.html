HÓLYAGOSODIK  tárgyatlan ige -ott, -jék (-jon) (csak 3. személyben)
Hólyagossá (1, 3) v. egyre hólyagosabbá válik. <span style="color:blue">Már hólyagosodik a gyerek leforrázott keze. A felvert tészta kezd hólyagosodni.</span>
<ul><li>Igekötős igék: felhólyagosodik; kihólyagosodik; meghólyagosodik.
</li><li>hólyagosodás; hólyagosodó.
</li></ul></div>
