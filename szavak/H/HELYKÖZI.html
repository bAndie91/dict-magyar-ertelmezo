HELYKÖZI  melléknév (<span style="color:green;font-weight:bold">hivatalos</span>)
Rendsz. egymástól távolabb eső, közigazgatási szempontból különböző helyek, helységek között fennálló, történő; nem helyi. <span style="color:blue">Helyközi forgalom, járat; helyközi telefonbeszélgetés; helyközi telefonhálózat.</span>
