HOLTELEVEN  [t-e] melléknév (<span style="color:green;font-weight:bold">régies</span>)
Olyan &lt;személy&gt;, aki nagyon megijedt, megrémült; se holt, se eleven. <span style="color:blue">Holtelevenné vált, mikor a rossz hírt meghallotta.</span> □ Toldi riadtában majd holteleven lett. (Arany János)
