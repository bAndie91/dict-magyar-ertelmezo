HOMOKFUTÓ  főnév (<span style="color:green;font-weight:bold">elavulóban</span>)
Magas, négykerekű, rugós, fedetlen, egyszerű, rövidebb útra haszn. személyszállító lovas kocsi; cséza. <span style="color:blue">Homokfutóján meglátogatta a szomszéd falu orvosát.</span> □ Kis sárga homokfutóval indulnak Bántelekre. (Nagy Lajos)
