HŐVEZETŐ  melléknév és főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>, <span style="color:green;font-weight:bold">fizika</span>)
Olyan (anyag), amely könnyen átveszi s gyorsan és könnyen továbbterjeszti vmely vele érintkező test, anyag, hőforrás hőjét, hőfokát. <span style="color:blue">Hővezető anyagok. A bőr rossz hővezető. A vas jó hővezető.</span>
