HÁTGERINCSORVADÁS  [c-s] főnév (<span style="color:green;font-weight:bold">orvostudomány</span>)
A gerincvelőnek rendsz. vérbajos fertőzésből eredő megbetegedése, sorvadása, amely járási, látási, egyensúlyi, nemi zavarokat, végül teljes elsenyvedést és halált okoz (Tabes dorsalis); tábesz.
<ul><li>hátgerincsorvadási; hátgerincsorvadásos.
</li></ul></div>
