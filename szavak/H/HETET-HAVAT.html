HETET-HAVAT  [e-e] főnév (csak ebben a tárgyragos alakban)
Válogatás nélkül mindent, mindenfélét összevissza. <span style="color:blue">Hetet-havat ígér; hetet-havat (össze)beszél, összehord, felhoz.</span> □ Az öreg hallgatta,  mintha mondaná: hát csak beszélj, hetet-havat, ami neked tetszik. (Mikszáth Kálmán)
