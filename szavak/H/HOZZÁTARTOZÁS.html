HOZZÁTARTOZÁS  főnév -t, -a (csak egyes számban) (<span style="color:green;font-weight:bold">ritka</span>)
A hozzátartozik igével kifejezett állapot, viszony; az a tény, hogy vki, vmi hozzátartozik vkihez, vmihez. <span style="color:blue">A gyermekek hozzátartozása szüleikhez; a kis tányérok hozzátartozása az étkészlethez.</span>
