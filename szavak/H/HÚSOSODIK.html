HÚSOSODIK  tárgyatlan ige -tam, -ott, -jék (-jon)
Vmi, ritk. vki húsossá (főként I. 2) válik, kövéredik, hízik. <span style="color:blue">A gyümölcs húsosodik. A disznó hamar húsosodik, ha jól etetik.</span>
<ul><li>Igekötős igék: meghúsosodik.
</li><li>húsosodás; húsosodó.
</li></ul></div>
