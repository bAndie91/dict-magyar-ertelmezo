HALLÓKÉPESSÉG  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Vmely élőlénynek, főként az embernek az a képessége, hogy hall; a hallószervnek, a fülnek hangfelfogó képessége; hallás. <span style="color:blue">Csökkent, gyengült, kifinomult, megromlott hallóképesség. Hallóképességét elveszette. Gyenge a hallóképessége.</span>
