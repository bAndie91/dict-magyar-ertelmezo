HALÁLTÁBOR  főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
A német fasizmus alatt fennállott olyan gyűjtőtábor, amelyben a fasizmus üldözöttjeit, az ártatlan milliókat nagyüzemi módszerekkel pusztították el, irtották ki. <span style="color:blue">Az auschwitzi haláltábor.</span>
