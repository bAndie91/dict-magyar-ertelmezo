HÁTFAL  főnév (<span style="color:green;font-weight:bold">ritka</span> v. <span style="color:green;font-weight:bold">műszaki nyelv</span>)
Az a fal, amely hátul van, vminek a hátulját alkotja; hátsó fal, hátulsó fal. <span style="color:blue">Az épület, a fiók, a szekrény hátfala.</span> □ A nagy király sokszor ájtatoskodott ez egyházban: bizonyságul itt van a templomi széke, a hátfalába vésett címerével. (Jókai Mór)
