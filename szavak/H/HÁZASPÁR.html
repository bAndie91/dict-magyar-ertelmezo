HÁZASPÁR  főnév
Férj és feleség együtt. <span style="color:blue">Boldog, fiatal, gyermektelen, öreg házaspár.</span> □ Tizenhét esztendős mult a gazda épen, Tizennégy az anyjok  Ilyen egy házaspár összeillik szépen. (Arany János) Itt távol tájkép, tóval a hegyekkel,  És rajta házaspár, sok víg gyerekkel. (Juhász Gyula)
