<ul><li>1. &lt;Hízásra fogott állat&gt; hasat ereszt, nő a hasa. <span style="color:blue">Már hasasodik a malaca.</span>
</li><li>2. <span style="color:blue">Hasasodik vmi,</span> (<span style="color:green;font-weight:bold">népies</span>, <span style="color:green;font-weight:bold">durva</span>) <span style="color:blue">vki:</span> vemhes állat, ill. terhes nő hasa feltűnően nő. <span style="color:blue">Már hasasodik a Riska.</span>
</li><li>Igekötős igék: meghasasodik.
</li><li>hasasodás; hasasodó.
</li></ul></div>
