HŐPALACK  főnév
Szigetelőanyagból készült védőtartóban elhelyezett, kettős falú, légmentesen zárható fém- v. üvegpalack, amelyben a beléje töltött ital v. étel egy napig is megtartja eredeti hőfokát; termosz. <span style="color:blue">A kirándulásra egy-egy hőpalackban kávét és teát vitt.</span>
