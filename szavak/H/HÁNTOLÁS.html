HÁNTOLÁS  főnév -t, -a (csak egyes számban)
A hántol igével kifejezett eljárás, művelet; az a cselekvés, hogy szemes terményt, főleg rizst v. kölest, héjától megfosztanak, hántolnak. <span style="color:blue">A hántolást manapság jobbára gépekkel végzik.</span>
