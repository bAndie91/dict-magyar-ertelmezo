HAJTŰ  főnév
Szaruból, celluloidból v. fémből készült, rendsz. U alakú v. tűhöz hasonló kis eszköz, amelyet a női haj feltűzésére, rendben tartására használnak. <span style="color:blue">Manapság egyre ritkul a hajtű használata.</span> □ A dús,  jószagú hajban meg kellett igazítani a török ékköves hajtűt. (Krúdy Gyula)
