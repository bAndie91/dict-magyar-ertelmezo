<ul><li>1. &lt;Zeneműben&gt; az a szólam, amelyet a zenekarban v. kisebb hangszeres együttesben egy v. több hegedűn adnak elő.
</li><li>2. (<span style="color:green;font-weight:bold">bizalmas</span>) &lt;Hangszeres együttesben&gt; az a csoport, amelynek tagjai hegedűn játszanak. <span style="color:blue">Ma nem hiányzik senki a hegedűszólamből.</span>
</li></ul></div>
