HALLÉPCSŐ  főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
A folyók medrét elzáró duzzasztóművekbe épített kisebb esésű és sodrú, sekélyebb vizű csatorna, amelyben a halak víz ellenében is úszhatnak, s ezáltal a kettéosztott folyóágban való mozgásuk biztosítva van; hallétra.
<ul><li>hallépcsős.
</li></ul></div>
