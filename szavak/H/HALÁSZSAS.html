HALÁSZSAS  [sz-s] főnév (<span style="color:green;font-weight:bold">állattan</span>)
A sólyomfélék családjába tartozó, hallal táplálkozó ragadozó madár (Pandion haliaëtus). □ A halászsas le-lecsap egy kövér potyka után. (Jókai Mór) Káka tövén rucacsalád lapul össze, amikor a körben csavargó halászsas árnyéka átsuhan felette. (Bársony István)
