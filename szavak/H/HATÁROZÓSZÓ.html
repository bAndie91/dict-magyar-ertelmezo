HATÁROZÓSZÓ  főnév (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
Az a szófaj, ill. szó, amely helyet, időt v. egyéb körülményt (állapotot, módot, okot stb.) jelent, s a mondatban  rendsz. változatlan alakban  határozóként haszn. (ilyen pl. elöl, hanyatt, így, itt, most). → <span style="color:blue">Kérdő határozószó; mutató, vonatkozó határozószó.</span>
