HÚSIPAROS  [s-i] főnév (<span style="color:green;font-weight:bold">1945 előtt</span>, <span style="color:green;font-weight:bold">hivatalos</span>)
Az állati húsnak (1) emberi fogyasztásra való előkészítésével v. alkalmassá tételével, feldolgozásával foglalkozó kisiparos, v. húsáruk árusításával foglalkozó kiskereskedő. <span style="color:blue">A mészárosokat és henteseket közös néven húsiparosoknak hívták.</span>
