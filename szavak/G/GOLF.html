GOLF  főnév -ot, -ja (csak egyes számban) (<span style="color:green;font-weight:bold">sport</span>)
Olyan labdajáték, amelyben egy kis tömör gumilabdát botforma ütővel a szabad természetet utánzó területen a földön bizonyos távolságra levő kis lyukakba ütnek. <span style="color:blue">Golfot játszik.</span>
<ul><li>Szóösszetétel(ek): golfjáték; golfklub; golflabda; golfpálya; golfütő.
</li></ul></div>
