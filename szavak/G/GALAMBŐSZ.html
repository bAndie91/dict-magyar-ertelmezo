GALAMBŐSZ  [b-ő] melléknév
Olyan fehéren ősz &lt;személy, főként férfi, ill. fej, haj, szakáll&gt;, mint a fehér galamb tolla; teljesen ősz, tiszta ősz. □ Nagy szeget ütött ez a Bence fejébe. |  Csak nézett hol őrá, hol az ásott földre: | Vitéz Toldi Miklós galambősz fejére. (Arany János)
