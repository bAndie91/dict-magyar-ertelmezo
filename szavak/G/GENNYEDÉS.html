GENNYEDÉS  főnév -t, -e [e] (csak egyes számban)
A gennyed igével kifejezett folyamat; genny képződése (sebben, daganatban stb.); gennyesedés. <span style="color:blue">A fog, a seb gennyedése; gennyedésnek indul. A gennyedéstől megóvja a sebet.</span>
