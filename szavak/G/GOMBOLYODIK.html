GOMBOLYODIK  tárgyatlan ige -ott, -jék (-jon) (csak 3. személyben) (<span style="color:green;font-weight:bold">ritka</span>)
Vmi gombolyagba tekeredik, csavarodik, gombolyaggá alakul. <span style="color:blue">Nehezen gombolyodik ez a fonal.</span>
<ul><li>Igekötős igék: felgombolyodik; kigombolyodik; legombolyodik; összegombolyodik.
</li><li>gombolyodás; gombolyodó.
</li></ul></div>
