GÉPELEM  [e] [p-e] főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Azok közül az elemek, részek közül vmelyik, amelyekből gépek építhetők (pl. a csapágy, a csiga, a tengely stb.). <span style="color:blue">Összekötő, forgó, mozgást közvetítő gépelem; emelő- és szállítógépek, gőzgépek gépeleme; folyadékok vezetésére való gépelem.</span>
