GALÓCA [1]  főnév ..cát, ..cája (<span style="color:green;font-weight:bold">növénytan</span>)
Olyan mérges gomba, melynek kalapja ellaposodó félgömb, a kalap alsó részén levő lemezei fehérek v. sárgák. → <span style="color:blue">Légyölő galóca.</span>
<ul><li>Szóösszetétel(ek): galócafajta; galócafélék; galócapálinka.
</li></ul></div>
