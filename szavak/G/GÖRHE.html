GÖRHE  [e] főnév görhét, görhéje [e] (<span style="color:green;font-weight:bold">tájszó</span>)
Kukoricalisztből készült száraz, porhanyós pogácsa v. lepényforma sütemény. □ Hideg görhe fejezte be az ebédet. (Krúdy Gyula) Az ő görhéje jobb volt, mint másé. Kukoricapogácsa ez, de sokkal zsírosabban és édesebbre sütve, mint másé. (Móricz Zsigmond)
