<div class="szocikk">
GONDOLATÁTVITEL  [t-á] főnév (<span style="color:green;font-weight:bold">lélektan</span>)
Az a lelki jelenség, hogy egy személy a benne felmerült tudattartalmat egy másik, vele vhogyan (pl. kézfogással) kontaktusban álló, érzékeny idegrendszerű személynek eddig még fel nem derített módon átadja.
<ul><li>gondolatátviteles; gondolatátviteli.
</li></ul></div>
