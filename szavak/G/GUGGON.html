GUGGON  határozószó (rendsz. az ül igével kapcs.)
<ul><li>1. (<span style="color:green;font-weight:bold">ritka</span>) Guggoló helyzetben, guggolva. □ A piacon a guggon ülő kofák közt ácsorogtam. (Móra Ferenc) Guggon ülve figyelték, amint a lángok körülnyaldosták a kályhát. (Kosztolányi Dezső)
</li><li>2. <span style="color:blue">Guggon ülő:</span> nem futó, nem kúszó, törpe &lt;bab, tök&gt;.
</li></ul></div>
