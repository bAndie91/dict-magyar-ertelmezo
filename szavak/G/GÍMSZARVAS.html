GÍMSZARVAS  főnév (<span style="color:green;font-weight:bold">állattan</span>)
Nagy testű, barna szőrű, hegyvidéken, erdőkben élő, páros ujjú kérődző állat (Cervus elaphus); a hím fejét ágas-bogas agancs díszíti; szarvas. □ Mégis, mégis, ha reggel lett, A gímszarvast űzni kellett. (Arany János)
