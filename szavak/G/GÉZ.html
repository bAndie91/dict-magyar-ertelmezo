GÉZ  főnév -t, -ek, -e [ë, e]
Pamutból készült, igen ritka szövésű fehér köt(öző)szer; rendsz. 510 cm széles szalagokban tekercselve haszn. <span style="color:blue">Gézt tesz a sebre. Gézzel csavarta, kötötte körül a sebet.</span>
<ul><li>Szóösszetétel(ek): gézcsík; gézcsomag; gézpólya; géztekercs.
</li></ul></div>
