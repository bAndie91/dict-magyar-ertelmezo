GÖRL  főnév -t, -ök, (-je) [e]
Revükben, látványos operettekben szereplő kartáncosnő, akinek társnőivel együtt előadott táncát a gépiesen végzett mozdulatok jellemzik. <span style="color:blue">Görlnek szerződött. Gyönyörködött a görlök táncában.</span>
<ul><li>Szóösszetétel(ek): görlcsapat; görlcsoport.
</li></ul></div>
