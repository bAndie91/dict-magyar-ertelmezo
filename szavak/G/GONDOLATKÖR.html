GONDOLATKÖR  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Vmely nagyobb, fontosabb tárgyra vonatk. gondolatok, vele kapcs. eszmék összessége, zárt egészet alkotó egysége. <span style="color:blue">Egy gondolatkörben mozog. Nem tud kitörni a teológiai gondolatkörből.</span>
