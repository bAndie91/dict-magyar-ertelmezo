GULYÁS [1]  főnév -t, -ok, -a
A gulyát őrző pásztor. <span style="color:blue">Számadó gulyás.</span> □ Vén gulyás ül a karszéken  (Arany János) Az utcán már tülköl a kanász, utána nemsokára a gulyás. (Nagy Lajos)
<ul><li>Szóösszetétel(ek): 1. gulyásfiú; gulyáshajlék; gulyásház; gulyásszámadó; gulyástanya. 2. fejőgulyás.
