GNOSZTICIZMUS  főnév -t, -a (csak egyes számban) (<span style="color:green;font-weight:bold">filozófia</span>)
Az a filozófiai irány, amely időszámításunk első századaiban a keresztény vallás, bizonyos keleti vallások és görög filozófiai irányok tanaiból keletkezett, s a jó és rossz küzdelmét és a megismerés magasabb fokát hirdette.
