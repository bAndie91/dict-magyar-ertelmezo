GOHÉR  főnév -t, (-ok), -ja góhér (<span style="color:green;font-weight:bold">szőlészet</span>)
Ma már ritkábban termesztett, laza fürtű, hosszúkás bogyójú, korai csemegeszőlő. <span style="color:blue">Fehér, fekete gohér.</span> □ Setétűl a setét góhér a vesszőkön, Barna színt vér [= ver] vissza a többi szőlőkön. (Csokonai Vitéz Mihály)
