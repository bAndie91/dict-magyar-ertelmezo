GABONATERMÉS  főnév
Egy bizonyos idő, rendsz. egy év alatt termett gabona. <span style="color:blue">Bőséges, gazdag, jó gabonatermés; gyenge, rossz gabonatermés. Jó gabonatermést várhatunk.</span> □ A májusi hő napokra  következni fognak a késői fagyok, s Dagő sziget egész gabonatermése egy éjszaka oda lesz. (Jókai Mór)
