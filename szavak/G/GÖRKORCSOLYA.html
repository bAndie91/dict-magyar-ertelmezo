GÖRKORCSOLYA  főnév
A korcsolyához hasonlóan lábra csatolható, nálunk főleg játékszerként használt eszköz, melynek a talp alatt lévő négy apró kereke sima, kemény talajon gyorsan gördül; kerekes korcsolya. <span style="color:blue">Görkorcsolyát kapott ajándékba.</span>
<ul><li>görkorcsolyás; görkorcsolyázik.
