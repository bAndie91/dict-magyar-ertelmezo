GONDOLATPÁRHUZAM  főnév (<span style="color:green;font-weight:bold">irodalomtudomány</span>)
A gondolatritmusnak az a faja, amelyben egymással rokon gondolatok párhuzamos felépítésben követik egymást. <span style="color:blue">Gondolatpárhuzam van Arany Toldijának következő soraiban: Akkor is oly csendes, méla éjszaka volt, Akkor is oly tisztán csillogott le a hold.</span>
