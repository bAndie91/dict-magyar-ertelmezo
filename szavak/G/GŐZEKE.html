GŐZEKE  [z-e] főnév (<span style="color:green;font-weight:bold">elavulóban</span>)
<ul><li>1. Egyszerre több barázdát szántó különleges szerkezetű nagy eke, melyet rendsz. két gőzgép (lokomobil) acélsodronykötélen vontat fel és alá a szántóföldön.
</li><li>2. &lt;Laza szóhasználatban:&gt; az ilyen eke vontatására való gőzhajtású lokomobil.
</li><li>gőzekés.
</li></ul></div>
