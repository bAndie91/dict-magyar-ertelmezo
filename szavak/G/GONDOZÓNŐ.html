GONDOZÓNŐ  főnév (<span style="color:green;font-weight:bold">egészségügy</span>)
Szakképzettséget szerzett nő, aki vmely egészségvédelmi intézmény alkalmazottjaként tanácsadással, főleg csecsemők, gyermekek v. bizonyos betegségekben szenvedők egészségügyi felügyeletével foglalkozik.
<ul><li>Szóösszetétel(ek): gyermekgondozónő.
</li><li>gondozónői.
