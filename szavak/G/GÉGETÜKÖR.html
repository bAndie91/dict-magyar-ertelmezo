GÉGETÜKÖR  főnév (<span style="color:green;font-weight:bold">orvostudomány</span>)
A garat (1) mélyére bocsátható csőszerű, tükrös szerkezet, amely a villanyfénnyel megvilágított gége(fő), légcső v. nyelőcső közvetlen megszemlélését, vizsgálatát lehetővé teszi. <span style="color:blue">A gégetükör segítségével tanulmányozták először a hangképzést.</span>
