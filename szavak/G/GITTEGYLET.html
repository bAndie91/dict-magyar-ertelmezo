GITTEGYLET  [t-e] főnév (<span style="color:green;font-weight:bold">gúnyos</span>)
Fölöslegesen alakult, jelentéktelen ügyekkel foglalkozó kis egyesület, szervezet. <span style="color:blue">Valami gittegylet elnöke.</span> || a. (<span style="color:green;font-weight:bold">rosszalló</span>) Fontoskodó, de komoly ügyintézésre képtelen szervezet, intézmény. <span style="color:blue">Ehhez a gittegylethez fordultam, de semmit se tettek.</span>
