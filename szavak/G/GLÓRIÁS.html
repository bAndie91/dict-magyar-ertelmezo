GLÓRIÁS  melléknév -an, -abb
<ul><li>1. Fején glóriával ékesített &lt;képzeletbeli személy v. képe, ill. szobra&gt;. <span style="color:blue">Glóriás alak, angyal, szent.</span>
</li><li>2. (<span style="color:green;font-weight:bold">költői</span>) <span style="color:blue">Glóriásan:</span> dicsőséggel, dicsfénnyel övezetten. □ S mielőtt a régi mód letűnne, Már összefogva az új itt áll Glóriásan és fölkészülve. (Ady Endre)
</li></ul></div>
