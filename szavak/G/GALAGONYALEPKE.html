GALAGONYALEPKE  főnév (<span style="color:green;font-weight:bold">állattan</span>)
Közepes nagyságú fehér lepke, szárnyának fekete erezete élesen rajzolt; hernyói galagonyabokrokon, gyümölcsfákon élnek (Aporia crataegi). <span style="color:blue">A galagonyalepke hernyója sok kárt tesz a gyümölcsösben.</span>
