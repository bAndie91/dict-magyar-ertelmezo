GÖMBHÁROMSZÖG  főnév (<span style="color:green;font-weight:bold">mértan</span>)
A gömb felületének az a része, melyet a gömb középpontján keresztülmenő három, egymást metsző sík vág ki a gömb felszínéből.
<ul><li>Szóösszetétel(ek): gömbháromszögtan; gömbháromszögtani.
</li></ul></div>
