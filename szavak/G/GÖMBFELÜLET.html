GÖMBFELÜLET  főnév (<span style="color:green;font-weight:bold">mértan</span>)
Olyan görbe felület, amelyet az átmérője körül teljes fordulatot tevő félkör alkot, s amelynek minden pontja a gömb középpontjától egyenlő távolságra van; a gömb felülete.
<ul><li>gömbfelületi; gömbfelületű.
</li></ul></div>
