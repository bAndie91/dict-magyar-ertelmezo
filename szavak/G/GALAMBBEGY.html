GALAMBBEGY  főnév
<ul><li>1. Bokros, füves helyeken tenyésző egyéves növény; hosszúkás, keskeny levele, apró, tölcséres, lilás virága van; madársaláta (Valerianella). <span style="color:blue">Fogas, koronás, saláta galambbegy.</span>
</li><li>2. Ennek salátaként fogyasztott levele.
</li><li>Szóösszetétel(ek): galambbegysaláta.
</li></ul></div>
