GÖMBVILLÁM  főnév (<span style="color:green;font-weight:bold">légkörtan</span>)
Villámláskor keletkező, ritkán előforduló jelenség: 130 cm átmérőjű fényes gömb, tkp. elektromos állapotban levő, erősen izzó, nagy csattanással, gyorsan megsemmisülő levegőtömeg. <span style="color:blue">Lebegő gömbvillám.</span>
