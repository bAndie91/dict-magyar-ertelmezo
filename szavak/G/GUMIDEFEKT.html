GUMIDEFEKT  főnév
A gépjármű felfújt gumiabroncsának a továbbhaladást akadályozó megsérülése, kilyukadása, defektje. <span style="color:blue">Gumidefekt miatt késett az autó.</span> □ Az országúton egy  teherautó vesztegel,  alkalmasint gumidefektje van. (Herczeg Ferenc)
