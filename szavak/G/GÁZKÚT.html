GÁZKÚT  főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Éghető gáz (földgáz) felszínre hozatalára a föld mélyébe fúrt, keskeny csővezetékkel bélelt, elzáró és szabályozó műszaki berendezéssel ellátott lyuk. <span style="color:blue">A gázkút csapja. Új gázkutakat fúrtak.</span>
