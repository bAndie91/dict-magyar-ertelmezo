GUMIBOT  főnév
Kemény gumiból készült, kb. fél méter hosszú, rugalmas bot, melyet egyes államok rendőrsége fegyver helyett fenyítő eszközül használ. <span style="color:blue">A rendőrök gumibotokkal vonultak a sztrájk letörésére.</span> □ A rendőrök fölemelték rettentő rövid gumibotjukat. (Hunyady Sándor)
