GUILLOTINE  [gijotin] főnév guillotine-t, guillotine-ok, guillotine-ja (<span style="color:green;font-weight:bold">történettudomány</span>)
Nyaktiló. □ Midőn XVI. Lajost a guillotinhez vitték,  úgy hitte, hogy csak ijesztik. (Kazinczy Ferenc) Az erkély egy guillotine emelvényévé, az íróasztal nyaktilóvá [változik]. (Madách Imre)
