GONOSZTETT  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Gonosz indulatból fakadó, másnak súlyos kárt, sérelmet okozó cselekedet; gaztett. <span style="color:blue">Gonosztettéért meglakol; gonosztettet visz végbe. Nem hittem, hogy ilyen gonosztettre képes legyen.</span>
