GIDA  főnév gidát, gidája
Fiatal kecske. <span style="color:blue">Vidáman ugrándozik a kis gida.</span> || a. (<span style="color:green;font-weight:bold">vadászat</span>) Fiatal őz, ill. zerge. □ Az ura átöleli. Hosszú karjaival át meg átfonja, mint az óriáskígyó a gidát. (Móricz Zsigmond)
