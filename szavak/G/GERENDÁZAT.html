GERENDÁZAT  [ë-ë] főnév -ot, -a (<span style="color:green;font-weight:bold">építészet</span>)
Vmely szerkezetnek az a része, amely viszonylag sűrűn elhelyezett, beépített gerendákból áll. <span style="color:blue">A födém gerendázata elkészült.</span> □ Lámpavilág tört keresztül a gerendázat hasadékán. (Jókai Mór)
<ul><li>Szóösszetétel(ek): fedélgerendázat.
</li></ul></div>
