BÁRIUM  főnév -ot, -ja (csak egyes számban) (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Az alkálikus földfémek csoportjába tartozó kémiai elem; ezüstfehér, lágy fém (Ba). <span style="color:blue">A bárium oldható vegyületei erősen mérgezők.</span>
<ul><li>Szóösszetétel(ek): hidroxid; báriumkarbonát; báriumklorát; báriumklorid; báriumszulfát.
</li><li>báriumos.
</li></ul></div>
