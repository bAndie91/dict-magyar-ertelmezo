BÓLINTÁS  főnév -t, -ok, -a
A bólint (1) igével kifejezett cselekvés, mozdulat. <span style="color:blue">Bólintásával fejezte ki hozzájárulását.</span> □ Egy könnyű bólintással köszöné meg a koszorút. (Vas Gereben) Fölkeléssel és néma bólintással köszöntöttem. (Gárdonyi Géza)
<ul><li>Szóösszetétel(ek): fejbólintás.
</li></ul></div>
