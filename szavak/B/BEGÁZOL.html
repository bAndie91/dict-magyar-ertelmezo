BEGÁZOL  tárgyatlan ige
Benn levő helyre, ill. vminek a belsejébe gázol. <span style="color:blue">Begázolt a vízbe. A lovak begázoltak a kukorica közé.</span> □ Mentek  a legények a pocsétához,  s ott meglátva a kilátszó lófarkat, begázoltak. (Jókai Mór)
