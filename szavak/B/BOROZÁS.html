BOROZÁS  főnév -t, (-ok), -a
A boroz igével kifejezett cselekvés; iddogálás, borozgatás. <span style="color:blue">Meghitt társaságban való borozás. Vidám borozással telt az este.</span> □ Koronként csendes borozásban keresett szórakozást. (Gyulai Pál) A borozás iskoláját még a Bácskában tanulta ki. (Kuncz Aladár)
