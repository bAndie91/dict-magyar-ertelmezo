BÉROSZTÁLY  [r-o] főnév (<span style="color:green;font-weight:bold">hivatalos</span>)
<ul><li>1. Szakképzettség, ill. munkakör alapján megállapított bérezési osztály (5), kategória. <span style="color:blue">A második bérosztályba került.</span>
</li><li>2. Némely nagyobb intézménynek, üzemnek az az osztálya, amely az illető intézmény, üzem dolgozóinak bérezésével foglalkozik.
</li></ul></div>
