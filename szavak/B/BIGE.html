<div class="szocikk">
BIGE  [e] főnév bigét, bigéje [e], (<span style="color:green;font-weight:bold">tájszó</span>) pige (<span style="color:green;font-weight:bold">népies</span>)
Két végén hegyesre faragott arasznyi fadarab, amellyel úgy játszanak, hogy a földre fektetik, s egyik végét bottal megütik, ettől a levegőbe pattan, és akkor elütik, mint a labdát.
<ul><li>Szóösszetétel(ek): bigefa; bigeütő.
</li></ul></div>
