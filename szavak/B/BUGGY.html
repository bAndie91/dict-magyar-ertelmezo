BUGGY  főnév buggyot, buggya
A szabással létrehozott v. viselés közben keletkezett laza, gömbölyded kiöblösödés, kitüremlés &lt;ruhán, kül. női ruhán, blúzon&gt;. <span style="color:blue">Buggyot vet a blúz.</span> □ A nadrág  buggyot vetett a térdeken. (Gárdonyi Géza)
