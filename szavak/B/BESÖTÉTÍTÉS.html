BESÖTÉTÍTÉS  főnév -t, (-ek), -e [ë, e]
A besötétít igével kifejezett cselekvés, eljárás; az a cselekvés, hogy vmit besötétítenek; a napfény, világosság kirekesztése vhonnan. <span style="color:blue">A szoba, a terem besötétítése. A legyek ellen besötétítéssel védekeztek.</span>
</div>
