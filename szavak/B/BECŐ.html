BECŐ  [e] főnév -t, -je [e] (<span style="color:green;font-weight:bold">növénytan</span>)
A keresztes virágú növényeknek rekesszel kétfelé választott, száraz termése; éréskor felnyílik; rendsz. több keskeny, hosszúkás magot tartalmaz (siliqua). <span style="color:blue">A kelkáposzta, a repce becője.</span>
<ul><li>Szóösszetétel(ek): becőtermés.
</li><li>becőke; becős.
</li></ul></div>
