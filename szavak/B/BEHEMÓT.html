BEHEMÓT  [ë-ë] melléknév és főnév -ot, (-ja)
Ormótlanul, idomtalanul hatalmas termetű és esetlen, nehézkes mozgású (ember v. ritk. állat); óriás(i), monstrum. <span style="color:blue">Nagy behemót ember. A megvadult behemót állat rárohant a vadászra. Valósággal eltörpült egy ilyen behemót mellett.</span>
