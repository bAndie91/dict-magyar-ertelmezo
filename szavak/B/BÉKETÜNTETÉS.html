BÉKETÜNTETÉS  főnév (<span style="color:green;font-weight:bold">1945 után</span>)
A tömegek békeakaratának lelkes kinyilvánítása nagyarányú tüntetéssel, esetleg utcai felvonulással. <span style="color:blue">A békegyűlés hatalmas béketüntetéssé vált. A kongresszus fáklyás béketüntetéssel ért véget. Népünk béketüntetésekkel felelt a háborús bujtogatóknak.</span>
