BAJUSZOSODIK  tárgyatlan ige -tam, -ott, -jék (-jon)
<span style="color:blue">Vki bajuszosodik:</span> vkinek bajusza (első ízben) nőni kezd; serdülőkorban már nő a bajusza. <span style="color:blue">Ez a fiú még csak 15 éves, de már bajuszosodik.</span>
<ul><li>Igekötős igék: megbajuszosodik.
</li><li>bajuszosodás; bajuszosodó.
</li></ul></div>
