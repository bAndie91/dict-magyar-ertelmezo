BABASZOBA  főnév
Játékbáboknak berendezett, szoba alakját utánzó, egyik oldalán nyitott ládika, mint gyermekjáték. □ A szekrényen volt egy kis babaszoba: lombfűrészelt, fehérlakkos bútorok  kis nyoszolya, melynek piros selyempaplana alatt aludt egy hajasbaba. (Kosztolányi Dezső)
