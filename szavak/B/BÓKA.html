BÓKA  főnév bókát, bókája (<span style="color:green;font-weight:bold">növénytan</span>)
A hüvelyesek családjába tartozó növénynemzetség (Astragalus). || a. Ebbe a nemzetségbe tartozó, homokos pusztákon, füves lejtőkön, erdős, cserjés helyeken tenyésző növény. <span style="color:blue">Érdes, fehéres, gyapjas, száratlan, zászlós bóka.</span>
