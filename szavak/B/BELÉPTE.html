BELÉPTE  [e-e] főnév, (személyragos)
Az a tény, hogy vki belépett (1) vhova. <span style="color:blue">Beléptekor nagy csend támadt.</span> <span style="color:blue">Beléptemet senki sem vette észre.</span> □ A további beszédeket félbeszakítá Galban lovag belépte. (Jókai Mór) Ön  sokkal jobban áll, mint a színi világba beléptemkor állottam én. (Tolnai Lajos)
