BELETUD  tárgyas ige
<span style="color:blue">Beletud vmit vmibe:</span> mint tartozékát, alkotórészét beleszámítja vmibe, betud vmibe. <span style="color:blue">Ebbe az összegbe beletudjuk a múlt évi tartozást is.</span> □ Nyolc napi vacatióból, jövet-menetet belétudva, alig maradt volna egy pár nap együttlétünkre. (Arany János)
<ul><li>beletudható; beletudott.
