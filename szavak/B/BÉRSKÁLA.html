BÉRSKÁLA  [r-s] főnév (<span style="color:green;font-weight:bold">közgazdaságtan</span>)
Olyan munkabérrendszer, amelyben a magasabb képzettségnek v. nagyobb, jobb teljesítménynek arányosan több bér felel meg. → <span style="color:blue">Mozgó bérskála; progresszív, új bérskála. A bérskálát módosítják, változtatják.</span>
<ul><li>bérskálájú; bérskálás.
</li></ul></div>
