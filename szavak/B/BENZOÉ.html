BENZOÉ  [ë] főnév -t, -ja (csak egyes számban) (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Egy trópusi fa barnavörös, törékeny, kellemes, balzsamos illatú gyantája, melyet főleg az illatszergyártásban és a festékiparban használnak.
<ul><li>Szóösszetétel(ek): benzoéfa.
</li></ul></div>
