BELTENGER  főnév (<span style="color:green;font-weight:bold">földrajz</span>)
Szárazfölddel v. szigetekkel majdnem teljesen körülzárt tenger(rész), melyet csak (szűk) tengerszoros köt össze a nyílt tengerrel (pl. az Adriai-tenger, a Fekete-tenger, a Földközi-tenger, a Vörös-tenger). <span style="color:blue">Hazánk területén az őskorban beltenger volt.</span>
