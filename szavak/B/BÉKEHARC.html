BÉKEHARC  főnév (<span style="color:green;font-weight:bold">1945 után</span>)
A háborús uszítás ellen, a háború megakadályozására, a béke megvédéséért és biztosításáért kifejtett elszánt, céltudatos társadalmi és politikai tevékenység; békemozgalom. <span style="color:blue">A békeharc eredményei, sikerei, vezére, vezetője. Részt vesz a békeharcban.</span>
