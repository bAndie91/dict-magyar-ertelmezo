BEGYÖMÖSZÖL  tárgyas ige
<span style="color:blue">Vhova begyömöszöl vmit:</span> vminek a belsejébe v. vmely belül levő helyre gyömöszölve tesz, helyez vmit. <span style="color:blue">Úti táskájába begyömöszölte gyapjú takaróját. Ruhái közé begyömöszölt néhány könyvet is.</span>
<ul><li>begyömöszölés; begyömöszölhető; begyömöszölő; begyömöszölt; begyömöszöltet.
</li></ul></div>
