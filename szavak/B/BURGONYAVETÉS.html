<ul><li>1. Az a mezőgazdasági munka, amellyel a burgonyát rendsz. kapavágásnyi mélységbe elvetik; a burgonya vetése. <span style="color:blue">A burgonyavetést géppel végzi.</span>
</li><li>2. (<span style="color:green;font-weight:bold">ritka</span>) Burgonyával bevetett föld. <span style="color:blue">Van három hold burgonyavetése.</span>
