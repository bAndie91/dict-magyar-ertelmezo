BUNDACIPŐ  főnév (<span style="color:green;font-weight:bold">ruházkodás</span>)
Meleg kelmével v. prémmel bélelt és szegett (többnyire a bokát is takaró) cipő. <span style="color:blue">Csatos, fűzős, prémes bundacipő; fekete, szürke bundacipő. Ízléses bundacipők jelentek meg a kirakatokban. Télire bundacipőt vett az anyjának.</span>
<ul><li>bundacipőjű; bundacipős.
