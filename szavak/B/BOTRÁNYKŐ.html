BOTRÁNYKŐ  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Az a személy, helyzet, körülmény, akin, amelyen mindenki megbotránkozik. <span style="color:blue">Ő volt a társaság botrányköve.</span> □ Magában véve huszonnégy spahi halála nem lett volna oly nagy botránykő. (Jókai Mór)
