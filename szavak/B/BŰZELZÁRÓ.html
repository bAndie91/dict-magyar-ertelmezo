BŰZELZÁRÓ  [e; z-e] főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Vízvezeték, árnyékszék lefolyójának vezetékébe közvetlenül a kiöntő után beépített S alakú cső, amelynek egyik ága állandóan vízzel van tele, és ezzel megakadályozza a csatorna gázainak és szagának visszaáramlását.
