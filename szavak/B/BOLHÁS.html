BOLHÁS  melléknév -an, -abb
<ul><li>1. Olyan &lt;személy, állat&gt;, akiben v. amelyben (sok) bolha van, akin, amelyen bolhák élősködnek. <span style="color:blue">Bolhás kutya.</span>
</li><li>2. Olyan &lt;ruhadarab&gt;, amelyben bolhák vannak, v. amelyen a bolha piszka látható. <span style="color:blue">Bolhás ing; bolhás a bundája.</span>
</li></ul></div>
