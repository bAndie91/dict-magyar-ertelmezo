BOLONDOZÁS  főnév -t, -ok, -a
A bolondozik igével kifejezett cselekvés, magatartás; bolondos, tréfás viselkedés. <span style="color:blue">Egész este tartott a bolondozás. Mindenki nevetett bolondozásán. Ne vedd komolyan bolondozását.</span> □ Az öreg Gaál kivénült a divatból, és megszokta a bolondozást. (Krúdy Gyula)
