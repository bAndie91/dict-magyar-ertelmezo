BANKKAMATLÁB  főnév (<span style="color:green;font-weight:bold">bankszakma</span>)
Az a százalékban kifejezett kamatláb, amelyet a jegybank hivatalosan megállapít, és az általa leszámitolt váltók után felszámít. <span style="color:blue">A bankkamatláb 3 százalék. A magánbankok a bankkamatlábon felül 12 százalékot számítottak.</span>
