BEPEREL  tárgyas ige bepöröl
Vkit perbe fog; vki ellen pert indít. <span style="color:blue">Beperel vkit vmiért. Kártérítésért beperel vkit. Adósság miatt beperelte. A sértőt beperelte.</span> □ Beperlem a semmirevalót. Kínaezüstöt adni igazi helyett! (Jókai Mór)
<ul><li>beperelés; beperelhető; beperelő; beperelt; bepereltet.
</li></ul></div>
