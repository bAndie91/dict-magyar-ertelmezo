BAKTERHÁZ  főnév (<span style="color:green;font-weight:bold">népies</span>)
Vasúti őrház. □ Ásítozva nézegetett ki a rohanó vonat ablakából a tavaszi éjbe. Kis bakterházak szaladtak el a sötétségben. (Krúdy Gyula) A vonat | eggyé vált velem  nem tudtam betelni semmivel, |  bakterházakkal, ringó, suhanó | állomásokkal. (Szabó Lőrinc)
