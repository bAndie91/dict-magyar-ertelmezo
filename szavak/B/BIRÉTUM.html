BIRÉTUM  főnév -ot, -a (<span style="color:green;font-weight:bold">vallásügy</span>)
&lt;Katolikusoknál&gt; a papoknak főleg szertartások alkalmával viselt különféle színű sapkája, amelynek három v. négy ága a tetején összefut. □ [Kecskerágó.] Mintha lombjain csupa kis Tündéri pöttöm püspök ülne S bíbor birétumban örülne. (Tóth Árpád)
<ul><li>birétumos.
