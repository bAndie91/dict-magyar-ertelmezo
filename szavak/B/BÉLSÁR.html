BÉLSÁR  főnév (<span style="color:green;font-weight:bold">orvostudomány</span>)
A megevett tápláléknak fel nem dolgozott, a bélben összegyűlő és a végbélnyíláson át kiürülő része, salakja; a bél megemésztetlen tartalma; ürülék, széklet. <span style="color:blue">Híg, kemény, sűrű, véres bélsár.</span>
