BUZÉR  főnév -t, -ok, -ja (<span style="color:green;font-weight:bold">növénytan</span>)
Hosszúkás levelű, tüskés szárú, sárgás virágú fűnemű növény; gyökere vörös festékanyagot tartalmaz; festőbuzér (Rubia tinctorum).
<ul><li>Szóösszetétel(ek): 1. buzérfélék; buzérfesték; buzérfű; buzérgyökér; buzérlepke; buzérvörös; 2. festőbuzér.
</li></ul></div>
