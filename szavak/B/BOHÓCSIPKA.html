BOHÓCSIPKA  [c-s] főnév
Lecsüngő csörgőkkel felszerelt színes sipka, melyet főleg a cirkuszi bohóc szokott a fejére tenni; csörgősipka. <span style="color:blue">Felteszi a bohócsipkát; bohócsipkában jelenik meg a porondon, az álarcosbálon.</span>
<ul><li>bohócsipkás.
</li></ul></div>
