BÚGÓ [1]  melléknév -n v. -an, -bb
Olyan, aki, ami búg [1] (14). <span style="color:blue">Búgó bogár, cséplőgép, légcsavar, vadgalamb; búgó szél; búgó hangú énekesnő.</span> □ A búgó, zengő őszi szellő Kuszálja a fák levelét. (Tolnai Lajos) A torkából búgó hangok törtek elő. (Krúdy Gyula)
