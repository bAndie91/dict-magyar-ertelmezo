BENYÚLÓ  melléknév
<ul><li>1. Olyan &lt;személy, dolog&gt;, aki, amely vhova benyúl. <span style="color:blue">Az ajtón benyúló kéz. Az ablakon benyúló tolvaj.</span>
</li><li>2. Olyan &lt;dolog&gt;, ami benyúlik (13) vhova. <span style="color:blue">A tengerbe benyúló félsziget; az ablakon benyúló orgonavirág; a késő éjszakába benyúló tárgyalás.</span>
</li></ul></div>
