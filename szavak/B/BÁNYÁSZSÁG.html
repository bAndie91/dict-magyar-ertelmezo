<ul><li>1. A bányamunkások, bányászok összessége v. vmely csoportja. <span style="color:blue">A pécsi bányászság sztrájkja. A bányászság teljesítette felajánlását.</span>
</li><li>2. Bányaműveléssel való foglalkozás; a bányász(ok) foglalkozása, mestersége. <span style="color:blue">Otthagyta a bányászságot.</span>
</li></ul></div>
