BUKKANÓ  melléknév és főnév
<ul><li>I. melléknév Olyan, aki, ami vkire, vmire bukkan. <span style="color:blue">Olajra bukkanó munkások.</span>
</li><li>II. főnév -t, -ja
</li><li>1. (<span style="color:green;font-weight:bold">tájszó</span>) Hirtelen, meredeken ereszkedő lejtő. <span style="color:blue">Az útnak több bukkanója van.</span>
</li><li>2. (<span style="color:green;font-weight:bold">tájszó</span>) Kis gödör az úton, úttesten. <span style="color:blue">Az út, az utca tele van bukkanóval.</span>
</li></ul></div>
