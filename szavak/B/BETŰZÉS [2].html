BETŰZÉS [2]  [e] főnév -t, -e [e] (csak egyes számban)
A betűz [2] igével kifejezett cselekvés (főleg az igének 1. jelentésében); az a cselekvés, hogy vmit betűznek (vmibe, vhová). <span style="color:blue">A gombostű betűzése a ruhába; a virág betűzése a gomblyukba.</span>
