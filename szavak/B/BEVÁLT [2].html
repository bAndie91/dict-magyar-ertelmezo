BEVÁLT [2]  melléknév és főnév -an
Olyan (személy v. dolog), akiről, amiről bebizonyosodott, hogy beválik vminek; alkalmas, megfelelő. <span style="color:blue">A sorozáson beváltak októberben vonulnak be. Jól bevált. A kitűnően bevált fiatalok megállják helyüket.</span>
