BÚTOROZATLAN  melléknév -ul
Olyan &lt;helyiség, lakás&gt;, amely nincs bútorral berendezve. <span style="color:blue">Bútorozatlan szobát bérelt. Lakása még bútorozatlan.</span> □ A bútorozatlan termek hűvös félhomálya a kedélyben lakálytalan [= nem lakályos]  hatást keltett föl. (Kemény Zsigmond)
