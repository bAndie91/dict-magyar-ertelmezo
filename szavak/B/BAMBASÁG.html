BAMBASÁG  főnév -ot, -a
A bamba melléknévvel kifejezett tulajdonság, cselekedet v. megnyilatkozás. <span style="color:blue">Kétségbeejtő, szánalmas, színlelt, tettetett bambaság. A bambaság rá volt írva arcára.</span> □ Valami csekélységet akart?  kérdé a lengyel alamuszi bambasággal. (Mikszáth Kálmán)
