BIRSALMASAJT  [rs-a] főnév
Birsalmából és sok cukorból készített, sűrűre főzött, kocsonyás csemege. <span style="color:blue">Birsalmasajtot eszik, készít.</span> □ S mi majszoltuk fiatal-lágy ajakkal | az édes és bíbor birsalma-sajtot, | melyben dió volt. (Kosztolányi Dezső)
<ul><li>birsalmasajtos.
