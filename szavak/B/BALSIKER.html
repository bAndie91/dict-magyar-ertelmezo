BALSIKER  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Vmely vállalkozás kedvezőtlen végződése, eredménye, vmely szereplés kedvezőtlen fogadtatása; sikertelenség, kudarc. <span style="color:blue">Színházi balsiker; a balsikerek elkedvetlenítették, elkeserítették, megtörték. A sok balsiker után végül mégis rámosolygott a szerencse.</span>
