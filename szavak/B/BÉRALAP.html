BÉRALAP  [r-a] főnév (<span style="color:green;font-weight:bold">hivatalos</span>, <span style="color:green;font-weight:bold">1945 után</span>)
Az a pénzösszeg, amelyet a szocialista állam egy bizonyos időszakban (év, hónap) az egész népgazdaság, az egyes népgazdasági ágak, intézmények, vállalatok részére a munka díjazására (bérekre, fizetésekre) tervszerűen megállapít.
<ul><li>béralapi; béralapú.
