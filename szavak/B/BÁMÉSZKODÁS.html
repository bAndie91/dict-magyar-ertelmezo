BÁMÉSZKODÁS  főnév -t, (-ok), -a
A bámészkodik igével kifejezett cselekvés, magatartás; szájtátó bámulás, csodálkozás. <span style="color:blue">Tétlen bámészkodás. Bámészkodással nem megyünk semmire.</span> || a. Az a tény, hogy vki bámészkodik. <span style="color:blue">A gyerekek bámészkodása. A művész menekült a tömeg bámészkodása elől.</span>
