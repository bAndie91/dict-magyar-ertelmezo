BESZÉDHELYZET  főnév (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
Azoknak a körülményeknek (előbb elhangzott mondatoknak és egyidejű jelenségeknek: taglejtésnek, arckifejezésnek v. egyéb külső tényezőknek) összessége, amelyek közt vmely nyilatkozat, közlés történik. <span style="color:blue">A beszédhelyzet a hiányos mondatot is érthetővé teszi.</span>
