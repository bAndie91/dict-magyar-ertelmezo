BÚSLAKODIK  tárgyatlan ige -tam, -ott, -jék (-jon)
Mélyen, huzamosabb ideig búsul, szomorkodik. <span style="color:blue">Búslakodik vmiért, vmin, vmi miatt. Mit búslakodol itt magadban?</span> □ Ti földi népek, Oly búslakodva nézlek. (Tóth Árpád)
<ul><li>Igekötős igék: elbúslakodik; nekibúslakodik.
</li><li>búslakodás; búslakodó.
</li></ul></div>
