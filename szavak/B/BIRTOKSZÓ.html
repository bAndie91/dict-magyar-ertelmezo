BIRTOKSZÓ  főnév (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
&lt;Birtokos szerkezetben&gt; az a szó, amely azt a személyt v. dolgot nevezi meg, aki vkivel meghatározott viszonyban van (pl. rokona, ismerőse), aki v. amely vkinek, vminek része, tartozéka; birtok (pl. a "barátom könyve" szókapcsolatban a <span style="color:blue">könyve</span>).
