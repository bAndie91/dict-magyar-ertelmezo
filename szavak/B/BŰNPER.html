BŰNPER  [mp v. np] főnév bűnpör
Olyan per, amely bűnüggyel kapcsolatban a bűncselekmény tettese, ill. gyanúsítottja ellen folyik. <span style="color:blue">Háborús bűnper; a népbíróság által tárgyalt bűnper; bűnperbe von vkit.</span> □ A  bűnperek az ottani  életnek  epizódjai közzé tartoznak. (Jósika Miklós)
<ul><li>bűnperes.
