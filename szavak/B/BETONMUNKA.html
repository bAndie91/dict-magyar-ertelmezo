BETONMUNKA  [mm v. nm] főnév (<span style="color:green;font-weight:bold">építészet</span>, <span style="color:green;font-weight:bold">műszaki nyelv</span>)
Betonnal végzett, rendsz. építkezési munka; betonozás. <span style="color:blue">A betonmunkával már készen vagyunk.</span> || a. (<span style="color:green;font-weight:bold">bizalmas</span>) Ennek eredménye; az így készült építmény, ill. vminek betonból való része. <span style="color:blue">Erős, jó, hatalmas betonmunka.</span>
