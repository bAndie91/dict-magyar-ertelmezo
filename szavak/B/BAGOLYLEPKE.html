BAGOLYLEPKE  főnév
<ul><li>1. Bolyhos torával a bagoly fejére emlékeztető, színezetében is a bagolyhoz hasonló, gyak. kártékony éjjeli lepke.
</li><li>2. <span style="color:blue">Bagolylepkék:</span> (<span style="color:green;font-weight:bold">állattan</span>) A lepkék egyik csoportja, ill. ezeknek egyik faja v. egyede (Noctuiformes). <span style="color:blue">Vetési bagolylepke.</span>
</li></ul></div>
