BOROTVAECSET  főnév, (<span style="color:green;font-weight:bold">népies</span>) beretvaecset
Borotválkozáshoz, borotváláshoz használt vastag ecset, mellyel a szakáll, szőrzet puhítására szappanból v. borotvakrémből habot készítenek, és ezt a borotválandó felületen szétkenik; borotvapamacs.
