BESZÁLLÁS  főnév -t, -a
A beszáll (2) igével kifejezett cselekvés; az a tény, hogy vki beszáll vmibe, vhová; kül. közúti járműre, vonatra szállás: <span style="color:blue">Beszállás az autóbuszba, a vasúti kocsiba. A másik oldalon van a beszállás. Beszállás!:</span> &lt;forgalmi alkalmazott figyelmeztetése az utasoknak&gt;.
