BÉLSZÍN  főnév (<span style="color:green;font-weight:bold">választékos</span>)
A levágott (hízott) marhának a vesetájék fölött levő húsa; vesepecsenye. <span style="color:blue">Vacsorára bélszínt evett.</span> || a. Az ebből készült húsétel, sült. <span style="color:blue">Gombás, párolt bélszín; bélszín vadasan.</span>
<ul><li>Szóösszetétel(ek): bélszínszelet.
