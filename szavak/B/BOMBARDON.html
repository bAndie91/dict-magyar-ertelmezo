BOMBARDON  főnév -t, -ok, -ja (<span style="color:green;font-weight:bold">zene</span>)
Rézből készült, bő méretű, hajlított, billentyűs, szelepekkel fölszerelt fúvóhangszer, melyen mély, öblös, tömör hangja miatt főleg basszusszólamokat játszanak; tuba. <span style="color:blue">Bombardonba fúj. Bombardonok búgtak a zenekar mélyén.</span>
<ul><li>bombardonos.
