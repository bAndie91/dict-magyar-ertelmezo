BURGONYAFÖLD  főnév
Burgonya termesztésére haszn., ezzel beültetett föld. <span style="color:blue">A nehéz, kötött, hideg agyag nem jó burgonyaföld. Öt hold burgonyaföldje van.</span> □ A falutól nem messze  burgonyaföld van. Tíz ujjammal kapartam ki néhány burgonyát a földből. (Petőfi Sándor)
