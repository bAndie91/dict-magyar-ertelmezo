<div class="szocikk">
BECENÉV  [e-e] főnév
A személynév kedveskedő, kicsinyített, becéző alakja v. más szó mint kedveskedő elnevezés, megszólítás a személynév helyett. <span style="color:blue">Becenevén szólítja.</span> □ Tóninak nevezték a tanulók bizalmasan, de ez a becenév nem illett hozzá. (Kosztolányi Dezső)
</div>
