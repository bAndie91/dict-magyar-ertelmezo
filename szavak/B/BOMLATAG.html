BOMLATAG  melléknév -on, -abb (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Könnyen szétomló, szétmálló; részeire bomló s ezért nem tartós. □ Nálunk most is számos visszaélések gátlására a régi és bomlatag korlátok óvatnak meg és tataroztatnak. (Kemény Zsigmond)
