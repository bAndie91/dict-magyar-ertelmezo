BÖRBÖNCE  [e] főnév ..cét, ..céje [e] berbence [e-e-e v. ë-ë-e] (<span style="color:green;font-weight:bold">tájszó</span>)
Rendsz. fából készült kerek edény(ke); szelence. □ Felvett egy pipát a tartóról, megtöltötte a dohányos börböncéből s rágyújtott. (Jókai Mór) Harmadszor tolta elém a dohányos börböncét. (Móra Ferenc)
