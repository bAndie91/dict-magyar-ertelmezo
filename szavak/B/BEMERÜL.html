BEMERÜL  tárgyatlan ige
&lt;Folyadékba, híg v. porhanyós anyagba&gt; belejutva részben, bizonyos mértékig annak szintje alá kerül, de úgy, hogy az nem lepi el teljesen. <span style="color:blue">Csak egy kicsit merült be a folyóba. Lábai térdig bemerültek a homokba. A megrakott uszály mélyen bemerült a vízbe.</span>
