BIZAKODÁS  főnév -t, (-ok), -a
A bizakodik igével kifejezett lelkiállapot; az a tény, hogy vki bizakodik (vmiben). <span style="color:blue">Tele bizakodással; bizakodással néz a jövő elé. Bizakodással remél vmit.</span> □ Gondatlan bizakodása  menten szétfoszla. (Kemény Zsigmond)
