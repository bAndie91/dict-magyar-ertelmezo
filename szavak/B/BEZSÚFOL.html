BEZSÚFOL  tárgyas ige
Szűk helyre összezsúfolva beszorít, begyömöszöl vmit, &lt;tömeget&gt; vhová beszorít, szűkösen, kényelmetlenül elhelyez. <span style="color:blue">Könyveit bezsúfolja egy ládába. Kétezer embert zsúfoltak be a színházba.</span>
<ul><li>bezsúfolás; bezsúfolgat; bezsúfolható; bezsúfoló; bezsúfolt; bezsúfoltat.
</li></ul></div>
