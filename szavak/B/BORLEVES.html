BORLEVES  főnév
Borból víz és tojás hozzáadásával készített, cukorral gyengén édesített, különféle fűszerrel (citrom, fahéj, szegfűszeg) ízesített meleg étel, melyet csészében vagy tányérban szoktak felszolgálni. □ A  nyugvás és az a jó forró borleves erőhöz juttaták. (Eötvös Károly)
