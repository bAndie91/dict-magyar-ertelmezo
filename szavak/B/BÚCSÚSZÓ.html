BÚCSÚSZÓ  főnév (gyak. többes számban) (<span style="color:green;font-weight:bold">választékos</span>)
Búcsúzáskor és búcsúzásul mondott szó. <span style="color:blue">Búcsúszavait nem felejtem el soha.</span> □ Búcsuszó nélkül csak nem lehet elválnunk. (Arany János) A hintó elrobog, de a búcsúszavak itt maradnak. (Mikszáth Kálmán)
