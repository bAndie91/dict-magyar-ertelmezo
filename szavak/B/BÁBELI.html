BÁBELI  [ë] melléknév
A bibliai Bábel (Babilon) városával kapcs., ott található, arra jellemző. <span style="color:blue">Bábeli nyelvzavar:</span> a) &lt;a biblia szerint&gt; a bábeli torony építéséig egységes emberi nyelv megzavarodása; b) (<span style="color:green;font-weight:bold">ritka</span>) sok különböző nyelv egy időben való hangzása; <span style="color:blue">bábeli zűrzavar:</span> nagy fokú z.
