BÚCSÚKIHALLGATÁS  főnév (<span style="color:green;font-weight:bold">hivatalos</span>)
Olyan kihallgatás, amelyen az állomáshelyéről v. állásából távozó magasrangú hivatalos személy v. diplomata elbúcsúzik az államfőtől, ill. minisztertől. <span style="color:blue">Az államfő búcsúkihallgatáson fogadta a lemondott miniszterelnököt.</span>
