BEKÖTŐ  [e] melléknév
Általában olyan, aki, ami beköt vmit. <span style="color:blue">A lovakat az istállóba bekötő kocsis; a sebet bekötő orvos.</span> || a. <span style="color:blue">Bekötő út:</span> vmely, a fő közlekedési útvonaltól távol eső pontot (települést stb.) a főútvonallal összekötő út. <span style="color:blue">A megyében tervbe vették 500 km bekötő út építését.</span>
