BELELAPOZ  tárgyatlan ige
<span style="color:blue">Belelapoz vmibe:</span> vmely könyvbe, füzetbe, írásba itt is, ott is lapozgatva futólag beletekint, alaposabb figyelem nélkül lapozza. <span style="color:blue">Én bizony nem olvastam el a könyvet, csak éppen belelapoztam.</span>
<ul><li>belelapozás; belelapozó.
