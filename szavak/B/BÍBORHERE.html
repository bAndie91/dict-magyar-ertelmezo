BÍBORHERE  főnév (<span style="color:green;font-weight:bold">növénytan</span>, <span style="color:green;font-weight:bold">mezőgazdaság</span>)
A pillangós virágúak családjába tartozó, bíborvörös virágú, egyéves takarmánynövény, melyet ősszel néha rozzsal keverve szoktak vetni (Trifolium incarnatum). <span style="color:blue">A bíborherének van fehér virágú változata is.</span>
