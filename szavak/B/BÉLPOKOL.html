BÉLPOKOL  főnév (<span style="color:green;font-weight:bold">régies</span>)
Bélpoklosság, lepra, ill. az ennek következtében keletkező fekélyek, kiütések halmaza. □ Lepjen meg bélpokol és rüh. (Arany János) Azt az egy arcot látja  fekélyekkel, bélpokollal rakva. (Jókai Mór)
