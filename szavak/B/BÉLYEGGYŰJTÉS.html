BÉLYEGGYŰJTÉS  [g-gy] főnév
Postabélyegek gyűjtése csere, levelezés, vásárlás útján. <span style="color:blue">A bélyeggyűjtés igen népszerű és tanulságos időtöltés. A bélyeggyűjtés a legelterjedtebb gyűjtési ág. Diákkorában abbahagyta a bélyeggyűjtést. Bélyeggyűjtéssel foglalkozik.</span>
