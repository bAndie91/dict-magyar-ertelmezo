BURGONYASALÁTA  főnév (<span style="color:green;font-weight:bold">konyhaművészet</span>)
Fölszeletelt főtt burgonyából ecetes, hagymás lével v. majonézzel készített, savanyúságként fogyasztott hideg étel; főként hús mellé tálalják. <span style="color:blue">Sertéskaraj burgonyasalátával. Nagyon szereti a burgonyasalátát.</span>
