BAGARIABŐR  főnév
Bagaria. <span style="color:blue">Bagariabőrből készült cipőfelsőrész, csizma, díszműáru.</span> || a. jelzői használat(ban) Bagariából készült. □ A vevő kivette a vörös bagariabőr tárcát a mentéje zsebéből. (Jókai Mór) Nagy bagariabőr csizmáinak izmos két sarka össze-összeütődött. (Mikszáth Kálmán)
