BERUHÁZ  tárgyas ige (<span style="color:green;font-weight:bold">hivatalos</span>)
&lt;Nagyobb pénzösszeget&gt; fordít üzemek, intézmények létesítésére, fejlesztésére, kibővítésére. <span style="color:blue">Iskolák létesítésére több millió forintot ruháztak be. A vasúti berendezések korszerűsítésére jelentékeny összeget ruháztak be.</span>
<ul><li>beruházkodik; beruházó; beruházott.
</li></ul></div>
