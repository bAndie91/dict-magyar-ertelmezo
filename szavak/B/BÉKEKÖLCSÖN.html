BÉKEKÖLCSÖN  főnév (<span style="color:green;font-weight:bold">1945 után</span>)
A Magyar Népköztársaságnak 1950 és 1956 között évenként kibocsátott államkölcsönei közül vmelyik. <span style="color:blue">Az első, a második békekölcsön; a harmadik békekölcsön húzása; a békekölcsön kötvénye. Békekölcsön kerül kibocsátásra. Békekölcsönt jegyez.</span>
