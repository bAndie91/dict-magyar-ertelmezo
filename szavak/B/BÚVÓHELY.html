BÚVÓHELY  főnév
Elbújásra, elrejtőzésre alkalmas félreeső, eldugott hely. <span style="color:blue">Patkányok, zsiványok búvóhelye.</span> □ Szegény Veronka úgy reszketett a búvóhelyén, mint egy didergő madár. (Mikszáth Kálmán) A rablók nem szokták a búvóhelyüket akárki fiának elárulni. (Herczeg Ferenc)
<ul><li>búvóhelyes; búvóhelyi.
