BEBÁMUL  tárgyatlan ige
Bent levő helyre, hely felé bámul. <span style="color:blue">Bebámul az ablakon, a nyitott ajtón. Megáll az üzlet előtt, és bebámul a kirakat üvegén át.</span> □ A piacról a szájtátó csőcselék mind bebámulhatott a nagy ivóterembe. (Jókai Mór)
