BÖLCSESSÉGFOG  főnév
Az ember leghátsó zápfoga, mely igen későn, rendsz. a 1725. életév körül búvik ki. <span style="color:blue">Még nem nőtt ki a bölcsességfoga</span> (<span style="color:green;font-weight:bold">átvitt értelemben</span> is): még megfontolatlan, nem elég komoly, éretlen. □ Most huszonkét esztendős: most jönnek a bölcsességfogai. (Jókai Mór)
