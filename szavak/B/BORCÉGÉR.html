BORCÉGÉR  főnév (<span style="color:green;font-weight:bold">régies</span>)
Bormérések, kocsmák ajtaja fölött cégérül kifüggesztett, csomóba kötött háncs, gyaluforgács, szőlőfürt v. más hasonló jel. □ Nem irtózott más pokoltul, hanem attul, ahol ki nem kötik a borcégért, és nem töltenek a csaplárok. (Faludi Ferenc)
