BRONZSZÍNŰ  [z-sz] melléknév
A bronzéhoz hasonló, fényes, meleg, barna színű. <span style="color:blue">Bronzszínű haj, ruha. Bronzszínűre sült emberek dolgoztak az úttesten.</span> □ A férj kissé meghajtotta bronzszínű fejét. (Herczeg Ferenc) Az ingujját felgyűrte vállig, bronzszínű az izmos karja. (Nagy Lajos)
