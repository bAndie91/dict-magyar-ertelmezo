BELEKAROL  tárgyatlan ige
<span style="color:blue">Belekarol (vkibe, vmibe):</span> karját vkinek a karjába ölti. <span style="color:blue">Belekarolt a menyasszonyába.</span> □ Szeretett volna belekarolni az asszony karjába, de sehogy sem sikerült neki ez az egyszerű mozdulat. (Móricz Zsigmond)
Vö.: karol (1).
belekarolás; belekaroló.
