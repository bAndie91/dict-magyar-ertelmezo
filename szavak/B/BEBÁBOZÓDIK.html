BEBÁBOZÓDIK  tárgyatlan ige -ott, -jék (-jon) (csak 3. sz-ban) (<span style="color:green;font-weight:bold">állattan</span>)

<ul><li>bebábozódás; bebábozódó; bebábozódott.
