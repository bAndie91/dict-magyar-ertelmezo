BESZEMTELENKEDIK  tárgyatlan ige
Szemtelenül bemegy, betolakodik vhová, ahová senki sem hívta, ahol semmi keresnivalója sincs. <span style="color:blue">Beszemtelenkedik vhová, vkihez; beszemtelenkedett hozzánk, minden házba.</span>
<ul><li>beszemtelenkedés; beszemtelenkedett; beszemtelenkedő.
</li></ul></div>
