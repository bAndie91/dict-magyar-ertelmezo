BETÜREMLÉS  [e-e] főnév -t, -ek, -e [ë, e]
A betüremlik (1) igével kifejezett történés; az a tény, hogy vmi betüremlik, ill. ennek eredménye: vminek betüremlett része. <span style="color:blue">A belek betüremlése; a ruha betüremlése. Elsimította a betüremlést. A betüremlést operálni kellett.</span>
