BOTOSISPÁN  [s-i] főnév (<span style="color:green;font-weight:bold">1945 előtt</span>)
A gazdatisztnél alacsonyabb rangú és képzettségű uradalmi alkalmazott, az uradalom mezőgazdasági munkásainak közvetlen felügyelője. □ A ház is  abban az állapotban maradt, ahogy nagyapjuk idejében a botosispán élt benne. (Móricz Zsigmond)
