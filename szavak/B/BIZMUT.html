BIZMUT  -ot, -ja (<span style="color:green;font-weight:bold">vegyi ipar</span>)
A természetben tisztán is előforduló szürkésfehér, néha vöröses árnyalatú merev, kis keménységű fém, amelynek ötvözeteit az iparban, vegyületeit a kozmetikában és a gyógyászatban használják; vegyjele: Bi.
<ul><li>Szóösszetétel(ek): bizmutkása.
</li><li>bizmutos.
