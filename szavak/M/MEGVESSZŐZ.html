MEGVESSZŐZ  tárgyas ige
Vesszővel, pálcával (megszégyenítő) büntetésül megver. <span style="color:blue">Azt, aki vétett a fegyelem ellen, megvesszőzték.</span> □ Amely katona fogollyal szóba eredt, megvesszőzték. (Kazinczy Ferenc)
<ul><li>megvesszőzés; megvesszőző; megvesszőzött; megvesszőztet.
</li></ul></div>
