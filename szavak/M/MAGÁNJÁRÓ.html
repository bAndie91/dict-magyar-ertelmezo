MAGÁNJÁRÓ  melléknév és főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Olyan (gépezet), amelynek helyváltoztatásához külső hajtó- v. vontató erő nem szükséges, mert beépített motor v. gőzgép segítségével tudja helyét változtatni; önjáró. <span style="color:blue">Magánjáró aratógép, cséplőgép, kombájn. Javítják a magánjárót.</span>
