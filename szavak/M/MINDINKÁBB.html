MINDINKÁBB  [d-i] határozószó
Egyre fokozódó mértékben, egyre inkább. <span style="color:blue">Mindinkább javul. Figyelmét mindinkább leköti ez a kérdés. Mindinkább tisztulnak gondolatai.</span> □ Az éj mindinkább sötétedett. (Gárdonyi Géza) Mindinkább bonyolódik a dolog. (Krúdy Gyula)
