MÉSZÉGETÉS  [sz-é] főnév
A meszet éget szókapcsolattal kifejezett eljárás, művelet, tevékenység; a mészkőnek torony alakú kemencében való hevítése; eközben a széndioxid eltávozik belőle, és megmarad az égetett mész. <span style="color:blue">A hegyi falu lakói mészégetéssel foglalkoznak.</span>
