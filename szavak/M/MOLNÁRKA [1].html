MOLNÁRKA [1]  főnév ..kát, ..kája (<span style="color:green;font-weight:bold">állattan</span>)
A poloskák rokonságába tartozó, álló- v. lassan folyó vizek felszínén futkosó, hosszú lábú rovar (Gerris paludum). □ A víz csillogó remegéssel folydogált a belehajló füvek között. Fürge molnárkák korcsolyáztak a színén. (Gárdonyi Géza)
