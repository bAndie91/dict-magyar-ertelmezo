MALOMGÁT  főnév
Vízimalmot hajtó folyóvízen épült duzzasztógát, amely az összegyűlt vizet a malom kerekére vezeti. □ Az én malomgátam szorítja ki rétjére a vizet. (Eötvös József) Nagyon meggyűlt a víz éjféltáján a malomgátnál. (Mikszáth Kálmán)
<ul><li>malomgátas; malomgáti.
