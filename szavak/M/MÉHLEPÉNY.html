MÉHLEPÉNY  [mélepény] főnév (<span style="color:green;font-weight:bold">biológia</span>)
A magasabb rendű emlősök méhében a fogamzás után kialakuló és fejlődő magzat táplálkozását és oxigénnel való ellátását lehetővé tevő lepényszerű szerv, amely a szülés után leválik a méh faláról.
