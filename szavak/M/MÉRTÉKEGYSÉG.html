MÉRTÉKEGYSÉG  [k-e] főnév
A testek, a jelenségek mérésére haszn. mérték egysége (5), vmely mértékrendszer alapegysége. <span style="color:blue">Abszolút mértékegység(ek); a legkisebb mértékegység; a méter mint mértékegység; a hosszúság, a sebesség mértékegysége.</span>
<ul><li>mértékegységi; mértékegységnyi; mértékegységű.
</li></ul></div>
