MONDAKÖR  főnév (<span style="color:green;font-weight:bold">irodalomtudomány</span>)
Összefüggő mondák csoportja. <span style="color:blue">A hún, a trójai mondakör.</span> □ Hasonlíthatlanúl többet érne, ha magából a mondakörből vehetném az anyagot. (Arany János) Itt volt Colchys, a Jázon-mondakör végcélja. (Jókai Mór)
mondaköri; mondakörű.
