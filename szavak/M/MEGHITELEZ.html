MEGHITELEZ  tárgyas ige (<span style="color:green;font-weight:bold">pénzügy</span>)
<span style="color:blue">Meghitelez vkit, vmit (vmely összeg erejéig):</span> &lt;személy, vállalat&gt; vkit v. vmely pénzintézetet azzal bíz meg, hogy vmely áru szállításának igazolása után az áru ellenértékét fizesse ki a szállítónak.
<ul><li>meghitelezés; meghitelezett; meghitelező.
</li></ul></div>
