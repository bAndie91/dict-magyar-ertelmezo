MENTOL  [ë v. e] főnév -t, -ja (<span style="color:green;font-weight:bold">vegyi ipar</span>)
A borsmentából párolt olaj erősen illó, fehér, kristályos szerkezetű fő alkotórésze, melynek szeszes oldata hűtő és viszketést csillapító hatású szer.
<ul><li>Szóösszetétel(ek): mentolíz; mentolízű; mentolszag; mentolszagú.
</li><li>mentolos.
</li></ul></div>
