<span style="color:blue">Meghőmérőz vkit:</span> hőmérővel megméri vkinek a hőmérsékletét. <span style="color:blue">Mióta hőemelkedései vannak, minden reggel meghőmérőzi magát.</span> □ Hátha még meg is hőmérőzném magam, milyen fügegyerek [= derék ember] lennék akkor. (Móra Ferenc)
