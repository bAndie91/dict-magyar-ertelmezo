MONOPOLHELYZET  főnév (<span style="color:green;font-weight:bold">sajtónyelvi</span>)
Az a helyzet, amelyet vmely monopólium biztosít vkinek, vminek vmely téren; gazdasági v. hatalmi szempontból vki, vmi számára kiváltságos, kizárólagosan kedvező helyzet. <span style="color:blue">Kihasználja monopolhelyzetét.</span>
monopolhelyzeti; monopolhelyzetű.
