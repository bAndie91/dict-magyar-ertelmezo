MEGTÉTEL  [ë-e] főnév -t, -e [e] (csak egyes számban, birtokos személyraggal)
Az a tény, hogy vki megtesz vmit. <span style="color:blue">Az előkészületek, a javaslat, az út megtétele.</span> □ Kegyelmed azon Apafi Mihály, kérdé a basa az illő üdvözlések megtétele után, aki több esztendeig volt a tatár fogságában? (Jókai Mór)
