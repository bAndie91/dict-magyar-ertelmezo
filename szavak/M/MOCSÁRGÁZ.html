MOCSÁRGÁZ  főnév
Mocsár fenekén bomló szerves anyagok rothadásakor keletkező metángáz, amely buborékokban tör a felszínre. <span style="color:blue">A meggyulladt mocsárgáz a lidércfény.</span> □ A mocsárgáz, amint felkavarodik, azonnal a legmagasabb szintre tör, és ott szétpattan. (Móricz Zsigmond)
mocsárgázos.
