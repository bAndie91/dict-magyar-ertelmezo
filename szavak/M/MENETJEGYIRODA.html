<div class="szocikk">
MENETJEGYIRODA  [gy-i] főnév
Menetjegyek, hálókocsijegyek kiadásával, társas utazások előkészítésével, lebonyolításával foglalkozó iroda. <span style="color:blue">A vonatok érkezéséről és indulásáról felvilágosítást nyújt a menetjegyiroda.</span>
<ul><li>menetjegyirodai; menetjegyirodás.
</li></ul></div>
