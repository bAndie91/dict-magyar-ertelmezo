MŰSORKÖZLŐ  főnév -t, -je [e]
&lt;Kabarékban v. rendezvényeken&gt; az a személy, aki a műsor egyes számait a közönségnek bejelenti, s a számok közti szünetet csevegéssel, tréfával kitölti; konferanszié. <span style="color:blue">Az ötletes műsorközlőt a közönség megtapsolta.</span>
