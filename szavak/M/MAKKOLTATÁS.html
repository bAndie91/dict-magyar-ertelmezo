MAKKOLTATÁS  főnév -t, (-ok), -a (<span style="color:green;font-weight:bold">népies</span>)
A makkoltat igével kifejezett cselekvés, tevékenység; sertésnek makkal etetése, hizlalása. <span style="color:blue">A disznók makkoltatása. A makkoltatás a kanász dolga. Régen a tölgyfaerdőkben a sertéseket makkoltatással hizlalták.</span>
