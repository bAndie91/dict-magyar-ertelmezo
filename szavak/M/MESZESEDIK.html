MESZESEDIK  [e-e-ë] tárgyatlan ige -ett, -jék (-jen) [ë, ë] (csak 3. személyben)
A benne lerakódó mésztől fokozatosan meszessé (I. 1, 6) válik. <span style="color:blue">Meszesednek az erei. Meszesedik a víz. Már meszesednek a tüdejében a gócok.</span>
