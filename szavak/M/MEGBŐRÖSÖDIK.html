MEGBŐRÖSÖDIK  tárgyatlan ige
<span style="color:blue">Megbőrösödik vmi:</span> vmely folyadék felszínét teljesen, ill. bizonyos mértékig belepi a rajta képződött hártya, bőrszerű réteg. <span style="color:blue">Megbőrösödik az enyv, a lekvár, a tej.</span>
<ul><li>megbőrösödés; megbőrösödő; megbőrösödött.
</li></ul></div>
