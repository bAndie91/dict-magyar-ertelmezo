MÉNTELEP  főnév
Az országos lótenyésztés fejlesztésére létesített állami (régen katonai szervezetű) intézmény. <span style="color:blue">A méntelepről kölcsön kapott csődör.</span> □ Szénavárt színház, itt még bódé sincs; ott méntelep, bikatelep: itt egy kis óvodát nem tudunk fönntartani. (Tolnai Lajos)
