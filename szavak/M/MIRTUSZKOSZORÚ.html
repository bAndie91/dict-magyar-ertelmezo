MIRTUSZKOSZORÚ  főnév, (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">népies</span>, <span style="color:green;font-weight:bold">régies</span>) mirtuskoszorú
A mirtuszfa leveleiből és virágaiból font koszorú, v. ennek utánzata; nők egyházi esküvőn viselik. □ Anyám magába ballag az úton, | azon tűnődik, hogy esküvőjén | mirtuszkoszorú volt a fején. (Kosztolányi Dezső)
<ul><li>mirtuszkoszorús.
</li></ul></div>
