MUNKAALKALOM  főnév
A munka (I. 2c) végzésének lehetősége; kenyérkereseti alkalom. <span style="color:blue">Munkaalkalmat ad, biztosít vkinek; munkaalkalmat keres, szerez, talál. Bőséges a munkaalkalom. Ha nincs munkaalkalom, nincs kereset. Az ötéves terv sokféle új munkaalkalmat teremtett.</span>
