MEGPORHANYÍT  tárgyas ige
A kellő v. a kívánt mértékben porhanyóssá tesz vmit. <span style="color:blue">Megporhanyítja a húst; megporhanyítja a földet.</span> □ A hunnok a nyers húst nyergeik alá rakták, úgy porhanyították meg. (Jókai Mór)
<ul><li>megporhanyítás; megporhanyítható; megporhanyító; megporhanyított; megporhanyíttat.
