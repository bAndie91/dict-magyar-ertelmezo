MEGOLAJOZ  [g-o] tárgyas ige
<span style="color:blue">Megolajoz vmit:</span> vminek a szerkezetét, súrlódó (alkat)részét v. (alkat)részeit (belülről) olajjal megkeni. <span style="color:blue">Megolajozza a gépet, a kereket, a kulcsot, az órát, a tengelyt, a zárat.</span>
<ul><li>megolajozás; megolajozható; megolajozó; megolajozott; megolajoztat.
</li></ul></div>
