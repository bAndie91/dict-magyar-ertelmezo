MEGHOZATAL  főnév -t, -a (csak egyes számban)
A meghoz (12, 56) igével kifejezett cselekvés, ill. az a tény, hogy vki, vmi meghoz vmit. <span style="color:blue">Vminek a meghozatala; a döntés, a határozat, az ítélet, a törvény meghozatala. A könyv meghozatala nehézségekbe ütközik.</span>
