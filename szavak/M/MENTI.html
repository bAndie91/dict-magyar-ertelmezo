MENTI  [e v. ë] melléknév (csak megelőző főnévvel kapcsolatban)
Vmely, hosszirányban elnyúló, húzódó természeti alakulat v. emberi alkotás mentén elterülő, levő. <span style="color:blue">Folyó menti város; határ menti község; út menti fák; vízpart menti földek.</span>
