<div class="szocikk">
MOZGÓPOSTA  főnév (<span style="color:green;font-weight:bold">postaügy</span>)
&lt;Megfelelően berendezett járműben, pl. vasúti kocsiban, gépkocsiban&gt; a szállított postai anyagot útközben feldolgozó közvetítő postahivatal; állomásonként az anyagot leadja, ill. továbbításra átveszi.
<ul><li>Szóösszetétel(ek): mozgópostakocsi. 
</li><li>mozgópostai; mozgópostás.
</li></ul></div>
