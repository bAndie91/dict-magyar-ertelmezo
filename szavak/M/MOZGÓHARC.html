MOZGÓHARC  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
&lt;Az állásharccal ellentétben&gt; olyan harc, amelyet elsősorban a csapatok mozgása, manőverezése jellemez, és amelyben az arcvonalak nem merevednek meg huzamosabb időre. <span style="color:blue">A hadműveletek sikere rendszerint mozgóharcban dől el.</span>
