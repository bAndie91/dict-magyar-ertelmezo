MARTILAPU  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
Fészkes virágú, agyagos helyeken kora tavasszal sárgán virító, később nagy, lapuszerű leveleket hajtó gyógynövény; levelét néhol főzeléknek, töltikének használják (Tussilago farfara).
