MACSKAGYÖKÉR  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
Erdőn, nedves réten tenyésző, magas szárú, évelő növény; páratlanul szárnyalt levele, erős illatú, apró, fehér v. pirosló virága van; a gyógyszeriparban használják (Valeriana). <span style="color:blue">Hármas levelű, kétlaki, mezei macskagyökér.</span>
</div>
