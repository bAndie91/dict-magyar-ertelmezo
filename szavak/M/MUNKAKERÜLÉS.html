MUNKAKERÜLÉS  [e] főnév -t, (-ek), -e [ë, e]
Szándékos, folyamatos kibúvás a munkavállalás v. vmely munkának (megfelelő) elvégzése alól; naplopás. <span style="color:blue">A közveszélyes munkakerülés bűntettét a törvény börtönnel bünteti.</span>
munkakerüléses; munkakerülési.
