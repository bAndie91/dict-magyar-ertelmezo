MEGDRÁGUL  [g-d] tárgyatlan ige
<span style="color:blue">Megdrágul vmi:</span> vminek az ára v. költségei megnövekednek, vmi drágább lesz. <span style="color:blue">A világpiacon megdrágultak a nyersanyagok. A villamos nem drágult meg.</span>
<ul><li>megdrágulás; megdráguló; megdrágult.
</li></ul></div>
