MEGBICSAKOLJA MAGÁT  (<span style="color:green;font-weight:bold">tájszó</span>) megbikacsolja magát (<span style="color:green;font-weight:bold">bizalmas</span>)
Megmakacsolja, megköti magát. □ Lévén ma pápista ünnep; én is megbicsakoltam magam, hogy ma délelőtt nem megyek hivatalba. (Arany János) A részeg fickó megbikacsolta magát. (Jókai Mór)
