MADÁRLÁTTA  melléknév (<span style="color:green;font-weight:bold">népies</span>)
Olyan &lt;kenyér&gt;, amelyet vki mezei munkáról v. hosszabb útról visszatérve, rendsz. maradékként hazavisz. <span style="color:blue">Madárlátta cipó.</span> □ Kutat az apró nép [a tarisznyában], örülne, ha benne Madárlátta kenyér-darabocskát lelne. (Arany János)
