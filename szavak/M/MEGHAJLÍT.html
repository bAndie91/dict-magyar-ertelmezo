MEGHAJLÍT  tárgyas ige
&lt;Egyenes, hajlékony tárgyat, testrészt&gt; a kívánt mértékig hajlít; meggörbít. <span style="color:blue">Meghajlítja a kezében tartott botot, drótot, lécet, pálcát, rudat, vasat; meghajlítja a derekát, a térdét, az ujját.</span>
<ul><li>meghajlítás; meghajlítható; meghajlító; meghajlított; meghajlíttat.
</li></ul></div>
