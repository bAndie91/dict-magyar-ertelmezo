MINDÖRÖKRE  [d-ö] határozószó, általános (kissé <span style="color:green;font-weight:bold">választékos</span>)
Minden időkre, örök időkre; örökre. <span style="color:blue">A régi világnak mindörökre vége.</span> □ A mennyországot látja, amely végre eljött érte, hogy most mindörökre ölébe fogadja. (Krúdy Gyula) Ó érzem én, hogy mindörökre végem (Juhász Gyula)
