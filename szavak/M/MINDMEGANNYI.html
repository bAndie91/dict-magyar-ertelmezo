MINDMEGANNYI  [g-a] névmás, általános (számnévi, főleg főnévi) (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Ahány csak van, mind; egytől egyig. <span style="color:blue">Mintha mindmegannyi óriás lett volna.</span> □ [A kulcsárné] oly szemérmesen szedegette lábait, mintha e termetes egyenes fák mindmegannyi házasulandó férfiak volnának. (Tolnai Lajos)
