MINTAVÁSÁR  főnév (<span style="color:green;font-weight:bold">ritka</span>)
Olyan, rendsz. nemzetközi vásár, amelyen különféle termékekből, árucikkekből mintákat (5a) állítanak ki, mutatnak be, és az árut v. a helyszínen veszik meg, v. a minta alapján rendelik meg a kiállítótól; árumintavásár.
<ul><li>Szóösszetétel(ek): árumintavásár.
</li><li>mintavásári.
</li></ul></div>
