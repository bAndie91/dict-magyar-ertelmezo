MEGNYÚLÓSODIK  tárgyatlan ige
Egész anyagában v. egy bizonyos mértékig nyúlóssá válik. <span style="color:blue">Megnyúlósodik a bor, a keletlen, rosszul sült kenyér.</span> □ A borom mind megnyúlósodott, azt nem ihatod. (Jókai Mór)
<ul><li>megnyúlósodás; megnyúlósodó; megnyúlósodott.
