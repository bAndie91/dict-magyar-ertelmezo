MADÁRHÚSÚ  melléknév (<span style="color:green;font-weight:bold">bizalmas</span>)
Sovány testalkatú, szikár &lt;személy&gt;, ill. sovány, vékony &lt;testrész&gt;. <span style="color:blue">Madárhúsú asszony, gyermek.</span> □ Mintha most is látnám  madárhúsú vékony lábszáraihoz szorosan odafűzött bocskorban  s pattogtatni visszahangzó ostorát  (Arany János)
