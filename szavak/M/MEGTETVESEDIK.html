MEGTETVESEDIK  tárgyatlan ige
Vki, vmi tetvessé válik; meg-, ill. ellepik a tetvek. <span style="color:blue">A piszokban megtetvesedik az állat. Megtetvesedett a feje, a ruhája. A szerencsétlen katonák a lövészárokban megtetvesedtek.</span>
<ul><li>megtetvesedés; megtetvesedett; megtetvesedő.
