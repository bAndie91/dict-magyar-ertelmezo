MEGLASSUL  tárgyatlan ige
&lt;Mozgás, folyamat&gt; bizonyos mértékben lassúbbá válik. <span style="color:blue">Meglassul a beszéde, a járása, a mozgása; meglassul a fejlődése.</span> □ Vezérek, gyulák, rabonbánok, szólt az meglassult, de megtörött hangon, az idő végihez közelg. (Jókai Mór)
<ul><li>meglassulás; meglassuló; meglassult.
</li></ul></div>
