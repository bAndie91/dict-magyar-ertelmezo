MÉHKAPARÁS  [mékaparás] főnév
<ul><li>1. A megfogamzott petének és függelékének műtéti úton való eltávolítása a méhből; kürett. <span style="color:blue">Az öregasszonyt elítélték méhkaparásért.</span>
</li><li>2. (<span style="color:green;font-weight:bold">orvostudomány</span>) Az anyaméh nyálkahártyájának részbeni v. teljes eltávolítása kórisme, ill. gyógyítás végett.
</li><li>méhkaparásos.
</li></ul></div>
