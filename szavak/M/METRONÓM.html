METRONÓM  [ë] főnév -ot, -ja (<span style="color:green;font-weight:bold">zene</span>, <span style="color:green;font-weight:bold">fizika</span>)
Időtartam mérésére való, szabályozható súllyal és fokos beosztással (skálával) ellátott mozgó inga, amely a zeneművek tempójának gyorsaságát jelzi, s a helyes időviszonyok megrögzítését és reprodukálását megkönnyíti.
