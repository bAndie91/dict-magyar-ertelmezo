MIELŐBB  határozószó
A lehetőséghez képest korán v. hamar; minél előbb. <span style="color:blue">Írj mielőbb! Igyekezzél mielőbb elkészülni a munkáddal.</span> □ Hozasd fel a fiút mielőbb Budára. (Arany János) Eszembe jutott Kornél. Ellenállhatatlan vágyat éreztem, hogy mielőbb lássam őt. (Kosztolányi Dezső)
