MŰVÉSZFRIZURA  [sz-f] főnév
Férfinak a szokottnál, a divatosnál hosszabbra megnövesztett, hátrafelé fésült és a fülnél rendsz. elálló hajviselete. <span style="color:blue">Művészfrizurát hord. Lobogó művészfrizurával jelent meg a dobogón.</span>
művészfrizurájú; művészfrizurás.
