MEGEBÉDEL  [g-e] tárgyatlan ige
Ebédjét elfogyasztja; az ebédelést elvégzi. <span style="color:blue">Ha megebédeltél, pihenj egy kicsit!</span> □ Még mielőtt megebédelt, indult el egy hivatalos útjára. (Eötvös József)
<ul><li>megebédelés; megebédelő; megebédeltet.
