MELASZ  [ë v. e] főnév -t, -a (csak egyes számban)
A répacukor gyártásának mellékterméke; édeskés, csípős ízű, barna színű, sűrű folyadék, szörp; szeszgyártásra, ill. takarmányozásra használják.
<ul><li>Szóösszetétel(ek): melasztartalom.
</li><li>melaszos.
</li></ul></div>
