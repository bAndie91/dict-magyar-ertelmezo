MENETKÉPES  melléknév (-en) (<span style="color:green;font-weight:bold">hivatalos</span>)
<ul><li>1. Olyan &lt;élőlény&gt;, akinek, amelynek egészségi állapota elég jó ahhoz, hogy menetelhet, hosszabb útra mehet, menetelésben részt vehet. <span style="color:blue">Menetképes katona, ló. A sebesült már menetképes.</span>
</li><li>2. (<span style="color:green;font-weight:bold">ritka</span>) Üzemképes &lt;jármű&gt;. <span style="color:blue">Menetképes autó.</span>
</li><li>menetképesség.
</li></ul></div>
