MELLÜREG  [l-ü] főnév (<span style="color:green;font-weight:bold">bonctan</span>)
A testnek a mellcsont, a bordák, a gerincoszlop és a rekeszizom által határolt ürege, amely a lélegzés és a vérkeringés fő szerveit foglalja magában. <span style="color:blue">A mellüregben helyet foglaló szervek.</span>
<ul><li>mellüregi.
