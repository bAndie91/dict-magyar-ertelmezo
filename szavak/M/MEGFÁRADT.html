MEGFÁRADT  melléknév -an (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Olyan &lt;személy&gt;, aki az élet küzdelmeibe, nehézségeibe belefáradt, akit az élet megviselt. □ Megfáradt ember hamvára nehezedik a domb. (Vörösmarty Mihály) Se férfi, se gyerek, se magyar, se testvér, | csak megfáradt ember, aki itt hever. (József Attila)
