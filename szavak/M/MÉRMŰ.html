MÉRMŰ  főnév (<span style="color:green;font-weight:bold">építészet</span>)
Főleg a csúcsíves ablakok felső, elkeskenyedő részén alkalmazott, kőből faragott szabályos díszítmény. <span style="color:blue">Halhólyagos, homlokzatot borító, lóherelevél formájú mérmű; a mérmű bordája, nyílása.</span>
<ul><li>Szóösszetétel(ek): mérműborda; mérműnyílás.
</li></ul></div>
