MEGENGEDETT  [ë-e-e-ë; meg-e] melléknév
Olyan &lt;dolog&gt;, amit megengedtek (1, 6) vkinek. <span style="color:blue">A megengedett fürdés, játék.</span> || a. (<span style="color:green;font-weight:bold">hivatalos</span>) Hivatalos rendelettel engedélyezett, megállapított, megszabott. <span style="color:blue">A megengedett feszültség, nyomás, terhelés. A megengedett (legkisebb) sebesség (óránként) 10 km.</span>
