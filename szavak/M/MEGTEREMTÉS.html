MEGTEREMTÉS  főnév -t, -e [e] (csak egyes számban)
A megteremt igével kifejezett cselekvés, ill. folyamat, történés; az a cselekvés, hogy vmit megteremtenek; létrehoznak. <span style="color:blue">A tartós béke, az egység, a jó pénz megteremtése. Nagy erőfeszítéseket teszünk a korszerű mezőgazdaság megteremtésére.</span>
</div>
