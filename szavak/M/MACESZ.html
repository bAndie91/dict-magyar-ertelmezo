MACESZ  [ë v. e] főnév -t, (-ek) [ë] v. (-ok), -e [e] v. -a
Kovásztalan tésztából készült vékony, ropogósra sült, lap alakú tésztaféle; a zsidók húsvéti ünnepükön kenyér helyett fogyasztják; pászka. □ A jó ember örömében egy tál maceszt tett elénk. (Jókai Mór)
