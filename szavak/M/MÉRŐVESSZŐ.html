MÉRŐVESSZŐ  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Keskeny, vékony falemezekből készült, összehajtogatható, nyitott állapotban 12 m hosszú, csuklós mérce, az egyik oldalán hüvelykes, a másikon centiméteres beosztással; colstok. <span style="color:blue">A kőműves a falra illesztette a mérővesszőt.</span>
<ul><li>mérővesszős.
