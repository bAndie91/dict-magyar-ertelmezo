MIXOLID  [i-i v. i-í] melléknév (<span style="color:green;font-weight:bold">zene</span>)
Olyan dúr jellegű hétfokú &lt;hangsor&gt;, melynek harmadik és negyedik, valamint hatodik és hetedik hangja közt félhangnyi távolság van. <span style="color:blue">A mixolid skálának nincs vezérhangja.</span> || a. Ilyen hangsoron épülő. <span style="color:blue">Mixolid dallam, hangnem.</span>
