MEGHURÍT  tárgyas ige (<span style="color:green;font-weight:bold">tájszó</span>)
<ul><li>1. Keményen, éles, nyers hangon megdorgál, megfegyelmez, elhallgattat vkit. □ Tegnap ugyan szegényt [= a feleségemet] meghuritám érted: De tovább nem tűröm, nem én soha: érted? (Arany János)
</li><li>2. Kiabálva űz, kerget vkit, vmit. <span style="color:blue">Meghurítja a kutyát.</span>
</li></ul></div>
