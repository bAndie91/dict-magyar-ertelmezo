MAMMUT  [mamut] főnév -ot, -ja
Az elefánthoz hasonló, de sokkal nagyobb testű, hosszabb agyarú, sűrű szőrzetű, kihalt őskori állat. <span style="color:blue">Az ősember mammutra vadászott.</span>
<ul><li>Szóösszetétel(ek): mammutagyar; mammutbarlang; mammutcsontváz; mammutfenyő; mammutfizetés; mammuthús; mammutvagyon; mammutvállalat.
</li></ul></div>
