MEGTÁNTORÍT  tárgyas ige (<span style="color:green;font-weight:bold">választékos</span>)
Elhatározásában v. hűségében megingat vkit. □ Akit meg nem tántorít a hiúság, megejti a szenvedély. (Csiky Gergely) Sem pénz, sem ígéret meg nem tántorít. (Gárdonyi Géza)
<ul><li>megtántorítás; megtántorítható; megtántorító; megtántorított.
