MIHEZTARTÁS  [ë] főnév (<span style="color:green;font-weight:bold">hivatalos</span>)
&lt;Csak néhány állandósult szókapcsolatban.&gt; <span style="color:blue">Miheztartás végett:</span> azért, hogy az érdekelteknek legyen mihez tartaniuk magukat, legyen mihez igazodniuk; vmihez való igazodás, alkalmazkodás végett; <span style="color:blue">tudomás és miheztartás végett; miheztartás végett közöl vmit.</span>
