MANIKŰR  főnév -t, -ök, -je [e]
Kézápolás. <span style="color:blue">Keze eldurvult, ráférne egy kis manikűr.</span> || a. (<span style="color:green;font-weight:bold">ritka</span>) Az ezzel foglalkozó személy. □ A suszter először a lábat látja meg belüled,  a manikűr a körmöket, a hóhér a nyakat. (Karinthy Frigyes)
<ul><li>Szóösszetétel(ek): manikűrolló; manikűrüzlet.
