MEGÖLELGET  [g-ö] tárgyas ige
Bizonyos ideig ölelget, ill. többször megölel vkit, vmit. <span style="color:blue">Megölelgette az unokáit.</span> □ Balkezed a fejem alatt, jobbkezeddel | megölelgetsz, megcirógatsz, édes. (Babits Mihály)
<ul><li>megölelgetés; megölelgetett; megölelgető.
