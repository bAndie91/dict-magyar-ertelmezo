MINEKUTÁNA  [k-u] kötőszó (<span style="color:green;font-weight:bold">régies</span>, ma főleg körülményeskedő, népies előadásmódban)
Miután. □ Minekutánna megkülömböztél [= összeszólalkoztál] az asszonyoddal, engöm kértek mög, hogy az asszony húmiját [= holmiját] kiadassam. (Gárdonyi Géza)
