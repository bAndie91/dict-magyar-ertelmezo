MENETPARANCS  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
A menet (1) tervszerű végrehajtására vonatk. közvetlen intézkedések összessége, melyet az illetékes parancsnok rendszerint élőszóban ad ki. <span style="color:blue">Elhangzott a menetparancs, s a század elindult.</span>
