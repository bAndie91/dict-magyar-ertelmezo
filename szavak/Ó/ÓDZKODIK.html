ÓDZKODIK  tárgyatlan ige -tam, -ott, -jék (-jon) ódzkódik (<span style="color:green;font-weight:bold">népies</span>)
Húzódozik vmitől, vonakodik vmit megtenni; szabódik. <span style="color:blue">Nagyon ódzkódikik a nősüléstől.</span> □ Ha már [rászorul arra a kis pénzre] , én bizony nem ódzkódom. (Mikszáth Kálmán)
ódzkodás; ódzkodó.
