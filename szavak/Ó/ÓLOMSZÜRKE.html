ÓLOMSZÜRKE  melléknév és főnév (<span style="color:green;font-weight:bold">ipar</span>)
Az ólom színéhez hasonló, a kék felé hajló, sötétes szürke (szín); ólomszín. <span style="color:blue">Ólomszürke iszap, por, tető. Szereti az ólomszürkét.</span> □ A nap jégtányér, ólomszürke fénnyel. (Reviczky Gyula)
