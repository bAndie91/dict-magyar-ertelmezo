UZSORAKÖLCSÖN  főnév
Uzsorakamatra adott kölcsön. <span style="color:blue">Uzsorakölcsönre szorul; uzsorakölcsönt vesz fel. Uzsorakölcsönök tették tönkre.</span> □ Bűregér  volt a bizalmasa a török nagyúrnak, ő adott-vett neki a börzén, ő szerzett neki uzsorakölcsönt, ha megszorult. (Móra Ferenc)
