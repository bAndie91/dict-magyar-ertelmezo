UJJHEGY  főnév
A kéz ujjának a vége. <span style="color:blue">Csak ujjheggyel szabad érinteni.</span> □ [Vér] mutatkozék, Nem több, mint tűszúrás után Ujjhegyből serkenni szokott. (Kiss József) A bazsalikom csipkés levelét Ujjheggyel gyöngéden megdörzsölöm. (Tóth Árpád)
