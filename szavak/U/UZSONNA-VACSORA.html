UZSONNA-VACSORA  főnév ..rát, ..rája, (<span style="color:green;font-weight:bold">tájszó</span>) ozsonna-vacsora (<span style="color:green;font-weight:bold">ritka</span>)
Az uzsonna és a vacsora összevonásából keletkezett késő délutáni étkezés, bővebb uzsonna, ill. szűkösebb vacsora; rendsz. teából, hideg sültekből, ill. szendvicsekből és süteményekből áll. <span style="color:blue">A vendég ott maradt uzsonna-vacsorára.</span>
