URALOMVÁGY  főnév
Erős vágy, törekvés arra, hogy vki a hatáskörébe tartozó v. azon kívül eső személyeken uralkodjék, hatalmát velük éreztesse. <span style="color:blue">Az uralomvágy már sok vezető személyt tévútra vitt.</span> □ A velünk született szabadság- és uralomvágy  ugyanazon hajlamán alapszik a kedélynek. (Eötvös József)
