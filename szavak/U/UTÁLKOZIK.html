UTÁLKOZIK  tárgyatlan ige -tam, -ott, -zék (-zon), (<span style="color:green;font-weight:bold">népies</span>) útálkozik
Többször, huzamos ideig utálatot érez vki, vmi iránt. <span style="color:blue">Mélyen utálkozik e romlottság láttán.</span> □ Ösztöne lázad és utálkozik, a hangulata már elromlott. (Karinthy Frigyes)
<ul><li>utálkozás; utálkozó.
