URIZÁL  tárgyatlan ige -t, -jon (<span style="color:green;font-weight:bold">bizalmas</span>, <span style="color:green;font-weight:bold">gúnyos</span>)
Dologtalanul élve uraskodik. <span style="color:blue">Nem tud egyebet, csak urizálni.</span> □ Hazudik, urizál, rakja az adósságot, pedig egy garas érője sincs. (Tolnai Lajos)
<ul><li>Igekötős igék: áturizál; elurizál; végigurizál.
