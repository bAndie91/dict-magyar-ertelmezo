UGYANEKKORA  [n-e] névmás, mutató (melléknévi és főnévi) (rendsz. visszamutató szóként)
&lt;A jelenlevő szemlélt v. a közelben mutatott személy, dolog méreteihez viszonyítva:&gt; pontosan, épp(en) ekkora. <span style="color:blue">Milyen nagyra nőtt a fiad! Az enyém is ugyanekkora. Jókora dinnye, én is ugyanekkorát vettem.</span>
