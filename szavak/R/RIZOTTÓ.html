RIZOTTÓ  főnév -t, -ja (<span style="color:green;font-weight:bold">konyhaművészet</span>)
Húslevesben féllágyra főtt, majd párolt rizsből, zöldborsóból, gombából s apróra vágott könnyű húsféléből (borjú-, csirkehúsból, aprólékból, májból stb.) álló étel. <span style="color:blue">Gombás rizottó.</span>
rizottós.
