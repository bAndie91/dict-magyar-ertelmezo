REPEDT  [e-e] melléknév -en e]
Olyan &lt;szilárd test&gt;, amely meg van repedve, amelyen repedés folytán hasadás, nyílás, rés van. <span style="color:blue">Repedt fal, fazék, harang, márványlap, öntvény, pohár, tányér.</span> □ Otthon a tűzhely hűvös és repedt. | Hideg fazékban készül az ebéd. (József Attila)
repedtes; repedtség.
