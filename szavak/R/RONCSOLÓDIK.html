RONCSOLÓDIK  tárgyatlan ige -tam, -ott, -jék (-jon) (<span style="color:green;font-weight:bold">ritka</span>)
&lt;Szilárd test külső erő hatására&gt; úgy romlik, hogy fokozatosan darabokra töredezik.
Igekötős igék: elroncsolódik; összeroncsolódik; szétroncsolódik.
roncsolódás; roncsolódó; roncsolódott.
