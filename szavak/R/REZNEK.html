REZNEK  [e-e v. ë-ë] főnév -et, -e [ë, e] (<span style="color:green;font-weight:bold">állattan</span>)
A túzokhoz hasonló, de kisebb, nálunk csaknem teljesen kipusztult madár (Tetrax). □ Darwin a Himmalaya erdők madarairól jegyezte fel, hogy azok oly szelídek, mint a háziállatok;  házi baromfinak szelídültek a  túzokok és reznekek. (Jókai Mór)
