RONDÍRÁS  [d-í] főnév
A latin betűknek különleges, ún. rondtollal való, díszes, kör alakúan stilizált, helyenként vastagított írása. <span style="color:blue">A rondírás ma már nem divat. Rondírást gyakorolt, tanult.</span> || a. Ennek eredménye: ilyen betűk sora. <span style="color:blue">Rondírással teleírt lap.</span>
rondírásos; rondírású.
