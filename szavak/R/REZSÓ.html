REZSÓ  [ë] főnév -t, -ja resó
Egy v. két edényben való főzésre alkalmas, kisebb gáz- v. villanyfőző. <span style="color:blue">Melegítsd meg gyorsan a rezsón a kávét.</span> || a. Gázzal v. villannyal működő tűzhely. || b. Egyetlen edény melegítésére alkalmas hordozható kis villanytűzhely.
