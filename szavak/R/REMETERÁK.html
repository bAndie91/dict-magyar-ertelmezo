REMETERÁK  főnév (<span style="color:green;font-weight:bold">állattan</span>)
Tízlábú rák, amely üres csigaházat hurcol magával, s abban lakik, illetve sebezhető, puha potrohát állandóan abban tartja (Paguridae). □ [A palánkon] valami kofa rést tőrt, s mint a remeterák a csigahéjból, ott dugta ki a fejét. (Jókai Mór)
