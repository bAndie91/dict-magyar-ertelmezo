RÁSPOLYOZ  tárgyas ige -tam, -ott, -zon
Ráspollyal egyenget, simít vmit. <span style="color:blue">Simára ráspolyozza az éles sarkokat. Gondosan gömbölyűre ráspolyozta a körmét.</span>
<ul><li>Igekötős igék: leráspolyoz; megráspolyoz.
</li><li>ráspolyozás; ráspolyozgat; ráspolyozható; ráspolyozó; ráspolyozott; ráspolyoztat.
</li></ul></div>
