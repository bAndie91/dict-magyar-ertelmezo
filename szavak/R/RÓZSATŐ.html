RÓZSATŐ  főnév ..tövet [e] v. -t, -je [e]
Magas v. alacsony törzsű rózsa (1); rózsafa, ill. rózsabokor. <span style="color:blue">Három rózsatő van a kertben.</span> □ A rózsatő egy, évről évre mégis Új rózsákat terem. (Vörösmarty Mihály) Egy rózsatőt oltánk együtt ketten Holdvilágnál harmatos kertemben. (Kiss József)
