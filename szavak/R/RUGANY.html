RUGANY  főnév -t, -ok, -a (<span style="color:green;font-weight:bold">elavulóban</span>)
Csigavonalban, csigamenetűre meghajlított rugalmas fém v. huzal (főként ülő és fekvő alkalmatosságokban); rugó. <span style="color:blue">A hintó ruganya meglazult. A foszlott ülésből kiállnak a ruganyok.</span> □ Még az ülésre is leült, hogy kipróbálja a ruganyt. (Kosztolányi Dezső)
ruganyoz.
