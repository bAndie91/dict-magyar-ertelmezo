ROSTLEN  főnév (<span style="color:green;font-weight:bold">mezőgazdaság</span>)
A len egyik faj(táj)a; magasabbra nő, csak a tetején ágazik el, rostjai finomabbak, mint a házi len és az olajlen szálai. <span style="color:blue">A rostlen fontos ipari növény. A rostlent sűrűn vetik. A rostlen a nedves, laza talajt kedveli.</span>
<ul><li>Szóösszetétel(ek): rostlenmag; rostlentermés.
</li></ul></div>
