RÓKALELKŰ  [e v. ë] melléknév
Agyafúrtan, ravaszul rosszindulatú, gonosz &lt;személy&gt;. <span style="color:blue">Rókalelkű asszony, férfi. Vigyázz az ilyen rókalelkű emberre!</span> □ Hát ki volna úr más széles e határban? | Toldi György talán, a róka lelkü bátya, | ki Lajos királynál fenn a tányért váltja? (Arany János)
rókalelkűség.
