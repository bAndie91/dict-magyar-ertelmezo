RETESZÁLLÁS  [sz-á] főnév (<span style="color:green;font-weight:bold">katonaság</span>)
<ul><li>A védelmi berendezések általános irányától bizonyos szögben befelé elhajló vonalban kiépített állás; az a célja, hogy az arcvonalat áttörő ellenséget oldalról is tűz alá lehessen venni.
</li></ul></div>
