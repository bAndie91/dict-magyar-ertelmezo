ROHAMCSAPAT  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Különleges, rendsz. nagyon veszélyes harcászati feladat végrehajtására; gyak. önként jelentkezőkből összeállított, rendsz. kisebb kötelék. <span style="color:blue">Ádáz, elszánt, vakmerő rohamcsapat.</span> □ Vezér létére maga állt a rohamcsapat élére. (Jókai Mór)
rohamcsapatos.
