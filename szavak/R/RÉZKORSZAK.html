RÉZKORSZAK  főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
Az emberiség történelem előtti korszakának az az ideje, amikor rézből készült eszközöket, fegyvereket használtak; kb. egybeesik a barbárság középfokával. <span style="color:blue">A rézkorszak a kőkorszak és a bronzkorszak közé esik.</span>
