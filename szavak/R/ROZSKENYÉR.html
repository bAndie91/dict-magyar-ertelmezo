ROZSKENYÉR  főnév
Rozslisztből sütött, (feketés)barna kenyér. <span style="color:blue">Rozskenyérrel eszi a vajat és a mézet.</span> □ Gyönyörűség fut át az arcán: mindjárt elmenne  két jó hosszúlépést inni s egy kis kolbászt harapni hozzá rozskenyérrel. (Gelléri Andor Endre)
Szóösszetétel(ek): rozskenyérhéj.
