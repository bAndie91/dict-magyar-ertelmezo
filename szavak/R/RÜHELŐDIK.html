RÜHELŐDIK  [rühelődik] tárgyatlan ige -tem [e], -ött, -jék (-jön) (<span style="color:green;font-weight:bold">népies</span>)
<ul><li>1. Úgy vakaródzik, hogy vmelyik testrészét mozgatja, rángatja, s ruhájához v. vmely tárgyhoz odadörzsöli.
</li><li>2. Fészkelődik, nyugtalankodik.
rühelődés; rühelődő.
