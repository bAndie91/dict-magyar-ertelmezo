REJTJEL  főnév (<span style="color:green;font-weight:bold">katonaság</span>, <span style="color:green;font-weight:bold">hivatalos</span>)

<ul><li>Szóösszetétel(ek): rejtjelkulcs; rejtjelolvasás.
</li><li>rejtjeles.
