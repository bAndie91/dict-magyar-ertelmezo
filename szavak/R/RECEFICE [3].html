&lt;Népdalokban gyak. más indulatszó előtt ütemet pótoló, tréfás v. vidám felkiáltásként.&gt; □ A kisasszony Pozsonyban, Selymet lopott a boltban, Recefice krinolinban. (népköltés) Virágéknál ég a világ, Sütik már a rántott békát,  Recefice; bum-bum-bum! (népköltés)
