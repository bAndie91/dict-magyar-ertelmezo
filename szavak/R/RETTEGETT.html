RETTEGETT  [ë-ë-ë v. e-ë-ë] melléknév -ebb [e] (<span style="color:green;font-weight:bold">választékos</span>)
Olyan, akitől, amitől sokan rettegnek. <span style="color:blue">Rettegett zsarnok; a gyermekek rettegett betegsége.</span> □ A skandináv népnek mostoha földet adott a sors . Hírhedett hajósok voltak: de rettegettek is. (Jókai Mór)
