RUNHASZEKRÉNY  főnév
Ruhanemű tartására haszn. szekrény. <span style="color:blue">Akasztós runhaszekrény; polcos runhaszekrény.</span> □ A kiházasítás a ruhaszekrényt üríté ki. (Kemény Zsigmond) Odament a ruhaszekrényhez, kinyitotta, kivett a gallérjaim közül egyet, s kezdte felgombolni a nyakára. (Móricz Zsigmond)
