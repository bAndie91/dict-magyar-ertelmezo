&lt;Csak ilyen állandósult szókapcsolatokban:&gt; <span style="color:blue">(Már) rendőrkézen van:</span> elfogták, letartóztatták; <span style="color:blue">rendőrkézre kerül:</span> a rendőrség elfogja, letartóztatja; <span style="color:blue">rendőrkézre ad, juttat vkit:</span> feljelentéssel v. más módon a rendőrség kezébe a., j. <span style="color:blue">A besurranó tolvaj rendőrkézre került.</span>
