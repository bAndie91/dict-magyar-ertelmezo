ROZSNOK  főnév -ot, (-ja) (<span style="color:green;font-weight:bold">növénytan</span>)
A pázsitfüvek családjába tartozó, kalászhoz hasonló termésű gyom. <span style="color:blue">Ágas, árva, bókoló, meddő, mezei, parlagi, puha, sudár rozsnok.</span> || a. Az ilyen gyomokat magában foglaló növénynemzetség (Bromus).
