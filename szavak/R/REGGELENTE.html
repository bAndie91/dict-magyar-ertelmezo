REGGELENTE  [ë-e-ë-e] határozószó (kissé <span style="color:green;font-weight:bold">választékos</span>)
Hosszabb időn át v. általában minden reggel; reggelenként: <span style="color:blue">reggelente már hűvös van.</span> □ Megmondom, ki volt a szűzi szép Delilán: | Nagy király leánya, káspi tengeren túl, Honnan reggelente a nap utnak indúl. (Arany János)
