RAGULEVES  főnév (<span style="color:green;font-weight:bold">konyhaművészet</span>)
Apróra vagdalt húsból v. belső részekből és zöldségből készített, fűszeres leves. <span style="color:blue">Az ebéd ragulevessel kezdődött.</span> □ E nemzeti díszruhák s katonai egyenruhák [közt]  a  felmerülő fekete frakk úgy tűnik fel, mint a ragoutlevesbe esett légy. (Jókai Mór)
