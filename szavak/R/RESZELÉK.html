RESZELÉK  [e-e] főnév -et, -e [ë, e]
Vmely tárgyról reszelés következtében levált, lereszelt apró v. porszerű részecskék (halmaza). <span style="color:blue">A burgonyát megreszelik, a reszelékből keményítőt készítenek.</span>
<ul><li>Szóösszetétel(ek): vasreszelék.
</li><li>reszelékes.
