ROBBANÓTÖLTET  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Tüzérségi gránátba, aknába, valamint repülőbombába, esetleg vmely robbantó szerkezetbe szerelt robbanóanyag, mely a gyújtó hatására robban fel. <span style="color:blue">Kis(ebb), nagy(obb) robbanótöltet; robbanótöltetet tesz vmibe.</span>
robbanótöltetes.
