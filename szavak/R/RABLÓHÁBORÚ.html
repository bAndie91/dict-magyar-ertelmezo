RABLÓHÁBORÚ  főnév (<span style="color:green;font-weight:bold">sajtónyelvi</span>)
Olyan jogtalan, igazságtalan háború, amelynek célja idegen országok, idegen népek meghódítása, leigázása és kizsákmányolása. <span style="color:blue">A fasiszták rablóháborúja. Rablóháborút viseltek a gyarmati népek ellen.</span>
