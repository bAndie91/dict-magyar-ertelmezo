RAKOTTYA  főnév ..ttyát, ..ttyája (<span style="color:green;font-weight:bold">növénytan</span>)
Lápokban, ligetekben, patakok mentén gyakori, lándzsás v. visszásan tojásdad levelű, hosszú barkájú cserje, melynek vesszejét úgy használják, mint a fűzét (Salix cinerea); rekettyefűz.
<ul><li>Szóösszetétel(ek): rakottyabokor.
</li><li>rakottyás.
</li></ul></div>
