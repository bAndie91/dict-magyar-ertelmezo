<ul><li>1. Textilanyag hulladékából készült nagy szilárdságú, tartós papír. <span style="color:blue">Az igazi merített papír rongypapír volt.</span>
</li><li>2. A papírnak az a fajtája, amely a cellulóze mellett bizonyos százalékban rongyfoszlányokat tartalmaz.
