RANGIDŐS  [g-i] melléknév és főnév -t, -ök, -e [e]
Ugyanazon rangúak, rendsz. katonai jellegű intézmények tagjai között olyan (személy), aki előbb került abba a rangba. <span style="color:blue">Rangidős hadnagy, tábornok, tiszt. A rangidősök átvették a parancsnoklást.</span>
</div>
