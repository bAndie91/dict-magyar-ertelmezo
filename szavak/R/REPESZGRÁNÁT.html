REPESZGRÁNÁT  [sz-g] főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Vékony falú, sok robbanóanyaggal töltött tüzérségi lövedék, amely érintkezéskor azonnal robban, és ennek következtében a lövedék fala számos apró, pusztító hatású repeszre szakad szét.
