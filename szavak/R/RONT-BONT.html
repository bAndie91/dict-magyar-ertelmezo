RONT-BONT  tárgyas ige rontott-bontott, rontson-bontson; rontani-bontani (kissé <span style="color:green;font-weight:bold">tréfás</span>)
Ismételten v. állandóan ront, rongál, pusztít vmit. <span style="color:blue">Nagyon rossz gyerek, mindent csak ront-bont.</span> □ Kertem alatt jár az ellenségem, Rontja bontja ősi örökségem, | Gyilkos Körös! fogát feni rája. (Kiss József)
