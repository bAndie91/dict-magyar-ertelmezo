RENDŐRKOPÓ  [d-ő] főnév (rendsz. többes számban) (<span style="color:green;font-weight:bold">rosszalló</span> v. <span style="color:green;font-weight:bold">gúnyos</span>)
&lt;Rendőrállamokban&gt; a polgárokat zaklató, kül. pedig folyton utánuk szaglászó, nyomukban levő (titkos)rendőr. <span style="color:blue">A rendőrkopók figyelni kezdték. Már nyomában voltak a rendőrkopók.</span>
