RÉZROZSDA  főnév (<span style="color:green;font-weight:bold">ritka</span>)
Rézből készült tárgyak felületét a szabad levegőn bevonó, oxidáció folytán képződő zöld réteg; patina. □ Az egész torony  köröskörül rikító zöld már a rézrozsdától. (Jókai Mór)
<ul><li>Szóösszetétel(ek): rézrozsdaszín.
</li><li>rézrozsdás.
