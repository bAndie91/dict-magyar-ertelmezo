RÍMES  [ë] melléknév -en e]
Olyan, amiben rímek vannak, ami rímben van írva. <span style="color:blue">Rímes dal, jambusok, költemény, próza, strófa, vers.</span> □ S im óda helyett rímes prózát írok. (Gyulai Pál) Szeszélyes, bús ajándék E rímes, furcsa játék. (Tóth Árpád)
