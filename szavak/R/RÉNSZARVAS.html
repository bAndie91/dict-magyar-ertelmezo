RÉNSZARVAS  főnév
Az északi sarkkör táján honos, háziállatként is tenyésztett, párosujjú, kérődző állat (Rangifer); iramszarvas, tarándszarvas. <span style="color:blue">Erdei, tundrán élő rénszarvas; amerikai, európai, szibériai rénszarvas.</span>
<ul><li>Szóösszetétel(ek): rénszarvasagancs; rénszarvascsont; rénszarvascsorda.
</li></ul></div>
