RÁGOMBOL  tárgyas ige
<span style="color:blue">Vmit rágombol vmire:</span> gombbal ráerősíti úgy, hogy az egyik ruhadarabon levő gombo(ka)t a másikon levő gomblyukakon átdugja, ill. egyik ruhadarabot a másikra gombolja. <span style="color:blue">Kis leánykáknak a szoknyáját rágombolják a blúzra.</span>
<ul><li>rágombolás; rágombolható; rágombolt; rágomboltat.
</li></ul></div>
