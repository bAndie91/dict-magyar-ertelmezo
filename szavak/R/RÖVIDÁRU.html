RÖVIDÁRU  [d-á] főnév (<span style="color:green;font-weight:bold">kereskedelem</span>)
Varráshoz, ruha készítéséhez, ruhadarabok viseléséhez használt v. szükséges kisebb kellék (pl. gomb, csat, szalag, cérna, fonál stb.) mint áru. <span style="color:blue">Rövidáruval kereskedik.</span>
<ul><li>Szóösszetétel(ek): rövidáru-kereskedés; rövidáru-kereskedő.
</li><li>rövidárus.
</li></ul></div>
