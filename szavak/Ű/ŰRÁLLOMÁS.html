ŰRÁLLOMÁS  [r-á] főnév (<span style="color:green;font-weight:bold">1945 után</span>)
Előregyártott elemekből az űrben megépített és ott keringő (egyelőre csak tervezett) építmény, amely űrhajók indítására és leszállására, üzemanyag tárolására és kozmikus laboratóriumok befogadására lesz alkalmas.
