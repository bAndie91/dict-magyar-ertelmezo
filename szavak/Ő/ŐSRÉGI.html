ŐSRÉGI  melléknév
Nagyon régi korból eredő, ősi (2, 4). <span style="color:blue">Ősrégi hagyomány, népviselet.</span> □ Egy-egy kocsin csupa fiatal leány ül, azok előre hajtanak, s elkezdenek valami méla, ősrégi dalt. (Jókai Mór) A türelmes Grizeldiszt már az ősrégi mesék is emlegették. (Ambrus Zoltán)
