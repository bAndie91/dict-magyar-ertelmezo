ŐSZAPÓ  [sz-a] főnév (<span style="color:green;font-weight:bold">állattan</span>)
Fehér fejű, hosszú farkú, rendkívül mozgékony kis madár, hosszú farkú cinke (Aegithalos caudatus). <span style="color:blue">Az őszapó az ágak tövébe építi gömb vagy tojás alakú fészkét.</span>
