ŐSERŐ  [s-e] főnév
(<span style="color:green;font-weight:bold">választékos</span>) Vminek a kezdetétől, eredetétől fogva ható s hosszú időn át öröklődő természetes erő. A televény ősereje; a nép ősereje. Van valami bibliai őserő  különös észjárásukban. (Mikszáth Kálmán)
őserejű.
