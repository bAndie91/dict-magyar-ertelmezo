ŐRLŐFOG  főnév (<span style="color:green;font-weight:bold">bonctan</span>)
Az ember állandó fogai, ill. tejfogai közül azok a fogak, amelyeknek megszabott élettani rendeltetése a táplálék szétmorzsolása, őrlése; zápfog. <span style="color:blue">Az ép fogsorú embernek jobbról-balról, alul felül 2-2 kis és 3-3 nagy őrlőfoga van.</span>
őrlőfogas; őrlőfogú.
