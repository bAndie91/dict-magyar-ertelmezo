ŐSRENGETEG  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Őserdő (12). □ Az újvilág ősrengetegeinek bűbájos liánei [= liánjai] elkúsznak a legszélső ágokig. (Kemény Zsigmond) Ki ne hallotta volna a bielistoki uradalomnak a hírét? Ott vannak azok a lankás ősrengetegek, amelyekben még a bölény otthon van. (Jókai Mór)
