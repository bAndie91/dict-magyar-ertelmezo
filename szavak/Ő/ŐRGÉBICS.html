ŐRGÉBICS  főnév (<span style="color:green;font-weight:bold">állattan</span>)
Rigó nagyságú, hátán világos hamuszürke, hasán szennyes fehér színű, ragadozó természetű madár (Lanius excubitor). <span style="color:blue">Nagy őrgébics.</span> □ Messze, a telegráfdróton fehér-fekete köntöse tarkállik a szemfüles őrgébicsnek. (Bársony István)
