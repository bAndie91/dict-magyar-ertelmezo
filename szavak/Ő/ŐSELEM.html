&lt;Elavult filozófiai felfogás szerint&gt; az az anyag v. elem, amelyből minden más elem és anyag származik; ősanyag. || a. Kül víz. □ Mohó, őrült vágy élt bennünk, hogy összeolvadjunk az őselemmel, minden pórusunkon át magunkba szívjuk a hűs, sós vizet. (Kuncz Aladár)
