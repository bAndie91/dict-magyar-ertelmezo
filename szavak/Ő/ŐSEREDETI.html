ŐSEREDETI  [s-e] melléknév (<span style="color:green;font-weight:bold">választékos</span>)
Olyan, aki, ami hosszú idők alatt megőrizte eredeti, hamisítatlan jellegét. □ Egy ember áll előttünk a maga őseredeti egyszerűségében, természetes igaz indulataival. (Tolnai Lajos)
őseredetiség.
