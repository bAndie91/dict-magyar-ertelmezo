NYIKKANÁS  főnév -t, -ok, -a (<span style="color:green;font-weight:bold">hangutánzó</span>)
A nyikkan (13) igével kifejezett cselekvés, hangjelenség; az a tény, hogy vki, vmi (meg)nyikkan. <span style="color:blue">Nyikkanás nélkül. Egy nyikkanást se akarok hallani!</span> □ [A gyermek] olyan csendesen viseli magát, hagy nyikkanását sem hallani. (Jókai Mór)
nyikkanásnyi.
