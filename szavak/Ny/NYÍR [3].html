NYÍR [3]  főnév -t, (-ok,) -ja (<span style="color:green;font-weight:bold">állattenyésztés</span>)
A lófélék patájának alján kidomborodó, a tulajdonképpeni patánál puhább, V alakú szaruképződmény. <span style="color:blue">A kovács patkoláskor megsértette a nyírt.</span>
<ul><li>Szóösszetétel(ek): nyírbarázda; nyírrák; nyírrothadás.
</li></ul></div>
