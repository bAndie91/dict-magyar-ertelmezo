NYIRADÉK  [i v. í] főnév -ot, -a (<span style="color:green;font-weight:bold">ritka</span>)
Vmely anyagnak nyírásakor, összevágásakor lehullott része, hulladéka. <span style="color:blue">A szövetből a szabáskor maradt egy kis nyiradék.</span> □ Adj egy szeletet abból a sok rossz papírból.  Vencel adott neki egy darab nyiradékot. (Jókai Mór)
