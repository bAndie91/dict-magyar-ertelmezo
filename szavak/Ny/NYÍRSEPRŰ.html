NYÍRSEPRŰ  főnév
A nyírfának vékony, hosszú, hajlékony ágaiból kötött hosszabb-rövidebb nyelű seprű, amelyet főleg udvarok, utcák tisztogatására használnak. <span style="color:blue">Vett a vásárban két nyírseprűt.</span> □ [A szekér] nyírseprőkkel, gereblyékkel és kosarakkal volt megrakva. (Mikszáth Kálmán)
nyírseprűs.
