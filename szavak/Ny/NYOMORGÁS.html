NYOMORGÁS  főnév -t, (-ok), -a
A nyomorog igével kifejezett állapot; szűkös anyagi körülmények között való tengődés. <span style="color:blue">A hosszas nyomorgás beteggé tette.</span> || a. (<span style="color:green;font-weight:bold">régies</span>) Súlyos testi bajokban, szenvedésekben való sínylődés, gyötrődés; nyomorúság. <span style="color:blue">A leprások embertelen nyomorgása.</span>
