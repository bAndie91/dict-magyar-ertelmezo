NYÁLMIRIGY  főnév (<span style="color:green;font-weight:bold">bonctan</span>)
Az ember és a fejlettebb állatok szájüregébe nyíló, nyálat termelő mirigy. □ Tatár tanácsos  egy halpaprikásról emlékezett meg  Olyan részletesen és gusztusosan tudta az ilyesmit elbeszélni, hogy a nyálmirigyek működni kezdtek. (Kosztolányi Dezső)
nyálmirigyes.
