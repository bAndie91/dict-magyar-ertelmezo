NYIRATKOZIK  tárgyatlan ige -tam, -ott, -zék (-zon)
Haját nyíratja (vkivel). <span style="color:blue">Nincs itthon, most nyiratkozik.</span> □ [A sikkasztó] átöltözik, nyiratkozik , a bajuszát megtoldja vagy leberetváltatja. (Gárdonyi Géza)
<ul><li>Igekötős igék: lenyiratkozik; megnyiratkozik.
</li><li>nyiratkozó; nyiratkozott.
</li></ul></div>
