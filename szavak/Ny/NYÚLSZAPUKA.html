NYÚLSZAPUKA  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
A hüvelyesek családjába tartozó, sárga virágú növény (Anthyllis). || a. Ezzel bevetett terület. <span style="color:blue">Két hold nyúlszapukája van.</span> || b. Ez a növény mint takarmány. <span style="color:blue">Lekaszálta a nyúlszapukát. A marháknak nyúlszapukát adott.</span>
