TYÚKÓL  [k-ól főnév, (<span style="color:green;font-weight:bold">népies</span>) tikól
A tyúkok elhelyezésére (rendsz. téglából) készült, kisebb-nagyobb épület, ülőkkel, tojófészkekkel, etető- és itatóvályúkkal fölszerelve. <span style="color:blue">Deszkából készített, vesszőből font tyúkól. Este a tyúkok elülnek a tyúkólban.</span>
