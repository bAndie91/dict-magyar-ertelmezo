ARA  főnév arát, arája (főként birtokos személyraggal) (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Menyasszony, mátka, férfinak jegyese. □ Az oltártól rablá el más aráját. (Tompa Mihály) Jöjjön utolszor szép szeretője, Titkos arája, Kund Abigél! (Arany János) Megöli magát arája holtteste mellett. (Péterfy Jenő)
