ALIGAZGATÓ  [l-i] főnév
&lt;Némely munkaterületen v. szervezeti rendben&gt; közvetlenül az igazgatónak alárendelt, magasabb, szélesebb hatáskörű állásban levő személy, rendsz. az igazgató helyettese. <span style="color:blue">Aligazgatóvá nevezték ki. Az aligazgató magához rendelte.</span>
<ul><li>aligazgatói; aligazgatóság.
</li></ul></div>
