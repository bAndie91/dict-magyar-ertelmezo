AMIDŐN  határozószó, vonatkozó (kötőszóként) (<span style="color:green;font-weight:bold">választékos</span>)
Amikor, amely időben, midőn. □ Amidőn bé akarám a levelemet pecsételni, eszemben jutott a Carolus Magnus leánya. (Mikes Kelemen) Alkonyat volt, őszeleji alkonyat, amidőn  kisded fekete fölleg jelent meg az égen. (Tömörkény István)
