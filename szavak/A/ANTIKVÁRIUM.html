ANTIKVÁRIUM  főnév -ot, -a
Olyan könyvesbolt, amelyben régi, használt nyomtatványokat, főként könyveket és folyóiratokat, esetleg térképeket, metszeteket vesznek és árulnak. <span style="color:blue">Egy antikváriumban bukkantam rá erre a régi kiadásra. Eladta a tankönyveit az antikváriumban.</span>
<ul><li>antikváriumi; antikváriumos.
</li></ul></div>
