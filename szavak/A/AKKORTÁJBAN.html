AKKORTÁJBAN  határozószó, mutató
Nagyjából, körülbelül abban a szóban forgó, a már említett v. a mellékmondatban közelebbről megjelölt időben; akkortájt. <span style="color:blue">Akkortájban lehetett, mikor a fővárosba kerültem. [Nyolckor jön a barátom.]  Akkortájban már én is ráérek egy kis beszélgetésre.</span>
