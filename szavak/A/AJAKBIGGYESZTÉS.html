AJAKBIGGYESZTÉS  [e] főnév ajkbiggyesztés
Az alsó ajak előretolása, a száj szögletének lefelé szorítása, a lenézés, megvetés, gúny v. közömbösség kifejezésére. <span style="color:blue">Gúnyos ajakbiggyesztés; ajakbiggyesztése elárulta belső érzéseit. Fitymáló ajakbiggyesztéssel fogadta az érveket.</span>
