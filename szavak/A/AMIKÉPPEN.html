AMIKÉPPEN  [e] határozószó, vonatkozó, (kötőszóként), (<span style="color:green;font-weight:bold">ritka</span>) amiképp
&lt;Hasonlító mondatok bevezető szava; a főmondatban gyak. azonképpen, úgy v. éppúgy szóval.&gt; Olyan módon, úgy, ahogyan a vele kapcsolt mondat tartalma megjelöli. <span style="color:blue">Amiképpen ők cselekedtek, azonképpen cselekedjünk mi is.</span>
