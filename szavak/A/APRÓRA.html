APRÓRA  határozószó
Minden kis részletre kiterjeszkedve, nagyon részletesen; töviről hegyire. <span style="color:blue">Apróra elmesél, elmond, feljegyez. Mindent apróra megtudott.</span> □ Még egyszer a dolgot kérdezi apróra. (Arany János) Apróra meghánytak vetettek mindent a téli estéken. (Mikszáth Kálmán)
