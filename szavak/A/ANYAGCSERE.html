ANYAGCSERE  főnév (<span style="color:green;font-weight:bold">biológia</span>)
Az a bonyolult folyamat, amelynek során a sejtek az élet fenntartásához szükséges anyagokat felveszik, felbontják, átalakítják, s a bomlási anyagokat eltávolítják. <span style="color:blue">Betegség esetén csökken a szervezet anyagcseréje. Az erős munka fokozza az anyagcserét.</span>
