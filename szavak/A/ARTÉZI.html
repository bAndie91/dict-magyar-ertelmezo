ARTÉZI  melléknév ártézi
&lt;Csak állandósult szókapcsolatokban:&gt; <span style="color:blue">artézi kút:</span> olyan fúrott kút, melynek vize természetes nyomás következtében nagy mélységből tör fel; <span style="color:blue">artézi víz:</span> ilyen kútból nyert ivóvíz, ásványvíz, ill. gyógyvíz. □ A szénatéren pompás ártézi kutak lövellik víztömegeiket. (Jókai Mór)
