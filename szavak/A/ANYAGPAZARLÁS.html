ANYAGPAZARLÁS  főnév
A termeléshez szükséges anyag(ok)nak tervszerűtlen, gondatlan, fölösleges felhasználása; anyagpocsékolás. <span style="color:blue">Bűnös, esztelen, felelőtlen anyagpazarlás. Az üzemben nagymérvű anyagpazarlás folyt. Nagy anyagpazarlással dolgoztak.</span>
