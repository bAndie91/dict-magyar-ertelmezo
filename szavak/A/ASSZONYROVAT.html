ASSZONYROVAT  főnév
&lt;Vmely időszaki sajtótermékben, ritk. rádióműsorban&gt; asszonyok (2) számára szerkesztett rovat, amely asszonyokat érdeklő, érintő kérdésekkel foglalkozik. <span style="color:blue">Asszonyrovatot indít a lapban. Az asszonyrovatban olvastam. Ezen a héten nagyon gazdag volt az asszonyrovat.</span>
