ALKIMISTA  főnév ..tát, ..tája (<span style="color:green;font-weight:bold">régies</span> írva: alchimista is)
Alkímiával, főként aranycsinálással foglalkozó személy. □ Hallja meg az úr, ki vagyok. Doktor, borbély, alchimista. (Csokonai Vitéz Mihály) Megfeledkeztünk  az alkimistáról, ki műhelye mélyén az életelikszírt kereste. (Karinthy Frigyes)
