AMERRŐL  határozószó, vonatkozó (kötőszóként)
<ul><li>1. A vele kapcsolt mondatban megjelölt irányból; ahonnan. <span style="color:blue">Arra fordult, amerről a hangokat hallotta.</span>
</li><li>2. (<span style="color:green;font-weight:bold">bizalmas</span>) <span style="color:blue">Arról, amerről:</span> mindegy, hogy merről; akármerről; semmi közöd hozzá, hogy merről. <span style="color:blue">[Merről jössz?]  Arról, amerről, ne törődj vele.</span>
</li></ul></div>
