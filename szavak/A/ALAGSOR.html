ALAGSOR  főnév
Nagyobb, legtöbbször emeletes épületnek a földszint alatti, részben a földbe épített szintje; rendsz. mosókonyha, kazánház, műhely stb., ritkán lakás céljára. <span style="color:blue">A házmester lakása az alagsorban volt.</span>
