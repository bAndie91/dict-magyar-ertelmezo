ARANYKULCSOS  melléknév és főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
Meghatározott származási és vagyoni feltételeknek megfelelő nemesek részére adományozott udvari méltóságot viselő (személy). □ A zene alatt lerohant a teremből az egyik bálrendező, egy fiatal aranykulcsos. (Jókai Mór)
