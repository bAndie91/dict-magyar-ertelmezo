ALAPRAJZ  főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Vmely tárgy v. építmény alapjáról, emeleteiről készült műszaki rajz, amely vízszintes keresztmetszetben mutatja a területet, a méretek arányát, a falak, ajtók, ablakok elhelyezését. <span style="color:blue">Az épületekről alaprajzot készítenek.</span>
<ul><li>alaprajzi; alaprajzos; alaprajzú.
</li></ul></div>
