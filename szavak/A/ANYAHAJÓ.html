ANYAHAJÓ  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Olyan hadihajó, mely a hozzá beosztott kisebb egységek számára szükséges üzemi és hadianyagot, élelmiszert és felszerelést tárolja, rendsz. javítóműhely is van rajta. || a. Repülőgép-anyahajó.
<ul><li>Szóösszetétel(ek): repülőgép-anyahajó.
