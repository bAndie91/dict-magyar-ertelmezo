ANTRACIT  főnév -ot, -ja (főként egyes számban) (<span style="color:green;font-weight:bold">bányászat</span>)
A kőszén legrégibb keletkezésű, legértékesebb fajtája; színe egészen fekete, fémes fényű, üvegszerű, kagylós törésű; fűtőértéke 89000 kalória. <span style="color:blue">Antracitot Angliában, Belgiumban, az Egyesült Államokban és Kínában bányásznak.</span>
