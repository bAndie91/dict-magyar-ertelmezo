AKÁCOS  melléknév és főnév, (<span style="color:green;font-weight:bold">tájszó</span>) ákácos
<ul><li>I. melléknév Olyan &lt;hely, terület&gt;, ahol akácfák vannak, amely akáccal van beültetve. <span style="color:blue">Akácos táj, udvar, út.</span>
</li><li>II. főnév -t, -ok, -a Akáccal benőtt hely, terület; rendsz. kisebb akácerdő. <span style="color:blue">Az akácos megkötötte a homokos talajt. Behúzódott az akácosba.</span>
</li></ul></div>
