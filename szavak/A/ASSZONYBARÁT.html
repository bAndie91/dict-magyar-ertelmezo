<ul><li>1. Az a férfi, aki a rendesnél, megszokottnál nagyobb hajlandóságot mutat az udvarlásra, nőkkel való bizalmasabb érintkezésre. <span style="color:blue">Közismert asszonybarát. Túlságosan nagy asszonybarát volt, semhogy megnősüljön.</span>
