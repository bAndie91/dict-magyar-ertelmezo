AGYONSZORÍT  tárgyas ige
Szorítva, szorongatva megöl vkit, vmit. <span style="color:blue">A vad tolongásban agyonszorították.</span> □ Ha te tigris vagy, ő meg az óriáskígyó, mely körülölel és agyonszorít. (Jókai Mór)
<ul><li>agyonszorítás; agyonszorító; agyonszorított.
