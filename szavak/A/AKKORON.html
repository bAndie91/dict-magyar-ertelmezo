AKKORON  határozószó, mutató (<span style="color:green;font-weight:bold">költői</span>, <span style="color:green;font-weight:bold">régies</span>)
Abban az ismert, szóban forgó v. a mellékmondatban közelebbről megjelölt (régi) időben, korban; akkor (régen). □ Akkoron | levék teremtve, amidőn először | megláttalak. (Katona József) Derült volt akkoron még A magasban szép egem. (Vörösmarty Mihály)
