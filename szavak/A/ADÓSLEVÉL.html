ADÓSLEVÉL  főnév (<span style="color:green;font-weight:bold">régies</span>)
A hitelezőnél levő magánokirat, amelyet az adós állít ki annak bizonyságául és elismeréseként, hogy tartozik neki vmivel; elismervény, kötelezvény. □ Tárcája duzzadt, és adóslevele nincsen. (Vas Gereben) Erre a szóra összetépte az adóslevelet. (Jókai Mór)
