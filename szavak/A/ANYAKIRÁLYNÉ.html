ANYAKIRÁLYNÉ  főnév
Az uralkodó király v. királynő élő anyja. Szóláshasonlat(ok): (<span style="color:green;font-weight:bold">gúnyos</span>) <span style="color:blue">úgy jár</span> v. <span style="color:blue">olyan, mint egy anyakirályné:</span> büszke, páváskodó, méltóságot mímelő. □ Udvariasságának javarészét Forgácsnéra pazarolta, akivel úgy bánt, mint egy anyakirálynéval. (Herczeg Ferenc)
