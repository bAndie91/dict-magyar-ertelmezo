ARCSZÖG  [c-sz] főnév (<span style="color:green;font-weight:bold">embertan</span>)
&lt;Az arcon&gt; az orr tengelye és a külső hallójárat közötti vonallal alkotott szög, amely az embernél jóval nagyobb, mint más gerinces állatnál, s amelyből általában az állat, ill. az ember szellemi fejlettségének fokára következtetnek.
<ul><li>arcszögű.
</li></ul></div>
