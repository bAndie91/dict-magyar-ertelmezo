ARANYGALUSKA  főnév (<span style="color:green;font-weight:bold">konyhaművészet</span>)
Finom kelt tésztából készült étel; a tésztát apróra kiszaggatják, egyenként vajban v. zsírban megmártják, dióval és cukorral v. mazsolával, fahéjjal meghintik, két v. több sorban egymás fölé rakják és az egészet kisütik; gyak. sodóval tálalják.
<ul><li>aranygaluskás.
</li></ul></div>
