ALULCSAPÓ  melléknév
<span style="color:blue">Alulcsapó vízimalom:</span> olyan v., amelyben a víz folyásának az irányára merőlegesen elhelyezett lapátkereket a víz sodra mozgatja, s az a gerendellyel összeköttetésben levő fogaskerekek közvetítésével hajtja a felső építményben elhelyezett őrlő berendezést.
