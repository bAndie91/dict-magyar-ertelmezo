ALAKPÁR  főnév (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
Ugyanannak a szónak olyan két alakja, mely hangzásra eltér egymástól, s gyak. jelentésük és rendsz. hangulati értékük is különbözik (pl. <span style="color:blue">hű</span> és <span style="color:blue">hív; papír</span> és <span style="color:blue">papiros; ad</span> és <span style="color:blue">ád</span>).
