ARANYSZÍNŰ  melléknév
Az arany színéhez hasonló színű. <span style="color:blue">Aranyszínű bor, felhő.</span> □ Csaknem aranyszínű vörös haja hosszan, mint az oroszlán sörénye lobog vállai körül. (Jókai Mór) [Somló] aranyszínű nedve  a világ bármelyik pecsenyeborával fölveszi a versenyt. (Mikszáth Kálmán)
