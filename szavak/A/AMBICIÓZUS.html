AMBICIÓZUS * melléknév -an, -abb
<ul><li>1. Nagyravágyó, becsvágyó, nagyra törő. □ Van egy-két büszke nagynéném, egy pár ambiciózus nagybátyám. (Tolnai Lajos)
</li><li>2. Buzgó, iparkodó, törekvő, lelkes. <span style="color:blue">Az ambiciózus fiatalember egyszerre két idegen nyelvet tanult.</span>
