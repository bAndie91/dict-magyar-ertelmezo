ARCKRÉM  [c-k] főnév
Főként növényi és állati zsírokból, olajokból v. ásványi anyagokból (vazelin, parafin) készült krém (2); az arcbőrt puhító, üdévé, simává tevő és védő arcápoló szer. <span style="color:blue">Többféle arckrémet használ.</span>
<ul><li>arckrémes.
