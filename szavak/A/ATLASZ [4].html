ATLASZ [4]  főnév -t, -ok, -a
A görög mitológia szerint a Földet vállán tartó Atlasz istent jelképező, kőből faragott, férfi alakú szobor, melyet az ókori és a barokk építészetben mint tartó elemet, oszlopot szoktak alkalmazni. <span style="color:blue">Atlaszokkal díszített bejárat.</span>
