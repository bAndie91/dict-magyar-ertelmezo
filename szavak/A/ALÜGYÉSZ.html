ALÜGYÉSZ  [l-ü] főnév (<span style="color:green;font-weight:bold">régies</span>)
<ul><li>1. &lt;Törvényszéken&gt; az ügyész, a közvádló helyettese.
</li><li>2. &lt;Törvényhatóságokon&gt; a főügyész mellé beosztott, ügyvédi vizsgát tett személy. <span style="color:blue">Városi alügyész.</span> □ [A kocsin] Zátonyi táblabíró s Völgyesy alügyész ültek. (Eötvös József)
