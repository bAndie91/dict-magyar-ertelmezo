AVÉGETT  [e] határozószó, mutató (<span style="color:green;font-weight:bold">régies</span> írva: a végett is)
Az ismert, szóban forgó, távolinak jelzett v. a mellékmondatban részletezett dolog végett. → <span style="color:blue">Éppen avégett; avégett jöttem ide, hogy veled beszéljek.</span> □ A pipám javában égett, Nem is mentem én a végett. (Petőfi Sándor)
