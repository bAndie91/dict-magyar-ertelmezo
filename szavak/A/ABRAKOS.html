ABRAKOS  melléknév
Olyan &lt;gazdasági eszköz&gt;, amelyben abrak van v. szokott lenni, amelyben abrakot tárolnak, v. amelyből az állatot abrakkal v. egyéb élelemmel táplálják. <span style="color:blue">Abrakos kosár, láda, rosta; abrakos tarisznya←; abrakos vályú.</span> □ Kecskebaklábú abrakos vályúval tele az udvar. (Eötvös Károly)
</div>
