ANTISZEMITIZMUS  [ë v. e] főnév -t, -a (csak egyes számban)
Mesterségesen szított, fajelméleti alapon álló gyűlölet a zsidóság iránt; zsidógyűlölet, zsidóellenesség. <span style="color:blue">Az antiszemitizmus megnyilvánulásai. Az antiszemitizmus embertelen formát öltött a fasiszta országokban.</span>
