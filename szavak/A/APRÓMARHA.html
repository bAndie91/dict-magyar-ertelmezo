APRÓMARHA  főnév (<span style="color:green;font-weight:bold">népies</span>)
Aprójószág, baromfi. □ Halnak  nemcsak az emberek, hanem még az aprómarha is. (Eötvös József) A város piacán egynéhány ember ácsorgott  Mindenik el akarja adni a disznaját, aprómarháit. (Gárdonyi Géza)
