AJAKÍR  [k-í] főnév (<span style="color:green;font-weight:bold">választékos</span>, <span style="color:green;font-weight:bold">kereskedelem</span>)
Az ajak kiszáradása, kicserepedése v. felrepedezése ellen, ill. az ajkon támadt kisebb sérülések gyógyítására haszn., rendsz. rudacska formájú kenőcs.
