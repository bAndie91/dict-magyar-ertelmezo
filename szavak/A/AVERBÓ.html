AVERBÓ  [ë] főnév -t, -ja (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
&lt;Némely nyelvben, főként a latinban&gt; az igének azok a fő alakjai, amelyeknek ismeretében az ige valamennyi alakját meg lehet szerkeszteni; téma. <span style="color:blue">A latinban az ige averbója rendszerint négy vagy öt igealakból áll.</span>
