ALAKUTÁNZÁS  [k-u] főnév (<span style="color:green;font-weight:bold">állattan</span>)
Az a képesség, mellyel vmely állat önvédelemből v. tápláléka megszerzése közben környezetét utánzó alakot, ill. színt ölt, alkalmazkodik hozzá; mimikri. <span style="color:blue">A kaméleon alakutánzással téveszti meg áldozatait.</span>
