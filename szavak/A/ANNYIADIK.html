ANNYIADIK  névmás, mutató (sorszámnévi) (<span style="color:green;font-weight:bold">ritka</span>)
Sorrendben az elsőtől számítva, azon a helyen levő, olyan sorszámú, amelyikre a beszédhelyzetre v. a szövegösszefüggésre támaszkodó annyi (főleg I. 1, 2) szó utal. <span style="color:blue">[Hányadik lettél a versenyen?]  Annyiadik, ahányadiknak reméltem.</span>
