ALEZREDES  [l-e] főnév
&lt;Hadseregben, ill. katonai jellegű testületben&gt; az őrnagynál magasabb, az ezredesnél alacsonyabb rendfokozatú tiszt v. ritk. ilyen rendfokozat. <span style="color:blue">Alezredessé nevezték ki. A zászlóalj parancsnoka X. Y. alezredes. Rendfokozata alezredes.</span>
<ul><li>alezredesi; alezredesség.
