ALKALOIDA  főnév ..dát, ..dája (gyak. többes számban) (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Az alkáliákhoz hasonló tulajdonságú, lúgos hatású, erősen mérgező szerves vegyület; igen kis adagban gyógyszerül haszn. <span style="color:blue">A legfontosabb alkaloidák a morfium, kinin, koffein, theobromin, nikotin.</span>
