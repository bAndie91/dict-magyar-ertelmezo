APÁCANÖVENDÉK  főnév
<ul><li>1. Apácák iskolájába járó, esetleg a zárdában benn lakó növendék; zárdanövendék.
</li><li>2. (<span style="color:green;font-weight:bold">ritka</span>) Olyan (fő)iskolai növendék, aki egyúttal apáca is.
</li><li>3. (<span style="color:green;font-weight:bold">ritka</span>) Apácának készülő, zárdában élő, de rendtagnak még fel nem vett nő.
</li><li>apácanövendékes.
</li></ul></div>
