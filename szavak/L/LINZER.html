LINZER  [lindzer v. linzër] főnév -t, (-ek), -e [ë, e] (<span style="color:green;font-weight:bold">konyhaművészet</span>)
Lisztből, tojásból és cukorból bő zsiradék hozzáadásával készült, különféleképpen ízesített, omlós édes tészta. <span style="color:blue">Diós, rácsos linzer. Linzert süt.</span> □ Megevett  három mignont, egy linzert , egy fürt szőlőt. (Nagy Lajos)
