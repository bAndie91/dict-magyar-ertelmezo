LÁNCREAKCIÓ  főnév (<span style="color:green;font-weight:bold">fizika</span>)
&lt;A magfizikában&gt; hasadásra képes atommagok között kedvező körülmények létrehozása esetén bekövetkező és a jelenlevő összes hasítható atommagokra átterjedő lavinaszerű, önmagát fenntartó átalakulás, amelynek folyamán az atommagokból nagy energia szabadul fel.
