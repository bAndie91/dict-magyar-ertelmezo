LOMBLEVELŰ  [e-e] melléknév és főnév -t, -ek (-je) [e-e] (<span style="color:green;font-weight:bold">növénytan</span>)
Olyan (növény, főként fa, bokor), amelynek teljes, kifejlett (lomb)levele, tavasszal kihajtó, ősszel lehulló lombja, lombozata van; lombos. <span style="color:blue">Lomblevelű erdő. Ide lomblevelűeket ültetünk.</span>
