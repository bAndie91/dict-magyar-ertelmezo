LÁMPAOSZLOP  főnév
Magas, vékony oszlop, amelyen utcai lámpa van elhelyezve. □ A két barát  két lámpaoszlopra volt akasztva. (Jósika Miklós) Egykettőre kifeszítették a madzagot, egyik végét a lámpaoszlopra, másikat a sarokházra erősítve. (Nagy Lajos)
<ul><li>lámpaoszlopos; lámpaoszlopú.
