LEVESZÖLDSÉG  [s-z] főnév (<span style="color:green;font-weight:bold">konyhaművészet</span>)
Leves főzéséhez szükséges, kis csomóba kötve árusított vegyes zöldség, rendsz. petrezselyemgyökér, zeller, karalábé és sárgarépa együtt. <span style="color:blue">Két csomó leveszöldséget vásárolt. A leveszöldségből hiányzott a répa.</span>
