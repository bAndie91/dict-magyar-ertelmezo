LEVAN  tárgyatlan ige (rendsz. csak jelenben) (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">bizalmas</span>)
&lt;Elvégzendő munka&gt; be van fejezve, le van tudva; túlestem, túlestünk v. a szóban forgó személy túlesett rajta; végére jutottam; kész. <span style="color:blue">Beadtam a jelentést, hát ez is levan.</span>
