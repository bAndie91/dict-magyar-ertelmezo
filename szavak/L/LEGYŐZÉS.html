LEGYŐZÉS  főnév -t, -e [e] (csak egyes számban)
A legyőz igével kifejezett cselekvés, tevékenység; az a cselekvés, hogy vkit, vmit legyőznek; vki, vmi fölött aratott győzelem. <span style="color:blue">A betegség, az ellenfél, az ellenség, a félelem, a nehézségek, az undor legyőzése.</span>
<ul><li>Szóösszetétel(ek): önlegyőzés.
</li></ul></div>
