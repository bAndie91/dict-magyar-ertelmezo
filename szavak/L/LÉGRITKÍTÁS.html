LÉGRITKÍTÁS  főnév -t, -a (csak egyes számban) (<span style="color:green;font-weight:bold">fizika</span>)
A levegő ritkábbá tétele vmely zárt térben az ott lévő levegő egy részének légszivattyúval való eltávolítása útján. || a. (<span style="color:green;font-weight:bold">ritka</span>) A levegőnek ilyen módon csökkentett sűrűsége, ritkított, ritkább volta vhol.
