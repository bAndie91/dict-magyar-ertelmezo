LEVESES  [e-e-ë] melléknév -en, -ebb [e, e]
<ul><li>1. Levessel leöntött, beszennyezett &lt;tárgy&gt;. <span style="color:blue">Leveses lett az abrosz.</span>
</li><li>2. A leves főzéséhez, tartásához, tálalásához, fogyasztásához használatos &lt;eszköz&gt;. <span style="color:blue">Leveses fazék, kondér.</span>
</li><li>3. (<span style="color:green;font-weight:bold">ritka</span>) Lében dús, leves (I) &lt;gyümölcs&gt;. <span style="color:blue">Leveses körte.</span>
</li></ul></div>
