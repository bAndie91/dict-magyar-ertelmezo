LEGYEZŐPÁLMA  főnév
<ul><li>1. Olyan, különféle fajokhoz tartozó pálmák közül vmelyik, amelyeknek széles, legyező alakú leveleik vannak.
</li><li>2. (<span style="color:green;font-weight:bold">növénytan</span>) Európában is vadon élő pálma; nagy, legyező alakú leveleinek rostjából készül az ún, növényi lószőr (Chamaerops humilis).
</li><li>legyezőpálmás.
