LÉGOSZLOP  [g-o] főnév (<span style="color:green;font-weight:bold">fizika</span>, <span style="color:green;font-weight:bold">légkörtan</span>)
Légkörünknek (tudományos vizsgálat végett) kiragadva szemlélt része; vmely meghatározott felület fölött levő, nyomásával arra ható levegőmennyiség. <span style="color:blue">A víz szivattyúzásakor a víz felszíne fölött levő légoszlop súlya nyomja be a vizet a gépezetbe.</span>
</div>
