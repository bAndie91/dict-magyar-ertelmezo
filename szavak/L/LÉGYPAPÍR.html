LÉGYPAPÍR  főnév légypapiros
Édes, ragadós anyaggal bekent, tekercsekben forgalomba hozott papírszalag, amelyet a lakásban kigyöngyölítve felfüggesztenek, hogy a legyek rászállva ráragadjanak; légyfogó papír. □ Rászállt a kapitányné, mint a légy a becukrozott légypapirosra. (Mikszáth Kálmán)
