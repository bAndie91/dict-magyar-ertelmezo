LÓSZERSZÁM  főnév
A ló befogásához, ill. fölnyergeléséhez szükséges, több részből (hám, kantár stb.) álló fölszerelés. □ A holdfénynél villog a lószerszámokon az ékkő és ezüstkarika. (Gárdonyi Géza)
<ul><li>Szóösszetétel(ek): lószerszám-árverés; lószerszámvétel.
</li><li>lószerszámos.
</li></ul></div>
