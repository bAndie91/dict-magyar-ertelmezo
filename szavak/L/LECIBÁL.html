LECIBÁL  tárgyas ige (<span style="color:green;font-weight:bold">bizalmas</span>)
Vmit, vkit cibálva, ide-oda húzogatva, rángatva levesz, lehúz vhonnan. <span style="color:blue">Lecibálja vkiről a kabátot. A szónokot lecibálják az emelvényről.</span> □ [A szögről] a kötelet lecibálta. (Mikszáth Kálmán)
<ul><li>lecibálás; lecibáló; lecibált; lecibáltat.
</li></ul></div>
