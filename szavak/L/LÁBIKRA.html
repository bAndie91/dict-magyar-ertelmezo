LÁBIKRA  [b-i] főnév
Az alsó lábszárnak hátul kidomborodó, izmos, húsos része. <span style="color:blue">A kutya beleharapott a lábikrámba.</span> □ Derék leány. Olyan kemény lábikrája van, mint a kő. (Krúdy Gyula) Szép alakú lábikráján kifeszült a harisnya. (Kosztolányi Dezső)
<ul><li>lábikrájú.
