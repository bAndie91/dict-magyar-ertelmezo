LÉGYÖLŐ  [gy-ö] melléknév (<span style="color:green;font-weight:bold">növénytan</span>)
<span style="color:blue">Légyölő galóca:</span> a galócák egyik mérgező faja; húsa fehér, kalapja vörös v. sárga, tönkje kissé hasas, enyhén gumós, sárga; széles, fehér bocskora zsákszerűen eláll, tejbe v. vízbe áztatva olykor legyek pusztítására haszn. (Amanita muscaria).
