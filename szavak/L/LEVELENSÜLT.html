LEVELENSÜLT  [e-e-ë] főnév, (<span style="color:green;font-weight:bold">ritka</span>) levélensült [e-ë] (<span style="color:green;font-weight:bold">tájszó</span>)
Lepényféle, vékony sütemény, amelyet káposztalevélre téve szoktak a kemencébe vetni s úgy megsütni. □ A kürtőskalácsig és levelensültig ott volt a székely konyha minden pompája, dicsősége. (Mikszáth Kálmán)
