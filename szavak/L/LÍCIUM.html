LÍCIUM  főnév -ot, -a líceum [ë]
Rendsz. sövénynek ültetett, sűrű, bokros cserje; liláspiros, egész nyáron át nyíló virága és piros bogyótermése van (Lycium halimifolium); sefűsefa. □ A kerítések deszkából készültek, néhol lécből, itt-ott líceum is akad még. (Nagy Lajos)
<ul><li>líciumos.
