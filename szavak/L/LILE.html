LILE  [e] főnév lilét, liléje [e] (<span style="color:green;font-weight:bold">állattan</span>)
A szalonkák rendjébe tartozó, mocsaras, iszapos helyen élő, rövid lábú, rövid csőrű kisebb madár (Charadrius). <span style="color:blue">Kis, parti, széki lile.</span> □ Hiába ment hát  a sürűbe dalolni, oly hangon mint egy lile  (Arany JánosArisztophanész-fordítás)
