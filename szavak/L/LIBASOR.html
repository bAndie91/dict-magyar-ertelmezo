LIBASOR  főnév (csak -ban, -ba raggal)
Egyesével egymás mögött elhelyezkedő élőlények, főleg emberek sora. <span style="color:blue">Libasorban megy, vonul, halad; libasorba állít vkiket.</span> □ A három kárakatona szabályos libasorban, biztos távolságban hasította a vizet. (Herczeg Ferenc)
