LÉGHULLÁM  főnév (<span style="color:green;font-weight:bold">légkörtan</span>)
Két különböző hőmérsékletű nagyobb levegőtömeg érintkezéséből keletkező hullámszerű légmozgás, amely hatással van az időjárásra. <span style="color:blue">Meleg, nedves léghullám.</span> || a. Ilyen mozgással áramló légtömeg. <span style="color:blue">Meleg léghullám borította el a Kárpát-medencét.</span>
