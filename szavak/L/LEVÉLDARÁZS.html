LEVÉLDARÁZS  főnév (<span style="color:green;font-weight:bold">állattan</span>)
<span style="color:blue">Levéldarazsak:</span> a hártyásszárnyú rovarok egyik családja; petéiket zöld levél belsejébe rakják, lárváik levelekkel, növénynedvekkel táplálkoznak (Tenthredinidae). || a. Ebbe a családba tartozó rovar. <span style="color:blue">Hasadt csápú levéldarázs</span> (Schizocera furcata).
