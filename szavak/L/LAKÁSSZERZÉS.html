LAKÁSSZERZÉS  [s-sz] főnév
Az az eljárás, amellyel vki magának v. másnak lakást (23) szerez v. igyekszik szerezni. <span style="color:blue">A lakásszerzés sok utánjárást kíván. Sikerült a lakásszerzés.</span> || a. Ennek eredménye: az a tény, hogy vki lakást szerzett. <span style="color:blue">Lakásszerzés után megházasodott.</span>
<ul><li>lakásszerzési.
</li></ul></div>
