LÁTOGATOTT  melléknév -an, -abb (főként jelzőként) (kissé <span style="color:green;font-weight:bold">választékos</span>)
Olyan hely(iség), intézmény, ahol sokan megfordulnak, ahová sokan járnak, amelyet sokan látogatnak; kedvelt, népszerű. <span style="color:blue">Látogatott fürdőhely, előadások, mozi.</span>
