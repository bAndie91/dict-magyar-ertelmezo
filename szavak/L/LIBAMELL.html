LIBAMELL  főnév
A levágott és megtisztított liba különválasztott melle(húsa), amelyet emberi táplálékul használnak fel. <span style="color:blue">Vett egy egész libamellet.</span> || a. Az ebből készített étel. <span style="color:blue">Füstölt, sült libamell; vagdalt libamell:</span> libamellből készített vagdalt hús.
