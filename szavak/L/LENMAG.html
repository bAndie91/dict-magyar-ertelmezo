LENMAG  [mm v. nm] főnév
A len sárgásbarna, fénylő, kellemetlen szagú, 45 mm nagyságú magja, amelyből ipari és étolajat, ill. gyógyszert készítenek. <span style="color:blue">A lenmag kb. 30 százalék olajat tartalmaz.</span>
<ul><li>Szóösszetétel(ek): lenmagfőzet; lenmagkészlet; lenmagliszt; lenmagnemesítő; lenmagpogácsa.
</li></ul></div>
