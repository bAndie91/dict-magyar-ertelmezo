LÉGMELL  főnév (<span style="color:green;font-weight:bold">orvostudomány</span>)
Az a (kóros) állapot, amikor a mellüregben levegő halmozódik fel (pneumothorax). <span style="color:blue">(Mesterséges) légmell:</span> gyógykezelés végett levegő bevezetése a mellüregbe.
<ul><li>Szóösszetétel(ek): légmellkezelés.
</li><li>légmelles.
</li></ul></div>
