LAZÚRKŐ  főnév (<span style="color:green;font-weight:bold">ásványtan</span>)
Azúrkék színű, gyak. apró sárga szemcsékkel tarkázott, ékkőnek haszn. ásvány (Lapis lasuli). □ [A termet] egy világító kék boltozat fedezi be, melynek gerezdjei lazúrkővel vannak kirakva. (Jókai Mór)
