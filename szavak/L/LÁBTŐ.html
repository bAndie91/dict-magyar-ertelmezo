LÁBTŐ  főnév (<span style="color:green;font-weight:bold">ritka</span>)
<ul><li>1. (<span style="color:green;font-weight:bold">bonctan</span>) A lábfejnek a boka és a láb közepe közt elhelyezkedő, hét szabálytalan alakú csontból álló része. <span style="color:blue">A lábtő csontjai megsérültek.</span>
</li><li>2. (<span style="color:green;font-weight:bold">állattan</span>) Négylábú állat végtagjának a lábszár fölötti ízülete. <span style="color:blue">A hátulsó lábtő a csánk.</span>
</li><li>Szóösszetétel(ek): lábtőcsont.
</li></ul></div>
