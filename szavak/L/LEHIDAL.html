LEHIDAL  tárgyas ige -t, -jon (<span style="color:green;font-weight:bold">tájszó</span>)
Ráfekve v. rajta hancúrozva összegyűr, lenyom, lehever v. rendetlenné tesz vmit. <span style="color:blue">A gyerekek lehidalták az ágyat.</span> □ [A katonák] lehidalják a szalmát, amit másnap az ökrökkel fel kell étetnem. (Jókai Mór)
<ul><li>lehidalás; lehidaló; lehidalt.
