LEMENÉS  főnév -t, -ek, -e [ë, e] (<span style="color:green;font-weight:bold">ritka</span>)
A lemegy (I. 12) igével kifejezett mozgás, cselekvés; az a tény, hogy vki, vmi lemegy (vhonnan, vhová). <span style="color:blue">A lépcsőn való lemenés. Lemenés közben elesett. Miért húzódozik a vidékre való lemenéstől?</span>
