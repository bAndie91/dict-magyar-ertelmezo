LÉLEKÖLŐ  [k-ö] melléknév (<span style="color:green;font-weight:bold">választékos</span> gyak <span style="color:green;font-weight:bold">túlzó</span>)
A lélekre (3b), a kedélyre egyhangúságánál, a magasabb szellemi tevékenységet bénító v. lehetetlenné tevő voltánál fogva nyomasztólag ható. <span style="color:blue">Lélekölő munka, unalom.</span> □ Megundorodtam a kisszerű, lélekölő bürokratikus kényszerzubbonytól. (Tolnai Lajos)
