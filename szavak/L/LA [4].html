&lt;Idegenszerűen szerkesztett határozóban, ebben az idegen kapcsolatban:&gt; <span style="color:blue">ŕ la [ĺlĺ]:</span> &lt;vmely név, szó, kifejezés előtt:&gt; vkinek, vminek a módján, modorában; szerint. <span style="color:blue">Ŕ la Mikszáth: ŕ la carte [ŕlĺkĺrt]:</span> &lt;vendéglátó üzemben&gt; étlap szerint (étkezik).
