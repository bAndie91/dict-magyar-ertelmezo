<div class="szocikk">
LÉTREJÖTTE  [e-e] főnév (személyragos)
&lt;A személyraggal jelölt szervezet, viszony, helyzet, állapot, alkotás stb.&gt; valósággá levése, létezni kezdése, keletkezése, létrejövése; az a tény, hogy vmi létrejön, ill. létrejött (13). <span style="color:blue">A fegyverszünet, az intézmény, a megegyezés létrejötte.</span>
