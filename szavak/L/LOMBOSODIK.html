LOMBOSODIK  tárgyatlan ige -ott, -jék (-jon) (csak 3. személyben)
Lombjai kezdenek nőni; lomb nő rajta. <span style="color:blue">Lombosodik az erdő. Lombosodnak a gesztenyefák.</span>
<ul><li>Igekötős igék: ellombosodik; kilombosodik; meglombosodik.
</li><li>lombosodás; lombosodó.
</li></ul></div>
