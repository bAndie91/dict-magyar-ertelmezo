LÉGZŐSZERV  főnév (rendsz. többes számban) (<span style="color:green;font-weight:bold">biológia</span>)
<span style="color:blue">Légzőszervek:</span> az élőlényeknek azok a szervei (orr, garat, gége, légcső, hörgők, tüdő, kopoltyú), amelyek segítségével az oxigént felveszik, az elhasznált levegőt, gyak. a kiválasztott víz egy részét is kivezetik.
<ul><li>légzőszervi; légzőszervű.
