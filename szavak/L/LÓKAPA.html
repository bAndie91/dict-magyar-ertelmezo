<div class="szocikk">
LÓKAPA  főnév (<span style="color:green;font-weight:bold">mezőgazdaság</span>)
Több kés v. kapa alakú művelő vassal fölszerelt, lóval vontatott, ekeszerű mezőgazdasági gép; haladás közben a sorba vetett növények sorközeit porhanyítja, a gyomot kivágja, a kézi kapálást részben pótolja.
<ul><li>Szóösszetétel(ek): lókapa-alkatrész.
</li></ul></div>
