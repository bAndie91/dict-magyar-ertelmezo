<div class="szocikk">
LÉGGYÖKÉR  [g-gy] főnév (<span style="color:green;font-weight:bold">növénytan</span>)
Egyes növények föld feletti részeiből (szárból, ágból) eredő, a levegőben csüngő v. a talajba hatoló gyökér, amely táplálék fölvételére, ill. a növény támasztékául alkalmas. → <span style="color:blue">Kapaszkodó léggyökér; tápláló, támasztó, valódi léggyökér.</span>
</div>
