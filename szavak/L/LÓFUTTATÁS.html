LÓFUTTATÁS  főnév
<ul><li>1. (<span style="color:green;font-weight:bold">ritka</span>) Lónak könnyű ügetésben v. vágtában való futtatása vmely céllal. □ Ami eleinte lófuttatás volt, az utóbb lóverseny lőn. (Vörösmarty Mihály)
</li><li>2. (<span style="color:green;font-weight:bold">régies</span>) Lóverseny. □ Börzét, lófuttatást  a régi nemesség nem ismert. (Eötvös Károly)
</li></ul></div>
