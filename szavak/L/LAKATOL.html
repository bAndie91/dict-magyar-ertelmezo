LAKATOL  tárgyas ige -t, -jon
Vmit lakattal hozzáerősít vmihez. <span style="color:blue">A kerékpárt a fához lakatolja.</span> □ Az istállóajtó közepébe rakja be a vasrudat, és azt lakatolja. (Tömörkény István)
<ul><li>Igekötős igék: belakatol; lelakatol; odalakatol; rálakatol.
</li><li>lakatolás; lakatoló; lakatolt.
</li></ul></div>
