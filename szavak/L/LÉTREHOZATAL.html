LÉTREHOZATAL  főnév
A létrehoz (12) igével kifejezett cselekvés, eljárás, tevékenység, ill. az a cselekvés, hogy vmit létrehoznak; létrehozás, megalkotás, megteremtés. <span style="color:blue">Új szervezetek létrehozatala. A megegyezés létrehozatalában nagy része volt neki.</span>
