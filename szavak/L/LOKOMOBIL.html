<div class="szocikk">
LOKOMOBIL  főnév -t, -ok, -ja (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Egy helyben dolgozó, vontatható v. magánjáró gőzgép, amelyet rendsz. mezőgazdasági gépek (cséplőgép, gabonatisztítók, gőzeke) működtetésére, meghajtására használnak.
<ul><li>Szóösszetétel(ek): lokomobilkazán; lokomobilszerelvény.
</li><li>lokomobilos.
</li></ul></div>
