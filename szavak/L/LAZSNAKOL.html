LAZSNAKOL  tárgyas ige -t, -jon (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">népies</span>)
Ver, ütlegel, püföl vkit; páhol. □ Zeng, bömböl az egész ház, csak én ülök a kuckóban  és tűröm, hogy az apám lazsnakolja a két csemetét. (Móricz Zsigmond)
<ul><li>Igekötős igék: ellazsnakol; meglazsnakol.
</li><li>lazsnakolás; lazsnakoló.
</li></ul></div>
