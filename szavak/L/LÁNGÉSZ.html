LÁNGÉSZ  [g-é] főnév
Lángelme (1, 2). □ A lángész teremtő ihletése Ösvényt lobbant sötét homályokon. (Kisfaludy Károly) A hülye azt mondja a lángésznek: bolond. (Juhász Gyula) Róbert ezekben a történetekben  váratlanul felbukkant hadvezéri lángész volt. (Karinthy Frigyes)
