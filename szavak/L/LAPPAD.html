LAPPAD  tárgyatlan ige -t, -jon (<span style="color:green;font-weight:bold">ritka</span>)
&lt;Duzzadt, felfújt tárgy, daganat v. dagadt testrész&gt; domborulatából veszít, duzzadtsága szűnik; lohad. <span style="color:blue">Lappad a duda, a hólyag, a kovász. Dagadt az arca, de már lappad.</span>
<ul><li>Igekötős igék: lelappad; meglappad.
</li><li>lappadás; lappadó; lappadt.
