LÁBASFEJŰ  [e] főnév (-t), -ek, (-je) [e, e] (<span style="color:green;font-weight:bold">állattan</span>)
<span style="color:blue">Lábasfejűek:</span> a puhatestűek törzsének legfejlettebb osztályát alkotó tengeri állatok; fejükből nyolc v. tíz hosszú kar nyúlik ki. <span style="color:blue">A polip és a tintahal is a lábasfejűek közé tartozik.</span>
