LEFŰRÉSZEL  tárgyas ige
Fűrésszel levág. <span style="color:blue">Lefűrészeli az ágat.</span> □ A rablóknak sikerült láncaikat lefűrészelni. (Jókai Mór) Másnap lefűrészelték a térdem kalácsa alatt a lábamat, s megint bekötötték. (Gárdonyi Géza)
<ul><li>lefűrészelés; lefűrészelget; lefűrészelhető; lefűrészelt; lefűrészeltet.
