LÉGIHÍD  főnév (<span style="color:green;font-weight:bold">1945 után</span>)
Repülőgépekkel létesített légi összeköttetés a megszakadt földi közlekedés helyett, ill. két egymástól akadályokkal elválasztott, a külvilágtól elvágott hely között utánpótlás, fölszerelés, emberek szállítására. <span style="color:blue">Légihidat létesítettek az expedíció élelmiszerellátására.</span>
