LÁMPAÜVEG  főnév
Vmely világító test, fényforrás, lámpa elé védelmül v. egyéb céllal helyezett üveg alkatrész. || a. A petróleumlámpa lángját a léghuzam ellen védő, rendsz. alul kiöblösödő üveghenger. □ Pucold meg a lámpaüveget, csupa korom, az este sem tudtam olvasni. (Nagy Lajos)
