LÉGOLTALMI  [g-o] melléknév (<span style="color:green;font-weight:bold">hivatalos</span>)
Légoltalommal kapcsolatos, rá vonatkozó. <span style="color:blue">Légoltalmi kiképzés, szabályok.</span> || a. A légoltalmat irányító &lt;személy, szerv&gt;. <span style="color:blue">Légoltalmi parancsnok; légoltalmi központ, parancsnokság.</span> || b. A légoltalom céljaira használatos. <span style="color:blue">Légoltalmi óvóhely, pince.</span>
