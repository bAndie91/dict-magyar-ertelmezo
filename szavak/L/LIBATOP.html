LIBATOP  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
Utak szélén, romok között, de szántóföldön is élő, a földön szétterülő gyomnövény. <span style="color:blue">Fakó, fehér, sziki libatop.</span> || a. Az ilyen kétszikű növényeket magában foglaló növénynemzetség (Chenopodium).
