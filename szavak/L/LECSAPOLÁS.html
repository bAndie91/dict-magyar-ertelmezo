LECSAPOLÁS  főnév -t, (-ok), -a
A lecsapol igével kifejezett cselekvés, eljárás, művelet; az a cselekvés, hogy vmit lecsapolnak; folyadék levezetése (vhonnan). <span style="color:blue">A genny, a mocsár, a vér lecsapolása. Megkezdődik az árterületek lecsapolása.</span>
<ul><li>lecsapolási.
</li></ul></div>
