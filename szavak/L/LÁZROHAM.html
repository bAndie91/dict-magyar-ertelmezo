LÁZROHAM  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Hirtelen támadó és hamar elmúló magas láz; paroxizmus. □ Mikor  a lázroham percnyi csendet hagyott, akkor ismét okosan beszélt. (Jókai Mór) Mai viseletemet számítsa ön be, kérem, szokott betegségem megújuló lázrohamainak. (Mikszáth Kálmán)
