LANGYOSÍT  tárgyas ige -ott, -son; -ani
Melegítéssel v. ritk. hűtéssel fokozatosan langyossá tesz. <span style="color:blue">Vizet langyosít. A forró tejet langyosítani kell, mielőtt megisszuk.</span>
<ul><li>Igekötős igék: ellangyosít; lelangyosít; meglangyosít.
</li><li>langyosítgat; langyosítható; langyosító; langyosíttat.
</li></ul></div>
