LÉTSZÁM-KIEGÉSZÍTÉS  főnév (<span style="color:green;font-weight:bold">hivatalos</span>)
Vmely üzem, vállalat, intézmény, hivatal munkaközösségébe, vmely szervezet egységébe tartozó személyek létszámának a megállapított felső határig való kiegészítése. <span style="color:blue">A növekvő feladatok szükségessé teszik a létszám-kiegészítést.</span>
