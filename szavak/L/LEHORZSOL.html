LEHORZSOL  tárgyas ige
<span style="color:blue">Lehorzsol vmit:</span> horzsolva kisebb mértékben lehántja, leválasztja vminek a felszíni rétegét. <span style="color:blue">Elesett, és lehorzsolta a térdét. Mászás közben a fa kérge lehorzsolta lába szárán a bőrét. Költözködéskor a bútorokkal lehorzsolták a falat.</span>
<ul><li>lehorzsolás; lehorzsoló; lehorzsolt.
</li></ul></div>
