LÉTRAÁLLVÁNY  főnév (<span style="color:green;font-weight:bold">építészet</span>)
Egymástól rendsz. 23 méter távolságban elhelyezett létrákból és ezek fokain keresztbe fektetett pallókból összeillesztett állvány, amelyet építkezéskor, tatarozáskor szoktak a fal mellé állítani. <span style="color:blue">A létraállvány már az ötödik emeletig ér.</span>
<ul><li>létraállványos.
</li></ul></div>
