LÁPVIRÁG  főnév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Kapitalista országok nagyvárosainak züllött környezetében élő, de tisztaságát megőrző fiatal lány, ritk. férfi. □ Füstös az ég abban az utcában, Ahol én, mint lápvirág fakadtam. (Juhász Gyula)
