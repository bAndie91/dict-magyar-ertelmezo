ÍRATLAN  [í v. i] melléknév -ul
Olyan, amit nem írtak le; írásba nem foglalt. <span style="color:blue">Íratlan hagyomány; íratlan irodalom ←; íratlan jogszokás; íratlan törvény:</span> a hagyománytól szentesített, általánosan elfogadott és kötelezőnek elismert szokás.
