ÍRÓSZOBA  főnév (<span style="color:green;font-weight:bold">régies</span>)
&lt;Házban, szállóban, lakásban&gt; az a szoba, amelyben íróasztal és írószerek állnak rendelkezésre, s amely arra való, haszn., hogy benne írjanak; dolgozószoba. □ Délután bezárkózott az írószobájába. (Mikszáth Kálmán)
