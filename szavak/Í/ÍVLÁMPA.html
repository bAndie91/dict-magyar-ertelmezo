ÍVLÁMPA  főnév (<span style="color:green;font-weight:bold">villamosság</span>)
Ívfénnyel világító lámpa. □ A vonat a föld alatti pályaudvar ívlámpáinak fehér fényében óriási tömeget öntött ki magából. (Hunyady Sándor) A bronzsárkány hátából magas oszlop nyúlt fölfelé, a végében négy ívlámpa. (Nagy Lajos)
<ul><li>ívlámpás.
