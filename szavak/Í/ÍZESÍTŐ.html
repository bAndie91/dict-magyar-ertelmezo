ÍZESÍTŐ  [ë v. e] melléknév és főnév -t, -je [e]
Olyan (fűszer v. fűszerekből és egyéb ízes anyagokból összeállított készítmény), amelynek hozzáadása az ételnek, italnak kellemes ízt ad. <span style="color:blue">Ízesítő anyagok. Paradicsomból és paprikából kitűnő ízesítőt készíthetünk.</span>
