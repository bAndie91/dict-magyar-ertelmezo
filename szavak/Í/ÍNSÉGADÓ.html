ÍNSÉGADÓ  [g-a] főnév (<span style="color:green;font-weight:bold">1945 előtt</span>, <span style="color:green;font-weight:bold">hivatalos</span>)
Olyan adó, amelyet a társadalmi gondozásra szorulók segélyezése végett vetettek ki; szegényadó. □ Hogy ez fizessen inségadót? A bukott kereskedő? még a mennybeli jussa se az övé, mert tán arra is rátenyereltek a bankok. (Móra Ferenc)
