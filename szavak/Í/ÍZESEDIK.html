ÍZESEDIK  [ë-ë v. e-ë] tárgyatlan ige -ett, -jék (-jen) [ë, ë]
Fokozatosan ízessé (I. 1) v. ízesebbé, jóízűvé v. jobb ízűvé válik. <span style="color:blue">Ízesedik</span> v. <span style="color:blue">ízesedni kezd a gyümölcs. A paprikától ízesedik az étel.</span>
<ul><li>Igekötős igék: megízesedik.
</li><li>ízesedés; ízesedő; ízesedett.
