ÍTÉLETVÉGREHAJTÓ  főnév (<span style="color:green;font-weight:bold">hivatalos</span>)
A halálos ítéletet végrehajtó hatósági személy; hóhér. <span style="color:blue">Állami ítéletvégrehajtó. Az ítéletvégrehajtó teljesíti kötelességét.</span> □ A főügyész intett az állami ítéletvégrehajtónak, hogy teljesítse kötelességét. (Móra Ferenc)
