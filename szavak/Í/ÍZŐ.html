ÍZŐ  melléknév (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
Olyan &lt;kiejtés, nyelvjárás, ritk. személy&gt;, amelynek, akinek jellemző sajátossága az ízés. <span style="color:blue">Íző egyén, nyelvjárás. Íző kiejtéssel beszél.</span> □ Az í-ző tájak egyik gócában növekedve, könnyű nekem, csupán emlékezetből, összeszedni ez adatokat. (Arany János)
