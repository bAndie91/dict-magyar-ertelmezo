ÍRÓVESSZŐ  főnév
<ul><li>1. (<span style="color:green;font-weight:bold">történettudomány</span>) Az egyik végén hegyesre, a másik végén pedig laposra faragott (fém)vessző, amellyel az ókorban viasszal bevont fatáblára írtak; stílus.
</li><li>2. (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">régies</span>) Palából készült vékony rudacska, a palatáblára való írás eszköze; palavessző.
