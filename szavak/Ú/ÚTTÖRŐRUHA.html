ÚTTÖRŐRUHA  főnév (<span style="color:green;font-weight:bold">1945 után</span>)
Az úttörők (II. 3) egyenruhája, mely sötétkék, csúcsos végű, ellenző nélküli sapkából, fehér v. sötétdrapp ingből, vörös nyakkendőből és sötétkék v. sötétdrapp színű, rövid szövet- v. vászonnadrágból, ill. szoknyából áll.
<ul><li>úttörőruhájú; úttörőruhás.
</li></ul></div>
