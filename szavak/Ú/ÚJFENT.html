ÚJFENT  [ú-ë v. ú-e v. u-e] határozószó (<span style="color:green;font-weight:bold">régies</span>)
Újra, ismét, megint. □ E gondolat kellett hogy csüggedő lelke Nagyságát, erejét ujfent visszanyerje. (Arany János) Újfent morognak salabakterék: Mi magyarságunk nekik nem elég. (Ady Endre) Újfent vár a néma Komoly magány. (Juhász Gyula)
<ul><li>újfenti.
