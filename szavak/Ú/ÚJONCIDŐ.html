ÚJONCIDŐ  [c-i] főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Az újoncok kiképzésére való, szánt, megszabott idő; ill. az az idő, amíg vki újonc. <span style="color:blue">Letelt az újoncideje. Újoncidejét vidéken töltötte.</span>
<ul><li>újoncidejű; újoncidős.
