CÉHLEVÉL  [célevél] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
<ul><li>1. A céh (1) kiváltságait biztosító, szervezetét, belső életét szabályozó oklevél, amelyet az uralkodó adott ki.
</li><li>2. A céh (1) elöljárósága részéről a céh (1) tagjai számára kiadott mesterlevél v. más hivatalos irat.
</li><li>céhleveles.
</li></ul></div>
