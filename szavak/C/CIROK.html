<div class="szocikk">
CIROK  főnév cirkot v. -ot, -ja (csak egyes számban)
A pázsitfüvek közé tartozó s a köleshez hasonló, gyak. az ember magasságánál is nagyobbra növő ipari növény; elszáradt virágzatából seprűt kötnek (Sorghum vulgare).
<ul><li>Szóösszetétel(ek): 1. cirokmag; cirokszakáll; cirokszár; 2. seprűcirok.
</li></ul></div>
