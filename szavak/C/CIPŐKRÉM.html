CIPŐKRÉM  [ő-k] főnév
Viaszt, parafint, terpentint és festőanyagot tartalmazó krém (2a) a cipő v. más lábbeli bőrének fényesítésére, tartósabbá tételére; cipőpaszta, cipőkenőcs. <span style="color:blue">Barna, fehér, fekete, sárga cipőkrém.</span> □ Valamelyik hídon cipőkrémet árult. (Gelléri Andor Endre)
<ul><li>cipőkrémes.
