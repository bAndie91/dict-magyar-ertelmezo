CIGÁNYZENÉSZ  főnév (<span style="color:green;font-weight:bold">elavulóban</span>)
Olyan cigány (1), aki, rendsz. mint vmely cigányzenekar tagja, zenéléssel foglalkozik; népzenész. □ Megtehettem volna, hogy a magyar deréksereggel vonulok tovább, ott szívesen látták a cigányzenészt. (Jókai Mór)
cigányzenészes; cigányzenészi.
