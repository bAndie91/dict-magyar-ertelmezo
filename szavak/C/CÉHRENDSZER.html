CÉHRENDSZER  [cérëntszër] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
&lt;A hűbériség korában&gt; az a rendszer, amelyben az azonos szakmájú kézművesek és kalmárok céhekbe (1) tömörültek; az ipari fejlődésnek a manufaktúrát és a gyáripart megelőző formája. <span style="color:blue">A céhrendszer bomlása, bukása, kialakulása, kifejlődése.</span>
