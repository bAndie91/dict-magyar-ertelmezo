CÉLGÖMB  főnév
Kézi lőfegyver csövének végére szerelt kis gömb, ill. ma ék v. rúd alakú alkatrész, amely a célponttal és a nézőkével egy vonalba állítva lehetővé teszi a pontos célzást. → <span style="color:blue">Csapott célgömbbel.</span>
<ul><li>célgömbös; célgömbtelen.
</li></ul></div>
