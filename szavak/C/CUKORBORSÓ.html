CUKORBORSÓ  főnév
<ul><li>1. Korai édes borsót termő növény (Pisum sativum var. saccharatum). <span style="color:blue">Kapálni kell a cukorborsót.</span>
</li><li>2. E növény termésének hüvelye a benne levő szemekkel. <span style="color:blue">Lehet szedni a cukorborsót.</span>
</li><li>3. Ennek szemeiből főzött étel. <span style="color:blue">Cukorborsó lesz ebédre.</span>
</li></ul></div>
