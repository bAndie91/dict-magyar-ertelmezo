PÁSZTORÓRA  [r-ó] főnév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Szerelmeseknek magányos helyen szeretkezve együtt töltött ideje. □ Ott fönt  a kis padlászugban valóságos pásztorórát töltöttek. (Mikszáth Kálmán) Edouardra nem pásztoróra vár, hanem egész sora a  kalandoknak. (Ambrus Zoltán)
pásztorórai; pásztorórás.
