Törvényszolga, hajdú. □ A néhány fegyveres poroszló  közrefogott. (Táncsics Mihály) Ha zörren egy levél, Poroszlót jőni vél Kanizsa, Rozgonyi. (Arany János) || a. (<span style="color:green;font-weight:bold">régies</span>) Börtönőr (12). □ A hír a kínzó vagy szabadító poroszló. (Csokonai Vitéz Mihály)
