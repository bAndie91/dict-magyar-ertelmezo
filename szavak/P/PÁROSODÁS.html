PÁROSODÁS  főnév -t, -ok, -a
A párosodik igével kifejezett cselekvés; állatok nemi egyesülése, közösülése; párzás. <span style="color:blue">A párosodás ideje.</span> □ [A kolibrik] olyanok, mintha a madaraknak pillangókkal párosodásukból eredtek volna. (Jókai Mór)
