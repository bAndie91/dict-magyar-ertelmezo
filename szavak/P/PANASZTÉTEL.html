PANASZTÉTEL  főnév (<span style="color:green;font-weight:bold">elavulóban</span>)
Vmely panasznak (23) főként vmely hatóság előtt szóban v. írásban való előadása és orvoslásának kérése. <span style="color:blue">Panasztételre jelentkezik, megy. Panasztétel végett a bírósághoz fordul.</span> □ Lambertus volt az elsők között, kik siettek panasztételükkel előkerülni. (Jókai Mór)
