PAPÍRÜZLET  [r-ü] főnév (<span style="color:green;font-weight:bold">ritka</span>)
Papírkereskedés (1). <span style="color:blue">A papírüzletben töltőtollakat is árusítanak.</span> □ Csupán a papírüzletek kirakata mögött tombolt a farsang; a lila orrú mandarinok, ferde szemű muzsikok és gyapjas hajú négerek álorcái ott búsongtak eladatlanul. (Gelléri Andor Endre)
