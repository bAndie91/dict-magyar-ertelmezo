PISKOLC  főnév -ot, -a, piskolt -ot, -ja (<span style="color:green;font-weight:bold">ásványtan</span>, <span style="color:green;font-weight:bold">elavult</span>)
Kékesfehér, fényes, könnyen hasadó, karcsú, oszlopos kristályokból álló fém, az antimon legfontosabb érce. □ Bányájában rézen kívül piskoltot és kénesőt is termelt. (Jókai Mór)
