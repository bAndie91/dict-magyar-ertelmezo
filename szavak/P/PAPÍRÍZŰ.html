PAPÍRÍZŰ  [r-í] melléknév -en [e], -bb (<span style="color:green;font-weight:bold">rosszalló</span>)
Olyan &lt;irodalmi mű, írói ábrázolás(mód)&gt;, amely nem a valóságot, az életet festi, tükrözi, hanem az író vérszegény elképzelését; nem életszerű, élettelen, kiagyalt, papírszagú. <span style="color:blue">Papírízű cselekmény. Az egész mű papírízű.</span>
