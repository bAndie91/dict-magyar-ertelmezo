PÓKHAS  főnév (gyak. <span style="color:green;font-weight:bold">gúnyos</span>)
Vékony lábszárú és combú személynek, főleg férfinak potrohszerűen előre gömbölyödő nagy hasa. <span style="color:blue">Csak a fürdőben látszott meg, hogy milyen csúnya pókhasa van.</span> □ A pókhas feszül, mint a dob, majd szétpattantja az aranytól futtatott óraláncot. (Móra Ferenc)
pókhasú.
