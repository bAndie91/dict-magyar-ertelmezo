PARASZTKOCSI  főnév
Olyan kisebb, könnyű szekér, amilyet a parasztok főleg személyek fuvarozására szoktak használni. □ Vidor könnyűséggel szállott le a zötyögős parasztkocsiról. (Tolnai Lajos) Kocsit értünk utól. Parasztkocsi volt, mint a miénk. (Gárdonyi Géza)
parasztkocsis.
