PRIZMÁZÁS  főnév -t, -a (csak egyes számban) (<span style="color:green;font-weight:bold">műszaki nyelv</span>, <span style="color:green;font-weight:bold">mezőgazdaság</span>)
Az a cselekvés, hogy vmit prizmába (23) raknak; kül. egyes terményeknek ilyen módon való tárolási módja. <span style="color:blue">A homok, a kőzúzalék prizmázása; a burgonya, a cukorrépa prizmázása.</span>
