PÁLYATÉR  főnév (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Működési terület, lehetőség. □ Regényem időszakában a világviszonyok a hiú kalandoroknak csillogóbb pályatért nyitottak, mint most. (Kemény Zsigmond) Csécse ott állott, mint pályatér, ahol annyi élet lejátszotta már a maga körét. (Móricz Zsigmond)
