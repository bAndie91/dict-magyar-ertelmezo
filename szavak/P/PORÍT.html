PORÍT  tárgyas ige -ott, -son; -ani v. (-ni) (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
A nedvesség, a víz elvonásával, tartósítás végett, műszaki eljárással porrá alakít vmit. <span style="color:blue">Porítja a faszenet, a tejet, a tojást.</span>
<ul><li>Igekötős igék: elporít.
</li><li>porítás; porítható; porító; porított; poríttat.
</li></ul></div>
