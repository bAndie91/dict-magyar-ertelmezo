PARÁZNÁLKODÁS  főnév -t, -ok, -a (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">választékos</span>)
A paráználkodik igével kifejezett cselekvés, életmód; bujálkodás, nemi kicsapongás, házasságtörés. □ Szelinkai, a mézeskalácsos, midőn részeg fejjel megúnta felesége paráználkodásait, öngyilkos lett. (Krúdy Gyula)
