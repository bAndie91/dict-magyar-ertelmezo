PÉNZESZSÁK  [s-zs] főnév
<ul><li>1. (<span style="color:green;font-weight:bold">régies</span>) Kisebb zsák v. zacskó, amelyben érc- v. fémpénzt tartanak.
</li><li>2. (<span style="color:green;font-weight:bold">átvitt értelemben</span>, <span style="color:green;font-weight:bold">gúnyos</span>) Nagyon gazdag, de rendsz. fukar ember. <span style="color:blue">Dölyfös pénzeszsák.</span> □ Az ember mind csak pénzes zsák, Szólni hozzá hasztalan; Szive nincs, csak szijja van. (Arany János)
</li></ul></div>
