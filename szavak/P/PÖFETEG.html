PÖFETEG  [e-e] főnév -et, -e [ë, e] (<span style="color:green;font-weight:bold">növénytan</span>)
Pöfeteggomba. <span style="color:blue">Kis, nyeles, óriás pöfeteg.</span> □ Csoda alakú gombák üték fel fejeiket egyszerre; szömörcsögök és pöfetegek. (Jókai Mór) Fényes pöfeteg buggyan ki a cső zöld burkából, melynek hámján átüt fekete tartalmának a színe. (Nagy Lajos)
