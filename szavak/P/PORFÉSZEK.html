PORFÉSZEK  főnév (<span style="color:green;font-weight:bold">rosszalló</span>)
Porlepte, takarítatlan, elhanyagolt helyiség v. olyan falu, város, amelyben az utcák kövezetlensége miatt v. más okból nagy por van. <span style="color:blue">Ebben a porfészekben élt tíz évig.</span> □ Kis porfészek volt nyáron az a falu. (Gárdonyi Géza)
