PLISZÉ  főnév -t, -je [e] (<span style="color:green;font-weight:bold">ruházkodás</span>)
&lt;Női szoknyán v. blúzon&gt; géppel készített, sűrűn egymás mellett következő, egymásra boruló, 12 cm-nél nem mélyebb, élesre vasalt hajtás, berakás, ill. redőzés, boruló ránc. <span style="color:blue">Kibomlott a pliszé.</span>
