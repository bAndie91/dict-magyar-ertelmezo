PÁRTBIZALMI  főnév (<span style="color:green;font-weight:bold">politika</span>, <span style="color:green;font-weight:bold">1945 után</span>)
&lt;A kommunista pártokban&gt; a pártcsoport vezetője, aki a pártcsoport megbeszéléseit vezeti, az alapszervezet vezetőségének határozatait közli és végrehajtja a pártcsoport tagjaival, észrevételeiket továbbítja a vezetőséghez stb.; pártcsoportbizalmi.
