PEZSDÍT  [ë] tárgyas ige -ett, -sen [ë, ë]; -eni [e] v. (-ni) (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">választékos</span>)
&lt;Érzelmi hatás, szénsavas fürdő v. szeszes ital vért&gt; gyorsabb keringésre késztet. <span style="color:blue">A gyors talpalávaló pezsdíti a vért.</span>
<ul><li>Igekötős igék: felpezsdít; megpezsdít.
</li><li>pezsdítés; pezsdített; pezsdíthető; pezsdítő.
