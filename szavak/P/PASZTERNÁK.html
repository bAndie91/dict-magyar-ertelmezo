PASZTERNÁK  [ë] főnév -ot, -ja pasztinák (<span style="color:green;font-weight:bold">növénytan</span>)
Az ernyősök családjába tartozó, fűrészes levelű, sárga virágú, réteken igen gyakori növény; leves ízesítésére használt, répaszerű gyökeréért néhol termesztik is (Pastinaca sativa).
