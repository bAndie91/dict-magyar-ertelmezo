PÜSPÖKFALAT  főnév (<span style="color:green;font-weight:bold">bizalmas</span>)
Sült v. főtt baromfi fara, farcsíkja. □ A jérce püspökfalatja mellett a tejes eledelekre is szemet kell vetni. (Krúdy Gyula) Ölébe vett egy pecsenyés tálat, kézbe fogta a liba püspökfalatját és harapdálni kezdte. (Kosztolányi Dezső)
