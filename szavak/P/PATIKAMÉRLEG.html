PATIKAMÉRLEG  főnév
Gyógyszeradagok mérésére használt, nagyon érzékeny, kétkarú kézi mérleg. <span style="color:blue">Patikamérlegen mér; patikamérlegre tesz vmit: </span>(<span style="color:green;font-weight:bold">átvitt értelemben</span> is) túlzott gonddal, kicsinyeskedve mér, ill. bírál, szemlél vmit.
