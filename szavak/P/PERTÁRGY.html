PERTÁRGY  főnév, (<span style="color:green;font-weight:bold">ritka</span>) pörtárgy (<span style="color:green;font-weight:bold">jogtudomány</span>)
Az, ami végett a per folyik, amire vonatkozó jogának megítélését kéri a felperes; a per tárgya. <span style="color:blue">A pertárgy értéke.</span> □ Nem akarja nekem az okiratot átadni más áron, mint az egész pörtárgy feléért. (Jókai Mór)
pertárgyi; pertárgyú.
