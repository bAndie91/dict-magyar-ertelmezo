PROFOSZ  főnév -t, -ok, -a, (<span style="color:green;font-weight:bold">ritka</span>) profósz (<span style="color:green;font-weight:bold">elavult</span>)
&lt;Főként katonai&gt; börtönfelügyelő, foglár, porkoláb. □ A profósz elől, két gyertyával, én utána. (Kazinczy Ferenc) Se szó, se beszéd, mindjárt vitte a profosz, és belökte a börtönbe. (Mikszáth Kálmán)
