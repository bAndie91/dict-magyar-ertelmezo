PÁNEURÓPAI  [n-e] melléknév (<span style="color:green;font-weight:bold">politika</span>)
Azokkal a különféle burzsoá-pacifista és imperialista mozgalmakkal kapcsolatos, azoknak a mozgalmaknak a célját szolgáló, amelyek az európai tőkés országokat politikailag és gazdaságilag egyesíteni kívánják. <span style="color:blue">Páneurópai eszme, értekezlet, folyóirat, mozgalom.</span>
