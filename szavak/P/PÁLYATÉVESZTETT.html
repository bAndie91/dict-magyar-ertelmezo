PÁLYATÉVESZTETT  [e-ë] melléknév -en [e] (néha <span style="color:green;font-weight:bold">gúnyos</span>)
Olyan &lt;személy&gt;, aki hajlamainak, képességeinek nem megfelelő foglalkozást, hivatást, pályát választott. <span style="color:blue">Pályatévesztett ember.</span> □ Az asszonyok sóhajtottak, mint megannyi pályatévesztett nő. (Kosztolányi Dezső)
pályatévesztettség.
