PARASZTSOR  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Főleg a régebbi, paraszti származású emberekre jellemző állapot, életmód, sors. <span style="color:blue">Parasztsorban él; parasztsorban nőtt fel; kiemelkedik a parasztsorból.</span> □ Az én őseim mindannyian előkelő emberek voltak, a te apáid pedig mind parasztsorban éltek. (Ambrus Zoltán)
