PERGOLA  [ë] főnév ..lát, ..lája (<span style="color:green;font-weight:bold">építészet</span>)
Különálló kerti oszlopsor kőből, téglából v. fából; egyes oszlopait fent rendsz. fagerendák kötik össze; kúszónövénnyel befuttatva árnyas lugassá válik. <span style="color:blue">Pergolát építtetett a kertben. A napsütés elől a pergola alá húzódtak.</span>
