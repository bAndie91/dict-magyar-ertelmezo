PRINCIPÁLIS  főnév -t, -ok, -a (<span style="color:green;font-weight:bold">régies</span>)
Vmely hivatalnak v. értelmiségi jellegű munkahelynek, kül. ügyvédi irodának a főnöke; elöljáró, felettes. □ Sokszor jártam a principálisommal az úriszékekre. (Jókai Mór) A principális negyed négyre még nem érkezett az irodába. (Nagy Lajos)
principálisi.
