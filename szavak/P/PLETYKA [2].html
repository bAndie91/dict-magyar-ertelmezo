PLETYKA [2]  [ë] főnév ..kát, ..kája (rendsz. egyes számban) (<span style="color:green;font-weight:bold">növénytan</span>)
Olyan cserepes növény, amelynek heverő v. lelógó és a földhöz érő csomóinál gyökeret eresztő szára van; hosszúkás, tojásdad alakú levelei alul-felül zöldek v. alul piroslók v. felül ezüstös csíkosak (Tradescantia).
