PAPLAK  főnév (<span style="color:green;font-weight:bold">választékos</span>)
&lt;Falun, kisvárosban&gt; az a ház, amelyben a (rendsz. protestáns) pap lakik; parókia. □ A bejárást a paplakba egy mély boltív előzi meg. (Jókai Mór) A toronyra már rászállt a homály, de a paplak még világos volt. (Petelei István)
