PORCIKA [2]  főnév ..kát, ..kája (<span style="color:green;font-weight:bold">növénytan</span>)
A szegfűfélék családjába tartozó, lengő szárú, csomókban ülő, zöld virágú növény; egyes fajtái keresett gyógynövények (Herniaria). <span style="color:blue">Borzas, kopasz, szürke porcika.</span>
