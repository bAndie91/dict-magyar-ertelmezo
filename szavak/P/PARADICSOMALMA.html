PARADICSOMALMA  [m-al] főnév
<ul><li>1. (<span style="color:green;font-weight:bold">kertészet</span>) A kerti almafának cserje alakú fajtája, melyet törpe v. alacsony törzsű almafák neveléséhez alanyul használnak (Malus paradisiaca).
</li><li>2. (<span style="color:green;font-weight:bold">kertészet</span>, <span style="color:green;font-weight:bold">régies</span>) Paradicsom (12).
</li></ul></div>
