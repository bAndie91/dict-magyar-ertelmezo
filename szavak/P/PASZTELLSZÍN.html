PASZTELLSZÍN  [l-sz] főnév és melléknév
<ul><li>I. főnév Vmely színnek olyan minőségi változata, amilyet a pasztellkréta rajza ad; tompa, fénytelen, nem telt szín. <span style="color:blue">Kedveli a pasztellszíneket.</span>
</li><li>II. melléknév Pasztellszínű. <span style="color:blue">Pasztellszín anyag, ruha, szövet.</span>
</li></ul></div>
