PUSKAGOLYÓ  főnév
Régebben gömb, ma kihegyesedő henger alakú lövedék, amelyet puskából szoktak kilőni. <span style="color:blue">Fütyülnek, röpködnek a puskagolyók. Puskagolyót kapott a vállába.</span> □ A disznóban  se puskagolyó , se sörét nem volt. (Eötvös Károly)
<ul><li>Szóösszetétel(ek): puskagolyó-sivítás.
