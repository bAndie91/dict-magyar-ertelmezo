PÁRNAFA  főnév
(<span style="color:green;font-weight:bold">műszaki nyelv</span>) Általában olyan, fából készült építészeti, szerkezeti elem, amely szabadon álló szerkezetek terhét a megtámasztó részre átviszi. || a. (<span style="color:green;font-weight:bold">építészet</span>) Kül. kb. 810 cm vastag fűrészelt gerenda, amelyre a parkettet rakják, a padlódeszkát szögezik; vánkos.
