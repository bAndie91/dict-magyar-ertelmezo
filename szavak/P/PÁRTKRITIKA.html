PÁRTKRITIKA  [t-k] főnév (<span style="color:green;font-weight:bold">1945 után</span>)
A párt által személy(ek), közösség(ek), alkotás(ok) stb. felett gyakorolt, rendsz. elvi jelentőségű bírálat (12), kritika. <span style="color:blue">Elfogadja, megszívleli a pártkritikát.</span>
