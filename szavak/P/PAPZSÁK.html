PAPZSÁK  főnév (<span style="color:green;font-weight:bold">gúnyos</span>)
&lt;Rendsz. ebben az állandósult szókapcsolatban:&gt; <span style="color:blue">telhetetlen papzsák:</span> olyan ember akinek semmi sem elég; kielégíthetetlen, telhetetlen személy. □ A pap csak pap, és a "telhetetlen papzsák" nem chimaera [= agyrém]. (Petőfi Sándor)
