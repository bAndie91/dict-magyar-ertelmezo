PASZITA  főnév ..tát, ..tája (<span style="color:green;font-weight:bold">tájszó</span>)
Keresztelő alkalmával tartott vendégség, lakoma. □ A paszitát, meg az tort, meg az tort Avvá [= avval] kezgyük: igyunk bort, igyunk bort. (népköltés) Azt sem bánom, ha megkeresztelnek, csak  aztán a paszitában magam is részt vehessek. (Jókai Mór)
