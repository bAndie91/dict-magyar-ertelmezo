PÁROLÁS  főnév -t, -a (csak egyes számban)
A párol igével kifejezett cselekvés, eljárás; kül. vmely ételnek fedő alatt, gőzben történő puhítása. <span style="color:blue">Rizs párolása. A marhahúst lassú párolással puhítjuk.</span>
<ul><li>Szóösszetétel(ek): fapárolás.
</li><li>párolási.
