PEJKÓ  [e] főnév -t, -ja (<span style="color:green;font-weight:bold">kedveskedő</span>)
&lt;Lónévként is:&gt; pej (színű) ló. □ Az öreg kocsis bekormányozta a pejkókat a nyitott kapun. (Krúdy Gyula) Szömbe gyütt rám egy szekér. Annak a saraglyájához vót kötve egy pejkó. (Móricz Zsigmond)
