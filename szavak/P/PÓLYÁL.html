PÓLYÁL  tárgyas ige -t, -jon
Pólyáz (1, 2). □ [A tehén] szarvával dühösen döfött felénk, ha gyermekét el akartuk venni, hogy meleg kabátba pólyáljuk. (Kuncz Aladár)
<ul><li>Igekötős igék: belepólyál; bepólyál; kipólyál; visszapólyál.
</li><li>pólyálás; pólyálgat; pólyáló; pólyált; pólyáltat.
</li></ul></div>
