PITLE  [e] főnév pitlét, pitléje [e] (<span style="color:green;font-weight:bold">malomipar</span>)
Malomban a garat alatt levő sűrű szita, a lisztnek a korpától és a durvább liszttől való elválasztására. □ Csendes nyári éjszakákon mind a tizenhat malom pitléje kelepelt, szitálva a lisztlángot. (Jókai Mór)
pitlés.
