PÓTLÓDIK  tárgyatlan ige -tam, -ott, -jék (-jon)
&lt;Vmely tárgy, anyag felhasznált v. elpusztult része&gt; új, vele egynemű tárggyal, anyaggal kiegészül. <span style="color:blue">A sebesülés okozta vérveszteség gyorsan pótlódott.</span>
<ul><li>Igekötős igék: bepótlódik; kipótlódik; visszapótlódik.
</li><li>pótlódás; pótlódó; pótlódott.
</li></ul></div>
