PERGÁTLÓ  [ë] melléknév -an v. -lag (<span style="color:green;font-weight:bold">jogtudomány</span>)
Olyan &lt;körülmény&gt;, amely nem a per érdemére (3), hanem megindulásának v. folytatásának lehetőségére vonatkozik, s amelynek fennforgása esetén pert folytatni nem lehet. <span style="color:blue">Pergátló kifogás, körülmény.</span>
