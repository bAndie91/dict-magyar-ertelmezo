PÁRTVISZÁLY  főnév (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">választékos</span>)
Két v. több párt közötti viszály, nézeteltérés, súrlódás, vetélkedés. □ Egyes nagy emberek kormányzási éveire oszthatnók Athén történeteit, melyeket a pártviszályok megszaggatnak. (Eötvös József)
