PORÓZUS  melléknév (-an), -abb (<span style="color:green;font-weight:bold">tudományos</span>)
Olyan &lt;tárgy, anyag&gt;, amelynek szöveteiben, szerkezetében pórusok, apró lyukak vannak; lyukacsos. <span style="color:blue">Porózus tégla. Az ember bőre porózus.</span> □ A porózus kő rögtön elkezdett a csúcsos fenekén cseppeket keresztülbocsátani. (Jókai Mór)
porózusság.
