PRÓBÁLKOZÁS  főnév -t, -ok, -a
A próbálkozik igével kifejezett cselekvés, magatartás; az a tény, hogy vki próbálkozik (vmivel). <span style="color:blue">Hasztalan, meddő, szánalmas próbálkozás. Első próbálkozásra nem sikerült a dolog. Közönyösen nézték a gyönge gyerekek próbálkozását.</span>
