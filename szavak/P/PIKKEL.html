PIKKEL * [ë] tárgyatlan ige -t, -jen [ë] (<span style="color:green;font-weight:bold">bizalmas</span>)
Tartósan neheztel vkire, és haragját, ellenszenvét apró kellemetlenkedésekkel érezteti vele; kirúg rá. <span style="color:blue">Pikkel vkire. Pikkel rám a tanár.</span> □ Évek óta "pikkelt" Jenőkére  a panaszok, szemrehányások, sóhajtások miatt. (Krúdy Gyula)
pikkelés; pikkelő.
