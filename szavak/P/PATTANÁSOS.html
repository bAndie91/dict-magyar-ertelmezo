PATTANÁSOS  melléknév -an, -abb
Olyan &lt;személy&gt;, akinek arcán sok pattanás (2) van. <span style="color:blue">Pattanásos leány, kamasz.</span> || a. Pattanásokkal (2) borított. <span style="color:blue">Pattanásos arc, bőr.</span> □ Homloka nem magas és pattanásos. (Mikszáth Kálmán) Piros arcú, csupa pattanásos képű lány volt. (Móricz Zsigmond)
