PAPIROSPÉNZ  főnév (<span style="color:green;font-weight:bold">régies</span>)
Papírpénz. □ A papirospénz ha szerfölötti mennyiségben kibocsátva minden kézen forog, elveszti becsét. (Eötvös József) A törvényalkatónak [= törvényalkotónak] helyes vagy bal fogalma  a papirospénz természetéről kényelmem vagy romlásom felett határoz. (Kemény Zsigmond)
