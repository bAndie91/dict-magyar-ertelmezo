PATTANTYÚ  főnév -t, -ja (<span style="color:green;font-weight:bold">katonaság</span>, <span style="color:green;font-weight:bold">elavult</span>)
Löveg, rendsz. ágyú. □ Mársnak kockáját,  Sebes pattantyúit, Füstölgő ágyúit Bátran néztem! (Faludi Ferenc) Elaggtam, Nem birom a kardot,  És iszonyú nekem a pattantyú hangja. (Vörösmarty Mihály) Pattantyuk, mozsarak nagy golyók halommal. (Arany János)
