PÁNTOL  tárgyas ige -t, -jon (<span style="color:green;font-weight:bold">ritka</span>)
Pánttal (12) (éppen akkor) ellátva összeköt v. megerősít vmit. <span style="color:blue">Ládát pántol.</span>
Igekötős igék: átpántol; bepántol; hozzápántol; körülpántol; megpántol; összepántol; rápántol.
pántolás; pántoló; pántolt.
