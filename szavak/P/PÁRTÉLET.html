PÁRTÉLET  [t-ë] főnév (<span style="color:green;font-weight:bold">politika</span>)
A párttagok tevékenysége a párton belül és a párt tevékenységének megnyilatkozása az értekezletek, a gyűlések, a pártnapok, a pártoktatás, a pártonkívüliek nevelése, a párt és a tömegek kapcsolata terén. <span style="color:blue">Az alapszervezetben élénk pártélet folyik.</span>
