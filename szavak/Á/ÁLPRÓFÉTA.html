ÁLPRÓFÉTA  [l-p] főnév (<span style="color:green;font-weight:bold">sajtónyelvi</span>)
<ul><li>1. Az, aki prófétai igénnyel hazugságo(ka)t, téves eszméket, hamis tanokat hirdet; hamis próféta. <span style="color:blue">A tanyákat álpróféták járták.</span>
</li><li>2. Az, aki később hamisnak bizonyuló jóslatokat mond, terjeszt. <span style="color:blue">Álprófétának bizonyult.</span>
</li><li>álprófétaság.
