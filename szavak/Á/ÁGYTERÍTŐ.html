ÁGYTERÍTŐ  főnév
A bevetett ágy letakarására használatos, rendsz. nehezebb textilanyagból készült terítő; ágytakaró. <span style="color:blue">Brokát, csipke, selyem ágyterítő.</span> □ Gyula kijött, furcsa toalettben, egy ágyterítőt vetett át a vállán. (Babits Mihály)
<ul><li>ágyterítőjű; ágyterítős.
