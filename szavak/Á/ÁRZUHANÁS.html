ÁRZUHANÁS  főnév (<span style="color:green;font-weight:bold">sajtónyelvi</span>)
Az áraknak általában v. vmely áru (12) árának hirtelen és nagyfokú csökkenése, esése. <span style="color:blue">Páratlan árzuhanás; előre nem sejtett árzuhanás. Az árzuhanást nem sikerült megállítani. A búza chichagói árzuhanása a spekulánsok egész sorát tette tönkre.</span>
