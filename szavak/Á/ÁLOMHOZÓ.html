ÁLOMHOZÓ  melléknév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Álmosságot, álmot (1, 2, 3) okozó. <span style="color:blue">Álomhozó ital, por, sötétség, szer.</span> □ Álomhozó esti szellő, Legyezd gyengén angyalomat. (Csokonai Vitéz Mihály) [A meghívott halál.] Még fehér papírálarcot visel Álomhozó húsz grammnyi porban Itt, az asztalomon. (Ady Endre)
