ÁTLAGÁR  [g-á] főnév
Egy-egy árucikk, ill. általában az áruk különféle árainak középértéke meghatározott időközben; átlagos ár. <span style="color:blue">Egyes helyeken 8 forintot, máshol 6 forintot fizetünk érte, az átlagár tehát 7 forint. Kiszámítja az átlagárat.</span>
