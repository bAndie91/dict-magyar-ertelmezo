ÁLMÉLKODÁS  főnév -t, -ok, -a
Az álmélkodik igével kifejezett állapot. <span style="color:blue">Álmélkodást kelt; volt nagy álmélkodás. Alig tudott magához térni álmélkodásából.</span> □ Itt hagynád sokféle kedves mulatságod?  A malomkövet ki öltené karjára, Molnár legények álmélkodására? (Arany János)
