ÁTLÓ  főnév -t, -ja (<span style="color:green;font-weight:bold">mértan</span>)
Vmely négy- v. sokszögű idomnak két nem szomszédos csúcsát összekötő egyenes. <span style="color:blue">Az átlóra merőlegesen húzott egyenes; az átlók metszőpontja. A négyszögnek két átlója van. Meghúzzuk az átlót.</span>
<ul><li>Szóösszetétel(ek): átlóirány, átlóvonal.
