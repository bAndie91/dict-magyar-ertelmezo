ÁLLÓÓRA  főnév
Olyan óra, amely vmin áll(hat) &lt;ellentétben a fali, torony-, karkötő és zsebórával&gt;. <span style="color:blue">Állóóra volt az íróasztalán. Felhúzta a sarokban levő állóórat.</span> □ Gyertya helyett  ijedtében felkapta az ezüst állóórát, azt vitte maga előtt. (Mikszáth Kálmán)
