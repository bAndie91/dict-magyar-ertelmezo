ÁGYBONTÁS  főnév (csak egyes számban) (<span style="color:green;font-weight:bold">választékos</span>)
A bevetett ágy(nemű) előkészítése a lefekvéshez. <span style="color:blue">Még ágybontás előtt hazaértek a gyerekek.</span> □ Úgy elduruzsolgattak [= halkan elbeszélgettek] ott , mintha csak az ősi udvarház előtt ülnének , várva az éjszakai ágybontásra. (Móra Ferenc)
