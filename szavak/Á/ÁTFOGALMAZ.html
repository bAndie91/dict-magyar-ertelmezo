ÁTFOGALMAZ  tárgyas ige
Bizonyos mértékben másképp, átalakítva, vmilyen célnak jobban megfelelően, újra fogalmaz. <span style="color:blue">Átfogalmazza a bonyolult mondatokat. Fogalmazd át ezt a levelet, mert így sértő a hangja.</span>
<ul><li>átfogalmazás; átfogalmazható; átfogalmazó; átfogalmazott; átfogalmaztat.
