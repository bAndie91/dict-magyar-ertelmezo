ÁRNYOLDAL  [ny-o] főnév
Vkinek, vminek, főleg elvont dolognak rossz, előnytelen oldala, hibája, hátránya. <span style="color:blue">A barátság árnyoldalai; magaviseletének árnyoldala; a nagyság árnyoldala. Nem mutatta árnyoldalait.</span> □ E kis árnyoldalak dacára is a művészélet csak legszebb. (Petőfi Sándor)
