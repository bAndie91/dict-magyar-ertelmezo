ÁRAMELLÁTÁS  [m-e] főnév
A fogyasztók (háztartások, üzemek stb.) ellátása a szükséges villanyárammal. <span style="color:blue">Egyenletes, folyamatos áramellátás; az üzem, a város áramellátása. Az áramellátás zavartalanul folyik. Biztosították az áramellátást.</span>
<ul><li>áramellátási; áramellátású.
