ÁRNYÉKKIRÁLY  főnév (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">választékos</span>)
Gyenge, könnyen befolyásolható, gyakran idegen hatalomnak alávetett, tényleges hatalommal alig v. egyáltalán nem rendelkező király; bábkirály. <span style="color:blue">Napóleon csak árnyékkirályokat tűrt meg Európa trónjain.</span>
