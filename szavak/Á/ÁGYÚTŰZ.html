ÁGYÚTŰZ  főnév
Az arcvonalnak bizonyos szakaszán felállított ágyúk tüzelése vmely célpontra. <span style="color:blue">Gyilkos, pusztító, szűnni nem akaró ágyútűz; ágyútüzet nyit vmire. A várost szakadatlan ágyútűz alatt tartják. A gyalogság erős ágyútűzbe került.</span> □ Küldj ádáz csatába, emberirtó ágyútűzbe. (Jókai Mór)
