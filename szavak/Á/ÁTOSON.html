ÁTOSON  [t-o] tárgyatlan ige
Osonva, lopódzkodva átmegy vmin v. vhova. <span style="color:blue">Átoson a szobán; átoson az anyjához.</span> □ Átosontunk este bíró urammal a szomszéd Rekettyésre. (Mikszáth Kálmán) Éjfélkor fölkeltem. Átosontam a sötétben lábujjhegyen a másik szobába. (Gárdonyi Géza)
<ul><li>átosonás; átosonó; átosont.
</li></ul></div>
