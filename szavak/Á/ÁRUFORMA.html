ÁRUFORMA  főnév (<span style="color:green;font-weight:bold">közgazdaságtan</span>)
A munkatermékek zömének megjelenési formája az árut (12) termelő társadalomban, ahol értékesítésük piaci csere útján történik. <span style="color:blue">A munkatermék az eladáskor áruformát ölt.</span>
