ÁTHULL  tárgyatlan ige, (<span style="color:green;font-weight:bold">népies</span>) áthullik
<ul><li>1. &lt;Résen, lyuk(ak)on&gt; lefelé hullva átjut. <span style="color:blue">Áthull vmin. Áthull a rostán a szem. Áthull a tetőn az eső.</span>
</li><li>2. A másik oldalon, a túloldalon levő helyre hull. <span style="color:blue">Áthull vhova. Az alma áthull a szomszéd kertbe.</span>
</li><li>áthullás; áthullat; áthulló; áthullott.
</li></ul></div>
