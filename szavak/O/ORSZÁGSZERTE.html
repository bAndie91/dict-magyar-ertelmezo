ORSZÁGSZERTE  határozószó
Az egész országban mindenütt v. nagyon sokfelé az országban. <span style="color:blue">Országszerte bőséges eső hullott. Nálunk országszerte divat a húsvéti locsolkodás.</span> □ Radeczkit a nép oly csúful megverte, Hogy serege csak úgy futott országszerte. (Sárosy Gyula)
