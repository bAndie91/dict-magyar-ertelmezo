ORVUL  határozószó (<span style="color:green;font-weight:bold">rosszalló</span>)
Leplezve, rejtekből, lesből, gonosz indulattal (és váratlanul). <span style="color:blue">Orvul rátámad vkire; orvul rajtaüt vkin; orvul meggyilkol vkit.</span> □ Nem világos nappal, hanem éjjel, orvul [ölték meg]. (Arany János) Hátulról, orvul estek neki ketten. (Kosztolányi Dezső)
