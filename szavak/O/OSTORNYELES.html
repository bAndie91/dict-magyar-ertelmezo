OSTORNYELES  [e-e] melléknév (<span style="color:green;font-weight:bold">1945 után</span>)
&lt;Csak ebben a szókapcsolatban:&gt; <span style="color:blue">Ostornyeles lámpa:</span> az utcai közvilágítás céljára az úttest szélére állított, fém lámpaoszlop, amelynek a fénycsöves lámpát tartó felső vége az ostornyél végződéséhez hasonlóan ívesen kissé behajol, az úttest fölé.
