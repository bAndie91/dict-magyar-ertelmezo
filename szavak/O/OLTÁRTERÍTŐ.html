OLTÁRTERÍTŐ  főnév (<span style="color:green;font-weight:bold">vallásügy</span>)
Az oltárt (1) leborító díszes terítő. □ A nagy fehér oltárterítőt  az ő testvérhúga slingelte. (Mikszáth Kálmán) Középkori kódexből való a sekrestyés arca, aki Gizella oltárterítőjét, régi püspökök süvegeit  mutogatja a tanulni vágyó utazónak. (Krúdy Gyula)
