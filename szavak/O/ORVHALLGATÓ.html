ORVHALLGATÓ  melléknév és főnév (<span style="color:green;font-weight:bold">hivatalos</span> is) Olyan (személy, csoport), aki, amely engedély nélkül használ, tart üzemben rádió vevőkészüléket; zughallgató. <span style="color:blue">Lelepleztek egy orvhallgató családot. Az orvhallgatótól elkobozták a rádiót.</span>
