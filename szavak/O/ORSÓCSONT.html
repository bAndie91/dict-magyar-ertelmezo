ORSÓCSONT  főnév (<span style="color:green;font-weight:bold">bonctan</span>)
Az alkart alkotó két csont egyike (a másik a singcsont); a hüvelykujj fölött kezdődik s a könyökig ér. □ Átvilágította saját kezét, melynek képét egy  tejüvegre vettette, s ott remegtek a csontok, a singcsontja meg az orsócsontja. (Kosztolányi Dezső)
