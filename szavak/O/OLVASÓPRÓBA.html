OLVASÓPRÓBA  [ó-p] főnév (<span style="color:green;font-weight:bold">film, színház</span>)
A színdarab első próbája, amelyen a színészek még csak olvassák a szerepüket, ill. a szerző v. a rendező teljes egészében felolvassa nekik a darabot.
olvasópróbai; olvasópróbás.
