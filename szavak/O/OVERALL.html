OVERALL  [ovëral] főnév -t, -ok, -ja
Erős, sötét vászonból készült, a törzset és a végtagokat fedő, egyetlen darabból álló, egybeszabott (munka)ruha; szerelőruha, kezeslábas. <span style="color:blue">A traktorosok overallba öltöztek. A szerelő overallt húzott magára, úgy mászott az autó alá.
overallos.
