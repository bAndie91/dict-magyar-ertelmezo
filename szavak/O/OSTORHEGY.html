OSTORHEGY  főnév
<ul><li>1. Az ostornak vékony, gyak. raffiából sodrott vége. □ Az ember ostorheggyel odacsapott a cigánygyerekre. (Móricz Zsigmond)
</li><li>2. (<span style="color:green;font-weight:bold">tájszó</span>) <span style="color:blue">Ostorhegyre vesz:</span> hajszol, kerget, megfuttat. □ Mintha ostorhegyre vették volna, úgy szaladt. (Jókai Mór)
</li></ul></div>
