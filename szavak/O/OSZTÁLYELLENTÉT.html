OSZTÁLYELLENTÉT  [ly-e] főnév (rendsz. többes számban) (<span style="color:green;font-weight:bold">politika</span>)
A kizsákmányoló és a kizsákmányolt, ill. az uralkodó és az elnyomott társadalmi osztályok között levő s a gazdasági helyzetükből fakadó ellentét mint az osztályharc alapja. <span style="color:blue">Az osztályellentétek fokozódása.</span>
