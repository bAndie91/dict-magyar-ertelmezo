OSTORNYÉL  főnév
Vékonyodó, hajlékony bot, rugalmas pálca, vessző, amelyre az ostor szíja, fonadéka van erősítve. □ Akkorát húzott a megfordított ostornyéllel a ló farára, hogy egyszerre két ostornyél lett belőle. (Móra Ferenc)
<ul><li>Szóösszetétel(ek): ostornyéltartó.
</li></ul></div>
