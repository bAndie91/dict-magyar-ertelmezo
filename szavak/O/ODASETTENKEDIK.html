Titokban, óvatosan, settenkedve odamegy vkihez, vhova. □ Odasettenkedett a tűzhöz, pipára gyújtani. (Mikszáth Kálmán) Egy ingben odasettenkedett az ajtóhoz. (Móricz Zsigmond)
