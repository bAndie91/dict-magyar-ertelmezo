OBSZCÉN  melléknév -ül, -ebb [e] v. -ul, -abb (<span style="color:green;font-weight:bold">választékos</span>)
A szemérmet durván, közönséges módon sértő; arcpirítóan illetlen, trágár. <span style="color:blue">Obszcén adoma, beszéd, jelenet, rajz, szavak, tréfa, viselkedés.</span> □ Obszcén fantázia vegyült az olcsó füst és alacsony érdekek közé. (Babits Mihály)
