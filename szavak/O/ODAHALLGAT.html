ODAHALLGAT  tárgyatlan ige
<span style="color:blue">Odahallgat (vkire, vmire):</span> hallgatva figyel vkinek a beszédére v. ritk. vmely hangjelenségre. <span style="color:blue">Hiába beszélt az anyja, oda se hallgatott. Nem hallgatott oda a zajra.</span>
Vö: hallgat (1a), idehallgat. odahallgatás; odahallgató.
