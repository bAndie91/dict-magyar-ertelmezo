OTTAN-OTTAN  határozószó, határozatlan (<span style="color:green;font-weight:bold">régies</span>)
Néha-néha, olykor-olykor, egyszer-másszor, hébe-hóba. □ A fuvola hangjai közé jól esik-e ottan-ottan harsonával rikkantani? (Arany János) Eszébe jutott a hosszú ötven esztendő számos keserűségeivel és ottan-ottan örömeivel is. (Tolnai Lajos)
