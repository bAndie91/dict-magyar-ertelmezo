ODAIRÁNYUL  tárgyatlan ige
Ismert, szóban forgó, ill. a határozóval pontosan megjelölt helyre, célpontra v. afelé irányul. <span style="color:blue">Ott volt egy repülőtér: a támadás odairányult. Az ágyúcsövek odairányultak az erődre.</span>
Vö: irányul (1, 2).
odairányulás; odairányuló.
