ODAROHAN  tárgyatlan ige
Rohanva odamegy vhova. <span style="color:blue">Odarohant a sebesülthöz, a helyszínre.</span> □ Odarohant a civódók közé; szétválasztá őket egymástól. (Jókai Mór) A fuvarosok leugráltak szekereikről, és odarohantak. (Mikszáth Kálmán)
<ul><li>odarohanás; odarohanó; odarohant.
</li></ul></div>
