ODAHALLATSZIK  tárgyatlan ige
&lt;Hang&gt; (a beszélőtől) távolabbi(nak tekintett), ismert v. szóban forgó helyre v. helyig jut, s ott is hallható, hallatszik. <span style="color:blue">A hegyen laknak, nem hallatszik oda a város lármája. Ha kiáltok, odahallatszik?</span>
odahallatszó; odahallatszott.
