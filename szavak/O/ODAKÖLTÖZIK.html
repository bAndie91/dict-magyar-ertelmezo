ODAKÖLTÖZIK  tárgyatlan ige
Vmely, a beszélőtől eltávolodó v. így felfogott irányban levő helyre, ilyen helyen levő személyhez költözik. <span style="color:blue">Két új ház épül a szomszédban, a barátom is odaköltözik. Nem volt lakásuk, odaköltöztek a szülőkhöz.</span>
Vö: költözik (1).
odaköltözés; odaköltöző; odaköltözött.
