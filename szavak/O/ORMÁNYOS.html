ORMÁNYOS  melléknév és főnév (<span style="color:green;font-weight:bold">állattan</span>)
<ul><li>I. melléknév (-an) Olyan &lt;állat&gt;, amelynek ormánya van. <span style="color:blue">Ormányos bogár.</span>
</li><li>II. főnév -t, -ok, -a <span style="color:blue">Ormányosok:</span> az emlősök osztályába és a patások rendjébe tartozó állatcsoport (Proboscidea), amelynek ma már csak két faja él: az indiai és az afrikai elefánt.
</li></ul></div>
