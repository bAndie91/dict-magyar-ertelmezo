ORRHEGY  főnév (rendsz. csak néhány ragos alakban) (<span style="color:green;font-weight:bold">ritka</span>)
Az orr(a) hegyes vége, csúcsa. <span style="color:blue">Orrhegyen üt, talál vkit, vmit; orrheggyel érint vmit. Orrhegyen ütötte a labda.</span> □ Kormos orrheggyel jött vissza [a hámorból]. (Herczeg Ferenc)
