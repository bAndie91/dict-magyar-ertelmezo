OKVETETLENKEDÉS  [e-e-e-ë] főnév -t, -ek, -e [ë, e]
Az okvetetlenkedik igével kifejezett cselekvés. <span style="color:blue">A gyerek okvetetlenkedése. Okvetetlenkedésével sok bosszúságot okozott.</span> □ A bal lábszárát kedélyesen tapogatni kezdte  mintha unná az asztalfőn ülő elnök okvetetlenkedéseit. (Krúdy Gyula)
