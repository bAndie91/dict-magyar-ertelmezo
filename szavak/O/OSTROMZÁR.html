OSTROMZÁR  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Vmely ostromlott erődnek, várnak, városnak v. területnek katonai erővel való körülzárása; blokád. <span style="color:blue">Ostromzár alá vesz; felment az ostromzár alól.</span> □ [A várost] ostromzár alá kell venni s éhséggel kényszeríteni a feladásra. (Jókai Mór)
