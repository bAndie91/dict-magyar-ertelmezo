ORRTŐ  főnév (<span style="color:green;font-weight:bold">bonctan</span>)
Az arcnak az a része, ahol az orrcsont a homlokcsontból, ill. a felső állcsontokból kiágazik. □ Arcán a járomcsonttól az orrtőig hosszú forradás futott, melyet harcos pályáján szerezhetett. (Kosztolányi Dezső)
