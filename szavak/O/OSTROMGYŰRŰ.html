OSTROMGYŰRŰ  főnév
Vmely erődnek, várnak, városnak stb. az ostromló sereg által történő teljes körülzárása; ostromzár. <span style="color:blue">Ostromgyűrűvel vették körül a várat. Az ostromgyűrű bezárult a város körül.</span> □ Az ostromgyűrű belső vonala összébb húzódott a vár körül. (Gárdonyi Géza)
