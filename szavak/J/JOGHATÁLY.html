JOGHATÁLY  főnév (<span style="color:green;font-weight:bold">jogtudomány</span>)
A jogszabályoknak az a tulajdonsága, hogy a hatóságok kötelesek őket alkalmazni, az állampolgároknak pedig alkalmazkodniuk kell hozzájuk. <span style="color:blue">Előzetes letartóztatására is kiterjedő joghatállyal; joghatállyal életbe lép.</span>
<ul><li>joghatályos; joghatályú.
</li></ul></div>
