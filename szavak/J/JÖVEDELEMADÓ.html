JÖVEDELEMADÓ  [m-a] főnév (<span style="color:green;font-weight:bold">közigazgatás</span>)
Vmely természetes v. jogi személy tiszta jövedelmét terhelő, évenként kivetett adó. <span style="color:blue">Általános jövedelemadó; a jövedelemadó csökkentése, fölemelése, kivetése. Magánszemélyek és a szövetkezetek jövedelemadót fizetnek.</span>
