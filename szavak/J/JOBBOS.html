JOBBOS  melléknév -an
<ul><li>1. (<span style="color:green;font-weight:bold">ritka</span>) A jobb kézre v. lábra való &lt;cipő, kesztyű&gt;.
</li><li>2. (<span style="color:green;font-weight:bold">műszaki nyelv</span>) <span style="color:blue">Jobbos zár:</span> olyan z., amely a kulcs jobbra fordulásával működik. <span style="color:blue">A szekrény ajtajára jobbos zárat tett.</span>
</li><li>3. (<span style="color:green;font-weight:bold">tájszó</span>) Olyan &lt;állat&gt;, amelyet jobb oldalra szoktak befogni; jobb oldalra befogott.
