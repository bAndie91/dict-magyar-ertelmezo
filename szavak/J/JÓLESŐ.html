JÓLESŐ  [jóleső; l-e] melléknév
Kellemes, megnyugtató érzést, megelégedést keltő &lt;dolog&gt;. <span style="color:blue">Jóleső langyos idő. Köszönjük a jóleső figyelmet. A jóleső, gyöngéd szavak megnyugtatták. Jóleső érzéssel vette tudomásul a hírt.</span> □ Valami jóleső érzés áradt el benne. (Mikszáth Kálmán)
