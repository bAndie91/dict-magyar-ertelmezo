JÉGPÁLYA  főnév
Sima jéggel borított, korcsolyázásra, jégkorongozásra alkalmas, sík terület. || a. Ez a terület a hozzátartozó épületekkel (melegedővel, pénztárral stb.) együtt. □ Korcsolyák csilingeltek a jégpályára siető nők kezében. (Kosztolányi Dezső)
