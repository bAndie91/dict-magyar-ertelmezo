JOGEGYSÉG  [g-e] főnév (<span style="color:green;font-weight:bold">jogtudomány</span>)
&lt;Vmely állam egész területén&gt; a jogszabályoknak ugyanabban a szellemben, egyformán való alkalmazása, a joggyakorlat egysége. □ Még a törvényhozást illetőleg sem volt jogegység ez egyeduralmak egyikében is. (Eötvös József)
<ul><li>jogegységi.
