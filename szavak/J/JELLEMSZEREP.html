JELLEMSZEREP  főnév (<span style="color:green;font-weight:bold">film, színház</span>)
Az a színészi, rendsz. férfiszerep, amely az emberi jellemet vmelyik uralkodó vonásában jeleníti meg, de nem annyira tragikus fenségű, mint inkább a humoros felé hajló felfogással. <span style="color:blue">Tiborc a Bánk bánban, Menenius Agrippa a Coriolanusban jellemszerepek.</span>
