<div class="szocikk">
JOGERŐ  [g-e] főnév (<span style="color:green;font-weight:bold">jogtudomány</span>)
Határozatnak, ítéletnek az a hatálya, amely a pert (esetleg csak ideiglenesen) befejezi, a határozatot, az ítéletet megtámadhatatlanná, irányadóvá és végrehajthatóvá teszi. <span style="color:blue">Jogerőre emelkedik; jogerőre lép; jogerejét veszti.</span>
<ul><li>jogerejű.
</li></ul></div>
