JELLEMSZILÁRDSÁG  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Az az erkölcsi tulajdonság, hogy vki elvszerű hűséggel bátran, szilárdan kitart vmely helyesnek megismert meggyőződés, elhatározás, állásfoglalás mellett; állhatatosság. □ A jellemszilárdság olyan érdeme a fiatal kornak, hogy méltó megsüvegelni. (Vas Gereben)
