JUHTÚRÓ  [jutúró] főnév
Juhtejből, ill. juhgomolyából készült, savanykás ízű túró. <span style="color:blue">Juhtúróval ízesített csusza.</span> □ Árulnak szepesi kolbászkákat, árulnak juhtúrót, mérnek szepesbélai borovicskát  (Krúdy Gyula) Tejet akarok inni, juhtúrót enni  Nagyon szeretem. (Kosztolányi Dezső)
<ul><li>juhtúrós.
