JAVAKORABELI  melléknév javakorbeli
Élete derekán, munkaerejének, alkotóerejének teljében levő &lt;személy&gt;. □ Egy kerek asztal mellett négy polgáriasan öltözött javakorbeli ember írt. (Tolnai Lajos) János már nem mai gyerek, nagyon is javakorabeli, a halántékán  ősz hajszálak csillognak. (Nagy Lajos)
