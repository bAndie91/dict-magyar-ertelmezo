<ul><li>1. Az államhatalomnak az a tevékenysége, hogy jogszabályokat alkot, jogrendszert épít ki. <span style="color:blue">A jogalkotásnak lépést kell tartania az élettel.</span>
</li><li>2. Ennek eredménye: a megalkotott jogi szabály(rendszer). <span style="color:blue">Az új jogalkotás nagy jelentősége.</span>
