JEGYESPÁR  főnév
Egymásnak házasságra eljegyzett férfi és nő; vőlegény és menyasszony együtt. <span style="color:blue">A jegyespár elindult az anyakönyvvezető elé.</span> □ A harmadik fogás után felkelt György barát, és köszöntőt mondott az új jegyespárra. (Gárdonyi Géza)
