JOBBÁGYRENDSZER  főnév (<span style="color:green;font-weight:bold">történettudomány</span>, <span style="color:green;font-weight:bold">politika</span>)
A feudalizmus társadalmi rendszere, amelyben a földesúr kizsákmányolja a jobbágyot (1), és amelynek a polgári forradalmak vetettek véget. <span style="color:blue">A jobbágyrendszer bomlása, bukása.</span>
