JOGBIZONYTALANSÁG  főnév (<span style="color:green;font-weight:bold">sajtónyelvi</span>)
Az a tény, ill. állapot, hogy az állam(hatalom) belső zavarai folytán nem tudja megvédeni polgárainak jogait, személyi és vagyoni biztonságát a jogsérelmek ellen, s nem torolja meg őket. <span style="color:blue">A háború utáni jogbizonytalanság. Megszüntették a jogbizonytalanságot.</span>
</div>
