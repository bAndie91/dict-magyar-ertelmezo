JÓSNŐ  főnév
Jóslással üzletszerűen foglalkozó nő. <span style="color:blue">Öreg jósnő járta a falut. A jósnő kivetette a kártyát.</span> □ Kémlelve közelíte a jósnő az ifjú fekvőhöz. (Vörösmarty Mihály) Meglátja, itt lesz ismét nemsokára, Emlékezzék bár a jósnő szavára. (Madách Imre)
