JOGTUDOR  főnév (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">hivatalos</span>)
A jogtudományok doktora; jogi doktor. □ Igen rövid ideig akarok önnek terhére lenni, uram; szólt Aladár a jogtudorhoz. (Jókai Mór) Shylock már feni kését, mikor megjelen Portia, egy jogtudor álöltözetében. (Ambrus Zoltán)
<ul><li>jogtudori; jogtudorság.
</li></ul></div>
