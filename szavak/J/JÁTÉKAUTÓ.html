JÁTÉKAUTÓ  [k-a] főnév
Vmely autófajtának gyak. rugós v. lendkerekes hajtószerkezettel ellátott, kicsinyített mása mint gyermekjáték. <span style="color:blue">Karácsonyra játékautót kapott.</span> || a. Lábbal  többnyire pedálos szerkezettel  hajtható, autó alakú kis játékkocsi. <span style="color:blue">A kisfiú büszkén ült a játékautóban.</span>
