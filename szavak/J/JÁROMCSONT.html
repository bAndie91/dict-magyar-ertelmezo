JÁROMCSONT  főnév (<span style="color:green;font-weight:bold">bonctan</span>)
Az arckoponya két oldalán elöl, a halánték és az orrüreg között kiemelkedő, ív alakú két csont egyike; pofacsont. □ Arcán a járomcsonttól az orrtőig hosszú forradás futott. (Kosztolányi Dezső)
