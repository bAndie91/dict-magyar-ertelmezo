JUHGOMOLYA  [jugomoja] főnév (<span style="color:green;font-weight:bold">népies</span>)
Juhtejből (házilag) készített sajt(féleség); készítési módja az, hogy a megalvadt tejet ritkás vászonzacskóba öntve felakasztják, hogy a savó kicsorogjon belőle, s az alvadék gömbölyű tömeggé szilárdul. <span style="color:blue">A juhgomolyából juhtúrót is készítenek.</span>
</div>
