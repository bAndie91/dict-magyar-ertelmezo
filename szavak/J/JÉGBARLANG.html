JÉGBARLANG  főnév (<span style="color:green;font-weight:bold">földrajz</span>)
Hegyoldalban levő mély sziklaüreg, amelyben a beszivárgó víz télen megfagy, és nyáron sem olvad el. □ Behunyt szemmel is tudta az utat a Lengyel-nyeregre, a tarpataki vízeséshez, de a dobsinai jégbarlanghoz is. (Krúdy Gyula)
