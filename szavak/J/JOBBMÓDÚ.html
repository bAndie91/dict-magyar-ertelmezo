JOBBMÓDÚ  melléknév és főnév -t, -ak, (-ja)
Az átlagosnál jobb módban, aránylag kedvező anyagi viszonyok, körülmények közt élő, vagyonos(abb) (személy, kisebb közösség). <span style="color:blue">Jobbmódú család. Jobbmódú rokonai lenézték őt. A jobbmódúak mind jelentkeztek.</span>
