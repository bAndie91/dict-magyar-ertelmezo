JUBILEUM  [ë] főnév -ot, -a
Örömünnep, amelyet vmely esemény emlékére ülnek, tartanak; kül. a 25, 50, 100 éves fordulón rendezett ünnepség; emlékünnep. <span style="color:blue">Ötvenéves jubileum; százéves jubileum; jubileumot ül. Huszonöt éves házassági jubileumát ünnepli.</span>
