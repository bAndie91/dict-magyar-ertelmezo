JERKE  [e-e] főnév jerkét, jerkéje [e, e-e] (<span style="color:green;font-weight:bold">népies</span>)
Egyévesnél fiatalabb nőstény bárány (v. ritk. kecske). □ Végiglépdel mind az ezer darab a harmattól csillogó gyepen, a nagy kilenc vezérkos legelöl,  [utánuk] a jerkék mélán. (Mikszáth Kálmán)
