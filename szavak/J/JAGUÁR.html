JAGUÁR  főnév -t, -ok, -ja
Egész Dél-Amerikában és Észak-Amerika déli részein is honos, a macskával rokon, vörösbarna v. fekete foltokkal tarkázott vörösessárga színű, nagy testű, veszedelmes ragadozó állat (Pantherina onca). □ Mint a labda, visszaugrott egy jaguár ügyességével. (Mikszáth Kálmán)
