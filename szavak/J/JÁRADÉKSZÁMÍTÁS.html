JÁRADÉKSZÁMÍTÁS  főnév (<span style="color:green;font-weight:bold">mennyiségtan</span>)
A kereskedelmi számtannak az a része, amely annak a kiszámításával foglalkozik, hogy meghatározott időn át fizetett kamatozó járadékok mekkora összegre rúgnak, ill. hogy vmely összeg eléréséhez bizonyos időn át milyen összegű járadékot kell fizetni.
