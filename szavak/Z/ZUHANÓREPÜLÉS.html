ZUHANÓREPÜLÉS  főnév (<span style="color:green;font-weight:bold">katonaság</span>, <span style="color:green;font-weight:bold">repülés</span>)
Rendsz. harcászatban, kis kiterjedésű cél megtámadásakor alkalmazott olyan repülés, amelynek során a repülőgép magasból meredeken, nagy sebességgel alábukik, majd hirtelen ismét a magasba emelkedik. <span style="color:blue">A légi kötelék zuhanórepülésben támadta a hidat.</span>
