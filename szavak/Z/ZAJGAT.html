ZAJGAT  tárgyas ige -tam, -ott, ..asson (<span style="color:green;font-weight:bold">népies</span>)
Ingerel, hajszol, zaklat vkit, vmit; zargat. <span style="color:blue">Folyton zajgatja a gyereket.</span> □ Megbecsüld a feleségedet,  mert ha meghallom, hogy ok nélkül zajgatod, majd az udvarodon termek. (Vas Gereben)
<ul><li>Igekötős igék: megzajgat.
