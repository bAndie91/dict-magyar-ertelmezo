ZÁRHANG  főnév (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
Olyan beszédhang, mássalhangzó, amely egymással szemben álló beszélőszerveink között alkotott zár felpattanásával keletkezik (pl. p, b; t, d; k, g). <span style="color:blue">A zárhangok között vannak ajakhangok, foghangok, ínyhangok.</span>
<ul><li>Szóösszetétel(ek): hangszalag-zárhang.
</li><li>zárhangú.
</li></ul></div>
