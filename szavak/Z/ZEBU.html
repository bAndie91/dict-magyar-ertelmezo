ZEBU  [ë v. e] főnév -t, -ja (<span style="color:green;font-weight:bold">állattan</span>)
Indiában és Kelet-Afrikában élő, vörös v. sárgásbarna színű, páros ujjú kérődző állat; jellemzője a hátán levő púp (Bibos indicus, ill. africanus). <span style="color:blue">Afrikai, ázsiai zebu.</span>
<ul><li>Szóösszetétel(ek): zebufogat.
</li></ul></div>
