ZÖLDÁR  [d-á] főnév
Tavasz vége felé a nagy esőzések s a magas hegységekben ezzel kapcs. hóolvadás következtében keletkező áradás, árvíz. <span style="color:blue">A zöldár már növényzettel borított, zöld területet öntött el.</span> □ A Tisza  a tavaszi zöldárral elindul a tokaji hegy felé. (Krúdy Gyula)
