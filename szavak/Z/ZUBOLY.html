ZUBOLY  főnév -t, -ok, -a (<span style="color:green;font-weight:bold">népies</span>, <span style="color:green;font-weight:bold">régies</span>)
&lt;Szövőszéken&gt; keresztben fekvő két erős rúd v. henger, a fonál felvetésére, ill. a kész vászon felcsavarására. □ A zuboly döngése most is kihallik az utcára. (Jókai Mór)
