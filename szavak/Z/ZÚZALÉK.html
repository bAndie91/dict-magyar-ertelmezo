ZÚZALÉK  főnév -ot, -ja (-a) (<span style="color:green;font-weight:bold">műszaki nyelv</span>)

<ul><li>Szóösszetétel(ek): zúzaléktörő.
</li><li>zúzaléknyi; zúzalékos; zúzalékú.
