ZÁRKA  főnév zárkát, zárkája
&lt;Letartóztatási v. büntető intézetben&gt; kisebb zárt helyiség, amelyben a foglyot v. fegyencet elhelyezik; cella. <span style="color:blue">Közös zárka; a börtön, a fegyház zárkái.</span>
<ul><li>Szóösszetétel(ek): magánzárka; sötétzárka.
</li><li>zárkai; zárkás.
