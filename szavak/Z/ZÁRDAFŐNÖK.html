ZÁRDAFŐNÖK  főnév (<span style="color:green;font-weight:bold">vallásügy</span>)
Zárda elöljárója, főnöke. □ Igen jó bor. Egy régi francia apátság pincéjéből való Ime, a zárdafőnök kézírása is igazolja a bor hitelességét. (Krúdy Gyula)
<ul><li>zárdafőnöki; zárdafőnökség.
