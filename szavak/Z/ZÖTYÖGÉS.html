ZÖTYÖGÉS  főnév -t, (-ek), -e [ë, e] (<span style="color:green;font-weight:bold">hangutánzó</span>)
A zötyög igével kifejezett történés, folyamat; az a tény, hogy vmi zötyög; hosszas ide-oda rázódás. <span style="color:blue">Kocsin, vonaton való zötyögés; a gyümölcs zötyögése a kosárban. A strófa zötyögése. Beteggé tette a hosszú zötyögés.</span>
