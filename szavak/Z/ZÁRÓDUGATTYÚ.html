ZÁRÓDUGATTYÚ  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
A puska závárzatának a cső hátulsó végéhez csatlakozó, dugattyú alakú része; zárdugattyú. <span style="color:blue">Becsukja, hátrahúzza a záródugattyút.</span>
<ul><li>záródugattyújú; záródugattyús.
</li></ul></div>
