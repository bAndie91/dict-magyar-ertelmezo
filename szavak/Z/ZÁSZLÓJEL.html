ZÁSZLÓJEL  főnév (<span style="color:green;font-weight:bold">katonaság</span>, <span style="color:green;font-weight:bold">sport</span>)
Egy v. két zászló mozgatásával történő jeladás, amelynek segítségével figyelmeztetést, parancsot v. üzenetet közölnek vmely távolabbi csapattal, hajóval, ill. vmely versenyzővel. <span style="color:blue">A hajót zászlójellel állították meg. A lovasokat zászlójellel indították.</span>
