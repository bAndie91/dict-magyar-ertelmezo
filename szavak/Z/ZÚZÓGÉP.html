ZÚZÓGÉP  főnév
Érc(ek), kőzet(ek) v. gabonanemű(ek) darabolására való, különféle nagyságú és szerkezetű gépi berendezés, amely szapora ütögetéssel v. érdes hengerek közötti nyomással végzi munkáját. <span style="color:blue">Az érceket rendszerint nedves zúzógépekkel aprítják.</span>
<ul><li>zúzógépes; zúzógépű.
</li></ul></div>
