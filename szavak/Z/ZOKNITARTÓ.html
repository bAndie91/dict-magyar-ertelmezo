ZOKNITARTÓ  főnév
Rendsz. rugalmas anyagból készült ruházati cikk, amelyet az alsó lábszárra, a térd alá csatolnak, s lecsüngő tartójához hozzákapcsolják a zokni felső végét, hogy ne csússzon le. <span style="color:blue">Jó minőségű zoknitartó; zoknitartók nagy választékban.</span>
