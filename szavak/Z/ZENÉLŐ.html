<div class="szocikk">
ZENÉLŐ  [e] melléknév
<ul><li>1. Olyan, aki, ami zenél. <span style="color:blue">Zenélő szerkezet, társaság. A ligetben, a parkban, a szigeten zenélő kút is volt.</span>
</li><li>2. (<span style="color:green;font-weight:bold">ritka</span>) Olyan &lt;hangulat, időszak, alkalom&gt;, amelyben v. amikor vki szívesen zenél, v. zenélnie kell. <span style="color:blue">Most olyan zenélő kedvem van. Ma zenélő napom van.</span>
</li></ul></div>
