ZÁP [1]  melléknév -on (<span style="color:green;font-weight:bold">ritka</span>)
Hosszas állásban v. a költés alatt megromlott, kellemetlen szagú &lt;tojás&gt;, amelyből nem kel ki házi szárnyas kicsinye, ill. madárfióka. (<span style="color:green;font-weight:bold">tájszó</span>) <span style="color:blue">Vmely tojás zápon marad:</span> nem kel ki belőle madárfióka, ill. házi szárnyas kicsinye. <span style="color:blue">Ez a tojás záp.</span>
