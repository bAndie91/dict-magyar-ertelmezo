FALUVÁROS  főnév (<span style="color:green;font-weight:bold">ritka</span>)
Olyan város, amelynek települési formája, társadalmi összetétele és lakóinak életformája egyaránt falusias. □ A fehér faluváros úgy jött felé a sötétülő estében  mintha valamit akarna neki mondani bizodalmasan. (Tolnai Lajos)
