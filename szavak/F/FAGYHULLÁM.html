FAGYHULLÁM  főnév (<span style="color:green;font-weight:bold">légkörtan</span>)
&lt;Főleg télen&gt; időnként hirtelen beálló s átmeneti jellegű, fagypont alatti hőmérséklet, amelyet a hideg légtömegek erős beáramlása idéz elő. <span style="color:blue">Fagyhullám árasztotta el az országot. Újabb fagyhullám várható.</span>
