FÉLCSERJE  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
A fás növényeknek az a fajtája, melynek alacsony és bokros növése van, föld feletti szára a földön elágazik, tavasszal keletkező hajtásai megfásodnak és évekig élnek, a nyári hajtások azonban lehullanak. <span style="color:blue">Félcserje a kerti zsálya.</span>
