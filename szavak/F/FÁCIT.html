FÁCIT  főnév -ot, -ja (csak egyes számban) (<span style="color:green;font-weight:bold">elavult</span>)
<ul><li>1. Vminek lényege, veleje. □ Az a dolog fácitja, hogy a bűnöst megkapjuk. (Tolnai Lajos)
</li><li>2. Végeredmény. □ Nagy nyugalommal ropogtatta a retket, a tenyere alatt tartott pénzcsomagot lapogatva: "itt a fácit!" (Jókai Mór)
</li></ul></div>
