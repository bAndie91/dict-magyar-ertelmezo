FENÉS  [e] főnév -t, (-ek), -e [ë, e]
A fen igével kifejezett cselekvés, művelet, az a cselekvés, hogy vmit fennek (12). <span style="color:blue">A kasza, a kés fenése; sáros csizmájának a küszöbhöz fenése.</span>
<ul><li>Szóösszetétel(ek): kaszafenés.
</li><li>fenési.
