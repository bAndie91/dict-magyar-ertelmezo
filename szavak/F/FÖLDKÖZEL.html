FÖLDKÖZEL  főnév (<span style="color:green;font-weight:bold">csillagászat</span>)
Vmely égitest (Hold, bolygó) pályájának az a pontja, amelyben az égitest legközelebb van a Földhöz. <span style="color:blue">Mikor van a Mars földközelben?</span> □ Földtávlatban [= földtávolban] volt a holdújság [= újhold], tehát a földközelben a höldtölte. (Jókai Mór)
<ul><li>földközeli; földközelség.
