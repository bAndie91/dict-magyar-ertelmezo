FÉLÁRBOC  [l-á] főnév
&lt;Csak ilyen kapcsolatokban:&gt; <span style="color:blue">(a zászló, lobogó) félárbocon van:</span> az árboc magasságának feléig van felhúzva &lt;rendsz. gyász jeléül&gt;; <span style="color:blue">(a zászlót) félárbocra eresztik:</span> (eredeti helyzetéből) erre a magasságra bocsátják le.
