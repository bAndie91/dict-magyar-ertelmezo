FÜSTÍZ  [t-í] főnév
A füstölt húsnak v. általában nyitott tűzhelyen, ill. szabad tűzön főtt v. sütött ételnek a jellegzetes íze. <span style="color:blue">Egy kis füstíz érzik a sonkán. Már jó lesz a pirított szalonna: érzik rajta a füstíz.</span>
<ul><li>füstízű.
</li></ul></div>
