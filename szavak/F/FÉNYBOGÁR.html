FÉNYBOGÁR  főnév (<span style="color:green;font-weight:bold">régies</span>)
Szentjánosbogár. □ A barátság nappal láthatatlan, Éjjel ragyog csak, mint a fénybogár. (Petőfi Sándor) De a hajnal csak nem pirkad, S amit látunk, az se csillag; Bolygó fény, vagy fénybogár! (Vajda János) A fénybogarak  világítanak a párás levegőben. (Péterfy Jenő)
