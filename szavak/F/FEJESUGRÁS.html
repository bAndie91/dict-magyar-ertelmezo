FEJESUGRÁS  [s-u] főnév (<span style="color:green;font-weight:bold">sport</span>)
Az úszósportban szokásos ugrás: az ugró a partról, ill. az ugródeszka pereméről úgy lendül a vízbe, hogy előbb a feje fúródik bele; fejes (II. 1a). || a. Az ilyen ugrás mint versenyszám. <span style="color:blue">A közönség megtapsolta a gyönyörű fejesugrásokat.</span>
<ul><li>fejesugrási.
