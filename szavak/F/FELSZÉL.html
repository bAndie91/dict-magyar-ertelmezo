FELSZÉL  főnév fölszél (<span style="color:green;font-weight:bold">népies</span>)
Északi szél. □ Fujdogál a felszél hidegen. (Arany János) Amióta a hajómra lépett, mindig felszél fúj. (Jókai Mór) Nem is telik bele sok idő, utolérte a hajót a felszél. (Tömörkény István)
