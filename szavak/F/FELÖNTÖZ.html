FELÖNTÖZ  [l-ö] tárgyas ige fölöntöz
&lt;Földet, kövezetet&gt; vmely folyadékkal meglocsol, benedvesít, hogy a rajta levő port elverje, lekösse. <span style="color:blue">Felöntözi a járdát, az udvart, az utcát.</span>
<ul><li>felöntözés; felöntözget; felöntöző; felöntözött; felöntöztet.
</li></ul></div>
