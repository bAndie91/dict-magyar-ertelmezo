FOKOZÓSZÓ  főnév (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
Olyan szó, amellyel vmely utána következő, esetleg megelőző szó fogalmi tartalmát fokozzuk, annak nagyobb v. igen nagy fokát fejezzük ki (pl. csúnyán, nagyon, rettenetesen; rém; éktelen; ilyen kifejezésekben: csúnyán meghűlt, rém okos, éktelen nagy).
