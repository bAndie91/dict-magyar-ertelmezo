FÜLJEGY  főnév (<span style="color:green;font-weight:bold">állattenyésztés</span>)
A négylábú jószág fülének bizonyos mérvű és alakú megcsonkítása, bevágása avégett, hogy a tulajdonos könnyebben felismerhesse. <span style="color:blue">A füljegy alakja.</span> || a. A jószág fülébe ugyanezen céllal csíptetett, fémből készült jegy (I. 2).
