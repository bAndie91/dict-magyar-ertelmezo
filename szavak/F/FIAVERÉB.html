FIAVERÉB  főnév (<span style="color:green;font-weight:bold">népies</span>)
Veréb kicsinye, meztelen v. tokos fiatal veréb; verébfióka. <span style="color:blue">A fiaverebet elkapta a macska.</span> □ Ha az egész esztendei aratást mind elvesztette is, ha úgy maradt is, mint a fárul leesett fiaveréb, másik esztendőben megint csak kikel az új vetés. (Jókai Mór)
