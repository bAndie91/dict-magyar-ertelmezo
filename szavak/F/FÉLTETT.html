FÉLTETT  [ë] melléknév -en, -ebb [e, e]
Olyan, akit, amit nagyon félt (1, 3) vki, akire, amire nagyon vigyáz. <span style="color:blue">Gyermeke volt legféltettebb kincse.</span> □ Te féltett s hőn szeretett haza  (Vörösmarty Mihály) Az Opatvszky-családnak van egy mindennél féltettebb drágasága  : a becsülete. (Jókai Mór)
