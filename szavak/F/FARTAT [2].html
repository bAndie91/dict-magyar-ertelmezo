FARTAT [2]  tárgyas ige -tam, -ott, ..asson (<span style="color:green;font-weight:bold">tájszó</span>)
Kérdezősködve faggat, vallat. □ Gyanakodik a bíró és addig fartatja a tolvajt, hogy [az] végre is szépen kivallotta [a lopást]. (Vas Gereben)
<ul><li>Igekötős igék: felfartat; megfartat.
</li><li>fartatás; fartató; fartatott.
</li></ul></div>
