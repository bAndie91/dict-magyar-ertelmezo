FÜRDŐZÉS  főnév -t, (-ek), -e [ë, e] (<span style="color:green;font-weight:bold">választékos</span>)
A fürdőzik igével kifejezett tevékenység, állapot; vmely fürdőhelyen való tartózkodás üdülés v. gyógyulás végett. <span style="color:blue">A balatoni fürdőzés rendbe hozta egészségét.</span> || a. (<span style="color:green;font-weight:bold">ritka</span>) Gyakori, rendszeres fürdés. <span style="color:blue">A mindennapos fürdőzés megedzette.</span>
