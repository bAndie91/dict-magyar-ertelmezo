FOGVACOGÁS  főnév
Az a tény, hogy vkinek &lt;rendsz. fázás, félelem, rémület miatt&gt; a foga(i) vacog(nak). <span style="color:blue">Fogvacogása elárulta félelmét.</span> □ No ez már boszorkányság volt! mondá fogvacogással a korcsmáros. (Jókai Mór) Félelme némileg eloszlott, fogvacogása megszűnt. (Mikszáth Kálmán)
<ul><li>fogvacogásos.
</li></ul></div>
