FONDORLELKŰ  [e v. ë] melléknév (-en) [e], -bb
Olyan &lt;személy&gt;, aki céljai elérésére, tervei megvalósítására fondorlatot szokott alkalmazni, ravaszul ármánykodó természetű. □ Megmentette [őt] a sötét börtönből,  fondorlelkű emberek, bárdolatlan önzők örvényéből. (Tolnai Lajos)
