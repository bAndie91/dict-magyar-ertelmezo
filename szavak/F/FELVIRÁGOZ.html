FELVIRÁGOZ  tárgyas ige fölvirágoz
Virággal feldíszít vkit, vmit. <span style="color:blue">Felvirágozza a lakást, a lovakat, a sírt. A legény felvirágozta a kalapját. Felvirágozták a katonákat.</span> □ Virágozd fel az állatot, Mit áldozatra szántál. (Madách Imre)
<ul><li>felvirágozás; felvirágozható; felvirágozó; felvirágozott.
