<div class="szocikk">
FÖLDADÓ  [d-a] főnév
Művelésre alkalmas földterület, földtulajdon után a kataszteri tiszta jövedelem alapján megállapított egyenes, állami adó.
<ul><li>Szóösszetétel(ek): földadóhátralék; földadókataszter; földadókivetés; földadó-kötelezettség; földadó-leszállítás; földadótartozás.
</li><li>földadójú.
</li></ul></div>
