FOSZLÁNYOS  melléknév -an, -abb (<span style="color:green;font-weight:bold">ritka</span>)
Foszlányokra szakadt, foszlányokból álló. <span style="color:blue">Foszlányos ing, terítő.</span> □ A keskeny ablak foszlányos függönyén keresztül  az anya derült tekintete ragyogott át. (Tolnai Lajos) Fehér, foszlányos felhők úsztak az égen. (Mikszáth Kálmán)
