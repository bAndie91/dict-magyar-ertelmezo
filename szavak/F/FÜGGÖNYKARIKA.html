FÜGGÖNYKARIKA  főnév (főleg többes számban)
Rendsz. fémből készült s többedmagával sorban a függöny szélére varrt karika; ezekkel a függönyt mozgathatóan a rúdra erősítik. || a. &lt;Színházi függönyön&gt; hasonló karika; ilyenek sorozatában mozog a függönyhúzó zsinór.
