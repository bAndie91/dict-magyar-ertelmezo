FŐTE  [e] főnév főtét, főtéje [e] (<span style="color:green;font-weight:bold">bányászat</span>)
A bánya föld alatti, üres, kivájt térségeit felül határoló kőzet, felület, tető. <span style="color:blue">A főte nyomása meglazította a szenet. Víz csepeg a főtéből. A főtét megtámasztják.</span>
<ul><li>Szóösszetétel(ek): főtefa; főtefolyosó; főtegerenda; főtenyomás; főtepászta.
</li></ul></div>
