FEGYVERFOGHATÓ  melléknév (<span style="color:green;font-weight:bold">választékos</span>)
Olyan &lt;személy&gt;, aki fegyvert tud fogni; fegyverfogásra, katonai szolgálatra alkalmas. <span style="color:blue">Minden fegyverfogható embert mozgósítottak.</span> □ A fegyverfogható polgárság nagy része oda volt a városból. (Arany János)
