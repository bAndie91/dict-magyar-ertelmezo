FAHAMU  főnév (<span style="color:green;font-weight:bold">vegyi ipar</span>)
A fa elégetésével kapott, ásványi anyagokat tartalmazó hamu; régebben hamuzsír, háziszappan és házi fertőtlenítőszer készítésére is használták. <span style="color:blue">Fahamuból lúgot csinál. A baromfiólba fahamut hint.</span>
<ul><li>Szóösszetétel(ek): fahamulúg.
</li><li>fahamus.
</li></ul></div>
