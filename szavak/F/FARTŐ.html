FARTŐ  főnév
A szarvasmarha csípőjétől a faráig terjedő izomzat, hús nyersen v. megfőzve. <span style="color:blue">A fartő nagyon jó leveshúsnak.</span> □ Volna még a konyhán egy darab főtt marhahús, például a fartőnek a vége, amit serclinek is mondanak. (Krúdy Gyula)
