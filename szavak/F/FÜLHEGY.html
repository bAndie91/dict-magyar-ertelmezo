FÜLHEGY  főnév
Emberi, állati fül felső csúcsa, hegye. <span style="color:blue">Az ostor vége a ló fülhegyét érte. (Csak) fülheggyel hallottam:</span> futólag, talán nem is egész pontosan h. □ A ló sem moccant meg, még a fülhegye sem. (Arany János) Úgy hallottuk fülheggyel, hogy a tűzoltó banda is szerepelni fog. (Tolnai Lajos)
