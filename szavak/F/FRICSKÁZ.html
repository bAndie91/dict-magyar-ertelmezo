FRICSKÁZ  tárgyas ige -tam, -ott, -zon
<span style="color:blue">Fricskáz vmit:</span> vminek ismételten v. szokásszerűen fricskát ad. <span style="color:blue">A fiúknak fülét és orrát fricskázza, a lányoknak a haját ráncigálja.</span>
<ul><li>Igekötős igék: felfricskáz; lefricskáz; megfricskáz; visszafricskáz.
</li><li>fricskázás; fricskázgat; fricskázó.
</li></ul></div>
