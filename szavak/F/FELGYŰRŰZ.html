FELGYŰRŰZ  tárgyas ige fölgyűrűz (<span style="color:green;font-weight:bold">ritka</span>)
Gyűrűvel ellát, feldíszít. □ Gyűrűzd föl, órázd föl, smukkozd [= ékszerezd] föl magadat. (Tolnai Lajos) Gyűrűzze fel ne az én szegény ujjamat, hanem az esernyőt. (Mikszáth Kálmán)
<ul><li>felgyűrűzés; felgyűrűzhető; felgyűrűzött.
