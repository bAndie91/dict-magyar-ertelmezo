FERTŐTLENÍTÉS  főnév -t, (-ek), -e [ë, e]
A fertőtlenít igével kifejezett eljárás, tevékenység; az a cselekvés, hogy vmit fertőtlenítenek. <span style="color:blue">Jóddal, klórmésszel való fertőtlenítés; a lakás, a ruhák fertőtlenítése. Ragályos beteg szobájában fertőtlenítést kell végezni.</span>
<ul><li>fertőtlenítési.
