FENYŐRIGÓ  főnév (<span style="color:green;font-weight:bold">állattan</span>)
Főleg hegyvidéki borókásokban, ritk. sík vidéki ligetekben élő, a rigók családjába tartozó madár; a feketerigónál nagyobb, feje és törzsének közepe tája hamuszürke (Turdus pilaris); fenyőmadár.
