FESZÜLTSÉGMÉRŐ  főnév
<ul><li>1. (<span style="color:green;font-weight:bold">villamosság</span>) Az a műszer, készülék, amely a rajta keresztülhaladó áram feszültségét méri és voltokban számszerűleg mutatja; voltmérő.
</li><li>2. (<span style="color:green;font-weight:bold">fizika</span>) A gőz és a gáz feszítő erejének, nyomásának mérésére haszn. készülék; manométer; feszmérő.
</li></ul></div>
