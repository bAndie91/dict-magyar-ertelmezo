FELLEBBVITEL  főnév föllebbvitel (<span style="color:green;font-weight:bold">jogtudomány</span>)
A bíróság előtti (peres v. peren kívüli) eljárásban a magasabb fokú bírósághoz intézett jogorvoslat (pl. fellebbezés, felfolyamodás, felülvizsgálat, semmisségi panasz). <span style="color:blue">Az ügy fellebbvitellel a legfelsőbb bírósághoz került.</span>
