FEJPÁRNA  főnév
<ul><li>1. Alvásnál, pihenésnél a fej alá tett, tollal töltött, rendsz. váltható huzatú, kisebb puha párna, vánkos; kispárna.
</li><li>2. Lószőrrel v. afrikkal töltött, rendsz. matracszerű, ék alakú, kiemelhető kis toldalék heverőn v. párnázott vasúti kocsi ülése végében.
</li><li>fejpárnás.
</li></ul></div>
