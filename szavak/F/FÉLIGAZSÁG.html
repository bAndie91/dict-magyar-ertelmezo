FÉLIGAZSÁG  [l-i] főnév
Olyan állítás, kijelentés, amelyben van valami igazság, egészében véve azonban csak félrevezeti, elámítja az embert. <span style="color:blue">Csak féligazságokat tud mondani. A féligazság, minthogy könnyen megtéveszti az embert, gyakran veszélyesebb, mint a nyilvánvaló hazugság.</span>
<ul><li>féligazságú.
</li></ul></div>
