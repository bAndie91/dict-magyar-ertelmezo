FOGKŐ  főnév
A nyálból a fogaknak különösen a foghússal érintkező részére lerakódott, főleg mészből álló tömör képződmény. <span style="color:blue">Fogköve van; a fogkövet leszedi, eltávolítja.</span>
<ul><li>Szóösszetétel(ek): fogkő-eltávolítás; fogkőlerakódás; fogkőoldó.
</li><li>fogköves.
</li></ul></div>
