FARKASALMA  [s-a] főnév (<span style="color:green;font-weight:bold">növénytan</span>)
Hosszú, sárga virágú évelő gyógynövény; levele szív alakú, gyökere csípős mérget tartalmaz (Aristolochia clematitis). □ Farkasalmát tettek a pálinkájába, attól beszél ilyen bolondokat. (Jókai Mór)
