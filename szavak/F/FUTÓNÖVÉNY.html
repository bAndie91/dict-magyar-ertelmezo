FUTÓNÖVÉNY  főnév
Olyan növény, melynek szára nem tud támaszték nélkül felfelé nőni, hanem hosszú indákat s azokon kacsokat eresztve a földön fut, v. falra, fára, karóra kapaszkodik, s ott elágazik, szétterjed; kúszónövény. <span style="color:blue">A tök, a szőlő, a bab, a borostyán futónövények.</span>
