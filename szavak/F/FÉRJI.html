FÉRJI  melléknév
Vkire mint férjre jellemző, tartozó; férj mivoltával kapcsolatos, ezt illető. <span style="color:blue">Férji büszkeség, jog(ok), kötelesség(ek); férji minőségében.</span> □ Másnap  már erősebb rendszabályokhoz folyamodott a sértett férji becsület. (Jókai Mór)
