FŐVÁDLOTT  főnév (<span style="color:green;font-weight:bold">jogtudomány</span>)
Több vádlott közül az elsőrendű vádlott; az, akit a bűntett végrehajtásával, előkészítésével, megszervezésével vádolnak. <span style="color:blue">A fővádlott védekezését a tanúvallomások megcáfolták.</span>
