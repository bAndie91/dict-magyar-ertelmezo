FÜGGŐFOLYOSÓ  főnév (<span style="color:green;font-weight:bold">építészet</span>)
Általában olyan folyosó, amely egy oldalon befalazott tartókon nyugszik, v. hídszerűen van építve. || a. Bérházak emeletein alkalmazott udvari folyosó, amely a lépcsőháztól indul ki, s amelyről az egyes lakások megközelíthetők.
