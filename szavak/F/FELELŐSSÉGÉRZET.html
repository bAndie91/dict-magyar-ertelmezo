FELELŐSSÉGÉRZET  [g-é] főnév
Annak felismerése és vállalása, hogy magunkért, tetteinkért v. másokért, a ránk bízottakért felelnünk kell; felelősségérzés. <span style="color:blue">Fokozott felelősségérzet; nincs benne felelősségérzet; Elevenen él benne a felelősségérzet; Minden tettét mélységes felelősségérzet hatja át.</span>
