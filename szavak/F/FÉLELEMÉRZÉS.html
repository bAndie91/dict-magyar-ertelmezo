FÉLELEMÉRZÉS  [m-é] főnév (<span style="color:green;font-weight:bold">lélektan</span>)
A félelem érzésének megléte v. feltámadása vkiben; az a lelki állapot, amelyben vki félelmet (1) érez. <span style="color:blue">Beteges, kínzó, ösztönös, tartós félelemérzés. Állandó félelemérzés között él. Nem tudja leküzdeni félelemérzését.</span>
