FAZONIGAZÍTÁS  [n-i] főnév
<ul><li>1. A rövidre vágott női haj, ill. a férfifrizura fésüléssel való rendbehozatala kisebb hajvágással a nyakon, férfiaknál esetleg a halántékon és a fül körül is.
</li><li>2. (<span style="color:green;font-weight:bold">ruházkodás</span>) A ruha szabásán, rendsz. a gallérján való kisebb igazítás, változtatás.
</li></ul></div>
