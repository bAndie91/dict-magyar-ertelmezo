FENNSÍK  főnév, (<span style="color:green;font-weight:bold">ritka</span>) fönnsík (<span style="color:green;font-weight:bold">földrajz</span>)
Magasan fekvő, többé-kevésbé sík terület. <span style="color:blue">A bükki fennsík.</span> □ A csengők csörögtek a lovak szerszámján, amint az öles hóval borított országúton, a széles fennsíkon Szindbáddal nyargaltak. (Krúdy Gyula)
