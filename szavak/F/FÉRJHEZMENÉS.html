FÉRJHEZMENÉS  [ë-ë] főnév
A nő házasságkötése; az a tény, hogy egy nő férjhez megy; férjhez menetel. → <span style="color:blue">Siet a férjhezmenéssel. A lányok fő gondja a férjhezmenés. Férjhezmenése után vidékre költöztek. Esetleges újabb férjhezmenéséig a haszonélvezet az özvegyé.</span>
