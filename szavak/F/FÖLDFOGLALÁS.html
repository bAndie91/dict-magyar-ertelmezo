FÖLDFOGLALÁS  főnév
Föld nélküli parasztoknak, mezőgazdasági munkásoknak, törpebirtokosoknak az a forradalmi cselekedete, hogy a meg nem művelt föld(ek)et v. vmely nagybirtoknak egy részét birtokukba veszik. <span style="color:blue">Önkényes, tömeges földfoglalás.</span>
