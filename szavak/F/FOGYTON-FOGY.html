FOGYTON-FOGY  tárgyatlan ige fogyton-fogyott, fogyton-fogyjon (csak 3. személyben) (<span style="color:green;font-weight:bold">régies</span>)
Fokozatosan, egyre nagyobb mértékben fogy. □ Folyton-foly [= egyre jobban folyik] és a fölső üvegből fogyton-fogy a por: akkor végződik az óra, mikor az utolsó por leesik. (Pázmány Péter)
