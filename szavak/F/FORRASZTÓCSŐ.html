FORRASZTÓCSŐ  főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Kisebb forrasztásokhoz használt, görbített végű, sárgaréz cső, melynek tágabb nyílását a szájba veszik, és egyenletesen levegőt fújnak bele, másik végét a lángba tartják, hogy a befújt levegővel a láng hőfokát növeljék.
