FELIZGUL  [l-i] tárgyatlan ige fölizgul
Hirtelen izgalomba jut, izgatottá, idegessé lesz; izgalom fogja el. <span style="color:blue">Felizgult az eseten. Felizgul a látványtól.</span> || a. Nemi izgalomba jut. <span style="color:blue">Az érzéki tánc közben felizgult. Az akt láttán felizgult.</span>
<ul><li>felizgulás; felizguló; felizgult.
