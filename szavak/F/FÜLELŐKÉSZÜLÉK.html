FÜLELŐKÉSZÜLÉK  [e] főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Hangerősítő készülék, amelynek segítségével gépek (főleg repülőgépek) zúgásából haladásuk irányát meg lehet állapítani. || a. Olyan készülék, amely bizonyos zörejek észlelésére s a hangforrás távolságának megmérésére stb. alkalmas.
