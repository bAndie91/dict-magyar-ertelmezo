FÉLREPILLANT  tárgyatlan ige
Futólagos pillantást vet oldalra; tekintetét hirtelen, rövid időre oldalt fordítja. <span style="color:blue">Nézett előre, anélkül, hogy félrepillantott volna. Mikor félrepillantott, észrevette, hogy mellette áll valaki.</span>
<ul><li>félrepillantás; félrepillantgat; félrepillantó.
</li></ul></div>
