FÖLDIGÉNYLŐ  [d-i] főnév
Olyan (személy, rendsz. szegényparaszt), aki földet akar szerezni, kül. aki földosztáskor földet igényel. <span style="color:blue">Földigénylő parasztok, törpebirtokosok. A földosztás 1945-ben mindenütt a földigénylők összeírásával kezdődött.</span>
</div>
