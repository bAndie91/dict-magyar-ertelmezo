FUTBALL-LABDA  főnév
Különféle nagyságú, általában 380430 g súlyú és 6871 cm kerületű, gumiból készült felfújható belső és bőrből varrt külső részből álló labda, amelyet a labdarúgásban használnak; labda, bőr, foci, laszti. <span style="color:blue">Veszek a fiamnak egy futball-labdát.</span>
