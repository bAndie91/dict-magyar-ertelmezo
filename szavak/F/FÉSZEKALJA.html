FÉSZEKALJA  [k-a] főnév
Egy fészekben levő, elférő, ill. egy anyamadár tojásaiból egy időben kikelt tojás v. madárivadék. <span style="color:blue">Az egész fészekalja elpusztult.</span> || a. jelzői használat(ban) Tojásból v. madárivadékból ilyen mennyiségű. <span style="color:blue">Egy fészekalja tojás. Egy fészekalja kiscsibe szaladgált az udvaron.</span>
