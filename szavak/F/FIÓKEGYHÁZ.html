FIÓKEGYHÁZ  [k-e] főnév (<span style="color:green;font-weight:bold">vallásügy</span>)
Az a kisebb egyházközség, amelynek nincs saját lelkésze, s amelyet egy másik egyházközségnek, az anyaegyháznak a lelkésze gondoz; leányegyház, fília, filiále.
<ul><li>fiókegyházas; fiókegyházi.
</li></ul></div>
