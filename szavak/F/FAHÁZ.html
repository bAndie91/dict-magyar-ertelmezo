FAHÁZ  főnév
Fából (fatörzsekből, gerendákból, deszkából v. lécből) épült ház. □ [A sok] rögtönzött faház eltűnt az utcákról. (Jókai Mór) Ó, a korhadó faház s ezer áldott hasadéka! | ó, a reteszes kabin! (Babits Mihály)
