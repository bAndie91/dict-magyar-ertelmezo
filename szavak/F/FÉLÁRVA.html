FÉLÁRVA  [l-á] melléknév és főnév
<ul><li>I. melléknév
</li><li>1. Olyan, rendsz. kiskorú, eltartásra szoruló &lt;személy&gt;, akinek apja v. anyja meghalt. <span style="color:blue">Félárva gyermek.</span>
</li><li>2. Az ilyen személynek járó, fizetendő. <span style="color:blue">Félárva járadék.</span>
</li><li>II. főnév Félárva személy. <span style="color:blue">Félárvát vett feleségül.</span>
</li></ul></div>
