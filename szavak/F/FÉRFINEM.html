FÉRFINEM  főnév (<span style="color:green;font-weight:bold">választékos</span>)
A férfiak összessége &lt;szemben a nőkkel, a női nemmel&gt;. <span style="color:blue">Köszönöm a bókot az egész férfinem nevében.</span> □ A férfinem harcol és sebeket oszt, a nőnem gyógyít és ápol. (Jókai Mór) A férfinem nagyon elfogyott a csatározások alatt. (Mikszáth Kálmán)
