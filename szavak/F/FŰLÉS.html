FŰLÉS  főnév -t, -e [e] (csak egyes számban) (<span style="color:green;font-weight:bold">ritka</span>)
A fűl(ik) igével kifejezett folyamat, állapot; az a tény v. mód, (a)hogy vmi fűlik; fűtés által meleggé válás, (be)melegedés. <span style="color:blue">A szoba fűlése. A kályha, a kemence fűlése rossz, nem kielégítő.</span>
