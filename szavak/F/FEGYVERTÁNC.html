FEGYVERTÁNC  főnév (<span style="color:green;font-weight:bold">régies</span>)
Fegyveres férfiak, katonák lejtette szertartásos, ünnepi, harci tánc. <span style="color:blue">A vad népek a harc előtt és után fegyvertáncot ropnak.</span> □ A lobogó tűz körül eljárták a fegyvertáncot, vad harci dalaikat rivallva. (Jókai Mór)
