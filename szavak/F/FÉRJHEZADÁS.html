FÉRJHEZADÁS  [ë; z-a] főnév
Az a cselekvés, eljárás, ill. tény, hogy vkit férjhez, nőül adnak (vkihez); annak elősegítése, hogy vki férjhez menjen. <span style="color:blue">A szülők számára nagy gond volt leányuk férjhezadása. Még nem gondolnak leányuk férjhezadására.</span>
<ul><li>férjhezadási.
</li></ul></div>
