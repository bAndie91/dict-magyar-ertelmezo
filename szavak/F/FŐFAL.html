FŐFAL  főnév
Az épület súlyát elsősorban tartó vastagabb külső v. belső fal. <span style="color:blue">Az épület főfala mentén helyezik el a pénzszekrényeket.</span> □ Hét ágy lévén a szobában, három-három egymással szemben volt a főfalon, a hetedik pedig keresztben az ajtó kisebb falán. (Móricz Zsigmond)
