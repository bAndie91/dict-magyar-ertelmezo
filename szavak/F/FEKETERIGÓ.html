FEKETERIGÓ  főnév (<span style="color:green;font-weight:bold">állattan</span>)
A rigók családjába tartozó, rovarokkal élő, hasznos, kellemes hangú, erdőben, ligetekben, kertekben gyakori madár; a hím tollazata egészen fekete, a nőstényé szürkésbarna (Turdus merula).
