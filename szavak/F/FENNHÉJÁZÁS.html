FENNHÉJÁZÁS  főnév -t, -a (csak egyes számban) fönnhéjázás (<span style="color:green;font-weight:bold">választékos</span>)
A fennhéjáz igével kifejezett magatartás; az a tény, hogy vki fennhéjáz; ok nélküli büszkélkedés; elbizakodottság, gőg. <span style="color:blue">Fennhéjázás jellemezte egész lényét. Minden szava, cselekedete fennhéjázás volt.</span>
