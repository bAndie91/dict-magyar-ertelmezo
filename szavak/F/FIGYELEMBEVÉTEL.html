FIGYELEMBEVÉTEL  [e-ë-e-e] főnév (csak egyes számban, csak birtokviszonyban)
Vmely körülmény, mozzanat szerepének bizonyos szempontból való tekintetbe vétele. <span style="color:blue">A körülmények figyelembevételével; a méltányossági szempontok figyelembevétele nélkül. Kérem a minőség figyelembevételét is.</span>
