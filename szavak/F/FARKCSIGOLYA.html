FARKCSIGOLYA  főnév
(<span style="color:green;font-weight:bold">állattan</span>) Csigolya az állatok farkában. || a. (<span style="color:green;font-weight:bold">bonctan</span>) <span style="color:blue">Farkcsigolyák:</span> az ember gerincoszlopának alsó végén levő, lefelé fokozatosan kisebbedő 36 csökevényes csontocska, amelyen már alig ismerhetők fel a csigolyák alkotórészeinek némi nyomai; farkcsont.
