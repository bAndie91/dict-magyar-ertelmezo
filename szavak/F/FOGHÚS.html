FOGHÚS  főnév
A foggyökereket körülvevő és a fogak közé is benyúló hús (1); így. <span style="color:blue">Kemény, piros foghús. Vérzik a foghúsa.</span> □ Az ajka  megrepedt, a foghúsa alól  vér szivárgott ki. (Nagy Lajos)
<ul><li>Szóösszetétel(ek): foghúsgyulladás; foghústályog.
</li></ul></div>
