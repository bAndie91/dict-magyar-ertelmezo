FORRÓLÁZ  főnév (<span style="color:green;font-weight:bold">népies</span>, <span style="color:green;font-weight:bold">régies</span>)
Különféle megbetegedésekkel kapcs. fellépő, gyak. önkívülettel járó igen magas láz, lázas betegség. □ A gyermek forrólázban volt, iszonyúan félrebeszélt. (Jókai Mór) Ekkor ismertem meg a borzongást, amit a forróláz okoz. (Móricz Zsigmond)
