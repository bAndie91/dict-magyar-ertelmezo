FRENETIKUS  [ë-ë v. e-e] melléknév -an, -abb (<span style="color:green;font-weight:bold">sajtónyelvi</span>)
Rendkívüli lelkesedést kifejező v. keltő, magával ragadó &lt;siker, ill. ennek megnyilvánulása&gt;. <span style="color:blue">Frenetikus siker; frenetikus hatás, taps. A hatás frenetikus volt.</span> □ A nézőközönség frenetikus tapsban tört ki. (Jókai Mór)
