FONÁLFÉREG  főnév (<span style="color:green;font-weight:bold">állattan</span>) Részint állatokban és emberekben élősködő, részint szabadon élő, fonálhoz hasonló alakú, hengeres testű féreg. □ Hálótanyájukat felverte [= ellepte] a bőr alá fúródó fonalféreg. (Jókai Mór) || a. <span style="color:blue">Fonálférgek:</span> az ilyen férgeket összefoglaló osztály (Nematoda).
