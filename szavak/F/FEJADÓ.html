FEJADÓ  [j-a] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
Olyan adónem, amelyet a vagyonra és jövedelemre való tekintet nélkül, csupán a személyek száma szerint vetettek ki. || a. (<span style="color:green;font-weight:bold">közigazgatás</span>, <span style="color:green;font-weight:bold">1945 előtt</span>) Az I. és (II) osztályú kereseti adó.
