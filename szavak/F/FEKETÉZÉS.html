FEKETÉZÉS  [e-e] főnév -t, (-ek), -e [ë, e]
<ul><li>1. Feketekávé fogyasztása, kül. étkezés után v. nyilvános helyen. <span style="color:blue">Ebéd utáni, kellemes feketézés. Megszokta a feketézést.</span>
</li><li>2. Feketekereskedelem, feketén (I. 8) való kereskedés. <span style="color:blue">Elítélték feketézésért.</span>
</li></ul></div>
