FÉRFIRUHA  főnév
Általában a férfiak öltözetéhez tartozó, férfiak viselte ruhadarabok (összessége). || a. Szűk. ért. a férfiak szokásos öltözetét alkotó nadrág, kabát és mellény; öltöny. <span style="color:blue">Gyapjú férfiruha. Ez a szabó csak férfiruhát készít.</span>
<ul><li>Szóösszetétel(ek): férfiruhaszalon.
</li><li>férfiruhás.
