FOGGYÖKÉR  [g-gy] főnév (<span style="color:green;font-weight:bold">biológia</span>)
Az emberi és az állati fognak (1) az állcsontba ékelődő része, gyökere; a csúcsán lévő nyíláson át vezet a fogba az ideg és a fog sejtjeit tápláló ér.
<ul><li>Szóösszetétel(ek): foggyökérgyulladás.
</li></ul></div>
