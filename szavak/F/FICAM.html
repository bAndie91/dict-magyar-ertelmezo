FICAM  főnév -ot, -a
Az ízületekben találkozó csontoknak külső, erőszakos hatásra történő kiugrása, helyükből való kimozdulása. □ A borbély, aki helyre tette a lábát, azt mondta, hogy ez veszedelmes ficam. (Jókai Mór)
<ul><li>Szóösszetétel(ek): bokaficam; csípőficam.
