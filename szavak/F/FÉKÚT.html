FÉKÚT  [k-ú] főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Az a távolság, amelyet a mozgásban levő jármű a fékezés kezdetétől a teljes megállásig tehetetlensége következtében még megtesz. <span style="color:blue">A vonat fékútja a menetsebességtől és a pálya lejtősségétől függ.</span>
