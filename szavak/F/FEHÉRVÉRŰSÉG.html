FEHÉRVÉRŰSÉG  [e] főnév -et, -e [ë, e] (<span style="color:green;font-weight:bold">orvostudomány</span>)
A vérképző szervek súlyos megbetegedése következtében fellépő betegség: a fehér vérsejtek növekvő elszaporodása a vérben (Leukaemia). <span style="color:blue">A fehérvérűség okát még nem tisztázta az orvostudomány.</span>
