FÉRFIKAR [1]  főnév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
A férfi karja mint az erő jelképe. □ Régi erkölcs, spártai férfikar Küzdött s vezérelt fergetegid között. (Berzsenyi Dániel) Föl magyar! Pozsonyhoz kell a férfikar: | A vítt Pozsony remeg. (Vörösmarty Mihály)
