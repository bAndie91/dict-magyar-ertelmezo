FOGLALATLAN  melléknév
<ul><li>1. (<span style="color:green;font-weight:bold">ritka</span>) Foglalattal el nem látott, foglalatba nem illesztett &lt;ékkő&gt;. <span style="color:blue">Foglalatlan drágakő.</span>
</li><li>2. Olyan &lt;forrás&gt;, amelyet (még) nem foglaltak (8).
</li><li>3. (<span style="color:green;font-weight:bold">jogtudomány</span>) Olyan, ami nem áll foglalás (2) alatt, nincs lefoglalva. <span style="color:blue">A szekrény, az ágy még foglalatlan.</span>
