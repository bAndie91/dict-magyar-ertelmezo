FŰTŐSZÁL  főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>, <span style="color:green;font-weight:bold">villamosság</span>)
Huzalszerű, fémből való, ellenállást kifejtő anyag, amelyet a rajta átfolyó áram melegít fel; az áram hőhatásán alapuló eszközök (villanyvasaló, villanykályha stb.) alkatrésze. <span style="color:blue">A villanyvasalóban ki kell cserélni a fűtőszálokat.</span>
<ul><li>fűtőszálas; fűtőszálú.
</li></ul></div>
