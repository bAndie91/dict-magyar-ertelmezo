FAÓRIÁS  főnév
Rendkívüli magasságú fa; óriás a fák között. <span style="color:blue">Kaliforniai faóriások.</span> □ A ház mellett az erdőnek helyét friss mező foglalja el, s az egyes meghagyott faóriások árnya alatt zöld pázsitszőnyeg terül el. (Eötvös József) Távol a liget sötétkék faóriásai borongtak. (Krúdy Gyula)
