FELÉLÉS  [fel-é] főnév fölélés
A felél (1) igével kifejezett tevékenység, ill. folyamat; az a cselekvés, hogy vmit felélnek. <span style="color:blue">A készletek, a termés felélése; jövedelmének, vagyonának felélése; erejének, energiájának felélése.</span>
<ul><li>felélési.
