FÉSZEKLAKÓ  melléknév és főnév (<span style="color:green;font-weight:bold">állattan</span>)
Olyan (madár), amely a tojásból kikelve csupasz, gyámoltalan, s ezért a fészek melegére szorul, és arra, hogy az öregek táplálják, gondozzák. <span style="color:blue">A fészeklakó madarak; a fészeklakók táplálkozása.</span>
</div>
