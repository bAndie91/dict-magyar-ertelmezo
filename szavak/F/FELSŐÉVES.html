FELSŐÉVES  melléknév és főnév fölsőéves (<span style="color:green;font-weight:bold">iskolai</span>)
Olyan (diák, növendék), aki vmely több évfolyamú (fő)iskola v. tanfolyam felsőbb tagozatába jár, felső éveit végzi. <span style="color:blue">Felsőéves általános iskolás, gimnazista, tanítóképzős. A felsőévesek nyáron mezőgazdasági munkára mennek.</span>
