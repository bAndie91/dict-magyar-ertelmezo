FÜGGŐÁGY  főnév
Fekvésre való alkalmatosság, mely hosszúkás hálóból v. vitorlavászon lapból áll, és két végén egy-egy tartóhoz erősítve ring; kertben, hajón stb. haszn. <span style="color:blue">Két fához kötötték a függőágyat.</span> □ Úgy látszék magát hintálni a habok tetején, mintha függőágyban ülne. (Jókai Mór)
