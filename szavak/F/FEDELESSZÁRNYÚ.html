FEDELESSZÁRNYÚ  [s-sz] melléknév és főnév (<span style="color:green;font-weight:bold">állattan</span>)
<ul><li>I. melléknév Olyan &lt;rovar&gt;, amelynek kettős szárnya közül a felső kemény, repülésre nem alkalmas és csak védelmül szolgáló, az alsó pedig repülésre való, hártyaszerű szárny.
</li><li>II. főnév -t, -ak, -ja
fedelesszárnyúak: bogarak (Coleoptera).
</li></ul></div>
