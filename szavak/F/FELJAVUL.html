FELJAVUL  tárgyatlan ige följavul
<span style="color:blue">Feljavul vki, vmi:</span> vkinek, vminek a minősége addig javul, míg egy bizonyos magasabb szintet elér. <span style="color:blue">Az állatok a jó legelőn hamar feljavultak. A csapat kondíciója feljavult.</span>
<ul><li>feljavulás; feljavuló; feljavult.
