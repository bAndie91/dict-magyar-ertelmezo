FÉLMAJOM  főnév (<span style="color:green;font-weight:bold">állattan</span>)
<span style="color:blue">Félmajmok:</span> a főemlősöknek az az alrendje, amelybe Afrikában és Indiában élő, a majmokhoz hasonlóan fákon lakó, de a majmoknál sokkal fejletlenebb agyvelejű, nagy szemű éjjeli állatok tartoznak (Prosimiae). <span style="color:blue">A félmajmok legtöbb fajának Madagaszkár a hazája.</span>
</div>
