FELKÖLTÖZIK  tárgyatlan ige fölköltözik
Vmely szempontból fent levő, északabbra fekvő v. nagyobb központi helyre költözik. <span style="color:blue">Felköltözik a negyedik emeletre, a várba; felköltözik Budapestre. Hosszas morgás után felköltözött a felső ágyra.</span>
<ul><li>felköltözés; felköltöző; felköltözött; felköltöztet.
