<div class="szocikk">
FÖLDMUNKA  főnév
Építkezéssel, út- és vasútépítéssel kapcs. olyan munka, amelynek folyamán a földet kiemelik, elszállítják, elhelyezik; kubikos munka. <span style="color:blue">A földmunkák egy részét ma már gépekkel végzik.</span>
<ul><li>Szóösszetétel(ek): földmunkagép; földmunkamódszer.
</li></ul></div>
