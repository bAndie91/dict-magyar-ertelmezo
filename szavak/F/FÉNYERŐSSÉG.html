FÉNYERŐSSÉG  [ny-e] főnév (<span style="color:green;font-weight:bold">fizika</span>)
A fénynek az a mennyisége, mely a fényforrástól meghatározott távolságban levő test egységnyi területére esik. <span style="color:blue">A fényerősség a fényforrástól való távolság négyzetének arányában fogy.</span>
<ul><li>Szóösszetétel(ek): fényerősségmérés; fényerősségmérő.
</li><li>fényerősségű.
