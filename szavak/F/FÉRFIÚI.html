FÉRFIÚI  melléknév (<span style="color:green;font-weight:bold">választékos</span>)
Férfi(ú)ra jellemző, férfi(ú)hoz illő &lt;magatartás, tulajdonság&gt;. <span style="color:blue">Férfiúi büszkeség, hiúság, méltóság.</span> □ Amit egy férfiúi, becsületes, egyenes szív meg tud tenni: azt igenis  megtette. (Tolnai Lajos)
