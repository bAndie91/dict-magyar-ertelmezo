FÉLHALK  melléknév -an
Nem egészen halk, de nem is hangos, inkább halk. <span style="color:blue">Félhalk beszélgetés folyt a sarokban; félhalk megjegyzés hallatszott.</span> □ Maris az utolsó szavakat félhalkan mondá. (Eötvös József) Az őrök, kik az ajtóban álltak, félhalkan suttogák: "a kétszarvú ember". (Jókai Mór)
