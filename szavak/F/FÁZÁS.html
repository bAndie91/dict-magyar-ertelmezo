FÁZÁS  főnév -t, (-ok), -a
A fázik (1) igével kifejezett állapot; az a tény, hogy vki v. vmi a hideg hatását (erősebben) érzi, fázik. <span style="color:blue">Didergő fázás. Egészen elgyengült a sok fázástól és éhezéstől.</span> □ Ott maradt egy ingben, mezítláb, szűk gatyában és borzongó fázással. (Móricz Zsigmond)
