FÖLDALAP  [d-a] főnév (<span style="color:green;font-weight:bold">1945 után</span>, <span style="color:green;font-weight:bold">hivatalos</span>)
Az 1945. évi földhöz juttatás céljára létesített olyan alap, amely részint elkobzott, részint kártalanítással igénybe vett, részint pedig az államkincstár tulajdonában levő földbirtokokból állott.
<ul><li>földalapi.
</li></ul></div>
