FEDŐANYAG  főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Általában minden olyan anyag, amellyel vmit, kül. épületet v. utat fednek, burkolnak. <span style="color:blue">A háztetők leggyakoribb fedőanyaga a cserép. Az útburkolat különféle fedőanyagokból készül.</span>
<ul><li>Szóösszetétel(ek): fedőanyaggyár; fedőanyaggyártás.
