FANYELŰ  [e] melléknév
Olyan &lt;eszköz, tárgy&gt;, amelynek fából (2a) van a nyele. <span style="color:blue">Fanyelű ár, esernyő, kés, villa.</span> □ Meg van elégedve , ha Szeged környékén az ő bicskáival szelik a szalonnát az atyafiak. Már a hódmezővásárhelyi embertől szinte irigyli. Jó annak a fanyelű bicsak is! (Mikszáth Kálmán)
