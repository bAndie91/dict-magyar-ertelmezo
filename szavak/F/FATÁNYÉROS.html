FATÁNYÉROS  főnév -t, (-ok), -a (<span style="color:green;font-weight:bold">konyhaművészet</span>)
Többféle sült húsból és pirított szalonnából összeállított étel, amelyet vegyes körettel fatányéron szolgálnak fel. □ Sajátkezűleg szokta vendégei előtt trancsírozni ünnepélyesen az erdélyi fatányérost. (Babits Mihály)
