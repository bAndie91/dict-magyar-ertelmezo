SORÁLLÁS  [r-á] főnév
Vmire várakozó, vmihez hozzájutni kívánó, vhova bejutni akaró csoport, tömeg sorban állása, főként vásárló szándékkal; sorbanállás. <span style="color:blue">Sorállás nélkül nem lehetett kenyeret kapni. Az árubőséggel megszűnik a sorállás.</span>
sorállási.
