<ul><li>1. (<span style="color:green;font-weight:bold">hivatalos</span>) Olyan munkaerő, aki vmely, rendsz. értelmiségi munka végzésében segédkezik. <span style="color:blue">Még egy-két segéderőt kell felvenni.</span>
