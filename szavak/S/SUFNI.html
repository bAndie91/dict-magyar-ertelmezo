SUFNI * főnév -t, -ja (<span style="color:green;font-weight:bold">népies</span>, <span style="color:green;font-weight:bold">bizalmas</span>)
Deszkából összetákolt bódé, ill. kuckó, zug a szerszámok, limlom, kis mennyiségű tüzelőanyag elhelyezésére; kisebb fészer. <span style="color:blue">Fás, ócska, szenes sufni.</span> □ Csinálok neked egy sufnit, hogy a szerszámot be tudd zárni, meg eső elől behúzódhass. (Móricz Zsigmond)
