SÍRNIVALÓ  főnév
Sírásra okot adó, sírásra késztető dolog, helyzet, körülmény; olyasmi, amin sírni kell v. lehet. <span style="color:blue">Mi van ebben </span>v.<span style="color:blue"> ezen sírnivaló? Van elég sírnivalója.</span> □ Be nagy is a magam-veszejtő szándék, Be száz furcsa sírnivaló les rám még. (Ady Endre)
