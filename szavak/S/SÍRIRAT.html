SÍRIRAT  [r-i] főnév (<span style="color:green;font-weight:bold">régies</span>)
Sírfelirat. □ Történetünk megrendítő lész. Mint a sír-irat a kövön: Ezek a sorssal birkozának, Örök dicsőség nevökön! (Tompa Mihály) Miért nem vesztem hát el a magasban Inkább, mint így hallgatni önmagam Síríratát. (Madách Imre)
