SELLAK  [ë v. e] főnév -ot, -ja (csak egyes számban)
Egyes indiai fafajtáknak pajzstetűk szívása következtében kiválasztódó gyantája; lakk, pecsétviasz, gitt, politúr, hanglemez stb. készítéséhez használják.
<ul><li>Szóösszetétel(ek): sellakpótló; sellakrúd.
</li><li>sellakos; sellakoz.
</li></ul></div>
