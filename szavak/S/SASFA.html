SASFA  főnév (<span style="color:green;font-weight:bold">népies</span>)
Általában faoszlop v. gerenda, amelyhez vmely fából készült szerkezet, építmény elemeit erősítik (pl. kapufélfa, kerítés oszlopa stb.). || a. (<span style="color:green;font-weight:bold">építészet</span>) (Favázas épület falában) az a függőleges gerenda, amelyhez a többi, ferdén v. vízszintesen álló gerendát erősítik.
