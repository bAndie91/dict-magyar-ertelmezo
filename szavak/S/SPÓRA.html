SPÓRA  főnév spórát, spórája (<span style="color:green;font-weight:bold">növénytan</span>)
Virágtalan növények ivartalan szaporító sejtje, általában egysejtű csíra magja, amelyből megtermékenyítés nélkül új növényi egyed fejlődik. <span style="color:blue">A gombák, a harasztok spórákkal szaporodnak.</span>
<ul><li>Szóösszetétel(ek): spóratok; spóratömlő.
</li><li>spórázik; spórás.
</li></ul></div>
