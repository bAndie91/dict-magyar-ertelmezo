SONKACSONT  főnév
A sonkában levő csont. <span style="color:blue">Levágja a sonkacsontról a sonkát.</span> || a. Ugyanez, a csont közvetlen közelében levő ízletes hússal együtt. <span style="color:blue">Sonkacsontot vesz vacsorára.</span> □ A Marci tarisznyájában még elég kenyér, szalonnabőrke és sonkacsont van. (Eötvös Károly)
