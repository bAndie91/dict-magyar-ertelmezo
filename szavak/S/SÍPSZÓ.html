SÍPSZÓ  főnév
A megfújt síp hangja, egy füttyentés a síppal. <span style="color:blue">Éles sípszó hallatszott. A sípszó a mérkőzés végét jelezte.</span> || a. Síppal játszott zene. <span style="color:blue">Sípszóval csalta lépre a madarat.</span> □ E pillanatban érkezik  nagy török sípszóval egy csapat. (Jókai Mór)
