SÁNCÁSÁS  [c-á] főnév
Az a munka(folyamat), amellyel sáncot (13), árkot ásnak, katonai támadás ellen védelmi vonalat építenek oly módon, hogy a kiásott árok mentén a földet felhányják, s ezt karókkal, kövekkel megerősítik. <span style="color:blue">A népet kihajtották sáncásásra.</span>
sáncásási.
