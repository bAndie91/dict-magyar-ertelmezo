SAKKMESTER  főnév (<span style="color:green;font-weight:bold">játék</span>)
Olyan kiváló sakkjátékos, akit a versenyeken elért eredményei alapján az erre illetékes szerv a "mester" címmel ruházott fel. □ A Mussong folyton gyakorol  Ő sakkmester akar lenni. (Nagy Lajos)
<ul><li>Szóösszetétel(ek): sakkmesterverseny.
</li><li>sakkmesteri; sakkmesterség.
</li></ul></div>
