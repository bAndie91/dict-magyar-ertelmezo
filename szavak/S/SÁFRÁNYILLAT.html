SÁFRÁNYILLAT  [ny-i] főnév
A fövő sáfrány kellemes, fűszeres illata. <span style="color:blue">Kellemes sáfrányillat áradt a konyhából.</span> Szólás(ok): <span style="color:blue">(meg)érzi a sáfrányillatot:</span> előre megérzi az őt fenyegető bajt, kellemetlenséget, büntetést (, s ezért még idejében kereket old, elmenekül).
