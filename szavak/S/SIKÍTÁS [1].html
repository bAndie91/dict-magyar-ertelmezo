SIKÍTÁS [1]  főnév -t, -ok, -a
A sikít [1] igével kifejezett cselekvés, megnyilvánulás, ill. hangjelenség; az a tény, hogy vki sikít. <span style="color:blue">A kisgyermek, a leányok sikítása. Idegesít a gyerek sikítása. Éles sikítás hallatszott.</span> □ Nagyanyám  nekiereszti  jajgató, égszakasztó sikítását. (Móricz Zsigmond)
