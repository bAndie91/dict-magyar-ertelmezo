SÜPPEDÉK  [e] főnév -et, -e [ë, e] (<span style="color:green;font-weight:bold">régies</span>)
A nedvességtől lágy, laza, ingoványos talaj, amely a nyomásnak könnyen enged, s a lábak alatt lesüpped. <span style="color:blue">A nádas mellett süppedék van.</span> □ Egy darabig fölfelé kellett menni, de aztán se haladhattak könnyen a nagy sár és a süppedékek miatt. (Ambrus Zoltán)
