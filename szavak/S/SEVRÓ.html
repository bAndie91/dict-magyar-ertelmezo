SEVRÓ  [ë v. e] főnév -t, -ja
Finoman kidolgozott, vékony, puha, fényes kecskebőr; főleg könnyű cipő felső részének készítésére használatos. <span style="color:blue">Sevróból csináltat cipőt.</span> || a. jelzői használat(ban) Ebből a bőrből készült, való. <span style="color:blue">Sevró felsőrész.</span>
<ul><li>Szóösszetétel(ek): sevrócipő; sevrólakk.
