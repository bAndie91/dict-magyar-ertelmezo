SPÁRTAI  melléknév (<span style="color:green;font-weight:bold">választékos</span>)
Az ókori Spárta lakosaira jellemző, rájuk emlékeztető: edzett, kemény, szigorú és egyszerű. <span style="color:blue">Spártai egyszerűség, erkölcs, jellem, nevelés.</span> □ Régi erkölcs, spártai férfikar Küzdött s vezérelt fergetegid között. (Berzsenyi Dániel)
spártaiság.
