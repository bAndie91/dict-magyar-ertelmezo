SÁSLILIOM  főnév (<span style="color:green;font-weight:bold">növénytan</span>) 
A liliomfélék családjába tartozó, nedves réteken, erdőkben elvadulva is tenyésző kerti dísznövény; nagy, tölcsér alakú, élénk sárga v. tűzpiros virága van; tűzliliom. □ A fennsíkon fakadó forrás  sásliliomokkal  volt körülszegélyezve. (Jókai Mór)
sásliliomos.
