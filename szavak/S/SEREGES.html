SEREGES  [e-e-ë] melléknév (<span style="color:green;font-weight:bold">ritka</span>) -en [e]
Egy időpontban, egyszerre nagy tömeget alkotó, csoportosan jelentkező, tömegben előforduló, történő. <span style="color:blue">Sereges megjelenés; rovarok sereges irtása. Seregesen érkeztek, tódulnak.</span> □ Seregesen senkik jönnek, Megrabolnak, elköszönnek  (Ady Endre)
