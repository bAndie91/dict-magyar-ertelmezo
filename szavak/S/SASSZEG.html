SASSZEG  [s-sz] főnév sasszög (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Rendsz. félkör keresztmetszetű, lágyított drótból készített szeg, amelyet összehajlítva dugnak vmely géprész, pl. csapszeg végén fúrt lyukba, majd a végét szétfeszítve kettéhajlítják, hogy ki ne eshessen.
sasszeges.
