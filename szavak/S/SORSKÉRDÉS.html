SORSKÉRDÉS  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Olyan kérdés (34), amelynek megoldása, eldöntése vkinek, vminek (rendsz. az emberek nagyobb csoportjának)sorsát,jövőjét eldönti, ill. meghatározza. <span style="color:blue">Ez nem volt számára sorskérdés. A népellenes kormányok a nép sorskérdéseiről a nép nélkül döntöttek.</span>
