SONKÁS  melléknév -an, -abb
Olyan &lt;étel&gt;, amely(b)en fölszeletelt v. darált sonka van, amelyet ezzel ízesítenek. <span style="color:blue">Sonkás kenyér, kocka, szendvics, tészta, zsemle.</span>
□ Van itt egy úr, aki sonkás omlettet szeretne fogyasztani, mégpedig parmezánnal  (Krúdy Gyula)
