SÁRSZALONKA  főnév (<span style="color:green;font-weight:bold">állattan</span>)
A szalonkák rendjébe tartozó, a rigónál nagyobb, nedves rétjeinken ősszel és tavasszal látható, részben itt fészkelő madár; feje tetején két sötétbarna hosszanti sáv húzódik (Capella gallinago).
