SISAKELLENZŐ  [k-e] főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
&lt;Lovagkori sisakokon&gt; az arcot védelmező, csuklós szerkezettel ellátott felcsapható és leereszthető rész; rostély. □ Sisakellenzője le vagyon bocsátva. (Arany János) Sisak-ellenzőjét felüti orcátlan. (Arany János)
sisakellenzőjű; sisakellenzős.
