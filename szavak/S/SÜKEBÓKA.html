SÜKEBÓKA  [e] melléknév ..kán, ..kább sikebóka (<span style="color:green;font-weight:bold">tájszó</span>)
<ul><li>1. Süket (I. 1).
</li><li>2. Olyan &lt;személy&gt;, aki süket (I. 2) mindenre, ami körülötte történik, mindig másutt az esze, se ért, se hall.
</li><li>3. Együgyű, gyámoltalan, ill. féleszű. <span style="color:blue">Csak állt, és bámult, mintha sükebóka volna.</span>
</li></ul></div>
