SÍRVEREM  főnév (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">költői</span>)
Sír [2] (1), sírgödör. □ Nem lett híre, kincse, de lett boldogsága S apjával fogadta őt be egy sírverem, Rajta zöld pázsit és tarka virág terem. (Petőfi Sándor) Dicsőség nélkül, ifjan, árván, Szegényen dobnak sírverembe. (Reviczky Gyula)
