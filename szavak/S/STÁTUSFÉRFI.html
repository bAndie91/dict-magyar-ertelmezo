STÁTUSFÉRFI  főnév státusférfiú (<span style="color:green;font-weight:bold">régies</span>)
Államférfi (12). □ Nem a gyors felfogás, helyes tapintat hiányzott e jól alkotott főben, hogy nem kisebb státusférfiú legyen, mint népszónok volt. (Csengery Antal) A státusférfiú begombolódzik a hiú világi benyomások elől. (Mikszáth Kálmán)
státusférfiúi.
