SIKERDÚS  melléknév (<span style="color:green;font-weight:bold">választékos</span>, <span style="color:green;font-weight:bold">sajtónyelvi</span>)
Sikerekben gazdag, eredményekben bővelkedő; nagy sikerű, sikeres. <span style="color:blue">Sikerdús közszereplés, pályafutás.</span> □ A sikerdús kivitelért a fővezér ott a helyszínen alezredessé emelte. (Jókai Mór)
