SIKERESÍT  [e-ë] tárgyas ige -ett, -sen [ë, ë]; -eni [e] v. -ni (<span style="color:green;font-weight:bold">régies</span>)
Sikeressé, eredményessé tesz; sikerre visz vmit. □ Neki úgy illett, hogy a legveszélyeztetettebb helyeken jelenjék meg, a mentés munkáját jelenlétével sikeresíteni. (Jókai Mór)
<ul><li>sikeresítés; sikeresített; sikeresítő.
