SÁRARANY  [sár-a] főnév (<span style="color:green;font-weight:bold">régies</span>)
Tiszta arany, színarany. □ Zsuzsánna  szép orcája, mint pünkösti új rózsa, Fényes haja nap csillaga vagy sárarany sárgája. (Balassi Bálint) Korona volt a fejében Sár-aranyból, kővel ékes. (Arany János)
