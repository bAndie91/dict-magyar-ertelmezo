SELYEMBOGÁR  főnév (<span style="color:green;font-weight:bold">népies</span>)
Selyemhernyó, ill. selyemlepke. □ Selyembogárként nem fonám-e be Én vágyim hálójába éltemet? (Vörösmarty Mihály) Versenyre hítta a pók A selyembogarat; Remélvén, hogy előtte Győzelmet ő arat. (Tompa Mihály)
<ul><li>Szóösszetétel(ek): selyembogár-tenyésztés.
