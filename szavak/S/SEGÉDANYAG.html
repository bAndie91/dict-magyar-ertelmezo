SEGÉDANYAG  [d-a] főnév (<span style="color:green;font-weight:bold">közgazdaságtan</span>)
A termelés során felhasznált olyan anyag, amely nem közvetlenül a készítendő termékhez szükséges (pl. üzem-, kenő-, fűtő-, festékanyag stb.). <span style="color:blue">A segédanyagok felhasználása terén nagy pazarlás folyt.</span>
