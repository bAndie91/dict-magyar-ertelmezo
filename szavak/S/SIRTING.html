SIRTING  főnév -et [ë], (-je) v. (-e) [e, e] (<span style="color:green;font-weight:bold">szövőipar</span>)
Ritka, a vászon szövésére emlékeztető kötéssel pamutból készített, különféle anyagokkal keményített, nem mosható, merev bélelő anyag. <span style="color:blue">A sirting adja meg a ruha kellő tartását.</span>
