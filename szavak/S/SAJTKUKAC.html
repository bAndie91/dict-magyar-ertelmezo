SAJTKUKAC  főnév
Egy légyfajnak (Piophila casei) sajtba, szalonnába rakott petéjéből kikelő álcája, mely főleg a kemény, erős sajtot porrá rágja. <span style="color:blue">Nyüzsög a sajtban a sajtkukac.</span>
Szóláshasonlat(ok): (<span style="color:green;font-weight:bold">bizalmas</span>) <span style="color:blue">olyan, mint a sajtkukac:</span> állandóan izeg-mozog, folyton fészkelődik.
