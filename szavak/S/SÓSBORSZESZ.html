SÓSBORSZESZ  főnév
Házi gyógyszerként, kül. borogatásra, bedörzsölésre használt, sós vízzel kevert, illatosított alkohol. □ Ahol fájt, ott megmaszíroztak, sósborszesszel bedörzsöltek. (Jókai Mór) Kenőccsel kenték, ecettel dörzsölték, sósborszesszel is borogatták. (Nagy Lajos)
sósborszeszes.
