SÚLYOSBODIK  tárgyatlan ige -ott, -jék (-jon) (csak 3. személyben) (<span style="color:green;font-weight:bold">választékos</span>)
Egyre nyomasztóbb, egyre nehezebben elviselhető, súlyosabb (35) lesz. <span style="color:blue">Súlyosbodik a helyzet. Egyre súlyosbodnak a terhek.</span> □ Betegsége napról napra súlyosbodik. (Eötvös József)
súlyosbodás; súlyosbodó; súlyosbodott.
