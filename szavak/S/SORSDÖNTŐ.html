SORSDÖNTŐ  melléknév -en [e], -bb (kissé <span style="color:green;font-weight:bold">választékos</span>) Olyan, ami egy embernek v. emberek csoportjának életére, sorsára, annak további alakulására döntő hatással van; döntő hatású. <span style="color:blue">Sorsdöntő jelentőségű; sorsdöntő kérdés, küzdelem, napok, óra, percek, választás; sorsdöntően fontos.</span>
