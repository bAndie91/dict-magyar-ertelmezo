SEBESVONAT  főnév
A személyvonatnál rendsz. gyorsabb, a gyorsvonatnál vmivel lassúbb járatú, rendsz. nagyobb távolságon közlekedő vonat. <span style="color:blue">A sebesvonat nem áll meg minden állomáson, de több helyen áll meg, mint a gyorsvonat.</span>
<ul><li>Szóösszetétel(ek): sebesvonatpár.
