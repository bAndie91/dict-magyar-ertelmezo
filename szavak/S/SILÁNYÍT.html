SILÁNYÍT  tárgyas ige -ott, -son; -ani (-ni)
Silánnyá, hitvánnyá tesz, elront vmit, értékét rontja, kevesbíti. <span style="color:blue">A szárazság silányítja a vetést.</span>
Igekötős igék: elsilányít; lesilányít; tönkresilányít.
silányítás; silányító; silányított.
