SEGÉDESZKÖZ  [d-e] főnév
Vmely munka végzésében v. vmely cél elérésére segítségül haszn. eszköz. <span style="color:blue">Az iskolai tanításban a legtöbbet használt segédeszköz a falitábla.</span> □ [A hősnő feláldozása] csak segédeszköz a boszú céljának sikeres elérésére. (Vörösmarty Mihály)
segédeszközi.
