SERLEGMÉRKŐZÉS  főnév (<span style="color:green;font-weight:bold">sport</span>)
Alkalomszerűen v. meghatározott időközökben rendezett olyan mérkőzés v. mérkőzésekből álló sorozat, amelynek győztesét egy serlegnek, kül. erre a célra alapított vándorserlegnek (végleges v. ideiglenes) odaítélésével jutalmazzák. <span style="color:blue">Csapatunk megnyerte a serlegmérkőzést.</span>
