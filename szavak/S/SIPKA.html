SIPKA  főnév sipkát, sipkája (<span style="color:green;font-weight:bold">népies</span>)
Sapka (1). □ Zsebéből sipkát vesz ki, s fejére teszi. (Csiky Gergely) A fején egy fekete birka hullájának bőrdarabja volt, amit sipkának hívtak, s azt begyűrve viselte. (Móricz Zsigmond)
Szóösszetétel(ek): 1. sipkaellenző; sipkaernyő; 2. bohócsipka.
