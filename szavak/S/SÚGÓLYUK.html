SÚGÓLYUK  főnév (<span style="color:green;font-weight:bold">film, színház</span>)
Mélyedés a rivalda közepén, amelynek a közönség felé rendsz. kagyló alakú fedele van, s amelyben előadás alatt a súgó ül. <span style="color:blue">A súgó már elfoglalta helyét a súgólyukban.</span> □ A súgólyukból erősen hangzott a súgó hangja. (Krúdy Gyula)
