SUGÁRÚT  [r-ú] főnév (<span style="color:green;font-weight:bold">választékos</span>)
Központi térségből induló, ill. azt metsző, egyenes, hosszú széles(ebb), gyak. fákkal szegélyezett városi (fő)útvonal. □ E várerősségű épület két szegletének két hosszú egyenes sugárút irányul. (Jókai Mór)
sugárúti.
