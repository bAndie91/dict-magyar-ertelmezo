SILÁNYUL  tárgyatlan ige -t, -jon (<span style="color:green;font-weight:bold">ritka</span>)
Silányodik. □ Lám lám, mivé silányúlt a nagy eszme, Melyért a circus vértanúi haltak. (Madách Imre) Ha puszta utánzás lett volna a dolog, úgy az hamar paródiává silányult volna. (Jókai Mór)
<ul><li>Igekötős igék: lesilányul.
</li><li>silányulás; silányuló; silányult.
