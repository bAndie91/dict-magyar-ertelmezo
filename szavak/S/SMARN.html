SMARN * főnév (rendsz. csak alanyesetben) (<span style="color:green;font-weight:bold">bizalmas</span>)
Jelentéktelen dolog; semmiség, potomság, vacakság. <span style="color:blue">Smarn az egész! Ez (nekem) smarn:</span> nem számít az egész, nem is érdemes törődni vele. □ Nekem smarn, amit a népek beszélnek. Egy jó rostélyos  az igen. A többi maszlag. (Karinthy Frigyes)
