CSÚCSSZÖG  [cs-sz] főnév (<span style="color:green;font-weight:bold">mértan</span>)
A szög szárainak a csúcson túl való meghosszabbításával keletkező, a szöggel szemben fekvő, vele azonos nagyságú szög. <span style="color:blue">Hegyes, tompa, derékszögű csúcsszögek. Ez a két szög egymásnak csúcsszöge.</span>
