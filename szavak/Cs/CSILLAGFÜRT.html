CSILLAGFÜRT  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
Pillangós virágú, zöldtrágyaként is használt takarmánynövény, némileg csillag alakú levelekkel (Lupinus).
<ul><li>Szóösszetétel(ek): csillagfürtmag; csillagfürt-termesztés; csillagfürt-vetőmag.
</li></ul></div>
