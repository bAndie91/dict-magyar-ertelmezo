CSUROMVIZES  [e] melléknév -en [e] (főleg határozói használatban)
Olyan, aki v. ami csuromvíz. <span style="color:blue">Csuromvizes a kabátja. Csuromvizesen érkezett haza.</span> □ Pogrányit egyszer csuromvizesen hozták haza. (Krúdy Gyula) Otthon összetörve, csuromvizesen roskadtam ágyba. (Kosztolányi Dezső)
