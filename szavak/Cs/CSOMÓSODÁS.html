CSOMÓSODÁS  főnév -t, (-ok), -a
A csomósodik (12) igével kifejezett folyamat, jelenség; az a tény, hogy vmi csomósodik; csomóssá (2) válás, csomó(k)ba összeállás. <span style="color:blue">A nedves liszt csomósodása; a hajnak, a kutya szőrének csomósodása. Kavarással elkerülhetjük a rántás csomósodását.</span>
<ul><li>csomósodási.
</li></ul></div>
