CSUPASZODIK  tárgyatlan ige -tam, -ott, -jék (-jon)
Egyre csupaszabbá (25) válik. <span style="color:blue">Csupaszodik a madár, ha vedlik. Ősszel csupaszodnak a fák.</span>
<ul><li>Igekötős igék: lecsupaszodik; megcsupaszodik.
</li><li>csupaszodás; csupaszodó.
</li></ul></div>
