CSÖRREN  [e] tárgyatlan ige -t, -jen [ë] (<span style="color:green;font-weight:bold">hangutánzó</span>, <span style="color:green;font-weight:bold">ritka</span>)
Egyszeri rövid, csörgő hangot ad. <span style="color:blue">Kezében kulcs csörren.</span> □ [A huszár] illemtudóan összecsapja bokáit, megint peng a sarkantyúja, csörren a kardja. (Kosztolányi Dezső)
<ul><li>Igekötős igék: megcsörren; összecsörren.
</li><li>csörrenés; csörrenő.
