CSENEVÉSZEDIK  [e-e-ë] tárgyatlan ige -tem, -ett, -jék (-jen) [e, ë, ë]
Fejlődésében fokozatosan visszamarad; satnyul. <span style="color:blue">A gyerek egyre jobban csenevészedik. A rózsatövek nem fejlődnek, inkább csenevészednek.</span>
<ul><li>Igekötős igék: elcsenevészedik.
</li><li>csenevészedés; csenevészedő.
