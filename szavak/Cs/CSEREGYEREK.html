CSEREGYEREK  főnév gyeregyermek (<span style="color:green;font-weight:bold">régies</span>)
Nyelvtanulás végett, kölcsönösségi alapon, idegen ajkú családhoz más vidékre küldött gyermek. □ Németül már akkor tudtam jól: Pozsonyban tanultam meg, mint cseregyerek. (Jókai Mór)
