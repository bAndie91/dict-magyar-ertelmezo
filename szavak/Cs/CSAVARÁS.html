CSAVARÁS  főnév -t, -ok, -a
A csavar igével kifejezett cselekvés; az a cselekvés, hogy vmit (vhová, vmi köré) csavarnak. <span style="color:blue">A nedves ruha csavarása; a kendőnek a nyak köré csavarása. Egy csavarással kitekerte az állat nyakát.</span>
<ul><li>Szóösszetétel(ek): szócsavarás.
</li><li>csavarási.
