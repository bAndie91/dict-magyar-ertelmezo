CSALÁDOS  melléknév -an és főnév -t, -ok
Olyan (személy, főleg férfi), akinek házastársa és gyermekei vannak; akihez család (2) tartozik. <span style="color:blue">Családos ember; családosan él. A családosok segélyben részesülnek.</span> □ 830-ban hagytam el a szülői hajlékot, 840-ben családossá lettem. (Arany János)
