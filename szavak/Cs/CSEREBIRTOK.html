CSEREBIRTOK  főnév
Az a földbirtok, amelyet vki rendsz. földjéért v. más ingatlan tulajdonáért cserébe kap(ott). || a. (<span style="color:green;font-weight:bold">1945 után</span>) Felosztott, kisajátított, köztulajdonba vett, tagosításba vont földbirtokért kárpótlásul hivatalosan cserébe adott földbirtok. <span style="color:blue">Jól járt a kapott cserebirtokkal.</span>
