CSEPERGÉS  [ë-ë] főnév -t, -e [e] csöpörgés (csak egyes számban)
A csepereg igével kifejezett folyamat, időjárási jelenség; lassú, ritka, csepergő, szemergő eső. <span style="color:blue">Meddig tart még ez a csepergés? Elállt a csepergés. [Volt-e nagy eső nálatok is?]  Nem volt bizony, csak egy kis csepergés.</span>
