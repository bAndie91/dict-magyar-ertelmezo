CSERIBARÁT  [e] főnév (<span style="color:green;font-weight:bold">népies</span>, <span style="color:green;font-weight:bold">régies</span>)
A ferencesek szigorúbb ágának, az önsanyargató mezítlábasoknak tagja. □ Uram, embereink egy kis cseribarátot fogtak; azt akarják, hogy prédikáljon nekik. (Vörösmarty Mihály) Elővett egy szennyes és gyűrött levelet. Egy cseribarát hozta. (Gárdonyi Géza)
