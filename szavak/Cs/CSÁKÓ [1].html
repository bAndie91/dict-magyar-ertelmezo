CSÁKÓ [1]  melléknév (<span style="color:green;font-weight:bold">népies</span>)
Szabályosan kifelé, ill. fölfelé görbülő &lt;szarv, bajusz&gt;. <span style="color:blue">Csákó szarvú ökör.</span> □ Szegény párának [= a tehénnek] csak csákó szarva maradt meg régi szépségéből. (Eötvös József) Megsodorta bajszát, de az visszahajla, S mely elébb volt csákó, lett belőle kajla. (Arany János)
