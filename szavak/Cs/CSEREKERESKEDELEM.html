CSEREKERESKEDELEM  főnév (<span style="color:green;font-weight:bold">közgazdaságtan</span>)
A kereskedelemnek az a kezdetleges formája, amelyben az egyes tárgyakat, termékeket pénz közbeiktatása nélkül, közvetlenül más tárgyakért, termékekért adják oda. <span style="color:blue">A cserekereskedelem a primitív népek között még ma is gyakori.</span>
