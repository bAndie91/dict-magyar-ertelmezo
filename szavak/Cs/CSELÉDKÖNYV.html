CSELÉDKÖNYV  főnév (<span style="color:green;font-weight:bold">1945 előtt</span>)
A cseléd személyére és szolgálatára vonatkozó adatokat feltüntető munkakönyv. <span style="color:blue">Mielőtt szolgálatba állt, kiváltotta cselédkönyvét.</span> □ Ha nincs kedve, fiam, a helyhez, akkor itt a könyve  és a cselédkönyvet az asztalra ejtette, úgyhogy az csappant. (Kosztolányi Dezső)
