CSENGŐS  [ë] melléknév -en [e], (<span style="color:green;font-weight:bold">népies</span>) csöngős
Csengővel (12) ellátott, felszerelt &lt;tárgy&gt;. <span style="color:blue">Csengős jelzőkészülék, szán, szekér.</span> || a. Olyan &lt;állat&gt;, amelynek csengőt (1a) akasztottak a nyakába. <span style="color:blue">Csengős bárány, csikó.</span> □ Vágyaim csengős nyáját vigyázva terelem. (Tóth Árpád)
