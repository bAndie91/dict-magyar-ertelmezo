CSEREBOMLÁS  főnév (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Az a vegyi átalakulás, amelynek során az egymásra ható vegyületek bizonyos alkotórészei kölcsönösen helyet cserélnek egymással, és ezáltal új vegyületek keletkeznek. <span style="color:blue">Részleges, teljes cserebomlás; cserebomlás ezüstnitrát és konyhasó között.</span>
