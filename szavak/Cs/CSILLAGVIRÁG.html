CSILLAGVIRÁG  főnév
<ul><li>1. (<span style="color:green;font-weight:bold">növénytan</span>) A liliommal közös családba tartozó, alacsony, égszínkék virágú, kora tavaszi erdei növény (Scilla bifolia). <span style="color:blue">Tavaszi csillagvirág.</span>
</li><li>2. (<span style="color:green;font-weight:bold">népies</span>) Ehhez hasonló, de különféle fajokhoz tartozó, csillag alakú kerti v. vadon növő virág.
</li><li>csillagvirágos.
