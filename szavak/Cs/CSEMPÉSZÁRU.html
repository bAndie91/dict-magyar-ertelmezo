<ul><li>1. Csempészés útján, a törvényes tilalmak kijátszásával szállított áru; dugáru. <span style="color:blue">Tömérdek csempészárut foglaltak le.</span>
</li><li>2. (<span style="color:green;font-weight:bold">átvitt értelemben</span>, <span style="color:green;font-weight:bold">sajtónyelvi</span>) Olyan szellemi termék, eszme, melyet titkon belopnak vhová. <span style="color:blue">A kozmopolitizmus csempészáruja.</span>
