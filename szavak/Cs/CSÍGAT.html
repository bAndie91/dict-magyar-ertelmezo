CSÍGAT  tárgyas ige -tam, -ott, ..asson (<span style="color:green;font-weight:bold">tájszó</span>)
Csitít, csitítgat. □ Ha ilyen tisztes öreg urak beköszöntenek néha értelmesebb hazánkfiaihoz, inkább csígatni kell őket, mint felbátorítani. (Vörösmarty Mihály)
<ul><li>Igekötős igék: elcsígat; lecsígat.
</li><li>csígatás; csígató.
