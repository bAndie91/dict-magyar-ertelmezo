CSAPÓHOROG  főnév (<span style="color:green;font-weight:bold">halászat</span>)
Főleg nagy, erős halak fogására alkalmazott halászó horog, melyet a part meredek részébe bevert dorongról erős, hosszú zsineggel lógatnak le a vízbe; a halász otthagyja, és csak időnként figyeli meg, hogy van-e már rajta hal.
