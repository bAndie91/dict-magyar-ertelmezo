CSÚCSHATÁS  főnév (<span style="color:green;font-weight:bold">villamosság</span>)
Az a törvényszerű fizikai jelenség, hogy az elektromos töltésű csúcsos testen az elektromos hatás a csúcsnál a legnagyobb, s az elektromosság a csúcson át gyakran kisül. <span style="color:blue">A csúcshatáson alapszik a villámhárító.</span>
