CSILLAGFÉNY  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Az a fény, amelyet a csillagok sugároznak. □ Száll reám aranyos, ezüstös csillagfény És koszorú gyanánt övezi fejemet. (Petőfi Sándor) A korai csillagfénynél folyt az utazás. (Jókai Mór)
