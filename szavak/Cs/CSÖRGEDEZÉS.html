CSÖRGEDEZÉS  [e-ë] főnév -t, -ek, -e [ë, e] csergedezés [ë-e-ë] (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>, <span style="color:green;font-weight:bold">hangutánzó</span>)
A csörgedez(ik) (12) igével kifejezett folyamat, ill. hangjelenség; az a tény, hogy vmi csörgedezik. <span style="color:blue">A csermely, a hólé, a patak csörgedezése; vérének csörgedezése.</span>
