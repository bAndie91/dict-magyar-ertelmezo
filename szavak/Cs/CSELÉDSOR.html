CSELÉDSOR  főnév (<span style="color:green;font-weight:bold">1945 előtt</span>)
A cseléd (12) munkaviszonya, életmódja, társadalmi állapota, gazdasági helyzete. <span style="color:blue">Szomorú állapot a cselédsor; cselédsorban élt; cselédsorból küzdötte fel magát; megunta a cselédsort.</span>
