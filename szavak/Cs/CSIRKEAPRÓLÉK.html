CSIRKEAPRÓLÉK  főnév (<span style="color:green;font-weight:bold">konyhaművészet</span>)
A levágott csirke kevésbé húsos végtagjai s ehető belső részei együtt, nyersen, ill. ételnek elkészítve. <span style="color:blue">Csirkeaprólék rizzsel. Csirkeaprólékból ragulevest főz.</span> □ Pompás leves volt, tejfeles, tojásos rizsleves, csirkeaprólékkal. (Jókai Mór)
