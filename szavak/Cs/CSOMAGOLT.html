CSOMAGOLT  melléknév -an
Olyan, ami be van csomagolva, csomaggá van alakítva. <span style="color:blue">Ládába csomagolt könyvek; papírba csomagolt holmi; csomagolt áru:</span> olyan á., amelyet előre kimérve és becsomagolva hoznak forgalomba; <span style="color:blue">tíz deka csomagolt teavaj; csomagolt árut szolgál ki.</span>
