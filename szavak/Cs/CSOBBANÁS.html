CSOBBANÁS  főnév -t, -ok, -a (<span style="color:green;font-weight:bold">hangutánzó</span>)
A csobban (1, 2) igével kifejezett hangjelenség, ill. az a tény, hogy vmi csobban. <span style="color:blue">A víz csobbanása; a folyóba eső kő csobbanása. Vmi csobbanást hallott. Nagy csobbanással elmerült a vízben.</span> □ Nagy  csobbanással a vízbe hanyatt dőlt. (Vörösmarty Mihály)
