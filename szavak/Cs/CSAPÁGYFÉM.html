CSAPÁGYFÉM  [p-á] főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
Csapágyak kitöltésére való, forgó géprészeket megtámasztó réz, ill. ón v. ólom tartalmú fém, mely elég szilárd ahhoz, hogy kis súrlódást kibírjon. <span style="color:blue">Fehér, vörös csapágyfém.</span>
