CSABAÍRE  [e] főnév ..rét (csak egyes számban) (<span style="color:green;font-weight:bold">növénytan</span>)
A rózsafélék családjába tartozó, zöldes v. pirosló gombvirágzatú, száraz helyeken élő gyomnövény (Sanguisorba minor). <span style="color:blue">A csabaíréből hajdan orvosságot készítettek.</span>
