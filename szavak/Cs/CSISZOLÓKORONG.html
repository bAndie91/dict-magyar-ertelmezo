CSISZOLÓKORONG  főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
A csiszolandó anyagnál keményebb, természetes v. mesterséges anyagból készült korong, amely gépben v. géppel forgatva fa, fém, vas, acél stb. csiszolására haszn. <span style="color:blue">A fúrót csiszolókoronggal élesítette meg.</span>
