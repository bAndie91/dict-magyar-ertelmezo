CSEREESZKÖZ  főnév (<span style="color:green;font-weight:bold">közgazdaságtan</span>)
Az a tárgy, áru v. más érték, amelyet más tárgy, áru v. cikk ellenértékeként cserébe odaadnak. <span style="color:blue">A leggyakoribb csereeszköz hajdan a szarvasmarha, a gabona vagy bizonyos fajta fémrúd volt. Manapság a pénz az általánosan elfogadott csereeszköz.</span>
