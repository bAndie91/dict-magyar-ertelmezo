CSALÁNSZÖVET  főnév
A csalán rostjaiból készült durva szövet. <span style="color:blue">A háború alatt csalánszövetből is készítettek ruhát.</span> || a. (<span style="color:green;font-weight:bold">régies</span>) Finom vászon, gyolcs. □ Sasza asszony, mint úrhölgyhöz illő, az athéni chitont [= hosszú, ingforma köpenyt] viselte; de az  finom csalánszövetből volt. (Jókai Mór)
