KÚSZÓNÖVÉNY  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
Az a növény, amelynek szára nem tud támaszték nélkül felfelé nőni, hanem hosszú indákat s azon kacsokat eresztve falra, fára, karóra kapaszkodik, v. a földön fut, s ott elágazik, szétterjed; futónövény. <span style="color:blue">Az iszalag, a borsó, a komló kúszónövények.</span>
<ul><li>kúszónövényes.
</li></ul></div>
