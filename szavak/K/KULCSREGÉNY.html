KULCSREGÉNY  főnév (<span style="color:green;font-weight:bold">irodalomtudomány</span>)
Olyan, rendsz. támadó élű, szatirikus regény, amelyben az író, kitalált nevekkel leplezve, élő és ismert alakokat szerepeltet, s amelyben az olvasók számára lehetséges a személyek azonosítása. <span style="color:blue">Szabó Dezső, Tolnai Lajos kulcsregényei.</span>
