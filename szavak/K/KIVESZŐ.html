<div class="szocikk">
KIVESZŐ  [e] melléknév és főnév
<ul><li>I. melléknév Olyan &lt;élő közösség, faj&gt;, amely már csak aránylag kevés egyedében él, nemsokára kivesz, kipusztul. <span style="color:blue">Kivesző állatfaj; kivesző nép, törzs.</span>
</li><li>II. főnév <span style="color:blue">Kiveszőben van:</span> kezd kiveszni, a kihalás, pusztulás állapotában van. <span style="color:blue">Ez a növényfaj kiveszőben van.</span>
</li></ul></div>
