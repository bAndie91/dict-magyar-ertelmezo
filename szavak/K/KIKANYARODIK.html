KIKANYARODIK  tárgyatlan ige
Kifelé vezető irányba kanyarodik; kanyarodva kimegy, kijut, kiér. <span style="color:blue">Az ösvény kikanyarodik az erdőből. Egy mellékutcából kikanyarodik az autó a főútra.</span> □ Sebes hajtással kanyarodott ki a pálházi puszta felé. (Tolnai Lajos)
<ul><li>kikanyarodás; kikanyarodó; kikanyarodott.
