KIRÁLYSAS  főnév (<span style="color:green;font-weight:bold">állattan</span>)
A sasok családjába tartozó, zömök testű, rövid farkú, fiatalon fakó barnássárga alapszínű, öreg korában sötétbarna tollazatú, kisebb-nagyobb emlősökkel és madarakkal táplálkozó ragadozó madár; parlagi sas (Aquila heliaca).
