KÖVÜLET  [e] főnév -et, -e [ë, e] (<span style="color:green;font-weight:bold">földtan</span>)
Olyan növényi v. állati maradvány, ill. nyom, amely vmely régebbi geológiai korszakban üledékes kőzetbe jutva megkövesedett.
