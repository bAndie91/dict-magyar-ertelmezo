KETTŐSHANGZÓ  főnév (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
Közvetlenül egymást követő két magánhangzónak egy szótagba olvadt kapcsolata; diftongus (pl. ao, üö). → <span style="color:blue">Emelkedő kettőshangzó; → eső kettőshangzó. Egyik-másik nyelvjárásunk kettőshangzókban igen gazdag.</span>
