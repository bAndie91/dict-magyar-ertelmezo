KECSKEBAK  főnév
<ul><li>1. A kecske hímje.
</li><li>2. (<span style="color:green;font-weight:bold">építészet</span>) Padhoz hasonló alkotmány, két A alakú lábbal; erre fektetik az ácsok a faragni való fát v. a kőmívesek az állványok deszkáit; kecskeláb (2).
</li><li>3. (<span style="color:green;font-weight:bold">népies</span>) Fűrészbak, kecskeláb (1).
</li><li>Szóösszetétel(ek): kecskebakláb.
</li></ul></div>
