KIUTÁL  tárgyas ige (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">bizalmas</span>)
<span style="color:blue">Vkit kiutál vhonnan:</span> viselkedésével annyira kellemetlenné, tűrhetetlenné teszi vki számára az ott-tartózkodást, hogy az jobbnak látja onnan el- v. kimaradni. <span style="color:blue">A társaság nem szívelte, s lassan kiutálták maguk közül.</span>
