KÖZTUDOMÁS  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Vmely dolognak, ténynek, eseménynek általános, a legtöbb ember által való ismerete, tudása; az a tény, hogy az emberek nagy többségének tudomása van róla. <span style="color:blue">Köztudomás szerint; köztudomásra jut vmi.</span>
</div>
