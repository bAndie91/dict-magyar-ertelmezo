KÜLFÖLDIESKEDÉS  [e-ë] főnév -t, -e [e] (csak egyes számban) (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>, <span style="color:green;font-weight:bold">rosszalló</span>)
Külföldi szokás(ok)nak, életformának, divatnak, szellemi jelenségeknek a hazai viszonyok lenézéséből eredő utánzása, majmolása, átvétele. <span style="color:blue">Nevetséges külföldieskedés; a külföldieskedés hóbortja.</span>
