KENÉZ  [e] főnév -t, -ek, -e [ë, e] (<span style="color:green;font-weight:bold">történettudomány</span>)
Azoknak a román v. szláv népcsoportokból alakult községeknek az elöljárója, amelyek a XIIIXIV. században főleg erdős vidékeken keletkeztek az elnéptelenedett magyar egyházi és világi birtokokon.
