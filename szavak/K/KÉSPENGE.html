KÉSPENGE  főnév
A késnek (13) fémből, leggyakrabban acélból készült, rendsz. egyik szélén kiélesített vágó része. □ A félben tört késpenge nem volt többé elég, hogy az utolsó ajtót keresztülvágja vele. (Jókai Mór) A késpenge fekete foltokat hagyott a fehér nyakkendőn. (Krúdy Gyula)
