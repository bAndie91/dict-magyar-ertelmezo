KICSILLAN  tárgyatlan ige
Rövid időre v. kis helyen hirtelen előtűnik, csillanva megjelenik vmi; kivillan. <span style="color:blue">A nap kicsillan a felhők közül</span> □ [A leány] felemelte a szoknyáit, ki is csillant formás bokája egy percre. (Mikszáth Kálmán)
<ul><li>kicsillanás; kicsillanó; kicsillant.
