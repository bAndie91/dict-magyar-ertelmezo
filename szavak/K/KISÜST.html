<div class="szocikk">
KISÜST  [s-ü] főnév
Kisüzemi v. házi pálinkafőző berendezés. <span style="color:blue">Kisüstön főtt pálinka.</span> □ A pestkörnyéki falusi jegyzők  kisüstön főtt szilvóriummal és más hazai csemegékkel kedveskedtek a szigorú nagybácsinak. (Krúdy Gyula) Drágább a pálinka, a kisüstök nem működnek a nagy adó miatt. (Nagy Lajos)
