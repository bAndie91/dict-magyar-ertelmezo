KITELEPÍTÉS  főnév -t, -ek, -e [ë, e]
A kitelepít igével kifejezett cselekvés, eljárás; az a cselekvés, hogy vkit, vmit kitelepítenek. <span style="color:blue">A nem kívánatos elemeknek a városból való kitelepítése; az üzemnek a külvárosba való kitelepítése.</span>
