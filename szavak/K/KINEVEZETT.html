KINEVEZETT  melléknév és főnév -et, -je [ë, e]
Az, akit kineveztek vminek, vmivé; kül. az ideiglenesen alkalmazottal szemben az állásában kinevezéssel megerősített (személy). <span style="color:blue">Kinevezett tanár, tisztviselő; az ideiglenesen alkalmazottak és a kinevezettek.</span>
