KÖNYVÍZŰ  [v-í] melléknév -en [e], -bb (<span style="color:green;font-weight:bold">választékos</span>, <span style="color:green;font-weight:bold">rosszalló</span>)
Olyan &lt;nyelvi forma&gt;, melyből a merev, elcsépelt v. szűk körre szorítkozó könyvnyelvi formákra emlékeztető módon hiányzik az élő beszéd frissesége, eleven változatossága, életszerűsége; könyvszagú, papírízű. <span style="color:blue">Könyvízű mondat, stílus.</span>
