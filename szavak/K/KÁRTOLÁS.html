KÁRTOLÁS  főnév -t, (-ok), -a (<span style="color:green;font-weight:bold">szövőipar</span>)
A kártol igével kifejezett művelet, folyamat, az a cselekvés, hogy vmit kártolnak. <span style="color:blue">A gyapjú, a pamut kártolása. A kártolás hegyes fogakkal ellátott fésűs szerkezettel történik. Kártolást végez.</span>
<ul><li>kártolási; kártolású.
</li></ul></div>
