KONYHASÓ  főnév
Rendsz. apróra őrölt közönséges (kő)só, amelyet ételek ízesítésére, ill. konzerválására használnak (NaCl). □ Tátongó seb volt  Kimosta a vízvezetéknél, jól megsózta konyhasóval, egy kis ronggyal körültekerte. (Kosztolányi Dezső)
<ul><li>Szóösszetétel(ek): konyhasóoldat.
