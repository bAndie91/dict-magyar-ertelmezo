KARONFOGVA  határozószó
A szóban forgó személy karjába karolva; karjukat egymásba öltve. <span style="color:blue">Karonfogva vezet vkit. Karonfogva sétálnak.</span> □ Karonfogva tovább ballagnak, el a másik szobába. (Krúdy Gyula) Fölfelé haladtak karonfogva valami drága szálló  márványlépcsőjén. (Babits Mihály)
