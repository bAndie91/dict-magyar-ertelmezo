KEMÉNYKEZŰ  [e-e] melléknév -en [e], keményebb kezű v. (-bb)
Olyan &lt;személy, főként férfi&gt;, aki szükség esetén kemény kézzel, erélyesen, sőt, ha kell, kíméletlenül jár el, intézkedik. <span style="color:blue">Keménykezű főnök, parancsnok.</span>
<ul><li>keménykezűség.
</li></ul></div>
