KARAVÁNÚT  [n-ú] főnév
&lt;Ázsiában és Afrikában, főleg az ókorban és a középkorban&gt; a karavánok állandó útvonala. <span style="color:blue">Ázsia egyik fő karavánútja a selyem útja volt, amely Kínából indult ki. A Szahara karavánútjai az oázisokat kötötték össze.</span>
<ul><li>karavánúti.
