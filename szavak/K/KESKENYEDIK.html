KESKENYEDIK  [e-ë-ë] tárgyatlan ige -ett, -jék (-jen) [ë, ë] (csak 3. személyben)
Vmi egyre keskenyebbé válik. <span style="color:blue">A vége felé keskenyedik az ösvény.</span>
<ul><li>Igekötős igék: elkeskenyedik; megkeskenyedik; lekeskenyedik.
</li><li>keskenyedés; keskenyedő.
</li></ul></div>
