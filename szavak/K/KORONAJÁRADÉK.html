KORONAJÁRADÉK  főnév (<span style="color:green;font-weight:bold">közgazdaságtan</span>, <span style="color:green;font-weight:bold">1945 előtt</span>)
Magyarországon a koronavaluta idején kibocsátott közületi kölcsön, amelynek járadékát is koronában fizették, ellentétben a dollár- és egyéb kölcsönökkel. <span style="color:blue">Vagyonát koronajáradékba fektette. A tőzsdén nagyon keresték a koronajáradékot.</span>
