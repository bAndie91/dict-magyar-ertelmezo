KATALÍZIS  főnév -t, (-ek) [ë], -e v. (-a) (<span style="color:green;font-weight:bold">vegyi ipar</span>)
Olyan vegyi eljárás, ill. jelenség, amelyben bizonyos anyagok, az ún. katalizátorok egyes vegyi folyamatokat elősegítenek, lefolyásukat gyorsítják (v. lassítják) anélkül, hogy maguk megváltoznának, átalakulnának.
<ul><li>katalízises.
</li></ul></div>
