KUCSMAGOMBA  főnév
Jóízű ehető gomba, amelynek kucsma alakú, barnás, szivacsos kalapja van. □ Bizonyosan a kucsmagombától lett rosszul   Az én gyomromat is megfeküdte. (Mikszáth Kálmán) || a. (<span style="color:green;font-weight:bold">növénytan</span>) <span style="color:blue">Kucsmagombák:</span> az ilyen gombákat magában foglaló nemzetség (Helvellaceae).
