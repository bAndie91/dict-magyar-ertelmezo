<div class="szocikk">
KENGURU  [ë v. e] -t, -ja
Főleg Ausztráliában élő erszényes, növényevő emlősállat; feltűnően hosszú és izmos hátsó lába és farka, de rövid és gyönge mellső lába van (Macropus). <span style="color:blue">Fürge, óriás, törpe, vörös kenguru.</span>
<ul><li>Szóösszetétel(ek): kenguruerszény.
</li></ul></div>
