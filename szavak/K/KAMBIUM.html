KAMBIUM  főnév -ot, -a (<span style="color:green;font-weight:bold">növénytan</span>)
A növény szára és gyökere kérgének középső szövetrétegében levő, osztódó sejtek egy sorából álló szövet, amely a növény háncs-, ill. farészét gyarapítja, s ezzel a szárat, ill. gyökeret vastagítja.
<ul><li>Szóösszetétel(ek): kambiumsejt.
</li></ul></div>
