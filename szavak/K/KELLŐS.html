KELLŐS  [e] melléknév
&lt;Fokozó szóként csak ebben az állandó szókapcsolatban:&gt; <span style="color:blue">vminek a kellős közepe:</span> vminek éppen, pontosan a közepe. <span style="color:blue">Az erdő, a tenger kellős közepén; az éjszaka kellős közepén. Itt vagyunk a tél kellős közepén.</span> □ A puszta kellős közepén egy diák állott. (Móricz Zsigmond)
