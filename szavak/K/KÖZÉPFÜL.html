KÖZÉPFÜL  főnév (<span style="color:green;font-weight:bold">bonctan</span>)
A fülnek a dobhártya mögött következő része, amely melléküregeivel együtt a dobüreget, valamint a benne található csontocskákat és izmokat foglalja magában.
<ul><li>Szóösszetétel(ek): középfüllob.
</li></ul></div>
