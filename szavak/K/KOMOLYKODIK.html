KOMOLYKODIK  tárgyatlan ige -tam, -ott, -jék (-jon)
Vki (esetleg természete ellenére) néha túlzottan komolynak (I. 1, 2, 4), szigorúnak, tekintélyesnek, okosnak akar látszani. <span style="color:blue">Ne komolykodj, nem illik hozzád.</span>
<ul><li>komolykodás; komolykodó.
</li></ul></div>
