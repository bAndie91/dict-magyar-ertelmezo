KÖVETKEZMÉNYES  [e-ë-ë] melléknév -en [e] (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
Olyan &lt;mellékmondat&gt;, amely a főmondatban kifejezett mondanivaló következményét tartalmazza (pl. Olyan sötét van már, hogy nem látok). <span style="color:blue">A következményes mellékmondat kötőszavai: hogy, úgyhogy.</span>
