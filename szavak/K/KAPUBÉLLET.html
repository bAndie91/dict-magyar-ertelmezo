KAPUBÉLLET  [e] főnév -et, -je [ë, e] (<span style="color:green;font-weight:bold">építészet</span>)
&lt;Főleg román v. gót stílusú épületekben&gt; a vastag falba nyitott, kifelé rendsz. szélesedő kapubejárat bélelése, falfelülete; leginkább egymáshoz illesztett s a falba mélyített oszlopok és ívek díszítik.
<ul><li>kapubélletes.
