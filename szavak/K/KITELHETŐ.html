KITELHETŐ  [e-e] melléknév -leg [e], (-képpen) [e] (<span style="color:green;font-weight:bold">régies</span>)
Olyan &lt;dolog&gt;, amely kitelhet (4a) vkitől; lehetséges. <span style="color:blue">Minden kitelhető módon.</span> □ Majd török, majd tatár üt be határinkon,  minden kitelhető módon reánk tolni barátságát. (Jókai Mór) Öreg szíve tőle kitelhető erővel dobogott. (Tolnai Lajos)
