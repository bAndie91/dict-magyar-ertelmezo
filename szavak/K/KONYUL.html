KONYUL  tárgyatlan ige -t, -jon (rendsz. helyhatározóval)
Tartását, feszességét elveszítve lazán lefelé görbül, hajlik. <span style="color:blue">Az ágak a föld felé konyulnak.</span> □ Ajkára dohánysárga bajusz konyul. (Kosztolányi Dezső)
<ul><li>Igekötős igék: lekonyul; visszakonyul.
</li><li>konyulás; konyuló; konyult.
</li></ul></div>
