KITEREBÉLYESEDIK  tárgyatlan ige
Bizonyos mértéket elérve terebélyesedik (12), igen terebélyessé, ill. nagyon széles körűvé válik. <span style="color:blue">A diófánk néhány évtized alatt kiterebélyesedett. Kiterebélyesedik a mozgalom.</span>
<ul><li>kiterebélyesedés; kiterebélyesedett; kiterebélyesedő.
</li></ul></div>
