KÉZIRATOS  [z-i] melléknév (-an) (<span style="color:green;font-weight:bold">irodalomtudomány</span>)
Kézzel írt, sokszorosított; kézírásos. <span style="color:blue">Kéziratos szöveg, énekeskönyv; kéziratos irodalom:</span> másolt, nagyobb részében még ki nem nyomtatott,kézzel írt szövegekből álló i. <span style="color:blue">Kossuth országgyűlési tudósításai kéziratos újság formájában jelentek meg.</span>
