KALAPKÚRA  főnév (<span style="color:green;font-weight:bold">tréfás</span>)
Meghűlésnek, náthának szeszes ital bőséges fogyasztásával való gyógyítása; a tréfa szerint addig kell inni, míg a beteg a maga elé tett egy kalap helyett kettőt nem lát. <span style="color:blue">Kalapkúrát tart.</span>
