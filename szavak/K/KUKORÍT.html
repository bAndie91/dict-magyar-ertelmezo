KUKORÍT  tárgyatlan ige -ott, -son; -ani (gyak. -t ragos mértékhatározóval) (<span style="color:green;font-weight:bold">népies</span>, <span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">hangutánzó</span>)
&lt;Kakas&gt; egyet v. egyszer kukorékol. □ A kakas kukorít; valahára megvirrad már! (Jókai Mór) Egy tépett farkú kiskakas  hangosat kukorított, aztán ijedten ugrott el. (Móricz Zsigmond)
