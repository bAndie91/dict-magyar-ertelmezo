KROKETT [1]  [ë v. e] főnév -et, -je [ë, e] (<span style="color:green;font-weight:bold">konyhaművészet</span>)
Apróra vagdalt v. sűrű mártással kötött anyagból (hús, főzelékféle, hal, tojás stb.) készült étel, amelyet henger v. gombóc formára sodorva zsírban v. olajban kisütnek, ill. kirántanak.
<ul><li>krokettes.
