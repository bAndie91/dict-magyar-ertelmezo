KIRENDELTSÉG  [kirëndëlcség v. kirëndëltség v. kirendëltség] főnév -et, -e [ë, e]
Vmely intézménynek, hivatalnak, vállalatnak székhelyén kívül működő, rendsz. önálló tevékenységet kifejtő része, helyi képviselete. <span style="color:blue">Hazatelepítési, kereskedelmi, vámhatósági kirendeltség.</span>
<ul><li>kirendeltségi.
