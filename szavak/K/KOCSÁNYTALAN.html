KOCSÁNYTALAN  melléknév -ul, (<span style="color:green;font-weight:bold">tájszó</span>) kocsántalan (<span style="color:green;font-weight:bold">növénytan</span>)
&lt;A kocsányossal ellentétben&gt; olyan &lt;növény v. része&gt;, amelynek nincs kocsánya. <span style="color:blue">Kocsánytalan tölgy:</span> hegyi talajon élő t., amelynek virága, ill. makkja közvetlenül az ágon ül (Quercus petraea).
