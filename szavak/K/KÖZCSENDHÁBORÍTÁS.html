KÖZCSENDHÁBORÍTÁS  főnév (<span style="color:green;font-weight:bold">jogtudomány</span>)
Embertől v. géptől eredő, fölöslegesen nagy zaj v. durva, zajos botrány, amely a közösség nyugalmát, főleg az éjjeli csendet zavarja, háborítja. <span style="color:blue">Közcsendháborítást követ el.</span> □ Nem sajtóvétségért lettünk ám elítélve , hanem "közcsendháborításért". (Jókai Mór)
