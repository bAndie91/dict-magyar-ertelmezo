KAPUŐR  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Vmely intézmény, épület kapujában őrködő, a be- és kimenőket ellenőrző, esetleg igazoltató személy; kapus, portás. □ Meg is hagyta a kapuőröknek, hogy  be ne eresszék, akármint dörömböznék is a kapun. (Mikszáth Kálmán)
<ul><li>kapuőri; kapuőrség.
