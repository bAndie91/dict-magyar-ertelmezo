KAPA-KASZA KERÜLŐ  (<span style="color:green;font-weight:bold">népies</span>, <span style="color:green;font-weight:bold">tréfás</span>)
Lusta, henyélő, minden munkát kerülő, nem dolgozó (ember). □ Szerény állat itt a lélek,  Aminek következtében Nem nagy számmal lelhetők A költők, müvészek és más Kapa-kaszakerülők. (Petőfi Sándor)
