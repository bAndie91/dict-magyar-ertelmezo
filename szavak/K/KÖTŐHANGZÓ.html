KÖTŐHANGZÓ  főnév (<span style="color:green;font-weight:bold">nyelvtudomány</span>)
Az a rövid magánhangzó, amely a csonka szótő és a toldalék között jelentkezik; többnyire azonos a tővégi rövid magánhangzóval (pl. a "mondani" és a "sokaság" szóban levő <span style="color:blue">a</span>).
<ul><li>kötőhangzójú; kötőhangzós.
</li></ul></div>
