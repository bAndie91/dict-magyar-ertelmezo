KEGYHELY  főnév (<span style="color:green;font-weight:bold">vallásügy</span>)
&lt;Katolikusoknál&gt; olyan hely, ahol a hivők hite szerint csodás jelenségek történtek, esetleg történnek, és ahová kegyelem (2a) nyerése végett zarándokolni szoktak; búcsújáró hely.
<ul><li>Szóösszetétel(ek): kegyhelykápolna.
</li><li>kegyhelyi.
</li></ul></div>
