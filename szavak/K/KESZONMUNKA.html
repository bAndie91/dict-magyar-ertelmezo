KESZONMUNKA  [mm v. nm] főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
A víz, ill. föld alatt, kül. föld alatti vasút, híd építésekor keszonban, rendsz. sűrített levegőjű térben végzett munka. <span style="color:blue">A keszonmunka jó szervezetet, szigorú biztonsági és egészségügyi intézkedéseket kíván.</span>
</div>
