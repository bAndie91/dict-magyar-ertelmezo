KAPOTNYAK  főnév -ot, -ja (<span style="color:green;font-weight:bold">növénytan</span>)
A farkasalmával rokon, árnyas, nyirkos erdőben tenyésző, mérges gyomnövény; kétlevelű ágán a levele vese alakú, virága sötétpiros, föld alatti szára borsszagú (Asarum europaeum). <span style="color:blue">Kerek levelű kapotnyak.</span>
