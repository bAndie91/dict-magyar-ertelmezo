KRÁKOGÁS  főnév -t, -ok, -a
A krákog igével kifejezett cselekvés, művelet; az a tény, hogy vki krákog. <span style="color:blue">A náthás beteg, az öreg krákogása.</span> || a. Az így keletkező rekedtes hang. <span style="color:blue">Egész nap hallatszott az öregember krákogása.</span> □ Rosszalló krákogást hallatott. (Mikszáth Kálmán)
