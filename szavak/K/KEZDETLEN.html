KEZDETLEN  [e-e-e] melléknév -ül (<span style="color:green;font-weight:bold">ritka</span>)
Olyan &lt;halom, csomag&gt;, amelyiket még nem bontottak fel, amelyikből még nem vettek ki; bontatlan, ép, megkezdetlen. <span style="color:blue">Egy kezdetlen csomag cigaretta; kezdetlen szénaboglya.</span>
