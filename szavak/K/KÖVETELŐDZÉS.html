KÖVETELŐDZÉS  [e-e] főnév -t, (-ek), -e [ë, e] követelőzés
A követelődzik igével kifejezett cselekvés; az a tény, hogy vki követelődzik; ismételt v. folytonos követelés. <span style="color:blue">Szemtelen, telhetetlen követelődzés. Bosszantotta a gyerekek követelődzése.</span>
