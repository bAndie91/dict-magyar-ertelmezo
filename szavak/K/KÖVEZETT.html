KÖVEZETT  [e-ë] melléknév
(Burkoló)kővel, téglával, betontömbökkel v. keramitkövekkel kirakott, ilyennel borított &lt;térség, esetleg helyiség&gt;. <span style="color:blue">Kövezett udvar, utca. A kövezett piacon nincs por.</span> □ Egy kövezett konyha nem szőnyeges szalon  (Tolnai Lajos)
