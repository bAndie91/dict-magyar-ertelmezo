KUKKRA  határozószó (<span style="color:green;font-weight:bold">tájszó</span>)
Egyenesen, magasan fölfelé. <span style="color:blue">Kukkra dobja a labdát. Kukkra áll egy tincs a fején. Kukkra pisil a kisfiú.</span> □ Az új pár elé helyezett tál leginkább fel van ékítve, ott van a kukkra állított disznóorr. (Orbán Balázs) A rosta a levegőben kukkra repül. (Teleki Sándor)
