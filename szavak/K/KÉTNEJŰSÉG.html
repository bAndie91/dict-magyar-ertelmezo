KÉTNEJŰSÉG  [e] főnév -et, -e [ë, e] (csak egyes számban)
Kettős házasság állapota, ill. az a bűntett, amelyet az a férfi követ el, aki érvényes házasságának tartama alatt ismét megnősül; bigámia. <span style="color:blue">Kétnejűség miatt elítélték. Kétnejűségben élt.</span>
</div>
