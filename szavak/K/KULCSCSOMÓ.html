KULCSCSOMÓ  főnév
Vmilyen szempontból együvé tartozó s együtt kezelt kulcsok összessége, rendsz. zsinórra v. karikára fűzve. <span style="color:blue">A kulcscsomóból kikereste a pince kulcsát.</span> □ Fekete, melles kötényt kötött fel, és a zsebben elhelyezte a kulcscsomót. (Krúdy Gyula)
