KANCSALÍT  tárgyatlan ige -ott, -son; -ani
Szemét kancsalul mozdítja, hunyorítja, kancsalul néz, szeme kancsal; bandzsít, sandít. □ Olvasott és néha kancsalítva nézett sörére. (Krúdy Gyula)
<ul><li>Igekötős igék: félrekancsalít; összekancsalít; visszakancsalít.
</li><li>kancsalítás; kancsalító.
</li></ul></div>
