KOCSISÜLÉS  [s-ü] főnév
A kocsi, szekér elején levő, rendsz. magasított ülés (2a) a kocsis és gyak. mellette még egy személy számára; bak. <span style="color:blue">A gyerekek büszkén ültek a kocsisülésen.</span> □ Felültek a csinos kis csézára; a hölgyek hátulra, Gyuri a kocsisülésre. (Mikszáth Kálmán)
