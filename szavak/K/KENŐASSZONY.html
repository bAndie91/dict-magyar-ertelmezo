KENŐASSZONY  főnév (<span style="color:green;font-weight:bold">népies</span>, <span style="color:green;font-weight:bold">régies</span>)
Olyan parasztasszony, aki ért a kenéshez (1a), a masszírozáshoz, és alkalomadtán ezzel gyógyítja a bajával hozzá fordulót. □ A faluból fel kell hívatni a kenőasszonyt, az maradjon a beteg mellett ápolóul. (Jókai Mór)
