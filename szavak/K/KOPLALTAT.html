KOPLALTAT  tárgyas ige -tam, -ott, ..asson
Koplalni kényszerít vkit, nem ad neki enni, v. nem engedi enni. <span style="color:blue">A rabokat napokon át koplaltatták. A gyomorrontás után az orvos egy napig koplaltatta.</span>
<ul><li>Igekötős igék: megkoplaltat.
</li><li>koplaltatás; koplaltatható; koplaltató; koplaltatott.
