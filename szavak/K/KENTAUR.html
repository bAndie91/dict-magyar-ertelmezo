KENTAUR  [ë v. e] főnév -t, -ok, -ja (<span style="color:green;font-weight:bold">mitológia</span>)
Mesebeli lény, amelynek felső teste férfira, alsó teste lóra emlékeztet. □ A barlanglakó kentaur otthonos volt a sötétben, és szeme jól látott, mint a tigriseké. (Babits Mihály)
