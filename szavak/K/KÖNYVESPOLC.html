KÖNYVESPOLC  főnév
Könyvek elhelyezésére való polc, állvány; könyvállvány. <span style="color:blue">A magas könyvespolc tele volt könyvekkel. Leemelt egy könyvet a könyvespolcról.</span> □ Ez volt a régi generáció, amelyet Magyarországon az láthatott, aki vidéki házak könyvespolcain is körülnézett. (Krúdy Gyula)
