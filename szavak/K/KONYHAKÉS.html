KONYHAKÉS  főnév
A konyhai munkához haszn., rendsz. fanyelű, hosszú, erős pengéjű kés. <span style="color:blue">A részeg legény egy konyhakést rántott elő a csizmaszárából.</span> □ Tisztogatta a halat, a konyhakés véletlenül beleszaladt a gyűrűsujjába. (Kosztolányi Dezső)
