KARDNYELŐ  [e] főnév -t, -je [e] (<span style="color:green;font-weight:bold">elavulóban</span>)
Artista, aki egyenes, tompa hegyű kardpengét, hosszú kést v. más hasonló tárgyat a nyelőcsövén át egészen a gyomráig letol. <span style="color:blue">Régen a cirkuszban kardnyelők is felléptek. A közönség megtapsolta az ügyes kardnyelőt.</span>
