KÜLÖNÉLÉS  [n-é] főnév
Az az állapot, amikor a házasfelek a családi, házassági közösségből való kiválás folytán v. egyéb körülmények (pl. közös lakás hiánya, különböző helységekben való állandó tartózkodás) miatt nem egy lakásban élnek. <span style="color:blue">A feleség különélése; különélése alatt.</span>
<ul><li>különélési.
