KECSKEFŰZ  főnév (<span style="color:green;font-weight:bold">növénytan</span>)
A fűzfélék családjába tartozó kisebb fa v. cserje; levele hosszúkás v. kerek tojásdad, felül sima, fényes, fonákján molyhos; főleg hegyvidéki erdőkben honos; virága, a közismert húsvéti barka kedvelt tápláléka a méheknek (Salix caprea).
<ul><li>kecskefűzes.
</li></ul></div>
