KISAGY  [s-a] főnév (<span style="color:green;font-weight:bold">bonctan</span>)
Az agyvelőnek a koponya hátsó részében, a nagyagy alatt elhelyezkedő része (cerebellum). □ A golyó szétroncsolja a kisagyat, s az öntudat azonnal megszűnik. (Kosztolányi Dezső)
<ul><li>Szóösszetétel(ek): kisagyvelő.
</li><li>kisagyi.
</li></ul></div>
