KARCSÚSÁG  főnév -ot, -a (csak egyes számban)
Vkinek, vminek a karcsú melléknévvel kifejezett tulajdonsága, karcsú volta. <span style="color:blue">A lány karcsúsága; derekának, termetének karcsúsága.</span> □ [A hegyvidék asszonyai] termetök életerős karcsúságát megtartják a késő vénség idejéig. (Jókai Mór)
<ul><li>karcsúsági.
</li></ul></div>
