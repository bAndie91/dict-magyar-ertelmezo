KÁRMEGÁLLAPÍTÁS  [g-á] főnév (<span style="color:green;font-weight:bold">hivatalos</span>)
Vmely kár (1) nagyságának, rendsz. pénzösszegben kifejezett mértékének hivatalos megállapítása az illetékes hatóság, főként a biztosító vállalat (megbízottja) által. <span style="color:blue">A kármegállapítás szerint a pusztulás 50%-os.</span>
