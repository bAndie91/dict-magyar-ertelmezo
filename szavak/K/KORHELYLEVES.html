KORHELYLEVES  főnév
Savanyú káposztából főzött leves kolbásszal. <span style="color:blue">Reggel felé korhelylevest tálaltak. Az átmulatott éjszaka után jólesett neki a korhelyleves.</span> □ Igaz, van recipé [= recept]: megterhelt és heves Gyomrunknak új erőt ád a korhel [= korhely] leves. (Csokonai Vitéz Mihály)
