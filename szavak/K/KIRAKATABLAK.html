KIRAKATABLAK  [t-a] főnév
A kirakat belső részét az utcától, ill. az üzlethelyiségtől elzáró ablak. <span style="color:blue">Kinyitotta a kirakatablakot, hogy bevegye a kért árut. Amíg a kirakatot rendezik, a kirakatablakot kitámasztják.</span> || a. Kirakatüveg (2). <span style="color:blue">Megrepedt a kirakatablak.</span>
