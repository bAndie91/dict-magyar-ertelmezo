KÖZKINCS  főnév (<span style="color:green;font-weight:bold">sajtónyelvi</span> v. <span style="color:green;font-weight:bold">választékos</span>)
Olyan szellemi érték, (alkotás), mely mindenki számára hozzáférhető, s a közösség minden tagjának egyaránt szellemi gazdagodására van. <span style="color:blue">Közkinccsé tesz vmit; közkinccsé válik. Petőfi költészete az egész magyar nép közkincse.</span>
