KERGESÉG  [e-e] főnév -et, -e [ë, e] (csak egyes számban)
Juhok agyvelejében fellépő megbetegedés, melyet a kutyában élő galandféregnek az embriója idéz elő; tünetei: kényszermozgás (pl. körben forgás), görcsök, levertség, legyengülés. <span style="color:blue">A juh kergeségben szenved, van.</span>
</div>
