KÉPANYAG  [p-a] főnév
Vmely célra  pl. eladásra, kiállításra, illusztrációként folyóiratba v. könyvbe  összegyűjtött v. vmilyen tekintetben egységet alkotó képek összessége. <span style="color:blue">A múzeum képanyaga elkerülte a pusztulást. A könyv gazdag képanyagot tartalmaz.</span>
