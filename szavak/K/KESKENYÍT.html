KESKENYÍT  [e-ë] tárgyas ige -ett, -sen [ë, ë]; -ni v. -eni [e]
(Egyre) keskenyebbé tesz. <span style="color:blue">Az úttest szélesebb lett, de a gyalogjárót keskenyíteni kellett.</span>
<ul><li>Igekötős igék: elkeskenyít; megkeskenyít; lekeskenyít.
</li><li>keskenyítés; keskenyített; keskenyíthető; keskenyítő; keskenyíttet.
