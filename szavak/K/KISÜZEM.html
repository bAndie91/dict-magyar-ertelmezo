KISÜZEM  [s-ü] főnév (<span style="color:green;font-weight:bold">közgazdaságtan</span>)
Magántulajdonban levő, kevés bérmunkást v. egyet sem foglalkoztató, egyáltalán nem v. csak kevéssé gépesített ipari v. mezőgazdasági üzem. <span style="color:blue">A kisüzemekben folyó paraszti és kisipari termelés.</span>
