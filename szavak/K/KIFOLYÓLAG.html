KIFOLYÓLAG  névutó (-ból, -ből ragos szóval, vele együtt értve) (<span style="color:green;font-weight:bold">hivatalos</span>)
A szóban forgó dolog következtében, annak folyományaként, következményeként, eredményeként. <span style="color:blue">Ebből kifolyólag; egy régebbi ügyből kifolyólag.</span> □ [A levél] egy szolgálati ügyből kifolyólag került hozzám. (Krúdy Gyula)
