KONKLUDÁL  tárgyatlan ige -t, -jon (<span style="color:green;font-weight:bold">választékos</span>)
Bizonyos előzményekből vmely (végső) következtetésre jut, vmire következtet. □ A beszéd sok ékes szóvirág után oda konkludált, hogy  [a szultán] adna Kecskemétnek egy állandóan ott lakó pasát. (Mikszáth Kálmán)
