KALLÓZIK  tárgyatlan ige -tam, -ott, -zék (-zon) (<span style="color:green;font-weight:bold">sport</span>)
&lt;Úszó&gt; mellre és hasra fekve úgy halad a vízben, hogy behajlított karral és nyújtott lábbal ollózó mozdulatokat végez. <span style="color:blue">A diákokat először kallózni tanították meg.</span>
<ul><li>Igekötős igék: végigkallózik.
</li><li>kallózó.
