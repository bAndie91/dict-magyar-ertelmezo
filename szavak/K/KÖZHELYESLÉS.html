KÖZHELYESLÉS  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Vmely csoportnak, közösségnek általános, egyhangú helyeslése, helyeslő magatartása, nyilatkozata vmivel kapcsolatban. <span style="color:blue">Beszédét közhelyeslés fogadta. Indítványa közhelyeslésre talált.</span> □ Ez indítvány közhelyesléssel fogadtatott. (Eötvös József)
