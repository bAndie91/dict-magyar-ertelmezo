KIFAGGAT  tárgyas ige
Addig faggat vkit, míg mindent meg nem tud vkiről, vmiről; kivallat. <span style="color:blue">Kifaggatta barátját családi körülményeiről.</span> □ A vendégek vacsora közben kifaggatták a gyerekeket, hogy miből mit tudnak. (Gárdonyi Géza)
<ul><li>kifaggatás; kifaggatható; kifaggató; kifaggatott.
