KORSZELLEM  főnév
Vmely történelmi korban a gazdasági, társadalmi és politikai viszonyoktól meghatározott uralkodó szellem. <span style="color:blue">A korszellem hatása alól ő sem vonhatta ki magát.</span> □ Ma a fiatalabbaké a munka és a jövő, benne van a korszellemben, hogy a régi garnitúrát ki kell cserélni. (Móricz Zsigmond)
