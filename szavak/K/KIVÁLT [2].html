KIVÁLT [2]  melléknév
Általában olyan &lt;személy, anyag, dolog&gt;, aki, amely a kiválás folyamatának eredményeképpen különül el vmiből, vmitől. <span style="color:blue">A koalícióból kivált ellenzéki párt; a kormányból kivált miniszterek; az üzletből kivált társ; az oldatból kivált mész. A kivált kén lerakódik a bőrbe.</span>
