KÁRPÓTOL  tárgyas ige -t, -jon
Kárpótlást ad, nyújt, juttat vkinek. <span style="color:blue">Kárpótol vkit vmiért; kárpótolja magát:</span> a) kárpótlást szerez magának; b) vigasztalást, elégtételt talál vhol, vmiben. <span style="color:blue">Gyermeke elvesztéséért semmi se kárpótolhatja.</span>
kárpótló v. kárpótoló; kárpótolható; kárpótolt.
