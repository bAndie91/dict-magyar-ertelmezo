KETTECSKÉN  [e-e] határozószó (<span style="color:green;font-weight:bold">kedveskedő</span>)
Csak ketten, ketten egyedül; ketten egymással jól megférve, jó egyetértésben; édes kettesben. <span style="color:blue">Elbeszélgettünk kettecskén a feleségemmel.</span> □ Még csak egy magam valék Tavaly ilyen tájban, Az idén már kettecskén Vagyunk a szobában. (Petőfi Sándor)
