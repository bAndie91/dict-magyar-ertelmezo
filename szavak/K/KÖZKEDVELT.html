KÖZKEDVELT  melléknév (kissé <span style="color:green;font-weight:bold">választékos</span>)
Olyan, akit, amit mindenki kedvel, szeret; népszerű. <span style="color:blue">Közkedvelt áru, fürdőhely. Közkedvelt ember ő városunkban.</span> □ A morganatikus [= rangon aluli] házasság igen bevett, mondhatnám közkedvelt dolog. (Ambrus Zoltán)
