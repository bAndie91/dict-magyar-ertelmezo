KOPOLTYÚ  főnév -t, -ja
Vérerekben gazdag, nagy felületű, lemezes, sallangos képződmény, a fejlettebb vízi állatok lélegzőszerve. <span style="color:blue">A hal kopoltyúval lélegzik.</span> □ S lélekze Jónás  | sürün szíván kopoltyuját a Halnak. (Babits Mihály)
<ul><li>Szóösszetétel(ek): kopoltyúfedő; kopoltyúív.
