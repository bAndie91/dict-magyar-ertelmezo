<div class="szocikk">
KAROSSZÉK  [s-sz] főnév
Olyan szék, amelyen kétoldalt a kéz pihentetésére v. támaszkodásra alkalmas karfa van. <span style="color:blue">Kényelmes, párnázott karosszék. Leült egy karosszékbe.</span> □ Öreg karosszék, ez fiúk, a vágyam. (Juhász Gyula) Egy nap felöltözött, s a karosszékbe ült. (Babits Mihály)
</div>
