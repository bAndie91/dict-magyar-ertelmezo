KORONATANÚ  főnév (<span style="color:green;font-weight:bold">jogtudomány</span>)
&lt;Bűnperben&gt; a legfontosabb tanú, akinek vallomása rendsz. teljes fényt derít az ügyre, igazolja v. megcáfolja a vádat. <span style="color:blue">Az alperes, a felperes, a vád, a védelem koronatanúja.</span> □ A vád koronatanúja Druma Szilárd volt, a piros arcú ügyvéd. (Kosztolányi Dezső)
