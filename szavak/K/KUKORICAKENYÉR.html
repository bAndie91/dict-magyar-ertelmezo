KUKORICAKENYÉR  főnév
Kukoricaliszttel kevert búza- v. rozslisztből sütött kenyér; kukoricás kenyér. <span style="color:blue">Egész télen kukoricakenyéren élt.</span> □ Az urak gyerekei, akik soha otthon nem esznek kukoricakenyeret, az iskolában elcserélik a fehér búzakenyerüket kukoricapogácsáért. (Móricz Zsigmond)
