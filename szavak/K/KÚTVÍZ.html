KÚTVÍZ  főnév
A fúrt v. ásott kútban levő, ill. belőle merített víz. <span style="color:blue">Friss, iható, kemény, lágy kútvíz; kútvizet iszik.</span> □ Apa vitte  a kulacsot, melyet otthoni jó kútvízzel töltött meg, az útra. (Kosztolányi Dezső) [Az ingből] a puszta kútvíz nem veszi ki  az olajos szennyet. (Móricz Zsigmond)
