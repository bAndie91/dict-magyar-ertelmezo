<div class="szocikk">
KINEVETTET  tárgyas ige
<ul><li>1. Okozza, hogy vkit kinevessenek. <span style="color:blue">Ne nevettess ki, nem akarom, hogy mindenki rajtam derüljön.</span>
</li><li>2. <span style="color:blue">Kinevetteti magát:</span> olyasmit tesz, ami miatt kinevetik, nevetség tárgya lesz; nevetségessé válik. <span style="color:blue">Ne nevettesd ki magadat!</span>
</li></ul></div>
