KOVASAV  főnév (<span style="color:green;font-weight:bold">vegyi ipar</span>)
A szilíciumnak hidrogénnel és oxigénnel való különféle arányú vegyülete; a természetben tisztán, magában nem fordul elő, de sói, a szilikátok gyakoriak.
<ul><li>Szóösszetétel(ek): kovasav-olvadék.
</li><li>kovasavas.
</li></ul></div>
