KÉPZETLEN  [e-e] melléknév -ül, -ebb [e]
Olyan &lt;személy&gt;, akinek nincsen kellő képzettsége, felkészültsége vmiben; vmilyen szempontból nem v. nem eléggé képzett. <span style="color:blue">Képzetlen műszerész; szakmailag, zeneileg képzetlen.</span>
<ul><li>képzetlenség.
</li></ul></div>
