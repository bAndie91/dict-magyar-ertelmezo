KECSKECSÖCSŰ  melléknév kecskecsecsű [e-e-ë]
&lt;Csak ebben az állandó szókapcsolatban:&gt; <span style="color:blue">Kecskecsöcsű szőlő:</span> olyan (csemege)szőlő, amelynek hosszúkásan tojásdad nagy szemei vannak. □ A magyar nép bogárhátú viskóban lakik, kecskecsecsű szőlőt eszik. (Arany János)
