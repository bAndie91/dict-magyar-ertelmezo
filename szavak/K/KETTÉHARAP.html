KETTÉHARAP  tárgyas ige
Két darabra, részre, kettőbe harap vmit; harapással két darabra, két részre oszt. <span style="color:blue">Kettéharapja a szilvát. Majd kettéharaptam a nyelvem.</span> □ A derekán harapta ketté a szivarját. (Jókai Mór)
<ul><li>kettéharapás; kettéharapható; kettéharapó; kettéharapott.
