KÍNHALÁL  főnév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Kínzással okozott, erőszakos halál. □ Szörnyű még az eszme is, Török kezében lelni kínhalált! (Jókai Mór) Áldott inség; magyar élet, Világon sincs párod néked, Nincsen célod, nincsen véged, Kínhalál az üdvösséged. (Ady Endre)
