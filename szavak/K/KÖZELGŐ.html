KÖZELGŐ  [e] melléknév (<span style="color:green;font-weight:bold">választékos</span>)
Olyan, aki, ami közeleg (1). <span style="color:blue">A közelgő nyár, tél, ünnep, vakáció, választás, vihar.</span> □ Szidja Csóri vajdát a közelgő tábor. (Arany János) Húszesztendős koromban örvendeztem volna a közelgő eseménynek [= a szerelmi légyottnak]. (Krúdy Gyula)
