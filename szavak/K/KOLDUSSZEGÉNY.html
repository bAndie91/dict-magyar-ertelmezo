<ul><li>I. melléknév -en [e] A legnagyobb mértékben szegény, teljesen nincstelen &lt;személy, csoport&gt;. <span style="color:blue">Koldusszegény családból származott.</span>
</li><li>II. főnév (<span style="color:green;font-weight:bold">ritka</span>) Ilyen személy. <span style="color:blue">Még a koldusszegény is legszebb ruháját vette fel.</span>
</li></ul></div>
