KOSTA  főnév kostát, kostája (<span style="color:green;font-weight:bold">elavult</span>, <span style="color:green;font-weight:bold">gúnyos</span>)
Kántortanító. □ Aztán a kostákhoz belátogat [az elcsapott rektor] És rajtok él, amíg ki nem lökik. (Arany János) A legátusnak a kostához kell menni. (Így tisztelték az iskolamestert hajdan.) (Jókai Mór)
