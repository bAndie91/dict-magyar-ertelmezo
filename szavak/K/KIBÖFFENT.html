Meggondolatlanul, elhamarkodva kimond vmit, amit nem kellett volna; kikottyant. <span style="color:blue">Kiböffentette az összeget.</span> □ A kulcsárné megröstellte, hogy kiböffentette [a titkot]. (Mikszáth Kálmán)
