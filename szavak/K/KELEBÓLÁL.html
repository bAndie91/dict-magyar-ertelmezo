KELEBÓLÁL  [e-e] tárgyatlan ige -t, -jon (<span style="color:green;font-weight:bold">tájszó</span>)
Fáradtan v. tájékozatlanul, rendsz. vmit keresve ide-oda jár, jön-megy; nagy területet összevissza, esetleg eredménytelenül bejár. <span style="color:blue">Egész délután a városban kelebóláltam, amíg ráakadtam a házra.</span>
