KRAKÉLERESKEDIK  [ë-ë-ë v. e-ë-ë] tárgyatlan ige -tem, -ett [e, ë], -jék (-jen) [ë]
Krakéler módjára, kihívón viselkedik; mindenkibe beleköt, erőszakoskodik, kötekedik. <span style="color:blue">Kitűnő vívó volt, és szeretett krakélereskedni.</span>
<ul><li>krakélereskedés; krakélereskedő.
</li></ul></div>
