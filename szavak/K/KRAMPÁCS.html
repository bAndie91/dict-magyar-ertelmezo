KRAMPÁCS  főnév -ot, -a (<span style="color:green;font-weight:bold">vasútügy</span>)
Olyan, krampácsolásra használatos csákány, amely mindkét v. egyik szárán lapos, széles bunkóban, fejben végződik, másik vége az utóbbi esetben hegyes; tömőcsákány. <span style="color:blue">Kiosztották a pályamunkásoknak a krampácsokat.</span>
