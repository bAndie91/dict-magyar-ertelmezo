KÖZÚT  [z-ú] főnév (<span style="color:green;font-weight:bold">közlekedés</span>)
&lt;A vasúttal ellentétben:&gt; közforgalom lebonyolítására való, közterületként használt út. <span style="color:blue">A gépkocsi elterjedése emelte a közutak jelentőségét. A teherforgalmat részint vasúton, részint közutakon bonyolítják le.</span>
