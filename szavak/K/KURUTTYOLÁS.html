KURUTTYOLÁS  főnév -t, (-ok), -a (<span style="color:green;font-weight:bold">hangutánzó</span>)
A kuruttyol igével kifejezett cselekvés, ill. hangjelenség; az a tény, hogy vmi (a béka) kuruttyol. <span style="color:blue">A békák kuruttyolása. Kuruttyolás hallatszott a tóból. A sok béka kuruttyolásba kezdett.</span>
