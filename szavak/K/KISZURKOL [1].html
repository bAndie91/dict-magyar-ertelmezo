KISZURKOL [1]  tárgyas ige (<span style="color:green;font-weight:bold">ritka</span>)
Szurokkal végig v. a kívánt mértékben beken vmit; szurokkal tömít. <span style="color:blue">Kiszurkolja a hordót, a teknő részeit.</span>
<ul><li>kiszurkolás; kiszurkolható; kiszurkoló; kiszurkolt; kiszurkoltat.
