KECSKEBÉKA  főnév (<span style="color:green;font-weight:bold">állattan</span>)
A békák családjába tartozó, nálunk folyók és állóvizek mentén nagyon közönséges, zöld hátú, barna foltos béka (Rana esculenta); combját zsírban kirántva ételként fogyasztják.
<ul><li>Szóösszetétel(ek): kecskebékazöld.
</li></ul></div>
