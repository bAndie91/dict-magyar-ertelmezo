KIHÁTRÁL  tárgyatlan ige
Hátrafelé lépkedve, hátrálva kimegy. <span style="color:blue">Kihátrált a szobából.</span> □ Kihátrált az ajtón anélkül, hogy Zoltán észrevette volna. (Jókai Mór) Kihátrált a kolostori vendégszobából, mielőtt a lakó ezt megakadályozhatta volna. (Krúdy Gyula)
