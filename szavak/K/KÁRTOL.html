KÁRTOL  tárgyas ige -t, -jon (<span style="color:green;font-weight:bold">szövőipar</span>)
&lt;Szálas, főleg szövőipari alapanyagot&gt; kézi v. főként gépi úton szálakra bont, fellazít, kifésül, elegyenget, s így felhasználásra, kül. fonásra, sodrásra előkészít. <span style="color:blue">Gyapjút, jutát, lent, lószőrt, pamutot, selymet kártol.</span>
<ul><li>kártolható; kártolhat.
