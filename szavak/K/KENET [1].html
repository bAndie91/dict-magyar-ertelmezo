KENET [1]  [e-e] tárgyas ige -tem, -ett [e, ë], ..essen [e-ë] (<span style="color:green;font-weight:bold">ritka</span>)
Elrendeli v. kéri, hogy vki vmit kenjen. <span style="color:blue">Olajjal keneti a testét. Vajas kenyeret kenet magának.</span>
<ul><li>Igekötős igék: bekenet; elkenet; felkenet; kikenet; lekenet; megkenet; rákenet; szétkenet; végigkenet.
</li></ul></div>
