KENDERIKE  [e-ë-e] főnév ..két, ..kéje [ë] (<span style="color:green;font-weight:bold">állattan</span>)
A pintyfélék közé tartozó, főleg domb- és hegyvidéken élő kis énekes madár; gyommagvakkal és rovarokkal táplálkozik (Carduelis cannabina cannabina). □ Tengelic, kenderike egész fészekalja fiával hurcolkodik bogáncsról bongáncsra. (Bársony István)
