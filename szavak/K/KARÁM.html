KARÁM  főnév -ot, -ja (<span style="color:green;font-weight:bold">népies</span>)
Náddal, gyékénnyel, vesszővel, deszkával bekerített, rendsz. fedetlen hely a szabadban legelő háziállatok együtt tartására és védelmére. □ Itt legelő gulya, és szétszórt karámok  (Tompa Mihály) Elmaradoztak a tanyák és karámok. (Karinthy Frigyes)
