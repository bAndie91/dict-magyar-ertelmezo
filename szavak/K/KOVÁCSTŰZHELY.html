KOVÁCSTŰZHELY  főnév (<span style="color:green;font-weight:bold">ipar</span>)
Kézi kovácsolásnál a (kisméretű) fémes anyag, munkadarab fölhevítésére való, beépített v. hordozható berendezés; rostély nélküli bemélyedés(ek)ben a kovácsszén fújtatóval odajuttatott levegővel ég.
