KÖRORVOS  [r-o] főnév (<span style="color:green;font-weight:bold">elavult</span>)
Több kisebb községből álló egészségügyi körzetnek tiszti orvosi v. községi orvosi vizsgát tett, kinevezett orvosa. □ A körorvos receptjét eltette a tárcájába. (Krúdy Gyula)
