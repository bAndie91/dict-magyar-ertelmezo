KALAPSKATULYA  [p-s] főnév, (<span style="color:green;font-weight:bold">népies</span>) kalapkatulya (<span style="color:green;font-weight:bold">elavulóban</span>)
Főleg női kalapok szállítására, tartására való, rendsz. kerek (karton)doboz. □ Susannet és gyermekeit hintójába felpakolta, utánuk még egy társzekeret küldött tele poggyásszal és kalapkatulyákkal. (Jókai Mór)
