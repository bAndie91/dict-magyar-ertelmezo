KŐBALTA  főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
A primitív embertől, kül. a kőkorszakban használt olyan balta, amelynek a feje kőből készült. <span style="color:blue">A kőbalta primitív munkaeszköz volt.</span> □ A főpap megtevé az áldozatot, főbe ütvén egy kőbaltával rendre az állatokat. (Jókai Mór)
