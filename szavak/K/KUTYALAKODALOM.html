KUTYALAKODALOM  főnév
<ul><li>1. (<span style="color:green;font-weight:bold">tájszó</span>) Büntetésül kapott verés, kikapás; haddelhadd. <span style="color:blue">Lesz (neked) kutyalakodalom:</span> ezért lakolni fogsz; lesz nemulass!
</li><li>2. (<span style="color:green;font-weight:bold">elavulóban</span>) Verekedéssel járó lárma, zűrzavar, bonyodalom. <span style="color:blue">Volt nagy kutyalakodalom. Ebből nagy kutyalakodalom támadt a kocsmában.</span>
</li></ul></div>
