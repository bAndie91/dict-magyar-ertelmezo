KIHENGEREL  tárgyas ige (<span style="color:green;font-weight:bold">fémipar</span>)
&lt;Fémet&gt; hengerléssel a kívánt mértékben kinyújt, ill. a kívánt formára való alakítását hengerléssel végrehajtja, befejezi. <span style="color:blue">Kihengerlik az acélt.</span> || a. Ily módon létrehoz vmit. <span style="color:blue">Kihengerelnek egy vaslemezt.</span>
<ul><li>kihengerelt; kihengereltet; kihengerlés; kihengerlő.
