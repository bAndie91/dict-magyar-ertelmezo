KOCSIFELHAJTÓ  főnév (<span style="color:green;font-weight:bold">közlekedés</span>)
Némely nagyobb középület, kül. színház v. vmely kastély, palota stb. főkapujához felkanyarodó, rendsz. ív alakban görbült kocsiút, amelyen a járművek közvetlenül a bejárathoz hajthatnak.
