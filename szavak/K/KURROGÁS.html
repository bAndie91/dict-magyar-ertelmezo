KURROGÁS  főnév -t, -ok, -a (<span style="color:green;font-weight:bold">népies</span>, <span style="color:green;font-weight:bold">hangutánzó</span>)
A kurrog igével kifejezett cselekvés, ill. hangjelenség; főként némely állat, madár morgásszerű hangja. <span style="color:blue">A galamb, a pulyka, a vadlúd kurrogása; a kutya, a macska kurrogása.</span> □ A sűrűből csak a siketfajd kurrogása  hangzik elő. (Jókai Mór)
