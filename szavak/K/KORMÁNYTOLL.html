KORMÁNYTOLL  főnév (<span style="color:green;font-weight:bold">állattan</span>)
<span style="color:blue">Kormánytollak:</span> a madár tollazatának azok a tollai, amelyekkel a madár röptét irányítja. □ A postagalamb  megszállt az ismerős ablakon  A levél vékony papirushártyára írottan a kormánytollainak egyikére volt göngyölve. (Jókai Mór)
