KÖLCSÖNKÖNYVTÁR  főnév
Olyan könyvtár, amely meghatározott feltételekkel könyveket kölcsönöz nem a könyvtár helyiségében való olvasásra. □ Elmesélem magának az én regényemet, aminél furcsábbat nem kapni a kölcsönkönyvtárban. (Jókai Mór)
