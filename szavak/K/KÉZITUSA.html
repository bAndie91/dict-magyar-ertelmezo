KÉZITUSA  főnév (<span style="color:green;font-weight:bold">katonaság</span>)
Főleg szuronnyal, karddal harcoló katonák közelharca; az a közelharc, amelyben ember ember ellen küzd. <span style="color:blue">Kézitusára került a sor.</span> || a. (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">túlzó</span>) &lt;Tömegben&gt; tülekedés, durva erőszakoskodás. <span style="color:blue">Csak kézitusával bírtam behatolni a terembe.</span>
