KÖRUTAZÁS  [r-u] főnév
Több helységet, várost, vidéket, országot érintő, ill. bejáró és rendsz. a kiindulási pontra visszatérő, hosszabb egyéni v. társas utazás. <span style="color:blue">Körutazáson vesz részt; körutazást tesz a Balaton körül, a Földközi-tengeren. Az utazási iroda körutazást rendez.</span>
<ul><li>körutazási.
</li></ul></div>
