KIFEHÉREDIK  tárgyatlan ige (csak 3. személyben)
Fehérebbé v. teljesen fehérré válik. <span style="color:blue">Elhanyagolt fogai néhány mosás után kifehéredtek. A vászon kifehéredik a szapulástól. Keze kifehéredett a sok mosástól. Nyáron lesült, de a bőre hamar kifehéredett.</span>
<ul><li>kifehéredés; kifehéredett; kifehéredő.
