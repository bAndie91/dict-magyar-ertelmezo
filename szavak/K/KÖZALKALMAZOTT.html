KÖZALKALMAZOTT  [z-a] főnév
Vmely államhatalmi, államigazgatási, bírói v. ügyészi szervnek választott, kinevezett v. szerződéses dolgozója, aki munkájáért rendszeres illetményt kap. <span style="color:blue">A közalkalmazottak fizetésemelése, létszámcsökkentése, nyugdíja, szakszervezete.</span>
<ul><li>közalkalmazotti.
</li></ul></div>
