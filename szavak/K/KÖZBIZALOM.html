KÖZBIZALOM  főnév (<span style="color:green;font-weight:bold">választékos</span>)
Vmely közösség egyöntetű bizalma vki, ritk. vmi iránt. <span style="color:blue">Közbizalomnak örvend; élvezi a közbizalmat. A közbizalom feléje fordult.</span> □ A tisztújításról s a közbizalom megszerzésének módjairól szóltak. (Eötvös József)
