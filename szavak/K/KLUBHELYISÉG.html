KLUBHELYISÉG  főnév
Vmely klub (1) épülete v. helyisége(i), ahol a klubélet folyik. <span style="color:blue">A kastély ma klubhelyiség. Tánc lesz a klubhelyiségben.</span> || a. Vmely sportklubnak az(ok) a helyisége(i), ahol az összejöveteleket, előadásokat tartják. <span style="color:blue">Mérkőzés után előadás lesz a klubhelyiségben.</span>
