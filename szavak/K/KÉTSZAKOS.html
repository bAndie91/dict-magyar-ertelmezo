KÉTSZAKOS  melléknév és főnév -t, -ok, -a (<span style="color:green;font-weight:bold">iskolai</span>)
Olyan (személy), aki az egyetemen v. főiskolán két szaktárgyat tanul v. két szaktárgyból van képesítése mint (középiskolai) tanárnak. <span style="color:blue">Kétszakos hallgató, tanár. A kétszakosok elhelyezkedése könnyebb, mint az egyszakosoké.</span>
