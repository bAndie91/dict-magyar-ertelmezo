KÁPOSZTAFEJ  főnév, (<span style="color:green;font-weight:bold">régies</span>) káposztafő
A káposzta szorosan egymásra boruló leveleinek tömött, gömbölyded csomója a torzsa körül; ezt használják fel étkezésre. □ Semmi nesz. Csak egy-egy káposztafő reped meg imitt-amott a túlságos áldás miatt, mely az égből csurog. (Mikszáth Kálmán)
