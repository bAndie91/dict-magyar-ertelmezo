KÉNSAV  főnév (<span style="color:green;font-weight:bold">vegyi ipar</span>)
A kénnek oxigénnel és hidrogénnel való egyesüléséből származó színtelen, sűrű, erősen maró hatású, vizet magába szívó vegyület, a vegyi ipar fontos anyaga; vitriol (H2SO4).
<ul><li>Szóösszetétel(ek): kénsavgyár; kénsavgyártás; kénsavmaradék; kénsavmentes.
</li><li>kénsavas.
</li></ul></div>
