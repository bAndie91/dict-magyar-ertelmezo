KIFOLYAT  tárgyas ige
&lt;Folyadékot&gt; vhonnan kifolyni enged, ill. elősegíti, hogy vhonnan kifolyjék. <span style="color:blue">Vigyázatlanságból az egész bort kifolyatta a hordóból. Kifolyatja a felmelegedett vizet a csapból, mielőtt inna.</span>
<ul><li>kifolyatás; kifolyató; kifolyatott.
