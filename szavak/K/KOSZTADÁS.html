KOSZTADÁS  [t-a] főnév (<span style="color:green;font-weight:bold">elavulóban</span>)
Az a tény, cselekvés, hogy vki rendszeresen, fizetségért ellátást, élelmezést ad rendsz. több, nála lakó v. a kosztot kihordó személynek, főleg idegenben tanuló diáknak. <span style="color:blue">Kosztadásból él; kosztadást vállal; kosztadással foglalkozik.</span>
<ul><li>kosztadási.
