KISVÁRTATVA  határozószó (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
Rövid idő elteltével, nemsokára, csakhamar &lt;ezzel a mellékértelemmel is:&gt; rövid várakozás után. □ Pedig ugye, kellene a pénz?  firtatott kisvártatva. (Mikszáth Kálmán) Kocsi zörgött, s kisvártatva elhaladt az úton a gunyhó előtt. (Tömörkény István)
