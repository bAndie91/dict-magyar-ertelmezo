KIÁBRÁNDULT  melléknév -an, -abb
<ul><li>1. (-ból, -ből ragos határozóval) Olyan &lt;személy&gt;, aki kiábrándult vkiből, vmiből. <span style="color:blue">Barátjából, szerelméből kiábrándult férfi.</span>
</li><li>2. Olyan &lt;személy&gt;, aki elvesztette minden reményét, hitét, ábrándját. <span style="color:blue">A kiábrándult ember cinikussá lesz.</span>
</li><li>kiábrándultság.
</li></ul></div>
