KULTÚRNÖVÉNY * főnév (<span style="color:green;font-weight:bold">mezőgazdaság</span>)
Az a növény, amelyet az ember vadon termő növényből megnemesített, megtelepített és külön gondozással nevelt, főleg azért, mert gazdaságilag szüksége van rá; gazdasági, termesztett növény. <span style="color:blue">A gabona a legfontosabb kultúrnövény.</span>
