<div class="szocikk">
KÖTÉLIDEGZETŰ  [e-e; l-i] melléknév
Olyan &lt;személy, főként férfi&gt;, akit semmiféle váratlan, meglepő, idegesítő dolog v. veszedelem nem hoz ki a sodrából, aki nem ismer félelmet, idegességet; rendíthetetlen nyugalmú. <span style="color:blue">A háború szörnyűségei még a kötélidegzetű embereket is próbára tették.</span>
</div>
