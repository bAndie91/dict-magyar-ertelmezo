KURTAVAS  főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
Olyan bilincs, amellyel a kezet a lábhoz csatolják, s így a rab csak görnyedten ülhet. <span style="color:blue">Kurtavasra ver vkit.</span> □ [Az alispán] a kaloda, deres, kurtavas és egyéb közigazgatási eszközöket egy kamrában tartotta bezárva. (Mikszáth Kálmán)
