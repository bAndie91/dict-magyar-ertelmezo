KIVEVÉS  [ë] főnév -t, (-ek), -e [ë, e]
A kivesz igével kifejezett cselekvés; az a cselekvés, hogy vki, vmi kivesz, kiemel vmit, vkit (vhonnan, vmiből); kivétel. <span style="color:blue">A gyermek kivevése a fürdővízből, a kocsiból; pénz kivevése a zsebből; a szálka kivevése a bőr alól.</span>
<ul><li>kivevési.
</li></ul></div>
