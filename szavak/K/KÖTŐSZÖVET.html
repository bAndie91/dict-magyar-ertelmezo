KÖTŐSZÖVET  főnév (<span style="color:green;font-weight:bold">biológia</span>)
&lt;A szervezetben&gt; a bőr alatt és a szervek elemei között kiterjedten található szövet (3), amely a többi szövetet és szerveket összetartja. <span style="color:blue">Bőr alatti, kocsonyás, laza, tömött kötőszövet.</span>
<ul><li>Szóösszetétel(ek): kötőszövet-daganat; kötőszövet-gyulladás.
</li></ul></div>
