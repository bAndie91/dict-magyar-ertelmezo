KÉNYSZERELADÁS  [r-e] főnév (<span style="color:green;font-weight:bold">kereskedelem</span>)
Kényszerhelyzetben, kényszer(űség)ből történő eladás. <span style="color:blue">A gyümölcs romlani kezdett, kényszereladás lett a vége. Ha nem fizet, kényszereladásra kerül a sor.</span>
