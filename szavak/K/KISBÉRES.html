KISBÉRES  főnév (<span style="color:green;font-weight:bold">1945 előtt</span>)
Fiatal (rendsz. tizennégyhuszonegy éves) mindenes mezőgazdasági cseléd, kül. olyan módosabb gazdánál, akinél felnőtt korú béres is szolgált. □ Nem ül kevélyebben a huszár a lovon, Mint az a kisbéres a vendégoldalon. (Petőfi Sándor)
