KÖRÖZVÉNY  főnév -t, -ek, -e [ë, e] (<span style="color:green;font-weight:bold">hivatalos</span>)
A beosztottakkal, alárendeltekkel parancsot, meghagyást, intézkedést, értesítést közlő körlevél. <span style="color:blue">Körözvényt ad ki; aláíratja a körözvényt. Megjött a körözvény részletes utasításokkal.</span>
<ul><li>Szóösszetétel(ek): körözvénytávirat.
