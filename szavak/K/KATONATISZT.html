KATONATISZT  főnév
Tiszti rendfokozatban levő katona. Szóláshasonlat(ok): <span style="color:blue">fizet, mint a katonatiszt:</span> gavallérosan f. □ Egy katonatiszt, abban a hitben, hogy kedvese megcsalta, megfogadja becsületszavára, hogy örökre szakít a leánnyal. (Ambrus Zoltán)
