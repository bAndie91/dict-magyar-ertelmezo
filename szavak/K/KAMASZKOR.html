KAMASZKOR  főnév
Az az életkor, rendsz. a 1416. életév, amely átmenet a gyermekkorból az ifjúkorba, és amelyet egyebek között a félszeg viselkedés és a kiegyensúlyozatlan lelkiállapot jellemez. <span style="color:blue">Most van a kamaszkorban. Kinőtt már a kamaszkorból.</span>
<ul><li>kamaszkori; kamaszkorú.
