KÉSEDELMI  [ë-e v. e-e] melléknév (<span style="color:green;font-weight:bold">kereskedelem</span>, <span style="color:green;font-weight:bold">pénzügy</span>)
Vmely kötelezettség késedelmes teljesítése miatt fizetendő. <span style="color:blue">Késedelmi kamat:</span> a késedelmes fizetés miatt, a késedelem időtartamához mérten fizetendő k.; <span style="color:blue">késedelmi kötbér. Mivel adóhátralékos volt, késedelmi kamatot kellett fizetnie.</span>
