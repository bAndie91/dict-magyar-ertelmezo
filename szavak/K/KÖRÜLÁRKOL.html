KÖRÜLÁRKOL  [l-á] tárgyas ige
&lt;Vmely területet, növényt v. épületet&gt; árokkal körülvesz; árkot ás körülötte. <span style="color:blue">Körülárkolta a répaföldet, a rétet, a sátort.</span>
<ul><li>körülárkolás; körülárkolható; körülárkoló; körülárkolt; körülárkoltat.
