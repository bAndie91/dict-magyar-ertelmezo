KOMÓCSIN  főnév -t, -ok, -ja
A pázsitfüvek családjába tartozó, nedvesebb réteken, legelőkön gyakori növény; tömött, füzérszerű virágzata a gyékény buzogányához hasonlít; kedvelt takarmány (Phleum pratense). <span style="color:blue">Érdes, mezei, sima komócsin.</span>
