KÖZJÓ  főnév (<span style="color:green;font-weight:bold">irodalmi nyelvben</span>)
A közösség, a társadalom érdeke, java, boldogsága, jóléte, ill. mindaz, ami ezt elősegíti, előmozdítja. <span style="color:blue">Áldoz a közjóra. Így kívánja a közjó.</span> □ Ha e köz jót előmozdithatom, Keblemben az önző szivet megtagadom. (Arany János)
