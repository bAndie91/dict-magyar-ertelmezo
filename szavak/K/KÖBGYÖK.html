KÖBGYÖK  főnév (<span style="color:green;font-weight:bold">mennyiségtan</span>)
Az a szám, amely köbre emelve az adott mennyiséget eredményezi. <span style="color:blue">8-nak a köbgyöke 2</span> (jelölve: [négyzetgyök 8 = 2]); <span style="color:blue">köbgyököt von.</span> □ Azt se tudta, hogy mi fán terem a köbgyök. (Kosztolányi Dezső)
<ul><li>Szóösszetétel(ek): köbgyökvonás.
