KUSZÁLTSÁG  [tárgyas v. cs] főnév -ot, -a (csak egyes számban)
A kuszált (14) melléknévvel kifejezett tulajdonság; vkinek, vminek kuszált volta. <span style="color:blue">Lelki kuszáltság; a fonalak kuszáltsága; gondolatainak kuszáltsága. Zavaró ez a kuszáltság.</span>
