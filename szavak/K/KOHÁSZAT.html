KOHÁSZAT  főnév -ot, -a (csak egyes számban)
Fém(ek)nek érc(ek)ből való kiolvasztásával, előállításával és félgyártmánnyá való feldolgozásával foglalkozó nehézipari (ipar-)ág. <span style="color:blue">A kohászat fejlődése, fejlesztése, fontossága.</span>
<ul><li>Szóösszetétel(ek): fémkohászat; vaskohászat.
</li><li>kohászati.
</li></ul></div>
