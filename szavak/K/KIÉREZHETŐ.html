KIÉREZHETŐ  melléknév -en [e]. -bb
Olyan &lt;dolog&gt;, amit ki lehet érezni (12), ami kiérzik vmiből. <span style="color:blue">Jó kolbász; éppen csak hogy kiérezhető belőle a fokhagyma íze. Szavaikból kiérezhető az öröm.</span> □ Jó, jó csak gúnyoljon is!  szólt az ügyvéd kiérezhető keserűséggel. (Mikszáth Kálmán)
