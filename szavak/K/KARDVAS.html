KARDVAS  főnév (<span style="color:green;font-weight:bold">régies</span>, <span style="color:green;font-weight:bold">költői</span>)
A kard pengéje; vas (4a). □ Kardvasán a menteujjal egyet törül. (Arany János) || a. (<span style="color:green;font-weight:bold">átvitt értelemben</span>) Kard. □ Sztambul felől bús hír repül, Zendűlnek vámosok; De küzdve két ifjú halad, Utat nyit kardvasok. (Vörösmarty Mihály)
