KESZTYŰTÁGÍTÓ  főnév
Rendsz. fából készült, ollóhoz hasonlóan működő kétágú eszköz, melyet a kesztyű ujjainak kitágítására használnak. □ Szokásom az útikészülékemet [= úti készletemet] versbe szedni, hogy valami el ne maradjon  Kesztyűtágító, vasaló, és hajbodorító. (Jókai Mór)
