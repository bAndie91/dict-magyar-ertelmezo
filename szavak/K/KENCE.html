KENCE  [e-e] főnév kencét, kencéje [e-e] (<span style="color:green;font-weight:bold">kereskedelem</span>)
Fémsók hozzáadásával és főzéssel gyorsan száradóvá tett növényi olaj, főként lenolaj, amely vmire kenve vékony, átlátszó, száraz, nem ragadós réteget alkot; firnisz, firnájsz. <span style="color:blue">Az olajfesték kencével készül.</span>
<ul><li>kencéz.
