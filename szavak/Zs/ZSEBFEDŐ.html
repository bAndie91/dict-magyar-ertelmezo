ZSEBFEDŐ  főnév (<span style="color:green;font-weight:bold">ruházkodás</span>)
A zseb fölé varrt, rendsz. ugyanabból a ruhaanyagból való szögletes darab, amely a zsebre ráhajolva (esetleg rá is gombolva) elfedi annak nyílását; hajtóka (1b), zsebhajtóka.
<ul><li>zsebfedős.
