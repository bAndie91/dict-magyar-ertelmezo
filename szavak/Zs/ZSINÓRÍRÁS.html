ZSINÓRÍRÁS  [r-í] főnév (<span style="color:green;font-weight:bold">iskolai</span>)
Álló, kerek, árnyékolás nélküli, folyamatosan egymásba kapcsolt betűkkel való írás(mód). <span style="color:blue">Bevezették az iskolában a zsinórírást. A gyermekek zsinórírással írtak az iskolában.</span>
<ul><li>zsinórírási; zsinórírásos; zsinórírású.
</li></ul></div>
