ZSIBBADOZ  tárgyatlan ige -ok, -ol; -tam, -ott; -zon zsibbadozik (<span style="color:green;font-weight:bold">ritka</span>, <span style="color:green;font-weight:bold">hangfestő</span>)
Gyakran v. apránkint huzamosan zsibbad (1, 2). □ Csodálatos szorongás fogott el, fejem zúgott, lábam, kezem zsibbadozott. (Mikszáth Kálmán)
<ul><li>Igekötős igék: elzsibbadoz.
</li><li>zsibbadozás; zsibbadozó.
