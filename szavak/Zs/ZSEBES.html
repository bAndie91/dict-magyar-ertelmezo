ZSEBES  [e-ë] melléknév és főnév
<ul><li>I. melléknév Olyan, aminek zsebe van, ami zsebbel van ellátva. <span style="color:blue">Zsebes felöltő, kötény, szoknya.</span>
</li><li>II. főnév -t, -ek, -e [ë, e] (<span style="color:green;font-weight:bold">argóban</span>) Zsebtolvaj. <span style="color:blue">Az üzletben elfogtak egy régi zsebest</span>.
</li></ul></div>
