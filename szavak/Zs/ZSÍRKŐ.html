ZSÍRKŐ  főnév (<span style="color:green;font-weight:bold">ásványtan</span>)
A magnéziumot tartalmazó ásványok egyik elváltozási terméke: fehéres, sárgás, zöldes v. szürkés, szálkás rostozatú, tömött, erősen zaftos tapintású, könnyen vágható kő (steatit); szalonnakő. <span style="color:blue">A szabókréta zsírkőből van.</span> 
zsírköves; zsírkövű.
