ZSÁKFUTÁS  főnév
Főleg majálisokon, népünnepélyeken rendezett tréfás verseny, amely abban áll, hogy a versenyzők két lábát egy zsákba bújtatják, amelyet derékban megkötnek, s benne ugrálva kell a célhoz eljutni; zsákban futás. <span style="color:blue">A zsákfutás részvevői akkorákat ugrottak, mint holmi bakkecske.</span>
