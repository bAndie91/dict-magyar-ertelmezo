ZSEMLEMORZSA  főnév zsömlemorzsa (<span style="color:green;font-weight:bold">konyhaművészet</span>, <span style="color:green;font-weight:bold">kereskedelem</span>)
Száraz zsemléből darálással v. zúzással készített morzsa, amelyben a kirántani való ételt szokták meghengergetni, s amelyet egyéb ételek elkészítéséhez is használnak; prézli.
<ul><li>zsemlemorzsás.
