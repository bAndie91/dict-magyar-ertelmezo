ZSELLÉRHÁZ  főnév (<span style="color:green;font-weight:bold">1945 előtt</span>)
Olyan ház, amely zsellér (1, 2) tulajdonában volt, v. amelyben bérlőként zsellér lakott. □ Zsellérházban lakik, másfél hold az egész birtoka. (Jókai Mór) Erdei, aki  "zsellérházban" lakott, ahonnan nem lehetett kitenni,  gyermektelen szegény volt. (Móricz Zsigmond)
