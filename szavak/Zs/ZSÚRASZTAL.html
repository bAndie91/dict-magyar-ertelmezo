ZSÚRASZTAL  [r-a] főnév
<ul><li>1. Kisméretű, könnyű, négylábú asztalka, rendsz. olyan, amelyből több egymás alatt helyezhető el; házi társas összejöveteleken étkezésre használják.
</li><li>2. (<span style="color:green;font-weight:bold">ritka</span>) Zsúrkocsi.
