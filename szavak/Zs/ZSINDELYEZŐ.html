ZSINDELYEZŐ  [ë-ë v. e-ë] melléknév és főnév
<ul><li>I. melléknév
</li><li>1. Zsindelyezést végző &lt;személy&gt;. <span style="color:blue">Zsindelyező ács.</span>
</li><li>2. Zsindelyezésből álló, rá vonatkozó, vele összefüggő. <span style="color:blue">Zsindelyező munka</span>.
</li><li>II. főnév -t, -je [e] Az a személy, munkás, aki zsindelyez. <span style="color:blue">A zsindelyezők ma befejezték a munkát.</span>
</li></ul></div>
