ZSILIPKAMRA  főnév (<span style="color:green;font-weight:bold">műszaki nyelv</span>)
&lt;Zsilipművekben&gt; kapukkal elzárható vízgyűjtő medence, amelynek segítségével vízi járműveket a víz alsó szintjéről a felső szintre lehet emelni; csege. <span style="color:blue">A zsilipkamrában felgyűlt, megduzzadt víz.</span>
