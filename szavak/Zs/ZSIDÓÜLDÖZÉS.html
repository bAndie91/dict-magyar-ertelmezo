ZSIDÓÜLDÖZÉS  főnév (<span style="color:green;font-weight:bold">történettudomány</span>)
A zsidó vallású és származású személyeknek vallási v. faji elvakultságból, gyűlöletből eredő üldözése. <span style="color:blue">A középkori, a német fasiszta, a nyilas zsidóüldözés.</span> □ Ezen égbekiáltólag igazságtalan zsidóüldözésnek apostola lett néhány zugprókátor. (Petőfi Sándor)
